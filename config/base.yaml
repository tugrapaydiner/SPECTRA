# SPECTRA base configuration.
# Task configs (sudoku.yaml, maze.yaml, ...) inherit from this via `_base_`
# and override only what differs.

seed: 42
device: auto          # auto | cpu | cuda

# Recursive core (TRM). See BLUEPRINT sections 5 and 15.
model:
  dim: 128            # hidden dimension D
  n_layers: 2         # transformer-style blocks inside the shared operator f_theta
  heads: 8            # attention heads
  n: 6                # inner latent recursion steps per cycle
  T: 3                # deep recursion cycles per supervision step
  N_sup: 8            # number of deep supervision steps
  alpha_y: 0.1        # residual scaling for y updates (section 5.6)
  alpha_z: 0.1        # residual scaling for z updates (section 5.6)

# Optimisation / training.
train:
  lr: 1.0e-3
  weight_decay: 0.01
  batch_size: 128
  max_steps: 20000
  warmup_steps: 500
  quant_warmup_steps: 2000
  clip_grad_norm: 1.0
  ema_decay: 0.999
  lambda_h: 0.5
  lambda_improve: 0.1
  margin: 0.01
  log_every: 50
  eval_every: 500
  eval_batches: 4             # bounded validation, not full-dataset materialization
  ckpt_every: 1000
  precision: fp32             # fp32 | fp16_amp (CUDA autocast + GradScaler)
  backend: pytorch_eager
  deterministic: false        # M04 CPU reference overrides this to true

# Logging (section 29).
log:
  level: INFO
  dir: outputs
  wandb: false
