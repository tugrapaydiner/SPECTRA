# SYNTHETIC local ARC-style transform task. This is NOT official ARC/ARC-AGI.
_base_: base.yaml

task: arc

data:
  variant: synthetic_single_transform
  num_tokens: 11       # colors 0..9 plus pad token 10
  pad_token: 10
  n_colors: 9
  transform: flip_h
  height: 30
  width: 30
  seq_len: 900
  max_h: 6
  max_w: 6

model:
  dim: 192
