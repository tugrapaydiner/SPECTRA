# Sudoku: generated symbolic reasoning task with exact semantic validation.
_base_: base.yaml

task: sudoku

data:
  num_tokens: 10       # exact vocabulary: 0 blank + digits 1..9
  seq_len: 81
  height: 9
  width: 9
  box: 3
  min_clues: 30
  max_clues: 50
  require_unique: true
  augment: true
  # M03 default: randomized MRV/backtracking from an empty board, not only
  # symmetry transforms of one canonical completed solution.
  solution_method: random_backtracking
