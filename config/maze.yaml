# Synthetic perfect-maze shortest-path overlay task with exact semantic validation.
_base_: base.yaml

task: maze

data:
  # Exact vocabulary: 0=wall, 1=open, 2=start, 3=goal, 4=path.
  num_tokens: 5
  height: 15
  width: 15
  seq_len: 225
  min_path_len: 8
  # No upper path bound is claimed by this retained configuration.
  max_path_len: null
  require_optimal: true
  augment: true
