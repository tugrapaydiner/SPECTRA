[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra"
version = "0.8.0.dev0"
description = "Certified repeated-query compilation and checked CNF tools for CPUs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SPECTRA" }]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/tugrapaydiner/SPECTRA"
Documentation = "https://github.com/tugrapaydiner/SPECTRA/blob/main/docs/README.md"
Issues = "https://github.com/tugrapaydiner/SPECTRA/issues"
Changelog = "https://github.com/tugrapaydiner/SPECTRA/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Everything needed to run the full test suite. Optional SVM export tests
# additionally use numpy/scikit-learn when installed and skip otherwise.
test = ["pytest>=7.4", "python-sat==1.9.dev15"]
svm = ["numpy>=1.24", "scikit-learn>=1.4"]
dev = ["pytest>=7.4", "python-sat==1.9.dev15", "ruff==0.16.9"]

[project.scripts]
spectra = "spectra.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spectra*"]

[tool.setuptools.package-data]
"spectra._native" = ["*.cpp", "ovo/*.cpp", "ovo/*.hpp", "ovo/*/*.cpp", "ovo/*/*.hpp"]

[tool.pytest.ini_options]
# Put the repository root on sys.path so the experiments package and scripts
# resolve during tests without an editable install.
pythonpath = ["."]
testpaths = ["tests", "experiments"]
addopts = "-ra"
markers = [
    "slow: long-running gates. Deselect with -m 'not slow'.",
    "exhaustive: full enumeration of comparator inputs; excluded from bounded sanitizer runs.",
]
filterwarnings = [
    # Keep test output readable; surface our own warnings only.
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["experiments/streaming/data_manifest.json"]

[tool.ruff.lint]
# Correctness-focused rules: pyflakes (undefined names, unused imports and
# variables, redefinitions) plus the pycodestyle error class.
select = ["F", "E9"]
