<title id="title">Same-model native SVM cost, relative to LIBSVM</title><desc id="desc">All seven retained models; fixed default SPECTRA and generated C relative to native LIBSVM. Generated C is faster than SPECTRA on five of six available small models. The missing HAR export is not a loss.</desc>
