name: Configure MSVC x64
description: Export the Visual Studio x64 build environment for later steps.
runs:
  using: composite
  steps:
    - shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vs) { throw 'MSVC x64 build tools not found' }
        $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
        $lines = & cmd /c "`"$vcvars`" >nul && set"
        if ($LASTEXITCODE -ne 0) { throw 'MSVC environment setup failed' }
        $keep = @('PATH','INCLUDE','LIB','LIBPATH','VCToolsInstallDir','VCINSTALLDIR','WindowsSdkDir','WindowsSDKVersion')
        foreach ($line in $lines) {
          $pair = $line -split '=', 2
          if ($pair.Count -eq 2 -and $pair[0] -in $keep) {
            $line | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
        }
