name: one-shot-finalize-part2

on:
  push:
    branches:
      - archive/research-history-20261016
    paths:
      - .github/workflows/one-shot-finalize-part2.yml

permissions:
  contents: write

concurrency:
  group: one-shot-finalize-part2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: archive/research-history-20261016
          fetch-depth: 0

      - name: Verify exact merge identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/heads/performance/automatic-engine-selection-final:refs/remotes/origin/performance/automatic-engine-selection-final \
            --tags

          test "$(git rev-parse origin/main)" = "527590406c2c624a6aa050e17c6f45b0f000ac5b"
          test "$(git rev-parse origin/performance/automatic-engine-selection-final)" = "90b652106c85e734e62f4a5d7eee97c94b964304"
          git merge-base --is-ancestor \
            90b652106c85e734e62f4a5d7eee97c94b964304 \
            527590406c2c624a6aa050e17c6f45b0f000ac5b

          parents="$(git show -s --format='%P' 527590406c2c624a6aa050e17c6f45b0f000ac5b)"
          test "$parents" = "ac71b3a777f4869424247df6481ef32f9996a6b 90b652106c85e734e62f4a5d7eee97c94b964304"

      - name: Create permanent annotated milestone tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tugrap Aydiner"
          git config user.email "106766396+tugrapaydiner@users.noreply.github.com"

          if git show-ref --verify --quiet refs/tags/part2-v10-validated; then
            test "$(git rev-list -n 1 part2-v10-validated)" = "527590406c2c624a6aa050e17c6f45b0f000ac5b"
          else
            git tag -a part2-v10-validated \
              527590406c2c624a6aa050e17c6f45b0f000ac5b \
              -m "Part 2 v10 validated and merged

Automatic exact-engine selection completed its frozen x86-64 and ARM64 validation matrix, merged through PR #72, and retained exact source identity 90b652106c85e734e62f4a5d7eee97c94b964304."
            git push origin refs/tags/part2-v10-validated
          fi

      - name: Delete merged Part 2 branch safely
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --heads origin refs/heads/performance/automatic-engine-selection-final | awk '{print $1}')"
          test "$remote_head" = "90b652106c85e734e62f4a5d7eee97c94b964304"
          git push origin --delete performance/automatic-engine-selection-final

      - name: Remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-finalize-part2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove completed Part 2 finalization workflow"
          git push origin HEAD:refs/heads/archive/research-history-20261016
