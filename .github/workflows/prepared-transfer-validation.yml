name: prepared-transfer-validation
on:
  push:
    branches: [research/prepared-transfer-20261015]
    paths: ['.github/workflows/prepared-transfer-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prepared-transfer-validation-${{ github.ref }}
  cancel-in-progress: false
env:
  PROTOCOL_COMMIT: 39e9ee0b89f1261106231ee94546758c510291ba
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
jobs:
  transfer:
    name: Frozen transfer (${{ matrix.runner }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, python: '3.11'}
          - {runner: ubuntu-24.04, python: '3.13'}
          - {runner: ubuntu-24.04-arm, python: '3.13'}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 39e9ee0b89f1261106231ee94546758c510291ba
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@v4
        with:
          repository: tulip-control/dd
          ref: 4442d498ddea1bec0071315f538cb5ef37443985
          path: upstream-dd
          persist-credentials: false
      - name: Install pinned native controls and test dependencies
        env:
          DD_FETCH: '1'
          DD_CUDD: '1'
        run: |
          set -euo pipefail
          python -m pip install 'setuptools==80.9.0' 'wheel==0.45.1' 'Cython==3.1.3'
          python -m pip install --no-build-isolation ./upstream-dd
          python -m pip install 'pytest==8.4.2' 'python-sat==1.9.dev15' 'numpy==2.2.6'
          python -c 'import dd.cudd; from pysat.solvers import Solver; s = Solver(name="minicard"); s.delete()'
      - name: Bind source and run all compiled-query contracts
        env:
          SPECTRA_REQUIRE_CUDD: '1'
        run: |
          set -euo pipefail
          mkdir -p transfer-evidence
          test "$(git rev-parse HEAD)" = "$PROTOCOL_COMMIT"
          test "$(git rev-parse HEAD:experiments/compiled_query)" = 4ed5e135148ad279fcc1eb51e6f38bb226c181be
          git rev-parse HEAD > transfer-evidence/source_commit.txt
          git rev-parse HEAD^{tree} > transfer-evidence/source_tree.txt
          python -VV > transfer-evidence/python.txt
          python -m pip freeze > transfer-evidence/environment.txt
          uname -a > transfer-evidence/platform.txt
          lscpu > transfer-evidence/cpu.txt
          python -m pytest experiments/compiled_query -q --junitxml=transfer-evidence/contracts.xml 2>&1 | tee transfer-evidence/contracts.log
      - name: Build both exact source versions and freeze all inputs before timing
        run: |
          set -euo pipefail
          python -m experiments.compiled_query.transfer_build transfer-evidence/builds | tee transfer-evidence/builds.log
          python -m experiments.compiled_query.transfer_panel freeze --root transfer-evidence/panel --protocol-commit "$PROTOCOL_COMMIT"
      - name: Execute every scheduled session and replay the original inputs
        run: |
          set -euo pipefail
          current=$(find "$PWD/transfer-evidence/builds/current" -maxdepth 1 -name '*.so')
          prior=$(find "$PWD/transfer-evidence/builds/prior" -maxdepth 1 -name '*.so')
          python -m experiments.compiled_query.transfer_panel run --root transfer-evidence/panel --current "$current" --prior "$prior" 2>&1 | tee transfer-evidence/run.log
          python -m experiments.compiled_query.transfer_panel audit --root transfer-evidence/panel | tee transfer-evidence/audit.log
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('transfer-evidence/panel/audit.json').read_text())
          print('Precommitted speed gate:',result['precommitted_speed_gate_pass'])
          print('A functional CI pass is not a speed-gate pass or external replication.')
          assert result['functional_complete'], 'Incomplete panel: retain all failed cells and evidence'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-transfer-${{ matrix.runner }}-py${{ matrix.python }}-${{ github.run_id }}
          path: transfer-evidence/
          retention-days: 30
          if-no-files-found: warn
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ['undefined', 'address,undefined']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 39e9ee0b89f1261106231ee94546758c510291ba
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest==8.4.2' 'python-sat==1.9.dev15'
      - name: Test native exact endpoint under sanitizer
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          set -euo pipefail
          mkdir -p sanitizer-evidence
          export SPECTRA_EXACT_LIBRARY="$(python -c "from experiments.compiled_query.exact import build_exact_runtime; import os; print(build_exact_runtime('sanitizer-evidence/build', sanitizer=os.environ['SANITIZER']))")"
          export UBSAN_OPTIONS=halt_on_error=1
          if [ "$SANITIZER" = 'address,undefined' ]; then
            export LD_PRELOAD="$(g++ -print-file-name=libasan.so):$(g++ -print-file-name=libstdc++.so)"
            export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
          fi
          python -m pytest experiments/compiled_query/test_exact.py -q --junitxml=sanitizer-evidence/contracts.xml 2>&1 | tee sanitizer-evidence/contracts.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-transfer-sanitizer-${{ matrix.sanitizer }}-${{ github.run_id }}
          path: sanitizer-evidence/
          retention-days: 30
          if-no-files-found: warn
