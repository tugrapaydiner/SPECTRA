name: apply-auto-selector-v4

on:
  push:
    branches: [performance/automatic-engine-selection]
    paths: [.github/workflows/apply-auto-selector-v4.yml]

permissions:
  contents: write

concurrency:
  group: apply-auto-selector-v4
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Apply the frozen v4 policy
        run: python scripts/apply_auto_selector_v4.py

      - name: Check source identity and focused contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          cmp spectra/_native/exact_binary.cpp experiments/compiled_query/exact_native.cpp
          python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_auto_selector_v4.py \
            tests/public/test_exact_api.py \
            tests/public/test_exact_bank_tile64.py \
            tests/public/test_exact_packet_packing.py

      - name: Publish the policy implementation
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-auto-selector-v4.yml
          git rm scripts/apply_auto_selector_v4.py
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          git add \
            spectra/_native/exact_binary.cpp \
            experiments/compiled_query/exact_native.cpp \
            spectra/exact.py \
            experiments/compiled_query/exact.py \
            tests/public/test_exact_api.py \
            experiments/compiled_query/README.md
          git commit -m 'Use graph-relative pin density for automatic selection'
          git push origin HEAD:performance/automatic-engine-selection
