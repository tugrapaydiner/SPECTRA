name: tmp-apply-selector-v7

on:
  push:
    branches: [performance/automatic-engine-selection]
    paths: [.github/workflows/tmp-apply-selector-v7.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install focused dependencies
        run: python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'

      - name: Apply the frozen v7 source and benchmark migration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp_apply_selector_v7.py
          python scripts/tmp_apply_selector_v7_benchmarks.py
          cmp spectra/_native/exact_binary.cpp experiments/compiled_query/exact_native.cpp
          python -m py_compile \
            spectra/exact.py \
            experiments/compiled_query/exact.py \
            experiments/compiled_query/auto_selector_benchmark.py \
            experiments/compiled_query/auto_selector_wap_guard.py \
            experiments/compiled_query/itc_exam_suite.py \
            experiments/compiled_query/test_exact.py \
            tests/public/test_auto_selector_v7.py \
            tests/public/test_exact_api.py
          if grep -nE 'structural-v6' \
            spectra/exact.py \
            experiments/compiled_query/exact.py \
            spectra/_native/exact_binary.cpp \
            experiments/compiled_query/exact_native.cpp \
            tests/public/test_auto_selector_v7.py \
            tests/public/test_exact_api.py \
            experiments/compiled_query/test_exact.py; then
            echo 'stale v6 executable identity remains' >&2
            exit 1
          fi
          git diff --check

      - name: Build and run selector contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/library.txt
          from spectra.exact import build_exact_runtime
          print(build_exact_runtime('/tmp/selector-v7-native'))
          PY
          export SPECTRA_EXACT_LIBRARY="$(cat /tmp/library.txt)"
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_auto_selector_v7.py \
            tests/public/test_exact_api.py \
            tests/public/test_exact_bank_tile64.py \
            tests/public/test_exact_packet_packing.py
          python -m pytest -q --confcutdir=experiments/compiled_query \
            experiments/compiled_query/test_exact.py \
            experiments/compiled_query/test_itc_exam_transfer.py

      - name: Publish structural v7 on the exploratory branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          git add -A \
            spectra/_native/exact_binary.cpp \
            spectra/exact.py \
            experiments/compiled_query/exact_native.cpp \
            experiments/compiled_query/exact.py \
            experiments/compiled_query/auto_selector_benchmark.py \
            experiments/compiled_query/auto_selector_wap_guard.py \
            experiments/compiled_query/itc_exam_suite.py \
            experiments/compiled_query/test_exact.py \
            experiments/compiled_query/test_itc_exam_transfer.py \
            tests/public/test_auto_selector_v7.py \
            tests/public/test_exact_api.py \
            tests/public/test_auto_selector_v6.py
          git commit -m 'Freeze structural v7 after the failed v6 confirmation'
          git push origin HEAD:performance/automatic-engine-selection
