name: learned-kernel-inputs
on:
  push:
    branches: [research/learned-kernel-profile]
    paths: [.github/workflows/learned-kernel-inputs.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Acquire bounded official dataset bytes, no model fitting
        shell: python
        run: |
          import urllib.request,pathlib,hashlib,json,os,zipfile,io
          out=pathlib.Path('learned-kernel-inputs');out.mkdir()
          url='https://archive.ics.uci.edu/static/public/178/semeion%2Bhandwritten%2Bdigit.zip'
          with urllib.request.urlopen(url,timeout=60) as r: raw=r.read(4*1024*1024+1)
          assert len(raw)<=4*1024*1024
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              assert any(n.endswith('semeion.data') for n in z.namelist())
          (out/'semeion.zip').write_bytes(raw)
          (out/'receipt.json').write_text(json.dumps({'url':url,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'source_commit':os.environ['GITHUB_SHA'],'scope':'official data acquisition only; no fitting or test predictions'},indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semeion-official-${{ github.sha }}
          path: learned-kernel-inputs/
          retention-days: 30
          if-no-files-found: error
