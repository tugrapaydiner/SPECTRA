name: complete-edgeless-kernel

on:
  push:
    branches:
      - part3/release-replication-readiness
    paths:
      - .github/workflows/complete-edgeless-kernel.yml

permissions:
  contents: write

concurrency:
  group: complete-edgeless-kernel
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'
      - name: Apply the corrected source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('.github/workflows/finish-edgeless-fast-path.yml').read_text(
              encoding='utf-8'
          )
          replacements = (
              (
                  "\n'''\n          new_admission = ",
                  "\n          '''\n          new_admission = ",
              ),
              (
                  "\n'''\n          if code.count(old_admission)",
                  "\n          '''\n          if code.count(old_admission)",
              ),
          )
          for old, new in replacements:
              if source.count(old) != 1:
                  raise AssertionError(f'expected one malformed delimiter: {old!r}')
              source = source.replace(old, new, 1)

          marker = (
              "      - name: Apply the edgeless kernel with structural markers\n"
              "        shell: bash\n"
              "        run: |\n"
          )
          start = source.index(marker) + len(marker)
          end = source.index("      - name: Run the focused contracts\n", start)
          script = dedent(source[start:end])
          Path('/tmp/apply-corrected-edgeless.sh').write_text(
              script, encoding='utf-8'
          )
          PY
          bash /tmp/apply-corrected-edgeless.sh
      - name: Run the full focused contract set
        shell: bash
        run: |
          set -euo pipefail
          export SPECTRA_EXACT_LIBRARY="$(
            python -c "from spectra.exact import build_exact_runtime; print(build_exact_runtime('edgeless-exact'))"
          )"
          python -m pytest \
            tests/public/test_exact_api.py \
            tests/public/test_exact_edgeless.py \
            --confcutdir=tests/public -q
          python -m pytest \
            experiments/compiled_query/test_exact.py \
            -q -k 'impossible_graph_bank_keeps_current_request_proofs or every_proof_kind_and_single_byte_mutations or auto_does_not_hide_malformed_packets_or_resource_limits'
          python -m pytest \
            experiments/compiled_query/test_native_twosat_challenge.py \
            experiments/compiled_query/test_twosat_development_benchmark.py -q
          python - <<'PY'
          from pathlib import Path
          assert Path('spectra/_native/exact_binary.cpp').read_bytes() == Path(
              'experiments/compiled_query/exact_native.cpp'
          ).read_bytes()
          PY
          git diff --check
      - name: Save the kernel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tugrap"
          git config user.email "106766396+tugrapaydiner@users.noreply.github.com"
          git add \
            spectra/_native/exact_binary.cpp \
            experiments/compiled_query/exact_native.cpp \
            tests/public/test_exact_edgeless.py \
            docs/EXACT_API.md
          git diff --cached --check
          git commit -m "Handle edgeless query banks directly"
          git push origin HEAD:refs/heads/part3/release-replication-readiness
