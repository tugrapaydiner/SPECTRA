name: budgeted-prototypes
on:
  push:
    branches: [research/budgeted-integer-prototypes]
    paths: [experiments/budgeted_prototypes/**, .github/workflows/budgeted-prototypes.yml]
  pull_request:
    branches: [main, research/integer-feature-interactions]
    paths: [experiments/budgeted_prototypes/**, .github/workflows/budgeted-prototypes.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 pytest==9.0.2
      - name: Retain exact source and ancestry without installing it
        shell: python
        run: |
          import pathlib,subprocess,hashlib,json,sys
          root=pathlib.Path('.prototype-ci');root.mkdir()
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          base='a118f571f96d4c26e29eaba4839941e9ce14fd05'
          (root/'source.tar.gz').write_bytes(subprocess.check_output(['git','archive','--format=tar.gz','HEAD']))
          (root/'parent.tar.gz').write_bytes(subprocess.check_output(['git','archive','--format=tar.gz',base]))
          (root/'base.commit').write_bytes(subprocess.check_output(['git','cat-file','commit',base]))
          (root/'update.patch').write_bytes(subprocess.check_output(['git','diff','--binary',base,'HEAD']))
          subprocess.run(['git','bundle','create',str(root/'review.bundle'),'HEAD','^'+base],check=True)
          (root/'environment.txt').write_bytes(subprocess.check_output([sys.executable,'-m','pip','freeze']))
          sources={p.as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('experiments/budgeted_prototypes').glob('*') if p.is_file()}
          (root/'source.json').write_text(json.dumps({'head':head,'tree':tree,'base':base,'sources':sources},indent=2))
      - name: Portable runtime and complete evidence-auditor contracts
        run: python -m pytest experiments/budgeted_prototypes/test_prototypes.py experiments/budgeted_prototypes/test_audit.py --import-mode=importlib --confcutdir=experiments/budgeted_prototypes -q --junitxml=.prototype-ci/portable.xml
      - name: Instrument prototype implementation
        run: python experiments/budgeted_prototypes/build.py --out .prototype-ci/ubsan --target portable --ubsan --layout register
      - name: Same runtime and evidence contracts under UBSan
        env:
          PROTOTYPE_LIBRARY: .prototype-ci/ubsan/prototypes.so
        run: python -m pytest experiments/budgeted_prototypes/test_prototypes.py experiments/budgeted_prototypes/test_audit.py --import-mode=importlib --confcutdir=experiments/budgeted_prototypes -q --junitxml=.prototype-ci/ubsan.xml
      - name: Verify tested source did not change
        shell: python
        run: |
          import pathlib,json,hashlib,subprocess
          record=json.loads(pathlib.Path('.prototype-ci/source.json').read_text())
          for name,wanted in record['sources'].items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==wanted,name
          subprocess.run(['git','diff','--exit-code','HEAD','--','.github/workflows/budgeted-prototypes.yml','experiments/budgeted_prototypes'],check=True)
          pathlib.Path('.prototype-ci/source-after.json').write_text(json.dumps({'status':'PASS','files':len(record['sources']),'tree':record['tree']},indent=2))
      - name: Record all artifact identities
        if: always()
        shell: python
        run: |
          import pathlib,json,hashlib
          root=pathlib.Path('.prototype-ci');root.mkdir(exist_ok=True)
          (root/'SHA256.json').write_text(json.dumps({p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file() and p.name!='SHA256.json'},indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budgeted-prototypes-${{ github.sha }}
          path: .prototype-ci/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
