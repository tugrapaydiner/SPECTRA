name: itc-exam-suite
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: itc-exam-suite-${{ github.ref }}
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
jobs:
  suite:
    name: Prospective ITC suite (${{ matrix.runner }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, python: '3.11'}
          - {runner: ubuntu-24.04, python: '3.13'}
          - {runner: ubuntu-24.04-arm, python: '3.13'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'build==1.3.0' 'pytest==8.4.2'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: davidvanbulck/ITC-2007-CETT
          ref: ed2d4c0cf5302b77a8b321cd0380de0bb579d538
          path: upstream/ITC-2007-CETT
          persist-credentials: false
      - name: Validate selector and suite contracts
        run: |
          set -euo pipefail
          python -m pytest \
            tests/public/test_exam_repair.py \
            tests/public/test_itc2007_exam.py \
            --confcutdir=tests/public -q \
            --junitxml=suite-public-contracts.xml
          python -m pytest \
            experiments/compiled_query/test_exact.py \
            experiments/compiled_query/test_itc_exam_transfer.py \
            experiments/compiled_query/test_itc_exam_suite.py \
            -q -k 'auto or tiled_witnesses or itc or suite' \
            --junitxml=suite-research-contracts.xml
      - name: Build and exercise the installed application API
        run: |
          set -euo pipefail
          python -m build --wheel --outdir suite-wheel
          python -m venv suite-install
          suite-install/bin/python -m pip install --no-deps suite-wheel/*.whl
          suite-install/bin/python -I scripts/check_exam_repair_installation.py \
            --out installed-exam-repair.json | tee installed-exam-repair.log
      - name: Freeze all roles before any holdout execution
        run: |
          set -euo pipefail
          python -m experiments.compiled_query.itc_exam_suite freeze \
            --root itc-suite-evidence \
            --upstream-root upstream/ITC-2007-CETT \
            --queries 1024 \
            --holdout-max-auto-raw-ratio 1.15 | tee freeze.log
      - name: Execute and independently audit every case
        run: |
          set -euo pipefail
          python -m experiments.compiled_query.itc_exam_suite run \
            --root itc-suite-evidence | tee run.log
          python -S -m experiments.compiled_query.itc_exam_suite audit \
            --root itc-suite-evidence | tee audit.log
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('itc-suite-evidence/suite-audit.json').read_text())
          assert result['functional_complete']
          assert result['holdout_gate_pass'], result['holdout_failures']
          roles = [case['role'] for case in result['cases']]
          assert roles == ['development', 'holdout', 'holdout']
          for case in result['cases']:
              assert case['queries'] == 1024
              assert case['sat'] + case['unsat'] == 1024
              assert case['auto_vs_raw_paired_median_ratio'] > 0
          print('Prospective holdout guardrail passed. Not a full timetabling claim.')
          PY
      - name: Preserve exact environment and source receipts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p suite-receipts
          git rev-parse HEAD > suite-receipts/source_commit.txt
          git rev-parse HEAD^{tree} > suite-receipts/source_tree.txt
          git -C upstream/ITC-2007-CETT rev-parse HEAD > suite-receipts/upstream_commit.txt
          python -VV > suite-receipts/python.txt
          uname -a > suite-receipts/platform.txt
          lscpu > suite-receipts/cpu.txt
          cp suite-public-contracts.xml suite-research-contracts.xml \
            freeze.log run.log audit.log installed-exam-repair.json \
            installed-exam-repair.log suite-receipts/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: itc-exam-suite-${{ matrix.runner }}-py${{ matrix.python }}-${{ github.run_id }}
          path: |
            itc-suite-evidence/
            suite-receipts/
            suite-wheel/
          retention-days: 90
          if-no-files-found: warn
