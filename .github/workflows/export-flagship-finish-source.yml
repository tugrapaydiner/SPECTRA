name: Apply flagship branch completion fix
on:
  push:
    branches: [research/flagship-finish-20261016]
    paths: ['.github/workflows/export-flagship-finish-source.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply reviewed patch
        run: |
          git apply --check .branch/finish-test-extra.patch
          git apply .branch/finish-test-extra.patch
      - name: Validate release and installation contracts
        run: |
          python -m pip install 'pytest==9.0.2'
          python scripts/check_release_readiness.py
          python -m pytest tests/public/test_release_hardening.py tests/public/test_current_installation.py --confcutdir=tests/public -q
          rm -rf /tmp/wheel && mkdir -p /tmp/wheel
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir /tmp/wheel
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheel = next(Path('/tmp/wheel').glob('*.whl'))
          with zipfile.ZipFile(wheel) as archive:
              metadata = archive.read(next(name for name in archive.namelist() if name.endswith('.dist-info/METADATA'))).decode()
          assert 'Requires-Dist: python-sat==1.9.dev15; extra == "test"' in metadata
          assert 'Requires-Dist: python-sat==1.9.dev15; extra == "dev"' in metadata
          PY
      - name: Commit the validated branch fix
        run: |
          git config user.name Tugrap
          git config user.email 106766396+tugrapaydiner@users.noreply.github.com
          git rm .branch/finish-test-extra.patch
          git add pyproject.toml scripts/check_release_readiness.py tests/public/test_release_hardening.py
          git commit -m "Make the documented public-test install complete"
          git push origin HEAD:research/flagship-finish-20261016
