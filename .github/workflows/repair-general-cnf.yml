name: repair-general-cnf

on:
  push:
    branches:
      - finish-part3
    paths:
      - .github/workflows/repair-general-cnf.yml

permissions:
  contents: write

concurrency:
  group: repair-general-cnf
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: finish-part3
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: marijnheule/drat-trim
          ref: 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          path: .official/drat-trim
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Apply the fail-closed repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise AssertionError(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          # PySAT/Lingeling can omit the final empty-clause record even when its
          # retained derivation is otherwise complete. Add the standard terminal
          # line only after an UNSAT result; the pinned external checker remains
          # the authority on whether the resulting proof is valid.
          path = 'experiments/general_competition/proof_backend.py'
          text = read(path)
          text = replace_once(
              text,
              '            proof = _proof_lines(raw_proof)\n',
              '            proof = _proof_lines(raw_proof)\n'
              '            if not _has_empty_clause(proof):\n'
              '                proof = (*proof, "0")\n',
              'terminal DRAT clause',
          )
          write(path, text)

          path = 'experiments/general_competition/test_proof_backend.py'
          text = read(path)
          marker = '''def test_retained_original_formula_proof_passes_drat_trim(tmp_path):
              clauses = unsat_cube()
              result = solve_safe_hybrid(3, clauses)
              formula = write_dimacs(tmp_path / "formula.cnf", 3, clauses)
              proof = write_drat(tmp_path / "proof.drat", result.proof)
              receipt = check_drat(os.environ["DRAT_TRIM"], formula, proof)
              assert receipt.verified, receipt.record()
              assert receipt.returncode == 0
              assert "VERIFIED" in (receipt.stdout + receipt.stderr).upper()


          '''
          addition = marker + '''@pytest.mark.skipif(
              not os.environ.get("DRAT_TRIM"),
              reason="pinned external DRAT-trim checker is not configured",
          )
          def test_root_conflict_proof_passes_drat_trim(tmp_path):
              clauses = ((1,), (-1,))
              result = solve_safe_hybrid(1, clauses)
              formula = write_dimacs(tmp_path / "root-conflict.cnf", 1, clauses)
              proof = write_drat(tmp_path / "root-conflict.drat", result.proof)
              receipt = check_drat(os.environ["DRAT_TRIM"], formula, proof)
              assert receipt.verified, receipt.record()


          '''
          text = replace_once(text, marker, addition, 'root-conflict DRAT check')
          write(path, text)

          # The native general-CNF matrix is now a permanent contract, not a
          # one-shot workflow. Keep both inventory guards synchronized.
          for path, anchor in (
              ('scripts/check_active_tree.py', '    "exact-public-api.yml",\n'),
              ('tests/test_release_version_intent.py', '    "exact-public-api.yml",\n'),
          ):
              text = read(path)
              text = replace_once(
                  text,
                  anchor,
                  anchor + '    "general-cnf.yml",\n',
                  f'{path} workflow inventory',
              )
              write(path, text)

          # Allow the matched benchmark to use the native reducer on large SAT
          # formulas. Acceptance still requires a complete model that checks on
          # the exact original CNF, so the native reduction is never trusted as
          # an answer by itself.
          path = 'experiments/general_competition/matched_backend.py'
          text = read(path)
          text = replace_once(
              text,
              'class MatchedComparison:\n    schema: str\n    solver: str\n',
              'class MatchedComparison:\n    schema: str\n    solver: str\n    frontend: str\n',
              'matched result frontend field',
          )
          text = replace_once(
              text,
              '    solver_name: str = "cadical195",\n    order: str = "plain-first",\n) -> MatchedComparison:\n',
              '    solver_name: str = "cadical195",\n    order: str = "plain-first",\n    native_core=None,\n) -> MatchedComparison:\n',
              'matched native parameter',
          )
          old_core = '''    core_started = perf_counter_ns()
              core = build_binary_core(nvars, canonical)
              core_elapsed = perf_counter_ns() - core_started
              if not verify_binary_core(nvars, canonical, core):
                  raise AssertionError("binary core failed independent replay")
          '''
          new_core = '''    core_started = perf_counter_ns()
              if native_core is None:
                  core = build_binary_core(nvars, canonical)
                  if not verify_binary_core(nvars, canonical, core):
                      raise AssertionError("binary core failed independent replay")
                  frontend = "python-replayable-binary-core"
              else:
                  core = native_core.reduce(nvars, canonical)
                  if core.original_nvars != nvars:
                      raise AssertionError("native binary core belongs to another formula")
                  frontend = "native-binary-core-v1"
              core_elapsed = perf_counter_ns() - core_started
          '''
          text = replace_once(text, old_core, new_core, 'matched core selection')
          text = replace_once(
              text,
              '                propagations=len(core.unit_trace),\n',
              '                propagations=getattr(core, "propagated_classes", 0),\n',
              'native contradiction receipt',
          )
          text = replace_once(
              text,
              '        solver=solver_name,\n        original_variables=nvars,\n',
              '        solver=solver_name,\n        frontend=frontend,\n        original_variables=nvars,\n',
              'matched frontend receipt',
          )
          text = replace_once(
              text,
              '            "exposed post-admission development diagnostic; same backend in both arms; "\n'
              '            "SAT models checked on original CNF; residual UNSAT has no standard proof yet"\n',
              '            "exposed post-admission development diagnostic; same backend in both arms; "\n'
              '            f"frontend={frontend}; SAT models checked on original CNF; "\n'
              '            "residual UNSAT has no standard proof yet"\n',
              'matched claim boundary',
          )
          write(path, text)

          path = 'experiments/general_competition/exposed_panel.py'
          text = read(path)
          text = replace_once(
              text,
              'from experiments.general_competition.matched_backend import compare_same_backend\n',
              'from experiments.general_competition.matched_backend import compare_same_backend\n'
              'from experiments.general_competition.native_binary_core import (\n'
              '    NativeBinaryCore,\n'
              '    build_native_binary_core,\n'
              ')\n',
              'panel native imports',
          )
          text = replace_once(
              text,
              '    root = Path(directory).resolve()\n    root.mkdir(parents=True, exist_ok=True)\n    cases = []\n',
              '    root = Path(directory).resolve()\n'
              '    root.mkdir(parents=True, exist_ok=True)\n'
              '    native_directory = root / "native-binary-core"\n'
              '    native_library = native_directory / "libspectra_general_core.so"\n'
              '    if not native_library.is_file():\n'
              '        native_library = build_native_binary_core(native_directory)\n'
              '    native_core = NativeBinaryCore(native_library)\n'
              '    cases = []\n',
              'panel native build',
          )
          text = replace_once(
              text,
              '                solver_name=solver_name,\n                order=order,\n',
              '                solver_name=solver_name,\n                order=order,\n                native_core=native_core,\n',
              'panel native execution',
          )
          text = replace_once(
              text,
              '        "solver": solver_name,\n        "repeats": repeats,\n',
              '        "solver": solver_name,\n        "frontend": "native-binary-core-v1",\n        "repeats": repeats,\n',
              'panel frontend receipt',
          )
          write(path, text)

          path = 'experiments/general_competition/test_matched_backend.py'
          text = read(path)
          text = replace_once(
              text,
              'from __future__ import annotations\n\nimport pytest\n',
              'from __future__ import annotations\n\nimport shutil\nimport sys\n\nimport pytest\n',
              'matched native test imports',
          )
          text = replace_once(
              text,
              'from experiments.general_competition.matched_backend import compare_same_backend\n',
              'from experiments.general_competition.matched_backend import compare_same_backend\n'
              'from experiments.general_competition.native_binary_core import (\n'
              '    NativeBinaryCore,\n'
              '    build_native_binary_core,\n'
              ')\n',
              'matched native test module',
          )
          text += '''

          @pytest.mark.skipif(
              sys.platform != "linux" or shutil.which("g++") is None,
              reason="native binary-core builder requires Linux and g++",
          )
          def test_native_frontend_keeps_original_model_checking(tmp_path):
              runtime = NativeBinaryCore(build_native_binary_core(tmp_path / "native-core"))
              result = compare_same_backend(
                  4,
                  ((1, -2), (-1, 2), (2, 3, 4), (-3, 4)),
                  native_core=runtime,
              )
              assert result.frontend == "native-binary-core-v1"
              assert result.accepted_for_timing
              assert result.plain.model_verified and result.hybrid.model_verified
          '''.replace('          ', '')
          write(path, text)
          PY

          git rm .github/workflows/repair-general-cnf.yml

      - name: Run the focused repair checks
        shell: bash
        env:
          DRAT_TRIM: ${{ github.workspace }}/.official/drat-trim/drat-trim
        run: |
          set -euo pipefail
          make -C .official/drat-trim
          python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15' 'pyyaml==6.0.3'
          python -m py_compile \
            experiments/general_competition/proof_backend.py \
            experiments/general_competition/matched_backend.py \
            experiments/general_competition/exposed_panel.py
          python -m pytest \
            experiments/general_competition/test_proof_backend.py \
            experiments/general_competition/test_matched_backend.py \
            tests/test_release_version_intent.py \
            -q
          python scripts/check_active_tree.py > /tmp/active-tree.json
          git diff --check

      - name: Commit the repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tugrap"
          git config user.email "106766396+tugrapaydiner@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair the general CNF validation path"
          git push origin HEAD:refs/heads/finish-part3
