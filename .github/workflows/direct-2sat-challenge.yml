name: direct-2sat-challenge

on:
  push:
    branches: [direct-2sat-challenge]
    paths:
      - 'experiments/compiled_query/direct_twosat*'
      - 'experiments/compiled_query/test_direct_twosat.py'
      - 'experiments/compiled_query/DIRECT_2SAT_CHALLENGE.md'
      - '.github/workflows/direct-2sat-challenge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: direct-2sat-challenge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest==9.0.2'
      - name: Compile and run the independent contracts
        run: |
          set -euo pipefail
          python -m py_compile \
            experiments/compiled_query/direct_twosat.py \
            experiments/compiled_query/direct_twosat_benchmark.py \
            experiments/compiled_query/test_direct_twosat.py
          python -m pytest experiments/compiled_query/test_direct_twosat.py -q
          git diff --check

  sanitizers:
    name: Sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [undefined, 'address,undefined']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest==9.0.2'
      - name: Run focused contracts under the native sanitizer
        env:
          DIRECT_2SAT_SANITIZER: ${{ matrix.sanitizer }}
        run: |
          set -euo pipefail
          export UBSAN_OPTIONS=halt_on_error=1
          if [ "$DIRECT_2SAT_SANITIZER" = 'address,undefined' ]; then
            export LD_PRELOAD="$(g++ -print-file-name=libasan.so):$(g++ -print-file-name=libstdc++.so)"
            export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
          fi
          python -m pytest experiments/compiled_query/test_direct_twosat.py \
            -k 'not exhaustive' -q

  benchmark:
    name: Exploratory benchmark (${{ matrix.runner }})
    needs: contracts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build both independent native services
        shell: bash
        run: |
          set -euo pipefail
          SPECTRA_LIBRARY="$(python -c "from spectra.exact import build_exact_runtime; print(build_exact_runtime('challenge-build/spectra'))")"
          DIRECT_LIBRARY="$(python -c "from experiments.compiled_query.direct_twosat import build_direct_twosat_runtime; print(build_direct_twosat_runtime('challenge-build/direct'))")"
          echo "SPECTRA_LIBRARY=$SPECTRA_LIBRARY" >> "$GITHUB_ENV"
          echo "DIRECT_LIBRARY=$DIRECT_LIBRARY" >> "$GITHUB_ENV"
      - name: Run the exposed synthetic challenge
        run: |
          set -euo pipefail
          python -m experiments.compiled_query.direct_twosat_benchmark \
            --spectra-library "$SPECTRA_LIBRARY" \
            --direct-library "$DIRECT_LIBRARY" \
            --out direct-2sat-results \
            --repeats 24
      - uses: actions/upload-artifact@v4
        with:
          name: direct-2sat-${{ matrix.runner }}-${{ github.run_id }}
          path: direct-2sat-results/
          retention-days: 90
          if-no-files-found: error
