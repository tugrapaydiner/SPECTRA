name: m11-adaptive-execution

on:
  push:
    branches: [research/m11-adaptive-execution]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adaptive-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install CPU dependencies
        run: |
          set -euxo pipefail
          mkdir -p .m11
          timeout 360s python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4" |& tee .m11/install_torch.txt
          timeout 180s python -m pip install -r requirements.txt |& tee .m11/install_requirements.txt

      - name: Compile M11 paths
        shell: bash
        run: |
          set +e
          python -m py_compile model/operators.py model/trm.py model/halting.py deploy/m11_adaptive_runtime.py scripts/m11_adaptive_execution.py
          echo "$?" | tee .m11/compile_exit_code.txt
          exit 0

      - name: Focused M11 contracts
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 600s python -m pytest tests/test_m11_adaptive_execution.py tests/test_halting.py -m "not slow" -q |& tee .m11/pytest_m11.txt
          code=${PIPESTATUS[0]}
          echo "$code" | tee .m11/focused_exit_code.txt
          exit 0

      - name: Run M11 retained measurement
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 1800s python scripts/m11_adaptive_execution.py --out .m11/experiment |& tee .m11/run.log
          code=${PIPESTATUS[0]}
          echo "$code" | tee .m11/experiment_exit_code.txt
          exit 0

      - name: Verify M11 acceptance evidence
        shell: bash
        run: |
          set +e
          python - <<'PY' |& tee .m11/evidence_check.txt
          import json, pathlib, sys
          root=pathlib.Path('.m11/experiment')
          required=['summary.json','measurement.json','score_rows.json','m11_cpu_artifact.pt']
          missing=[p for p in required if not (root/p).is_file()]
          print('missing=',missing)
          if missing: sys.exit(2)
          s=json.loads((root/'summary.json').read_text())
          print(json.dumps(s,indent=2,sort_keys=True))
          assert s['milestone']==11
          assert s['scope']=='real_adaptive_execution_batch1'
          assert s['status']=='complete'
          a=s['acceptance']
          assert a['full_density_equivalence'] is True
          assert a['earlier_halting_fewer_steps_and_work'] is True
          assert a['sparse_execution_skips_declared_work'] is True
          assert a['native_full_density_equivalence'] is True
          assert a['native_sparse_reference_equivalence'] is True
          assert a['native_sparse_reduces_real_work'] is True
          assert a['router_and_halter_overhead_measured'] is True
          e=s['early_exit']
          assert e['stop_reason']=='policy_halt'
          assert e['executed_steps'] < e['full_executed_steps']
          assert e['work']['block_applications'] < e['full_work']['block_applications']
          ar=s['adaptive_router_halter']
          assert ar['work']['router_calls'] > 0 and ar['work']['halter_calls'] > 0
          assert ar['timing_internal']['router_seconds'] >= 0
          assert ar['timing_internal']['halter_seconds'] >= 0
          nw=s['native_work']
          assert nw['half_active']['native_input_vectors'] < nw['full']['native_input_vectors']
          assert nw['half_active']['native_scalar_products'] < nw['full']['native_scalar_products']
          assert nw['half_active']['attention_k_vectors'] > nw['half_active']['attention_q_vectors']
          assert s['interpretation']['attention_kv_remain_dense'] is True
          assert s['interpretation']['whole_model_linear_density_claim'] is False
          assert s['interpretation']['batch_compaction_claim'] is False
          assert s['interpretation']['adaptive_can_be_slower_due_to_control_gather_scatter'] is True
          assert s['interpretation']['accuracy_can_drop_under_early_or_sparse_execution'] is True
          print('M11_ADAPTIVE_EXECUTION_GATE=PASS')
          PY
          echo "$?" | tee .m11/evidence_check_exit_code.txt
          exit 0

      - name: Full fast regression
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 900s python -m pytest -m "not slow" -ra |& tee .m11/pytest_fast.txt
          code=${PIPESTATUS[0]}
          echo "$code" | tee .m11/fast_exit_code.txt
          exit 0

      - name: Record provenance and hashes
        if: always()
        run: |
          {
            echo "head=$(git rev-parse HEAD)"
            echo "base=17c60819e2b5aace48b7b9994d0254989df25ab9"
            echo
            git diff --stat 17c60819e2b5aace48b7b9994d0254989df25ab9...HEAD
          } | tee .m11/diff_stat.txt
          python - <<'PY' | tee .m11/evidence_sha256.txt
          import hashlib,pathlib
          root=pathlib.Path('.m11')
          for p in sorted(q for q in root.rglob('*') if q.is_file() and q.name!='evidence_sha256.txt'):
              print(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}")
          PY

      - name: Upload M11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m11-adaptive-execution-evidence
          path: .m11/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Enforce M11 acceptance
        if: always()
        run: |
          compile=$(cat .m11/compile_exit_code.txt 2>/dev/null || echo 99)
          focused=$(cat .m11/focused_exit_code.txt 2>/dev/null || echo 99)
          experiment=$(cat .m11/experiment_exit_code.txt 2>/dev/null || echo 99)
          evidence=$(cat .m11/evidence_check_exit_code.txt 2>/dev/null || echo 99)
          fast=$(cat .m11/fast_exit_code.txt 2>/dev/null || echo 99)
          echo "compile=$compile focused=$focused experiment=$experiment evidence=$evidence fast=$fast"
          if [ "$compile" -ne 0 ] || [ "$focused" -ne 0 ] || [ "$experiment" -ne 0 ] || [ "$evidence" -ne 0 ] || [ "$fast" -ne 0 ]; then
            echo "M11 adaptive-execution acceptance not established; inspect retained evidence."
            exit 1
          fi
          echo "M11 adaptive-execution acceptance passed."
