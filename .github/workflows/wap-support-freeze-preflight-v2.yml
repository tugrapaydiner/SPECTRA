name: WAP support freeze preflight v2
on:
  push:
    branches: [research/quotient-application-v2-20261008]
    paths: [.github/workflows/wap-support-freeze-preflight-v2.yml]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Record exact unopened source state
        shell: bash
        run: |
          set -euo pipefail
          test ! -e experiments/wap_support/FREEZE.json
          test ! -e experiments/wap_support/HOLDOUT_OPEN.json
          status="$(git status --porcelain)"
          test -z "$status"
          mkdir -p delivery
          printf '%s' "$status" > delivery/initial-status.txt
          cat > delivery/PREFLIGHT_HISTORY.txt <<'EOF'
          Run 37882539282 stopped before any graph access because its receipt directory was created before the cleanliness check.
          Run 37882601328 passed the full public and UBSan suites and acquired only development graphs, then refused the certificate because ABI-v3 triples were not yet converted to the strict public CSR schema. No timing matrix or holdout graph was opened.
          This run includes strict canonical transport and a nonempty-residual-arc native-export-to-independent-verifier regression.
          EOF
          git rev-parse HEAD > delivery/source-commit.txt
          git rev-parse HEAD^{tree} > delivery/source-tree.txt
          git archive --format=tar.gz --prefix=SPECTRA/ HEAD > delivery/source.tar.gz
          git bundle create delivery/source-history.bundle --all
      - name: Install pinned test and solver controls
        run: |
          python -m pip install -q pytest==9.0.2 'python-sat==1.9.dev15'
          python -m pip freeze > delivery/environment.txt
          python --version > delivery/python.txt
          g++ --version > delivery/compiler.txt
      - name: Run complete public contracts
        run: |
          python -m pytest tests/public --confcutdir=tests/public \
            --junitxml=delivery/public-tests.xml > delivery/public-tests.log 2>&1
      - name: Run focused contracts under undefined-behaviour sanitizer
        shell: bash
        run: |
          set -euo pipefail
          python -c "from spectra.cnf.quotient_query import build_quotient_runtime; print(build_quotient_runtime('delivery/ubsan-native',sanitize=True))" > delivery/ubsan-runtime-path.txt
          SPECTRA_QUOTIENT_LIBRARY="$(cat delivery/ubsan-runtime-path.txt)" \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_wap_support.py \
            tests/public/test_wap_support_audit.py \
            tests/public/test_quotient_native_contract.py \
            tests/public/test_arcfree_support.py \
            > delivery/ubsan-tests.log 2>&1
      - name: Acquire exactly three consumed development graphs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery/graphs
          for name in wap01a.col wap05a.col wap06a.col; do
            curl --fail --location --retry 3 --retry-all-errors \
              "https://raw.githubusercontent.com/marijnheule/clicolcom/4932048642da2144f387961b595112277afff82f/graphs/${name}" \
              -o "delivery/graphs/${name}"
          done
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          inventory=json.load(open('experiments/quotient_application/WAP_UPSTREAM_INVENTORY.json'))
          expected=['wap01a.col','wap05a.col','wap06a.col']
          receipts=[]
          for name in expected:
              record=inventory['graphs'][name]
              assert record['role'] in ('development','development_consumed')
              data=(Path('delivery/graphs')/name).read_bytes()
              blob=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
              assert len(data)==record['bytes']
              assert blob==record['git_blob_sha1']
              receipts.append({'name':name,'role':record['role'],'bytes':len(data),
                               'git_blob_sha1':blob,'sha256':hashlib.sha256(data).hexdigest()})
          assert sorted(p.name for p in Path('delivery/graphs').iterdir())==expected
          Path('delivery/development-graph-acquisition.json').write_text(json.dumps({
              'schema':'spectra.wap_support.development_graph_acquisition.v1',
              'repository':inventory['repository'],'commit':inventory['commit'],
              'graphs':receipts},sort_keys=True,indent=2)+'\n')
          PY
      - name: Build optimized runtime and development cases
        shell: bash
        run: |
          set -euo pipefail
          python -c "from spectra.cnf.quotient_query import build_quotient_runtime; print(build_quotient_runtime('delivery/native'))" > delivery/runtime-path.txt
          cp delivery/native/build.json delivery/runtime-build.json
          python -m experiments.wap_support.run build-cases \
            --graphs delivery/graphs \
            --inventory experiments/quotient_application/WAP_UPSTREAM_INVENTORY.json \
            --out delivery/cases \
            --roles development development_consumed \
            > delivery/case-build.log 2>&1
      - name: Independently audit every development quotient relation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,time,zlib
          from pathlib import Path
          from experiments.wap_support.workload import WorkloadCase
          from spectra.cnf.quotient_query import QuotientRuntime
          from spectra.cnf.quotient_certificate import verify_quotient
          runtime=QuotientRuntime(Path('delivery/runtime-path.txt').read_text().strip())
          out=Path('delivery/certificates'); out.mkdir()
          rows=[]
          for path in sorted(Path('delivery/cases/cases').glob('*.json')):
              case=WorkloadCase.from_json(path)
              start=time.perf_counter_ns()
              prepared=runtime.prepare(case.n,case.palette,case.edges,masks=case.masks,
                                       mode='scc',max_build_bytes=512*1024*1024)
              try:
                  certificate=prepared.certificate()
                  audit=verify_quotient(case.n,case.palette,case.edges,case.masks,certificate)
                  assert audit['valid'] and audit['mapping_verified']
              finally:
                  prepared.close()
              payload=json.dumps(certificate,sort_keys=True,separators=(',',':')).encode()
              compressed=zlib.compress(payload,9)
              destination=out/(path.stem+'.certificate.json.zlib')
              destination.write_bytes(compressed)
              rows.append({'case_file':path.name,'case_sha256':case.case_sha256,
                           'certificate_sha256':hashlib.sha256(payload).hexdigest(),
                           'compressed_sha256':hashlib.sha256(compressed).hexdigest(),
                           'certificate_bytes':len(payload),'compressed_bytes':len(compressed),
                           'audit':audit,'audit_ns':time.perf_counter_ns()-start})
          assert len(rows)==3
          Path('delivery/development-certificate-audit.json').write_text(json.dumps({
              'schema':'spectra.wap_support.certificate_audit.v1','cases':rows
          },sort_keys=True,indent=2)+'\n')
          PY
      - name: Rerun complete 63-session development matrix
        run: |
          python -m experiments.wap_support.run run \
            --cases delivery/cases/cases \
            --runtime "$(cat delivery/runtime-path.txt)" \
            --out delivery/evidence \
            > delivery/measurement.log 2>&1
      - name: Reconstruct and audit development evidence
        run: |
          python -m experiments.wap_support.analyse \
            --cases delivery/cases \
            --evidence delivery/evidence \
            --runtime "$(cat delivery/runtime-path.txt)" \
            --inventory experiments/quotient_application/WAP_UPSTREAM_INVENTORY.json \
            --out delivery/development-analysis.json \
            --reconstruct-cases \
            --expected-role development \
            --expected-role development_consumed \
            > delivery/analysis.log 2>&1
      - name: Generate exact proposed prospective freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib,json,subprocess
          from pathlib import Path
          from experiments.wap_support import analyse,controls,run,workload
          root=Path('.')
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          names=subprocess.check_output(['git','ls-files','-z']).split(b'\0')
          names=[n.decode() for n in names if n]
          assert 'experiments/wap_support/FREEZE.json' not in names
          assert 'experiments/wap_support/HOLDOUT_OPEN.json' not in names
          sources={name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in sorted(names)}
          inv_path=root/'experiments/quotient_application/WAP_UPSTREAM_INVENTORY.json'
          inventory=json.loads(inv_path.read_text())
          holdouts={name:{'bytes':record['bytes'],'git_blob_sha1':record['git_blob_sha1']}
                    for name,record in sorted(inventory['graphs'].items())
                    if record['role']=='prospective_holdout'}
          assert sorted(holdouts)==['wap02a.col','wap03a.col','wap04a.col','wap07a.col','wap08a.col']
          development_analysis=json.load(open('delivery/development-analysis.json'))
          assert development_analysis['graphs']==3 and development_analysis['sessions']==63
          assert development_analysis['answers_audited']==64512
          def digest(path):return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          freeze={
            'schema':'spectra.wap_support.freeze.v1',
            'source_commit':commit,
            'sources':sources,
            'upstream':{'repository':inventory['repository'],'commit':inventory['commit'],
                        'role':'prospective_holdout','graphs':holdouts},
            'constants':{
              'query_count':workload.QUERY_COUNT,
              'query_width':workload.QUERY_WIDTH,
              'max_generator_attempts':workload.MAX_GENERATOR_ATTEMPTS,
              'min_unique_oracle_models':workload.MIN_UNIQUE_ORACLE_MODELS,
              'master_seed':workload.MASTER_SEED,
              'arms':list(controls.ARMS),'orders':list(run.ORDERS),
              'schedule_seed':run.SCHEDULE_SEED,'max_work':controls.MAX_WORK,
              'max_native_bytes':controls.MAX_BYTES,'model_cache_size':controls.CACHE_SIZE,
              'address_space_bytes':run.ADDRESS_SPACE_BYTES,
              'session_deadline_seconds':run.SESSION_DEADLINE_SECONDS,
              'primary_candidate':analyse.PRIMARY,'primary_control':analyse.CONTROL,
              'mean_ratio_upper_gate':analyse.MEAN_UPPER_GATE,
              'p95_ratio_upper_gate':analyse.P95_UPPER_GATE,
              'python_sat':analyse.EXPECTED_PYSAT,
            },
            'statistics':{'independent_graph_clusters':5,'exact_graph_resamples':3125,
                          'orders_per_graph':3,'answers_expected':107520},
            'development_receipts':{
              'source_tree':Path('delivery/source-tree.txt').read_text().strip(),
              'public_tests_sha256':digest('delivery/public-tests.xml'),
              'ubsan_tests_sha256':digest('delivery/ubsan-tests.log'),
              'graph_acquisition_sha256':digest('delivery/development-graph-acquisition.json'),
              'case_inventory_sha256':digest('delivery/cases/case_inventory.json'),
              'case_manifest_sha256':digest('delivery/cases/MANIFEST.json'),
              'evidence_manifest_sha256':digest('delivery/evidence/MANIFEST.json'),
              'certificate_audit_sha256':digest('delivery/development-certificate-audit.json'),
              'analysis_sha256':digest('delivery/development-analysis.json'),
              'analysis':development_analysis,
            },
            'claims':{
              'scope':'synthetic list/query workload on public WAP optical conflict topologies',
              'not_claimed':['ordinary chromatic-number superiority','deployed optical-network traces',
                             'general SAT superiority','learned reasoning','algorithmic novelty',
                             'independent-team replication','external adoption'],
            },
            'stop_rule':{'no_post_opening_tuning':True,'failure_is_preserved':True,
                         'changes_require_new_unopened_data':True},
          }
          Path('delivery/proposed-FREEZE.json').write_text(json.dumps(freeze,sort_keys=True,indent=2)+'\n')
          print(json.dumps({'source_commit':commit,'sources':len(sources),
                            'freeze_sha256':digest('delivery/proposed-FREEZE.json'),
                            'development_verdict':development_analysis['verdict']},sort_keys=True))
          PY
      - name: Seal delivery receipts
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('delivery')
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in sorted(root.rglob('*')) if p.is_file() and p.name!='DELIVERY_SHA256.json'}
          (root/'DELIVERY_SHA256.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wap-support-freeze-preflight-v2-${{ github.run_id }}
          path: delivery
          include-hidden-files: true
          retention-days: 90
