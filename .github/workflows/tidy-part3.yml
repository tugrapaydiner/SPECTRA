name: tidy-part3

on:
  push:
    branches:
      - part3/release-replication-readiness
    paths:
      - .github/workflows/tidy-part3.yml

permissions:
  contents: write

concurrency:
  group: tidy-part3
  cancel-in-progress: false

jobs:
  tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'
      - name: Apply the reviewed cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise AssertionError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          # Bind the human-readable environment receipt to the native build receipt.
          path = "spectra/exact_selftest.py"
          text = read(path)
          old = '''    _require(receipt["exact_api_version"] == EXACT_API_VERSION, "receipt API differs")
          _require(receipt["native_abi"] == EXACT_NATIVE_ABI, "receipt ABI differs")
          _require(receipt["library_name"] == library_path.name, "receipt library name differs")
          '''
          new = '''    _require(receipt["exact_api_version"] == EXACT_API_VERSION, "receipt API differs")
          _require(receipt["native_abi"] == EXACT_NATIVE_ABI, "receipt ABI differs")
          _require(receipt["python_implementation"] == "CPython", "receipt Python implementation differs")
          _require(report["python"] == receipt["python_version"], "reported Python version differs")
          _require(
              report["python_executable"] == receipt["python_executable"],
              "reported Python executable differs",
          )
          _require(report["platform"] == receipt["platform"], "reported platform differs")
          _require(receipt["library_name"] == library_path.name, "receipt library name differs")
          '''
          text = replace_once(text, old, new, "environment receipt binding")
          write(path, text)

          # Keep the Part 3 CLI change focused; restore the pre-existing CNF error text.
          path = "spectra/cli.py"
          text = read(path)
          text = replace_once(
              text,
              'raise ValueError("expected a JSON object containing a Boolean-list witness field")',
              'raise ValueError("expected a JSON object containing a Boolean-list witness")',
              "CNF error wording",
          )
          write(path, text)

          # Challenge both the fresh-process guard and forged environment metadata.
          path = "tests/public/test_exact_selftest.py"
          text = read(path)
          text = replace_once(
              text,
              "from spectra.evidence import verify\n",
              "from spectra.evidence import capture, verify\n",
              "evidence imports",
          )
          text = replace_once(
              text,
              "from spectra.exact_selftest import AUDIT_SCHEMA, SCHEMA\n",
              "from spectra.exact_selftest import AUDIT_SCHEMA, SCHEMA, verify_exact_selftest\n",
              "self-test imports",
          )
          marker = '''
          @pytest.mark.skipif(
          '''
          addition = '''
          def _refresh_manifest(root: Path) -> None:
              path = root / "SHA256.json"
              old = json.loads(path.read_text(encoding="utf-8"))
              manifest = capture(root, old["artifacts"])
              path.write_text(
                  json.dumps(manifest, indent=2, sort_keys=True) + "\\n",
                  encoding="utf-8",
              )


          def test_audit_refuses_an_already_loaded_native_module(tmp_path, monkeypatch):
              monkeypatch.setitem(sys.modules, "_spectra_exact_binary", object())
              with pytest.raises(RuntimeError, match="fresh process"):
                  verify_exact_selftest(tmp_path)


          @pytest.mark.skipif(
          '''
          text = replace_once(text, marker, addition, "audit guard tests")
          marker = '''    output = root / cases["mixed-current-query"]["output"]
          '''
          addition = '''    report_path = root / "selftest.json"
              original_report = report_path.read_text(encoding="utf-8")
              forged = json.loads(original_report)
              forged["platform"] = "forged-platform"
              report_path.write_text(
                  json.dumps(forged, indent=2, sort_keys=True) + "\\n",
                  encoding="utf-8",
              )
              _refresh_manifest(root)
              environment_mismatch = _run("exact", "audit", root)
              assert environment_mismatch.returncode == 2
              assert "reported platform differs" in environment_mismatch.stderr.lower()
              report_path.write_text(original_report, encoding="utf-8")
              _refresh_manifest(root)

              output = root / cases["mixed-current-query"]["output"]
          '''
          text = replace_once(text, marker, addition, "environment tamper test")
          write(path, text)

          # Correct the public support statement: Linux ARM64 is in the verified matrix.
          path = "docs/EXACT_REPLICATION.md"
          text = read(path)
          text = replace_once(
              text,
              "- GIL-enabled CPython on a supported Linux or Windows x64 environment;\n",
              "- GIL-enabled CPython on Linux x86-64 or ARM64, or Windows x64;\n",
              "replication platform wording",
          )
          write(path, text)

          # Restore the historical navigation paragraph dropped by an earlier full-file edit.
          path = "CHANGELOG.md"
          text = read(path)
          tail = '''Measurements retain small-case regressions, increased cold allocation and the
          `UNKNOWN` large-case outcomes. No external SAT superiority or learned-capability
          improvement was established. See [the efficiency guide](docs/EFFICIENCY_GUIDE.md).
          '''
          restored = tail + '''
          Earlier packaging and compact-state work is described in
          [current status](docs/STATUS.md) and the [history index](docs/history/README.md).
          '''
          text = replace_once(text, tail, restored, "changelog history links")
          write(path, text)

          Path(".github/workflows/tidy-part3.yml").unlink()
          PY
      - name: Verify the cleanup
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            spectra/cli.py \
            spectra/exact_selftest.py \
            spectra/exact_compare.py \
            tests/public/test_exact_selftest.py \
            tests/public/test_exact_compare.py
          python -m pytest \
            tests/public/test_exact_selftest.py \
            tests/public/test_exact_compare.py \
            --confcutdir=tests/public -q
          python scripts/check_release_readiness.py
          python scripts/check_active_tree.py
          git diff --check
      - name: Save the cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Tighten Part 3 verification"
          git push origin HEAD:refs/heads/part3/release-replication-readiness
