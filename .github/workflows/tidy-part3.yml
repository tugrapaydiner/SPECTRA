name: tidy-part3

on:
  push:
    branches:
      - part3/release-replication-readiness
    paths:
      - .github/workflows/tidy-part3.yml

permissions:
  contents: write

concurrency:
  group: tidy-part3
  cancel-in-progress: false

jobs:
  tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'
      - name: Apply the reviewed cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise AssertionError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          # Bind the readable environment fields to the native build receipt.
          path = "spectra/exact_selftest.py"
          text = read(path)
          needle = '    _require(receipt["library_name"] == library_path.name, "receipt library name differs")\n'
          environment_checks = "".join([
              '    _require(receipt["python_implementation"] == "CPython", "receipt Python implementation differs")\n',
              '    _require(report["python"] == receipt["python_version"], "reported Python version differs")\n',
              '    _require(\n',
              '        report["python_executable"] == receipt["python_executable"],\n',
              '        "reported Python executable differs",\n',
              '    )\n',
              '    _require(report["platform"] == receipt["platform"], "reported platform differs")\n',
              needle,
          ])
          text = replace_once(text, needle, environment_checks, "environment receipt binding")
          write(path, text)

          # Keep this PR focused by restoring the existing CNF error text.
          path = "spectra/cli.py"
          text = read(path)
          text = replace_once(
              text,
              'raise ValueError("expected a JSON object containing a Boolean-list witness field")',
              'raise ValueError("expected a JSON object containing a Boolean-list witness")',
              "CNF error wording",
          )
          write(path, text)

          # Challenge the fresh-process guard and forged environment metadata.
          path = "tests/public/test_exact_selftest.py"
          text = read(path)
          text = replace_once(
              text,
              "from spectra.evidence import verify\n",
              "from spectra.evidence import capture, verify\n",
              "evidence imports",
          )
          text = replace_once(
              text,
              "from spectra.exact_selftest import AUDIT_SCHEMA, SCHEMA\n",
              "from spectra.exact_selftest import AUDIT_SCHEMA, SCHEMA, verify_exact_selftest\n",
              "self-test imports",
          )
          marker = "@pytest.mark.skipif(\n"
          guard_tests = "".join([
              'def _refresh_manifest(root: Path) -> None:\n',
              '    path = root / "SHA256.json"\n',
              '    old = json.loads(path.read_text(encoding="utf-8"))\n',
              '    manifest = capture(root, old["artifacts"])\n',
              '    path.write_text(\n',
              '        json.dumps(manifest, indent=2, sort_keys=True) + "\\n",\n',
              '        encoding="utf-8",\n',
              '    )\n',
              '\n',
              '\n',
              'def test_audit_refuses_an_already_loaded_native_module(tmp_path, monkeypatch):\n',
              '    monkeypatch.setitem(sys.modules, "_spectra_exact_binary", object())\n',
              '    with pytest.raises(RuntimeError, match="fresh process"):\n',
              '        verify_exact_selftest(tmp_path)\n',
              '\n',
              '\n',
              marker,
          ])
          text = replace_once(text, marker, guard_tests, "audit guard tests")

          output_marker = '    output = root / cases["mixed-current-query"]["output"]\n'
          environment_test = "".join([
              '    report_path = root / "selftest.json"\n',
              '    original_report = report_path.read_text(encoding="utf-8")\n',
              '    forged = json.loads(original_report)\n',
              '    forged["platform"] = "forged-platform"\n',
              '    report_path.write_text(\n',
              '        json.dumps(forged, indent=2, sort_keys=True) + "\\n",\n',
              '        encoding="utf-8",\n',
              '    )\n',
              '    _refresh_manifest(root)\n',
              '    environment_mismatch = _run("exact", "audit", root)\n',
              '    assert environment_mismatch.returncode == 2\n',
              '    assert "reported platform differs" in environment_mismatch.stderr.lower()\n',
              '    report_path.write_text(original_report, encoding="utf-8")\n',
              '    _refresh_manifest(root)\n',
              '\n',
              output_marker,
          ])
          text = replace_once(text, output_marker, environment_test, "environment tamper test")
          write(path, text)

          # A valid second environment changes its report and receipt together.
          path = "tests/public/test_exact_compare.py"
          text = read(path)
          refresh_marker = "    _refresh_manifest(second)\n"
          if text.count(refresh_marker) != 2:
              raise AssertionError("comparison manifest refresh count differs")
          receipt_update = "".join([
              '    second_receipt_path = second / second_report["build"]["receipt"]\n',
              '    second_receipt = json.loads(\n',
              '        second_receipt_path.read_text(encoding="utf-8")\n',
              '    )\n',
              '    second_receipt["platform"] = "different-test-platform"\n',
              '    second_receipt_path.write_text(\n',
              '        json.dumps(second_receipt, indent=2, sort_keys=True) + "\\n",\n',
              '        encoding="utf-8",\n',
              '    )\n',
          ])
          text = text.replace(refresh_marker, receipt_update + refresh_marker, 1)
          write(path, text)

          # Linux ARM64 is part of the verified matrix.
          path = "docs/EXACT_REPLICATION.md"
          text = read(path)
          text = replace_once(
              text,
              "- GIL-enabled CPython on a supported Linux or Windows x64 environment;\n",
              "- GIL-enabled CPython on Linux x86-64 or ARM64, or Windows x64;\n",
              "replication platform wording",
          )
          write(path, text)

          # Restore the historical navigation paragraph dropped by an earlier edit.
          path = "CHANGELOG.md"
          text = read(path)
          historical = "".join([
              "Earlier packaging and compact-state work is described in\n",
              "[current status](docs/STATUS.md) and the [history index](docs/history/README.md).\n",
          ])
          if historical not in text:
              tail = "improvement was established. See [the efficiency guide](docs/EFFICIENCY_GUIDE.md).\n"
              if not text.endswith(tail):
                  raise AssertionError("changelog ending differs")
              text += "\n" + historical
          write(path, text)

          Path(".github/workflows/tidy-part3.yml").unlink()
          PY
      - name: Verify the cleanup
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            spectra/cli.py \
            spectra/exact_selftest.py \
            spectra/exact_compare.py \
            tests/public/test_exact_selftest.py \
            tests/public/test_exact_compare.py
          python -m pytest \
            tests/public/test_exact_selftest.py \
            tests/public/test_exact_compare.py \
            --confcutdir=tests/public -q
          python scripts/check_release_readiness.py
          python scripts/check_active_tree.py
          git diff --check
      - name: Save the cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Tighten Part 3 verification"
          git push origin HEAD:refs/heads/part3/release-replication-readiness
