name: apply-auto-selector-v9-fixed

on:
  push:
    branches: [performance/automatic-engine-selection-v8]
    paths: [.github/workflows/apply-auto-selector-v9-fixed.yml]

permissions:
  contents: write

concurrency:
  group: apply-auto-selector-v9-fixed
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply the frozen correction
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_auto_selector_v9.py')
          text = path.read_text()
          old_end = "                direct_reason = 'large_tiny_bank' ''',"
          new_end = "                direct_reason = 'large_tiny_bank'\n        ''',"
          if text.count(old_end) != 1:
              raise RuntimeError('old direct-dispatch anchor differs')
          text = text.replace(old_end, new_end)
          old_end = "                    )''',"
          new_end = "                    )\n        ''',"
          if text.count(old_end) != 1:
              raise RuntimeError('new direct-dispatch anchor differs')
          path.write_text(text.replace(old_end, new_end))
          PY
          python scripts/apply_auto_selector_v9.py
          cmp spectra/_native/exact_binary.cpp experiments/compiled_query/exact_native.cpp
          git diff --check
      - name: Run focused contracts
        run: |
          set -euo pipefail
          python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_auto_selector_v9.py \
            tests/public/test_exact_api.py \
            tests/public/test_exact_bank_tile64.py
          python -m pytest -q --confcutdir=experiments/compiled_query \
            experiments/compiled_query/test_exact.py \
            experiments/compiled_query/test_itc_exam_transfer.py \
            experiments/compiled_query/test_itc_exam_suite.py
      - name: Commit the correction
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-auto-selector-v9.yml \
            .github/workflows/apply-auto-selector-v9-fixed.yml \
            scripts/apply_auto_selector_v9.py
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          git add -A
          git commit -m 'Teach auto mode the dense-bank crossover' \
            -m 'Keep sub-96-vertex dense banks on raw, move longer 96-plus banks to SCC, and bypass SCC construction for structural raw decisions. Freeze a new confirmation panel without changing the existing gates.'
          git push origin HEAD:performance/automatic-engine-selection-v8
