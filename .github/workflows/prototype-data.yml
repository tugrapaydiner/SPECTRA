name: prototype-data
on:
  push:
    branches: [research/budgeted-integer-prototypes]
    paths: [.github/workflows/prototype-data.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch bounded official data only
        shell: python
        run: |
          import urllib.request,pathlib,zipfile,io,json,hashlib,os
          out=pathlib.Path('prototype-inputs');out.mkdir()
          url='https://archive.ics.uci.edu/static/public/80/optical+recognition+of+handwritten+digits.zip'
          with urllib.request.urlopen(url,timeout=60) as f: data=f.read(4*1024*1024+1)
          assert len(data)<=4*1024*1024
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert 'optdigits.tra' in names and 'optdigits.tes' in names
          (out/'optdigits.zip').write_bytes(data)
          (out/'receipt.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'url':url,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'members':names,'scope':'data acquisition only; no training/test predictions'},indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: prototype-official-inputs-${{ github.sha }}
          path: prototype-inputs/
          retention-days: 30
          if-no-files-found: error
