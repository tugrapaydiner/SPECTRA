name: Archive frozen WAP result as draft release
on:
  push:
    branches: [research/wap-support-results-20261009]
    paths: [.github/workflows/wap-support-draft-archive.yml]
permissions:
  actions: read
  contents: write
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: wap-support-result-20261009-draft
      ARTIFACT_ID: '11595284861'
      ARTIFACT_SHA256: 5410db4d5832544c3ec55b19c1449395020319516d20823038de66216b45527c
      FROZEN_SOURCE: 0af6fda36c60a110584e7db836ee5724e530fbd4
      OPEN_COMMIT: b7bca7fb7f62fcb0a43e6b33705cb834cd64494c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind result identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$FROZEN_SOURCE")" = "$FROZEN_SOURCE"
          test "$(git rev-parse "$OPEN_COMMIT")" = "$OPEN_COMMIT"
          test "$(git show "$FROZEN_SOURCE:experiments/wap_support/FREEZE.json" | sha256sum | cut -d' ' -f1)" = "31997d38cced5e5611f3f17dc6bc3929b21dcc92a6b7bc81a78db31aab949020"
          mkdir -p delivery/result-pack
          git rev-parse HEAD > delivery/results-commit.txt
          git rev-parse HEAD^{tree} > delivery/results-tree.txt
          git archive --format=tar.gz --prefix=SPECTRA-results/ HEAD > delivery/SPECTRA-wap-results-source.tar.gz
          cp experiments/wap_support/HOLDOUT_RESULTS_20261009.md delivery/result-pack/
          cp experiments/wap_support/HOLDOUT_DECISION_20261009.json delivery/result-pack/
          cp experiments/wap_support/FLAGSHIP_GATE_LEDGER.md delivery/result-pack/
          cp experiments/wap_support/NOVELTY_AND_CLAIM_BOUNDARY.md delivery/result-pack/
          cp experiments/wap_support/PRIOR_ART_AUDIT_20261009.md delivery/result-pack/
          cp experiments/wap_support/CROSS_ENVIRONMENT_REPRODUCTION_20261009.md delivery/result-pack/
          cp experiments/wap_support/CROSS_ENVIRONMENT_REPRODUCTION_20261009.json delivery/result-pack/
          cp experiments/wap_support/CERTIFICATE_REPRODUCTION_20261009.md delivery/result-pack/
          cp experiments/wap_support/PAPER_DRAFT.md delivery/result-pack/
          cp experiments/wap_support/REPLICATION.md delivery/result-pack/
          tar -C delivery -czf delivery/SPECTRA-wap-result-report-pack.tar.gz result-pack
      - name: Download exact one-shot artifact bytes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o delivery/SPECTRA-frozen-WAP-holdout-evidence.zip
          echo "${ARTIFACT_SHA256}  delivery/SPECTRA-frozen-WAP-holdout-evidence.zip" | sha256sum -c -
      - name: Audit downloaded artifact before archival
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery/audit
          unzip -q delivery/SPECTRA-frozen-WAP-holdout-evidence.zip -d delivery/audit
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('delivery/audit')
          manifest=json.loads((root/'SHA256.json').read_text())
          bad=[]
          for name,expected in manifest.items():
              path=root/name
              if not path.is_file(): bad.append({'path':name,'error':'missing'}); continue
              actual=hashlib.sha256(path.read_bytes()).hexdigest()
              if actual!=expected: bad.append({'path':name,'expected':expected,'actual':actual})
          decision=json.loads((root/'analysis.json').read_text())
          assert decision['verdict']=='PASS'
          assert decision['graphs']==5 and decision['sessions']==105 and decision['answers_audited']==107520
          assert not bad, bad[:5]
          receipt={'schema':'spectra.wap_support.draft_archive_audit.v1',
                   'artifact_id':11595284861,
                   'artifact_sha256':'5410db4d5832544c3ec55b19c1449395020319516d20823038de66216b45527c',
                   'manifest_entries_verified':len(manifest),
                   'analysis_verdict':decision['verdict'],
                   'graphs':decision['graphs'],'sessions':decision['sessions'],
                   'answers_audited':decision['answers_audited'],
                   'bad_entries':bad}
          Path('delivery/ARCHIVE_AUDIT.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          rm -rf delivery/audit
      - name: Build release checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd delivery
          sha256sum \
            SPECTRA-frozen-WAP-holdout-evidence.zip \
            SPECTRA-wap-results-source.tar.gz \
            SPECTRA-wap-result-report-pack.tar.gz \
            ARCHIVE_AUDIT.json \
            results-commit.txt results-tree.txt > SHA256SUMS
          cat > RELEASE_NOTES.md <<'EOF'
          # SPECTRA frozen WAP support-query result

          **Draft archival release — not a package release and not merged to main.**

          The prospectively frozen Python 3.13 result passed on five unopened WAP-A graphs: 105 complete sessions, 107,520 independently checked full answers, SCC/MiniCard mean ratio 0.363503 with exact whole-graph 95% interval [0.346789, 0.372944].

          The attached `SPECTRA-frozen-WAP-holdout-evidence.zip` is the exact GitHub Actions artifact from run 37883619073, artifact ID 11595284861, SHA-256 `5410db4d5832544c3ec55b19c1449395020319516d20823038de66216b45527c`.

          Scope limits: synthetic lists/restrictions; one public topology family; no general SAT/colouring claim; Python 3.11 misses the unchanged 2× complete-call gate; no independent-team replication or external adoption yet.
          EOF
      - name: Create or update draft prerelease and upload immutable assets
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft --prerelease \
              --title "SPECTRA WAP support-query result (draft archive)" \
              --notes-file delivery/RELEASE_NOTES.md
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --draft --prerelease \
              --title "SPECTRA WAP support-query result (draft archive)" \
              --notes-file delivery/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            delivery/SPECTRA-frozen-WAP-holdout-evidence.zip \
            delivery/SPECTRA-wap-results-source.tar.gz \
            delivery/SPECTRA-wap-result-report-pack.tar.gz \
            delivery/ARCHIVE_AUDIT.json \
            delivery/SHA256SUMS
      - name: Retain archival receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name,tagName,isDraft,isPrerelease,targetCommitish,url,assets > delivery/DRAFT_RELEASE.json || true
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('delivery')
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in sorted(root.rglob('*')) if p.is_file() and p.name!='DELIVERY_SHA256.json'}
          (root/'DELIVERY_SHA256.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wap-draft-archive-${{ github.run_id }}
          path: |
            delivery/ARCHIVE_AUDIT.json
            delivery/SHA256SUMS
            delivery/DRAFT_RELEASE.json
            delivery/DELIVERY_SHA256.json
            delivery/RELEASE_NOTES.md
            delivery/results-commit.txt
            delivery/results-tree.txt
          retention-days: 90
