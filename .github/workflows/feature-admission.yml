name: Application corpus admission
on:
  push:
    branches: [research/quotient-query-20261007]
    paths: [.github/workflows/feature-admission.yml]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve fixed upstream files and metadata-only selection
        run: |
          mkdir -p delivery
          python3 - <<'PY'
          import csv,hashlib,io,json,time,urllib.request,urllib.parse
          from pathlib import Path
          root=Path('delivery')
          repo='SoftVarE-Group/feature-model-benchmark'
          commit='afa60ee2c836e7bdc4068e0f4f128ea31158d2ad'
          base='https://raw.githubusercontent.com/'+repo+'/'+commit+'/'
          def fetch(url,limit=16000000):
              req=urllib.request.Request(url,headers={'User-Agent':'SPECTRA-public-corpus-admission'})
              with urllib.request.urlopen(req,timeout=30) as response:data=response.read(limit+1)
              if len(data)>limit:raise ValueError('download size cap')
              return data
          metadata=fetch(base+'statistics/Complete.csv')
          (root/'Complete.csv').write_bytes(metadata)
          for name in ('LICENSE','README.md'):(root/name).write_bytes(fetch(base+name))
          tree=json.loads(fetch('https://api.github.com/repos/'+repo+'/git/trees/'+commit+'?recursive=1'))
          if tree.get('truncated'):raise ValueError('incomplete upstream tree')
          (root/'upstream-tree.json').write_text(json.dumps(tree,sort_keys=True)+'\n')
          files={r['path']:r for r in tree['tree'] if r['type']=='blob'}
          rows=list(csv.DictReader(io.StringIO(metadata.decode('utf-8-sig')),delimiter=';'))
          selected={}
          for row in rows:
              try:n=int(float(row['NumberOfFeatures']));m=int(float(row['NumberOfClauses']))
              except (KeyError,ValueError):continue
              if not (1000<=n<=100000 and 0<=m<=1000000):continue
              name=row['Name']
              key=(row.get('Year',''),row.get('Version',''),row['Path'])
              if name not in selected or key>selected[name][0]:selected[name]=(key,row)
          # No solver outcome, component count or runtime participates in selection.
          records=[]
          for name,(_,row) in sorted(selected.items()):
              original=row['Path']
              desired=original if original.lower().endswith(('.cnf','.dimacs')) else str(Path(original.replace('feature_models/original/','feature_models/dimacs/')).with_suffix('.dimacs'))
              record={'name':name,'metadata':row,'path':desired,'status':'UNREAD'}
              entry=files.get(desired)
              if not entry or entry['size']>16000000:
                  record['status']='MISSING_OR_OVERSIZE';records.append(record);continue
              data=fetch(base+urllib.parse.quote(desired,safe='/'))
              gitsha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if gitsha!=entry['sha']:raise ValueError('upstream blob differs: '+desired)
              dest=root/'corpus'/desired;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
              record.update(status='ACQUIRED',bytes=len(data),git_blob=gitsha,sha256=hashlib.sha256(data).hexdigest())
              records.append(record)
              time.sleep(0.1)
          (root/'selection.json').write_text(json.dumps({'upstream':repo,'commit':commit,'selection':'All model Names having an eligible row (1000..100000 features, <=1000000 clauses); lexicographically latest (Year,Version,Path) eligible row per Name. Availability and <=16MB cap explicit. No candidate or solver evaluated.','records':records},sort_keys=True,indent=2)+'\n')
          (root/'ROLE.txt').write_text('Post-confirmation application HEADROOM ADMISSION only. These CNFs are not accepted by the current list-colouring API without a new frontend. No transfer, speed, correctness, novelty or adoption claim follows from acquisition. Original synthetic freeze unchanged.\n')
          (root/'SHA256.json').write_text(json.dumps({str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()},sort_keys=True,indent=2)+'\n')
          print('Acquired',sum(r['status']=='ACQUIRED' for r in records),'of',len(records),'metadata-selected sources')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-admission-${{ github.run_id }}
          path: delivery
          retention-days: 90
