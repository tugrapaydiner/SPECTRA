name: Query runtime on Windows
on:
  push:
    branches: [faster-queries]
    paths:
      - experiments/compiled_query/exact.py
      - experiments/compiled_query/exact_native.cpp
      - experiments/compiled_query/test_exact.py
      - experiments/compiled_query/test_transfer_hardening.py
      - experiments/compiled_query/test_proof_replay.py
      - .github/workflows/query-windows.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: query-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Windows x64 / Python ${{ matrix.python }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Load the installed MSVC x64 environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 build tools not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $lines = & cmd /c "`"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment setup failed' }
          foreach ($line in $lines) {
            $pair = $line -split '=', 2
            if ($pair.Count -eq 2 -and $pair[0] -in @('PATH','INCLUDE','LIB','LIBPATH','VCToolsInstallDir','VCINSTALLDIR','WindowsSdkDir','WindowsSDKVersion')) {
              $line | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - run: python -m pip install 'pytest==8.4.2' 'python-sat==1.9.dev15'
      - name: Build the actual Windows extension and keep its receipt
        shell: python
        run: |
          import os, pathlib, subprocess, sys, json, platform
          root=pathlib.Path('windows-query-checks'); root.mkdir()
          sys.path.insert(0, str(pathlib.Path.cwd()))
          (root/'source_commit.txt').write_bytes(subprocess.check_output(['git','rev-parse','HEAD']))
          (root/'host.json').write_text(json.dumps({'python':sys.version,'platform':platform.platform(),'machine':platform.machine()}),encoding='utf-8')
          from experiments.compiled_query.exact import build_exact_runtime
          library=build_exact_runtime(root/'build')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write('SPECTRA_EXACT_LIBRARY='+str(library)+'\n')
      - name: Check witnesses, proofs, packet parsing and concurrency
        run: python -m pytest experiments/compiled_query/test_exact.py experiments/compiled_query/test_transfer_hardening.py experiments/compiled_query/test_proof_replay.py -q --junitxml=windows-query-checks/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-query-py${{ matrix.python }}-${{ github.run_id }}
          path: windows-query-checks/
          retention-days: 90
          if-no-files-found: error
