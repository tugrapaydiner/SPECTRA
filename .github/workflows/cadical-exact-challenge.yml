name: cadical-exact-challenge

on:
  push:
    branches: [external-solver-challenge]
    paths:
      - 'experiments/compiled_query/CADICAL_301_CHALLENGE.md'
      - 'experiments/compiled_query/cadical_exact_native.cpp'
      - 'experiments/compiled_query/cadical_exact.py'
      - 'experiments/compiled_query/cadical_exact_benchmark.py'
      - 'experiments/compiled_query/test_cadical_exact.py'
      - '.github/workflows/cadical-exact-challenge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cadical-exact-challenge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out official CaDiCaL 3.0.1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: arminbiere/cadical
          ref: c60730422e758ef1cebe7aeddf2dda31c996bf04
          path: cadical-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest==9.0.2'
      - name: Compile and run the matched contracts
        env:
          CADICAL_SOURCE: ${{ github.workspace }}/cadical-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cadical-contract-evidence
          git rev-parse HEAD > cadical-contract-evidence/spectra-commit.txt
          git -C "$CADICAL_SOURCE" rev-parse HEAD > cadical-contract-evidence/cadical-commit.txt
          python -VV > cadical-contract-evidence/python.txt
          uname -a > cadical-contract-evidence/platform.txt
          python -m py_compile \
            experiments/compiled_query/cadical_exact.py \
            experiments/compiled_query/cadical_exact_benchmark.py \
            experiments/compiled_query/test_cadical_exact.py
          python -m pytest \
            experiments/compiled_query/test_cadical_exact.py -q \
            2>&1 | tee cadical-contract-evidence/tests.log
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cadical-contracts-${{ matrix.runner }}-${{ github.run_id }}
          path: cadical-contract-evidence/
          retention-days: 90
          if-no-files-found: error

  sanitizers:
    name: Adapter sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [undefined, 'address,undefined']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out official CaDiCaL 3.0.1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: arminbiere/cadical
          ref: c60730422e758ef1cebe7aeddf2dda31c996bf04
          path: cadical-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest==9.0.2'
      - name: Run project-owned adapter code under the sanitizer
        env:
          CADICAL_SOURCE: ${{ github.workspace }}/cadical-source
          CADICAL_ADAPTER_SANITIZER: ${{ matrix.sanitizer }}
        shell: bash
        run: |
          set -euo pipefail
          export UBSAN_OPTIONS=halt_on_error=1
          if [ "$CADICAL_ADAPTER_SANITIZER" = 'address,undefined' ]; then
            export LD_PRELOAD="$(g++ -print-file-name=libasan.so):$(g++ -print-file-name=libstdc++.so)"
            export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
          fi
          python -m pytest \
            experiments/compiled_query/test_cadical_exact.py \
            -k 'not every_three_vertex_formula' -q

  benchmark:
    name: Frozen benchmark (${{ matrix.runner }})
    needs: contracts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out official CaDiCaL 3.0.1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: arminbiere/cadical
          ref: c60730422e758ef1cebe7aeddf2dda31c996bf04
          path: cadical-source
          persist-credentials: false
      - name: Acquire the four disclosed mixed-bank graphs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: marijnheule/clicolcom
          ref: 4932048642da2144f387961b595112277afff82f
          path: challenge-upstream
          sparse-checkout: graphs
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build both native services and cases
        env:
          CADICAL_SOURCE: ${{ github.workspace }}/cadical-source
        shell: bash
        run: |
          set -euo pipefail
          SPECTRA_LIBRARY="$(python -c "from spectra.exact import build_exact_runtime; print(build_exact_runtime('challenge-build/spectra'))")"
          CADICAL_LIBRARY="$(python -c "from experiments.compiled_query.cadical_exact import build_cadical_exact_runtime; import os; print(build_cadical_exact_runtime('challenge-build/cadical', os.environ['CADICAL_SOURCE']))")"
          echo "SPECTRA_LIBRARY=$SPECTRA_LIBRARY" >> "$GITHUB_ENV"
          echo "CADICAL_LIBRARY=$CADICAL_LIBRARY" >> "$GITHUB_ENV"
          python - <<'PY'
          from pathlib import Path
          from experiments.compiled_query.direct_twosat_holdout import open_holdout
          open_holdout(Path('challenge-upstream/graphs'), Path('challenge-cases'))
          PY
      - name: Run the frozen large-gap matrix
        id: matrix
        shell: bash
        run: |
          set +e
          python -m experiments.compiled_query.cadical_exact_benchmark \
            --spectra-library "$SPECTRA_LIBRARY" \
            --cadical-library "$CADICAL_LIBRARY" \
            --cases challenge-cases \
            --out cadical-challenge-results \
            --repeats 30 \
            --enforce \
            2>&1 | tee cadical-challenge.log
          code=${PIPESTATUS[0]}
          echo "$code" > cadical-challenge-exit-code.txt
          exit 0
      - name: Retain every result, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: official-cadical-${{ matrix.runner }}-${{ github.run_id }}
          path: |
            cadical-challenge-results/
            cadical-challenge.log
            cadical-challenge-exit-code.txt
            challenge-build/
            challenge-cases/
          retention-days: 90
          if-no-files-found: error
      - name: Enforce the frozen verdict
        if: always()
        shell: bash
        run: |
          test -f cadical-challenge-exit-code.txt
          exit "$(cat cadical-challenge-exit-code.txt)"
