name: one-shot-part2-branch-cleanup

on:
  push:
    branches:
      - archive/research-history-20261016
    paths:
      - .github/workflows/one-shot-part2-branch-cleanup.yml

permissions:
  contents: write

concurrency:
  group: one-shot-part2-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify recovery and canonical refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin \
            main \
            performance/automatic-engine-selection-final \
            archive/research-history-20261016
          test "$(git rev-parse origin/main)" = "ac71b3a7777f4869424247df6481ef32f9996a6b"
          test "$(git rev-parse origin/performance/automatic-engine-selection-final)" = "49b3ab2baf896520602ed95e0075b4f0652340d7"
          git merge-base --is-ancestor \
            f6a572246caffa05047d69403a6cd9ec3de1f38f \
            HEAD
      - name: Verify every stale branch head
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          expected = {
              "archive/pre-part2-consolidation-2026-10-19": "1c863bb9b9c3d39760101088738e32a4807761a9",
              "audit/tile64-external-competition-20261017": "409055333f0da476563bc3e4c8ee556a2b5ec326",
              "performance/automatic-engine-selection": "128b70b696ff05df8e08e8128ee1cfee4dd3bb2f",
              "performance/automatic-engine-selection-confirmation-final": "3d87b4995618614691355795110175709f6c9a7b",
              "performance/automatic-engine-selection-v7": "9ff01b55af252f515d7a563a349ddf23fe6ad47e",
              "performance/automatic-engine-selection-v8": "46bde282eecc24c3ad62ad23a26b060af4e7f2dd",
              "performance/automatic-engine-selection-v10": "ac578fb6c9a3ef180143f7eb5f52714654e1e869",
              "performance/smarter-auto-selection": "6bc0852b9fe4601513333200069baac5cce58638",
              "research/beat-raw-tile64-20261017": "4f930cc1ccead064d3c76e067d287d88ad142dfd",
              "research/champion-gauntlet-20261017": "1501a3797a775c1b325cd1d76c9a785ec79cd26f",
          }
          for branch, wanted in expected.items():
              output = subprocess.check_output(
                  ["git", "ls-remote", "--heads", "origin", branch],
                  text=True,
              ).strip()
              if not output:
                  raise SystemExit(f"missing stale branch before cleanup: {branch}")
              observed, ref = output.split()
              if ref != f"refs/heads/{branch}" or observed != wanted:
                  raise SystemExit(
                      f"lease mismatch for {branch}: expected {wanted}, observed {observed}"
                  )
          PY
      - name: Delete only verified stale refs
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete \
            archive/pre-part2-consolidation-2026-10-19 \
            audit/tile64-external-competition-20261017 \
            performance/automatic-engine-selection \
            performance/automatic-engine-selection-confirmation-final \
            performance/automatic-engine-selection-v7 \
            performance/automatic-engine-selection-v8 \
            performance/automatic-engine-selection-v10 \
            performance/smarter-auto-selection \
            research/beat-raw-tile64-20261017 \
            research/champion-gauntlet-20261017
      - name: Verify the three-branch invariant
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          output = subprocess.check_output(
              ["git", "ls-remote", "--heads", "origin"], text=True
          )
          branches = {
              line.split()[1].removeprefix("refs/heads/")
              for line in output.splitlines()
              if line.strip()
          }
          expected = {
              "main",
              "performance/automatic-engine-selection-final",
              "archive/research-history-20261016",
          }
          if branches != expected:
              raise SystemExit(
                  f"branch invariant failed: expected {sorted(expected)}, observed {sorted(branches)}"
              )
          PY
      - name: Remove the one-shot workflow from the archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-part2-branch-cleanup.yml
          git add -A
          git commit -m "Remove completed Part 2 branch cleanup transaction"
          git push origin HEAD:refs/heads/archive/research-history-20261016
