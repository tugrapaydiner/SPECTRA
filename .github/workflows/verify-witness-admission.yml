name: verify-witness-admission

on:
  push:
    branches: [archive/research-history-20261016]
    paths: [.github/workflows/verify-witness-admission.yml]

permissions:
  contents: read

concurrency:
  group: verify-witness-admission
  cancel-in-progress: false

env:
  SPECTRA_COMMIT: d8f7aba2197a89f35919f8baf9d2ba24f8240433
  UPSTREAM_COMMIT: 4932048642da2144f387961b595112277afff82f

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SPECTRA_COMMIT }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: marijnheule/clicolcom
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream-source
          sparse-checkout: |
            graphs
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest==9.0.2'

      - name: Run the graph-free contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            experiments/compiled_query/witness_colouring.py \
            experiments/compiled_query/fresh_transfer.py \
            experiments/compiled_query/test_witness_colouring.py \
            experiments/compiled_query/test_fresh_transfer.py
          python -m pytest \
            experiments/compiled_query/test_witness_colouring.py \
            experiments/compiled_query/test_fresh_transfer.py -q
          git diff --check

      - name: Build all six exposed development cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p witness-verification
          python - <<'PY' 2>&1 | tee witness-verification/run.log
          from pathlib import Path
          import json

          from experiments.compiled_query.fresh_transfer import open_fresh_transfer

          root = Path("witness-verification/cases")
          manifest = open_fresh_transfer(
              Path("upstream-source/graphs"),
              root,
          )
          assert len(manifest["graphs"]) == 6
          for name, receipt in manifest["graphs"].items():
              assert receipt["query_count"] == 1024
              assert receipt["sat"] == receipt["unsat"] == 512
              assert receipt["witness_colours"] <= 63
              assert receipt["palette"] <= 64
              assert receipt["retained_edges"] >= 512
              assert receipt["answer_filtering"] is False
              if receipt["topology_mode"] == "degree-capped":
                  assert receipt["degree_cap"] == 62
                  assert receipt["maximum_retained_degree"] <= 62
                  assert receipt["dropped_edges"] > 0
              else:
                  assert receipt["topology_mode"] == "full"
                  assert receipt["dropped_edges"] == 0
              print(name, json.dumps(receipt, sort_keys=True), flush=True)

          assert manifest["graphs"]["DSJC500.5.col"]["topology_mode"] == "full"
          assert manifest["graphs"]["DSJC500.5.col"]["witness_colours"] <= 63
          assert manifest["graphs"]["miles1500.col"]["topology_mode"] == "degree-capped"
          Path("witness-verification/summary.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          git rev-parse HEAD > witness-verification/source_commit.txt
          git -C upstream-source rev-parse HEAD > witness-verification/upstream_commit.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: witness-admission-${{ github.run_id }}
          path: witness-verification/
          retention-days: 90
          if-no-files-found: error
