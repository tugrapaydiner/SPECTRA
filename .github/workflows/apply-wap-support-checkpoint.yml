name: Apply WAP support-query checkpoint
on:
  push:
    branches: [research/quotient-application-v2-20261008]
    paths:
      - .github/workflows/apply-wap-support-checkpoint.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Decode exact staged patch
        shell: bash
        run: |
          set -euo pipefail
          cat maintenance/wap-support-checkpoint/part-*.b64 > /tmp/wap-support.b64
          echo '347419edc730cb2af772f7e1b2756a710fb0ee99fe52ca2be89f8e241921e310  /tmp/wap-support.b64' | sha256sum -c -
          base64 -d /tmp/wap-support.b64 | gzip -d > /tmp/wap-support.patch
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          git am /tmp/wap-support.patch
      - name: Focused contracts
        run: |
          python -m pip install -q pytest==9.0.2
          python -m pytest -q --confcutdir=tests/public tests/public/test_wap_support.py
          python -m compileall -q experiments/wap_support
      - name: Publish checkpoint commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:research/quotient-application-v2-20261008
