name: export-batch-checkpoint-source
on:
  push:
    branches: [research/compiled-query-validation]
    paths:
      - '.github/workflows/apply-exact-bank-checkpoint.yml'
permissions:
  contents: read
concurrency:
  group: export-batch-checkpoint-source
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 972b8e5b8c66f73065050966c8f7e2b7f9069515
          fetch-depth: 0
          persist-credentials: false
      - name: Export the exact bit-parallel checkpoint
        run: |
          set -euo pipefail
          mkdir -p /tmp/batch-checkpoint
          git rev-parse HEAD > /tmp/batch-checkpoint/source_commit.txt
          git rev-parse HEAD^{tree} > /tmp/batch-checkpoint/source_tree.txt
          git archive --format=tar.gz --output=/tmp/batch-checkpoint/source.tar.gz HEAD
          sha256sum /tmp/batch-checkpoint/source.tar.gz > /tmp/batch-checkpoint/SHA256SUMS.txt
          git diff --binary ed1090312959827faa74faa138c101ec2a6d13c8..HEAD \
            > /tmp/batch-checkpoint/batch-from-ed109.patch
          sha256sum /tmp/batch-checkpoint/batch-from-ed109.patch \
            >> /tmp/batch-checkpoint/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: exact-batch-checkpoint-${{ github.run_id }}
          path: /tmp/batch-checkpoint/
          retention-days: 30
          if-no-files-found: error
