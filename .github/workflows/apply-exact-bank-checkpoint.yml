name: apply-exact-bank-checkpoint
on:
  push:
    branches: [research/compiled-query-validation]
    paths:
      - '.github/workflows/apply-exact-bank-checkpoint.yml'
permissions:
  contents: write
concurrency:
  group: apply-exact-bank-checkpoint
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and squash the hash-verified core checkpoint
        env:
          EXPECTED_B64_SHA256: 8db149d29ab07c42ea49878577f28428ae78081962530e654caa01cb820ea8d6
          EXPECTED_GZIP_SHA256: 39bd2e37d2bef1a8e9b258d0f69e4d22de11b48953c17a530303952977fb6487
          EXPECTED_PATCH_SHA256: 5dd92909269b53c71ed0f5938972b435b87ca59f221c4f60580c27b30bab6317
        run: |
          set -euo pipefail
          base="$GITHUB_SHA"
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          cat .github/bank-patch/00 .github/bank-patch/01 \
              .github/bank-patch/02a .github/bank-patch/02b .github/bank-patch/02c \
              .github/bank-patch/03 > /tmp/exact-bank.b64
          echo "$EXPECTED_B64_SHA256  /tmp/exact-bank.b64" | sha256sum --check
          base64 --decode /tmp/exact-bank.b64 > /tmp/exact-bank.patch.gz
          echo "$EXPECTED_GZIP_SHA256  /tmp/exact-bank.patch.gz" | sha256sum --check
          gzip --test /tmp/exact-bank.patch.gz
          gzip --decompress --stdout /tmp/exact-bank.patch.gz > /tmp/exact-bank.patch
          echo "$EXPECTED_PATCH_SHA256  /tmp/exact-bank.patch" | sha256sum --check
          git am /tmp/exact-bank.patch
          git reset --soft "$base"
          git restore --source="$base" --staged --worktree -- .github/workflows/exact-binary-development.yml
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'Refusing to publish unexpected workflow changes through the Actions token.' >&2
            git diff --cached --name-only >&2
            exit 1
          fi
          git commit -m 'Batch exact requests with independently checked bit-parallel SCC propagation'
          git rev-parse HEAD > /tmp/source_commit.txt
          git rev-parse HEAD^{tree} > /tmp/source_tree.txt
          git diff --binary "$base"..HEAD > /tmp/exact-bank-core.patch
          sha256sum /tmp/exact-bank-core.patch > /tmp/exact-bank-core.patch.sha256
          git push origin HEAD:research/compiled-query-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-bank-core-${{ github.run_id }}
          path: |
            /tmp/source_commit.txt
            /tmp/source_tree.txt
            /tmp/exact-bank-core.patch
            /tmp/exact-bank-core.patch.sha256
          retention-days: 30
          if-no-files-found: warn
