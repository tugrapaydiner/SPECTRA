name: m14-attempt2-early-exit

on:
  push:
    branches: [research/m14-attempt2-early-exit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attempt2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install CPU experiment dependencies
        run: |
          set -euxo pipefail
          mkdir -p .m14a2
          timeout 360s python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4" |& tee .m14a2/install_torch.txt
          timeout 240s python -m pip install -r requirements.txt matplotlib |& tee .m14a2/install_requirements.txt

      - name: Verify Attempt 2 preregistration and compile
        shell: bash
        run: |
          set +e
          git merge-base --is-ancestor a16860021b7f02bfbbe67a3a36c7eeca094c948c HEAD
          prereg=$?
          python -m py_compile scripts/m14_attempt2_early_exit.py scripts/render_m14_attempt2.py tests/test_m14_attempt2.py
          compile=$?
          echo "$prereg" | tee .m14a2/prereg_exit_code.txt
          echo "$compile" | tee .m14a2/compile_exit_code.txt
          exit 0

      - name: Focused Attempt 2 contracts
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 600s python -m pytest tests/test_m14_attempt2.py tests/test_m14_primary_experiment.py tests/test_energy_measurement.py -m "not slow" -q |& tee .m14a2/pytest_attempt2.txt
          code=${PIPESTATUS[0]}
          echo "$code" | tee .m14a2/focused_exit_code.txt
          exit 0

      - name: Run preregistered Attempt 2
        shell: bash
        run: |
          set +e
          set -o pipefail
          rm -rf .m14a2/experiment
          timeout 2100s python scripts/m14_attempt2_early_exit.py --out .m14a2/experiment |& tee .m14a2/experiment.log
          code=${PIPESTATUS[0]}
          echo "$code" | tee .m14a2/experiment_exit_code.txt
          exit 0

      - name: Render result table and Pareto plot from raw rows
        shell: bash
        run: |
          set +e
          set -o pipefail
          if [ -f .m14a2/experiment/summary.json ]; then
            python scripts/render_m14_attempt2.py --experiment .m14a2/experiment --out .m14a2/rendered |& tee .m14a2/render.log
            code=${PIPESTATUS[0]}
          else
            echo "Attempt 2 summary missing" | tee .m14a2/render.log
            code=3
          fi
          echo "$code" | tee .m14a2/render_exit_code.txt
          exit 0

      - name: Verify Attempt 2 evidence hierarchy
        shell: bash
        run: |
          set +e
          python - <<'PY' |& tee .m14a2/evidence_check.txt
          import hashlib,json,pathlib,sys
          root=pathlib.Path('.m14a2/experiment'); rendered=pathlib.Path('.m14a2/rendered')
          required=[
            root/'summary.json',root/'environment.json',root/'energy_inventory.json',root/'training_contract.json',
            root/'manifests/attempt1_regenerated_for_overlap_audit.json',root/'manifests/train_validation_development.json',
            root/'manifests/attempt1_attempt2_overlap_audit.json',root/'training_runs.jsonl',
            root/'validation_rows.jsonl',root/'validation_operating_points.json',root/'candidate_selection.json',
            root/'development_rows.jsonl',root/'development_effect.json',root/'development_decision.json',
            root/'development_operating_points.json',root/'development_energy.json',
            rendered/'result_table.csv',rendered/'result_table.md',rendered/'pareto.png',rendered/'provenance.json',
          ]
          missing=[str(p) for p in required if not p.is_file()]
          print('missing=',missing)
          if missing: sys.exit(2)
          s=json.loads((root/'summary.json').read_text())
          print(json.dumps(s,indent=2,sort_keys=True))
          assert s['milestone']==14 and s['attempt']==2
          assert s['protocol_committed_before_results'] is True
          assert s['attempt1_is_development_evidence'] is True
          assert s['candidate_supervision_weights']==[0.7,0.1,0.1,0.1]
          assert s['training_seeds']==[1411,2412,3413,4414,5415]
          assert s['n_training_seeds']==5 and s['all_training_runs']==10
          assert s['thresholds_changed_after_attempt1'] is False
          assert s['baseline_weakened'] is False and s['favorable_seed_filtering'] is False
          assert s['scaling_law_claim'] is False
          audit=json.loads((root/'manifests/attempt1_attempt2_overlap_audit.json').read_text())
          assert audit['exact_overlap_count']==0
          contract=json.loads((root/'training_contract.json').read_text())
          assert contract['candidate_deep_supervision_weights']==[0.7,0.1,0.1,0.1]
          assert contract['steps']==1800 and contract['training_seeds']==[1411,2412,3413,4414,5415]
          trains=[json.loads(x) for x in (root/'training_runs.jsonl').read_text().splitlines() if x.strip()]
          assert len(trains)==10
          cand=[r for r in trains if r['kind']=='fp_recursive_dim64']; base=[r for r in trains if r['kind']=='single_pass']
          assert len(cand)==5 and len(base)==5
          assert {r['seed'] for r in cand}=={1411,2412,3413,4414,5415}
          assert {r['seed'] for r in base}=={1411,2412,3413,4414,5415}
          assert cand[0]['architecture']['trainable_params'] < base[0]['architecture']['trainable_params']
          sel=json.loads((root/'candidate_selection.json').read_text())
          assert sel['selection_used_development'] is False and sel['selection_used_confirmation'] is False
          assert sel['selected_config_id'].startswith('early64_n')
          for r in sel['all_candidate_validation']:
            ratio=r['validation_latency_ratio_vs_baseline']
            if not (.85 <= ratio <= 1.15): assert r['latency_match_status']=='unmatched'
          dev=json.loads((root/'development_decision.json').read_text())
          assert s['development_gate']['pass']==dev['pass']
          if s['confirmation_opened']:
            for p in [root/'confirmation_freeze_manifest.json',root/'manifests/confirmation_1.json',root/'manifests/confirmation_overlap_audit.json',root/'confirmation_rows.jsonl',root/'confirmation_effect.json',root/'confirmation_decision.json',root/'confirmation_energy.json']:
              assert p.is_file(),p
            assert dev['pass'] is True
            fr=json.loads((root/'confirmation_freeze_manifest.json').read_text())
            au=json.loads((root/'manifests/confirmation_overlap_audit.json').read_text())
            co=json.loads((root/'confirmation_decision.json').read_text())
            assert fr['frozen_before_confirmation'] is True
            assert au['attempt1_overlap_count']==0 and au['attempt2_overlap_count']==0
            assert s['confirmation_manifest_opened_only_after_development_pass'] is True
            if s['status']=='COMPLETE':
              assert s['claim_confirmed'] is True and co['pass'] is True
            else:
              assert s['claim_confirmed'] is False
          else:
            assert dev['pass'] is False
            assert not (root/'manifests/confirmation_1.json').exists()
            assert s['status']=='INCOMPLETE'
          sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          prov=json.loads((rendered/'provenance.json').read_text())
          assert prov['raw_rows_sha256']==sha(pathlib.Path(prov['raw_rows']))
          assert prov['summary_sha256']==sha(root/'summary.json')
          assert prov['result_table_sha256']==sha(rendered/'result_table.csv')
          assert prov['pareto_plot_sha256']==sha(rendered/'pareto.png')
          assert 'unmatched points are not iso-budget' in prov['latency_matching_rule']
          print('M14_ATTEMPT2_EVIDENCE=VALID')
          print('M14_ATTEMPT2_STATUS='+s['status'])
          PY
          echo "$?" | tee .m14a2/evidence_check_exit_code.txt
          exit 0

      - name: Full fast regression
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 900s python -m pytest -m "not slow" -ra |& tee .m14a2/pytest_fast.txt
          code=${PIPESTATUS[0]}
          echo "$code" | tee .m14a2/fast_exit_code.txt
          exit 0

      - name: Record provenance and hashes
        if: always()
        run: |
          {
            echo "head=$(git rev-parse HEAD)"
            echo "base=b9e2decf19dcc772bfcef3a78615c2f4c8b350c0"
            echo "attempt1_prereg=99102c30f87661f6767c586ba6f81971e32a654c"
            echo "attempt2_prereg=a16860021b7f02bfbbe67a3a36c7eeca094c948c"
            git diff --stat b9e2decf19dcc772bfcef3a78615c2f4c8b350c0...HEAD
          } | tee .m14a2/diff_stat.txt
          python - <<'PY' | tee .m14a2/evidence_sha256.txt
          import hashlib,pathlib
          root=pathlib.Path('.m14a2')
          for p in sorted(q for q in root.rglob('*') if q.is_file() and q.name!='evidence_sha256.txt'):
            print(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}")
          PY

      - name: Upload Attempt 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m14-attempt2-early-exit-evidence
          path: .m14a2/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Enforce positive M14 acceptance
        if: always()
        run: |
          prereg=$(cat .m14a2/prereg_exit_code.txt 2>/dev/null || echo 99)
          compile=$(cat .m14a2/compile_exit_code.txt 2>/dev/null || echo 99)
          focused=$(cat .m14a2/focused_exit_code.txt 2>/dev/null || echo 99)
          experiment=$(cat .m14a2/experiment_exit_code.txt 2>/dev/null || echo 99)
          render=$(cat .m14a2/render_exit_code.txt 2>/dev/null || echo 99)
          evidence=$(cat .m14a2/evidence_check_exit_code.txt 2>/dev/null || echo 99)
          fast=$(cat .m14a2/fast_exit_code.txt 2>/dev/null || echo 99)
          status=$(python - <<'PY'
          import json,pathlib
          p=pathlib.Path('.m14a2/experiment/summary.json')
          print(json.loads(p.read_text()).get('status','MISSING') if p.is_file() else 'MISSING')
          PY
          )
          echo "prereg=$prereg compile=$compile focused=$focused experiment=$experiment render=$render evidence=$evidence fast=$fast status=$status"
          if [ "$prereg" -ne 0 ] || [ "$compile" -ne 0 ] || [ "$focused" -ne 0 ] || [ "$render" -ne 0 ] || [ "$evidence" -ne 0 ] || [ "$fast" -ne 0 ]; then
            echo "M14 Attempt 2 integrity failure."
            exit 1
          fi
          if [ "$experiment" -ne 0 ] || [ "$status" != "COMPLETE" ]; then
            echo "M14 Attempt 2 is valid development evidence, but the unchanged claim is not independently confirmed. M14 remains INCOMPLETE."
            exit 1
          fi
          echo "M14 acceptance passed on Attempt 2 with independent confirmation."
