name: cpu-regression-contracts
on:
  push:
    branches: [research/verifier-aligned-cpu-search]
    paths-ignore: ['results/**', 'docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cpu-contracts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cpu-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MAX_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export immutable source before testing
        run: |
          mkdir -p .cpu-contracts
          git rev-parse HEAD > .cpu-contracts/source_commit.txt
          git archive --format=tar HEAD -- . ':!results/m16/runs' ':!results/m16/sources' ':!results/m17/runs' > .cpu-contracts/source.tar
          echo 'Excludes retained binary source/run archives only; see archive command in this workflow.' > .cpu-contracts/source_scope.txt
          sha256sum .cpu-contracts/source.tar > .cpu-contracts/source_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: spectra-source-${{ github.sha }}
          path: .cpu-contracts/source*
          retention-days: 90
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install declared CPU environment
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install -r requirements-cpu-research.txt
          python -m pip freeze > .cpu-contracts/environment.lock.txt
      - name: Full CPU fast regression, including native builds
        run: |
          set -o pipefail
          timeout 1800s python -m pytest -m 'not slow' -ra | tee .cpu-contracts/pytest_fast.txt
      - name: Check accepted evidence without regenerating confirmation
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.m16_evidence import Evidence, write_json
          from scripts.m17_sources import AcceptedM16
          evidence = Evidence(Path('results/m16/sources'))
          accepted = AcceptedM16(Path('results/m16/runs/accepted-34522192590.tar.gz'), evidence)
          write_json(Path('.cpu-contracts/accepted_source_check.json'), accepted.identity())
          write_json(Path('.cpu-contracts/retrospective_audit.json'), evidence.retrospective())
          print('Pinned source bytes and historical audit verified; no new scientific data generated.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectra-cpu-contracts-${{ github.sha }}
          path: .cpu-contracts/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
