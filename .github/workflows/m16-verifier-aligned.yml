name: m16-verifier-aligned
on:
  push:
    branches: [research/verifier-aligned-cpu-search]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: m16-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cpu-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      MAX_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export exact source snapshot
        run: |
          mkdir -p .m16
          git rev-parse HEAD > .m16/source_commit.txt
          git archive --format=tar HEAD > .m16/source.tar
          sha256sum .m16/source.tar > .m16/source_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m16-source-${{ github.sha }}
          path: |
            .m16/source.tar
            .m16/source_commit.txt
            .m16/source_sha256.txt
          retention-days: 90
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install -r requirements.txt
          python -m pip freeze > .m16/environment.lock.txt
      - name: CPU fast regression
        run: |
          set -o pipefail
          timeout 1800s python -m pytest -m 'not slow' -ra | tee .m16/pytest_fast.txt
      - name: Run retained-evidence audit when available
        run: |
          if test -f scripts/m16_validate_retained.py; then
            python scripts/m16_validate_retained.py --out .m16/retained_validation.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m16-contract-evidence-${{ github.sha }}
          path: .m16/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
