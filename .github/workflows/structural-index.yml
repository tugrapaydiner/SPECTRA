name: structural-index
on:
  push:
    branches: [research/export-structural-index]
    paths: [experiments/structural_index/**, .github/workflows/structural-index.yml]
  pull_request:
    paths: [experiments/structural_index/**, .github/workflows/structural-index.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-upstream-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: spectra
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BayesWitnesses/m2cgen
          ref: 9784632311986234032673cdbfd29fc4c5cb429d
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install the original compatible testing environment
        run: |
          python -m pip install 'setuptools<60' wheel Cython==0.29.32 numpy==1.23.3 pandas==1.5.3
          python -m pip install --no-build-isolation -r upstream/requirements-test.txt
      - name: Prepare isolated sources, build and execute the unchanged upstream suite
        shell: python
        run: |
          import os,pathlib,subprocess,sys,json,hashlib
          root=pathlib.Path.cwd();out=root/'structural-results';out.mkdir()
          own=root/'spectra/experiments/structural_index'
          single=root/'single';indexed=root/'indexed'
          subprocess.run([sys.executable,'spectra/experiments/codegen_review/apply.py','--source',str(root/'upstream'),'--destination',str(single),'--variant','single'],check=True)
          subprocess.run([sys.executable,str(own/'apply.py'),str(single),str(indexed)],check=True)
          subprocess.run([sys.executable,str(own/'build.py'),str(out/'native')],check=True)
          library=next((out/'native').glob('*.so'))
          (out/'commit.txt').write_bytes(subprocess.check_output(['git','rev-parse','HEAD'],cwd=root/'spectra'))
          (out/'tree.txt').write_bytes(subprocess.check_output(['git','rev-parse','HEAD^{tree}'],cwd=root/'spectra'))
          (out/'environment.txt').write_bytes(subprocess.check_output([sys.executable,'-m','pip','freeze']))
          (out/'implementation.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(own.iterdir()) if p.is_file()},indent=2))
          outcomes=[]
          for name,package,mode in [('single',single,'native'),('full',indexed,'native'),('demand',indexed,'demand')]:
              env=dict(os.environ,PYTHONPATH=str(package),SPECTRA_STRUCTURAL_LIBRARY=str(library),SPECTRA_INDEX_MODE=mode)
              command=[sys.executable,'-m','pytest','tests','--ignore=tests/e2e','-q','--junitxml='+str(out/(name+'.xml'))]
              process=subprocess.run(command,cwd=package,env=env,capture_output=True,text=True,timeout=240)
              (out/(name+'.log')).write_text(process.stdout+'\n'+process.stderr)
              outcomes.append({'variant':name,'returncode':process.returncode,'command':command,'source_sha256':{p.relative_to(package).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted((package/'m2cgen').rglob('*.py'))}})
          for mode in ('native','demand'):
              env=dict(os.environ,PYTHONPATH=str(indexed),SPECTRA_STRUCTURAL_LIBRARY=str(library),SPECTRA_INDEX_MODE=mode)
              command=[sys.executable,'-m','pytest',str(own/'test_index.py'),'--confcutdir='+str(own),'-q','--junitxml='+str(out/('focused-'+mode+'.xml'))]
              process=subprocess.run(command,cwd=indexed,env=env,capture_output=True,text=True,timeout=120)
              (out/('focused-'+mode+'.log')).write_text(process.stdout+'\n'+process.stderr)
              outcomes.append({'variant':'focused-'+mode,'returncode':process.returncode,'command':command})
          (out/'results.json').write_text(json.dumps(outcomes,indent=2))
          assert all(r['returncode']==0 for r in outcomes),outcomes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structural-index-${{ github.sha }}
          path: structural-results/
          retention-days: 30
          if-no-files-found: warn
