name: WAP sealed development workspace
on:
  push:
    branches: [research/quotient-application-v2-20261008]
    paths:
      - .github/workflows/wap-development-workspace.yml
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify source and acquire development bytes only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf delivery
          mkdir -p delivery/workspace/graphs delivery/receipts
          git rev-parse HEAD > delivery/receipts/spectra_commit.txt
          git rev-parse HEAD^{tree} > delivery/receipts/spectra_tree.txt
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, urllib.request
          from pathlib import Path

          inv_path = Path('experiments/quotient_application/WAP_UPSTREAM_INVENTORY.json')
          inv = json.loads(inv_path.read_text(encoding='utf-8'))
          assert inv['schema'] == 'spectra.wap.upstream_inventory.v2'
          selected = {n:r for n,r in inv['graphs'].items()
                      if r['role'] in ('development','development_consumed')}
          expected_names = {'wap01a.col','wap05a.col','wap06a.col'}
          if set(selected) != expected_names:
              raise RuntimeError(f'development split drift: {sorted(selected)}')
          if any('holdout' in r['role'] for r in selected.values()):
              raise RuntimeError('holdout selected by development workspace')
          opener = urllib.request.build_opener()
          opener.addheaders = [('User-Agent','SPECTRA-sealed-development-workspace/1')]
          receipt = {
              'schema':'spectra.wap.sealed_development_workspace.v1',
              'upstream_repository':inv['repository'],
              'upstream_commit':inv['commit'],
              'inventory_sha256':hashlib.sha256(inv_path.read_bytes()).hexdigest(),
              'graphs':{},
          }
          out = Path('delivery/workspace/graphs')
          for name, record in sorted(selected.items()):
              url = f"https://raw.githubusercontent.com/{inv['repository']}/{inv['commit']}/graphs/{name}"
              with opener.open(url, timeout=60) as response:
                  data = response.read()
              blob = hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
              if len(data) != record['bytes'] or blob != record['git_blob_sha1']:
                  raise RuntimeError(f'upstream identity mismatch: {name}')
              (out/name).write_bytes(data)
              receipt['graphs'][name] = {
                  'bytes':len(data), 'git_blob_sha1':blob,
                  'sha256':hashlib.sha256(data).hexdigest(), 'url':url,
                  'role':record['role'],
              }
          Path('delivery/receipts/development_data.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          PY
          tar --exclude=.git --exclude=delivery -czf delivery/workspace/spectra-source.tar.gz .
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('delivery')
          hashes={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in sorted(root.rglob('*')) if p.is_file() and p.name!='SHA256.json'}
          (root/'SHA256.json').write_text(json.dumps(hashes,indent=2,sort_keys=True)+'\n')
          print(json.dumps(hashes,sort_keys=True))
          PY
      - name: Run published arc-free contracts before packaging
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q tests/public/test_arcfree_support.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wap-sealed-development-workspace-${{ github.run_id }}
          path: delivery
          include-hidden-files: true
          retention-days: 30
