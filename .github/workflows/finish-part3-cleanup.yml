name: finish-part3-cleanup

on:
  push:
    branches: [finish-part3]
    paths: ['.github/workflows/finish-part3-cleanup.yml']

permissions:
  contents: write

concurrency:
  group: finish-part3-cleanup
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: finish-part3
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the contract test environment
        run: python -m pip install 'build==1.3.0' 'pytest==9.0.2' 'numpy==2.3.5' 'python-sat==1.9.dev15'
      - name: Remove retired experiments and repair the selector contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          obsolete = (
              '.github/workflows/add-direct-conflict-fast-path.yml',
              '.github/workflows/cadical-exact-challenge.yml',
              '.github/workflows/check-faster-exact-service.yml',
              '.github/workflows/direct-2sat-challenge.yml',
              '.github/workflows/run-mixed-holdout.yml',
              '.github/workflows/update-exact-selector.yml',
              '.github/workflows/validate-mixed-holdout.yml',
              'experiments/compiled_query/CADICAL_301_CHALLENGE.md',
              'experiments/compiled_query/CADICAL_301_RESULTS_20261020.json',
              'experiments/compiled_query/CADICAL_301_RESULTS_20261020.md',
              'experiments/compiled_query/DIRECT_2SAT_CHALLENGE.md',
              'experiments/compiled_query/DIRECT_2SAT_HOLDOUT_PROTOCOL.md',
              'experiments/compiled_query/DIRECT_2SAT_HOLDOUT_RESULTS_20261020.md',
              'experiments/compiled_query/DIRECT_2SAT_RESULTS_20261020.md',
              'experiments/compiled_query/FRESH_TRANSFER_PROTOCOL_20261020.md',
              'experiments/compiled_query/FRESH_TRANSFER_RESULTS_20261020.json',
              'experiments/compiled_query/FRESH_TRANSFER_RESULTS_20261020.md',
              'experiments/compiled_query/STRUCTURAL_V11_REPLAY_20261020.md',
              'experiments/compiled_query/WITNESS_COLOURING_DEVELOPMENT_20261020.md',
              'experiments/compiled_query/cadical_exact.py',
              'experiments/compiled_query/cadical_exact_benchmark.py',
              'experiments/compiled_query/cadical_exact_native.cpp',
              'experiments/compiled_query/direct_twosat.py',
              'experiments/compiled_query/direct_twosat_benchmark.py',
              'experiments/compiled_query/direct_twosat_holdout.py',
              'experiments/compiled_query/direct_twosat_holdout_run.py',
              'experiments/compiled_query/direct_twosat_modes.cpp',
              'experiments/compiled_query/direct_twosat_native.cpp',
              'experiments/compiled_query/direct_twosat_wap_benchmark.py',
              'experiments/compiled_query/fresh_transfer.py',
              'experiments/compiled_query/fresh_transfer_benchmark.py',
              'experiments/compiled_query/test_cadical_exact.py',
              'experiments/compiled_query/test_direct_twosat.py',
              'experiments/compiled_query/test_direct_twosat_holdout.py',
              'experiments/compiled_query/test_fresh_transfer.py',
              'experiments/compiled_query/test_witness_colouring.py',
              'experiments/compiled_query/witness_colouring.py',
          )
          for name in obsolete:
              path = Path(name)
              if not path.is_file():
                  raise AssertionError(f'missing expected retired file: {name}')
              path.unlink()

          test_path = Path('experiments/compiled_query/test_exact.py')
          text = test_path.read_text(encoding='utf-8')
          replacements = {
              "        elif count >= 64 and components == 2 * n and len(edges) >= 4 * n:\n":
              "        elif n and count >= 64 and components == 2 * n and len(edges) >= 4 * n:\n",
              "        elif count >= 8 and 2 * components <= n:\n":
              "        elif n and count >= 8 and 2 * components <= n:\n",
          }
          for before, after in replacements.items():
              if text.count(before) != 1:
                  raise AssertionError(f'selector contract match count differs: {before!r}')
              text = text.replace(before, after, 1)
          test_path.write_text(text, encoding='utf-8')

          for name in (
              'spectra/_native/exact_binary.cpp',
              'experiments/compiled_query/exact_native.cpp',
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              before = '    // Structural auto policy v10. Raw handles tiny, contradictory,\n'
              after = '    // Structural auto policy v11. Raw handles tiny, contradictory,\n'
              if text.count(before) != 1:
                  raise AssertionError(f'policy comment match count differs in {name}')
              path.write_text(text.replace(before, after, 1), encoding='utf-8')

          Path('.github/workflows/finish-part3-cleanup.yml').unlink()
          PY
      - name: Check the cleaned tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python scripts/check_active_tree.py --out /tmp/active-tree.json
          python scripts/check_release_readiness.py --out /tmp/release-readiness.json
          python - <<'PY'
          from pathlib import Path

          removed = (
              'CADICAL_301_CHALLENGE.md',
              'CADICAL_301_RESULTS_20261020.json',
              'CADICAL_301_RESULTS_20261020.md',
              'DIRECT_2SAT_CHALLENGE.md',
              'DIRECT_2SAT_HOLDOUT_PROTOCOL.md',
              'DIRECT_2SAT_HOLDOUT_RESULTS_20261020.md',
              'DIRECT_2SAT_RESULTS_20261020.md',
              'FRESH_TRANSFER_PROTOCOL_20261020.md',
              'FRESH_TRANSFER_RESULTS_20261020.json',
              'FRESH_TRANSFER_RESULTS_20261020.md',
              'STRUCTURAL_V11_REPLAY_20261020.md',
              'WITNESS_COLOURING_DEVELOPMENT_20261020.md',
          )
          hits = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in {'.md', '.py', '.yml', '.yaml', '.toml'}:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              for name in removed:
                  if name in text:
                      hits.append(f'{path}:{name}')
          if hits:
              raise AssertionError('retired-file references remain: ' + ', '.join(hits))
          PY
      - name: Run the contracts that were red
        shell: bash
        run: |
          set -euo pipefail
          export SPECTRA_EXACT_LIBRARY="$(python -c "from spectra.exact import build_exact_runtime; print(build_exact_runtime('/tmp/part3-exact-build'))")"
          python -m pytest \
            experiments/compiled_query/test_exact.py \
            experiments/compiled_query/test_transfer_hardening.py \
            experiments/compiled_query/test_proof_replay.py \
            experiments/compiled_query/test_linear_construction.py -q
          python -m pytest \
            experiments/compiled_query/test_native_twosat_challenge.py \
            experiments/compiled_query/test_twosat_development_benchmark.py -q
          python -m pytest tests/public --confcutdir=tests/public -q
      - name: Save the cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Clean up Part 3 and restore the contracts'
          git push origin HEAD:refs/heads/finish-part3
