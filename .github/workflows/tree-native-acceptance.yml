name: tree-native-acceptance
on:
  push:
    branches: [research/tree-native-replay]
    paths: [.github/workflows/tree-native-acceptance.yml, experiments/certified_trees/**]
  pull_request:
    branches: [main, research/certified-integer-trees]
    paths: [.github/workflows/tree-native-acceptance.yml, experiments/certified_trees/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record exact source without mutating the branch
        shell: python
        run: |
          import pathlib,hashlib,json,subprocess
          out=pathlib.Path('.tree-native-ci');out.mkdir()
          base='b0435653198c599c0d4ab4e84511c83658bfd3ad'
          record={'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'base':base}
          record['sources']={p.as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('experiments/certified_trees').rglob('*') if p.is_file() and '__pycache__' not in p.parts}
          (out/'source.json').write_text(json.dumps(record,indent=2))
          subprocess.run(['git','bundle','create',str(out/'review.bundle'),'HEAD','^'+base],check=True)
          (out/'source.tar.gz').write_bytes(subprocess.check_output(['git','archive','--format=tar.gz','HEAD','experiments/certified_trees','.github/workflows/tree-native-acceptance.yml']))
          (out/'update.patch').write_bytes(subprocess.check_output(['git','diff','--binary',base,'HEAD']))
      - run: python -m pip install numpy==2.3.5 catboost==1.2.8 pytest==9.0.2
      - name: Obtain pinned official libraries for real fallback tests
        shell: python
        run: |
          import pathlib,urllib.request,hashlib,json,subprocess,sys
          out=pathlib.Path('.tree-native-ci');libs=out/'official';libs.mkdir()
          expected={'1.2.8':'5a0de49d0bc81e460fd983da0f0f9d819e804b4ae19c6c9451b31e4f57d06545','1.2.10':'de32f8e147ee8f969599a00b7145e8561b943e916b0132b811037f8f71952a0e'}
          for version,h in expected.items():
              name=f'libcatboostmodel-linux-x86_64-{version}.so'
              with urllib.request.urlopen(f'https://github.com/catboost/catboost/releases/download/v{version}/{name}',timeout=60) as f:data=f.read(32*1024**2+1)
              assert len(data)<=32*1024**2 and hashlib.sha256(data).hexdigest()==h
              (libs/name).write_bytes(data)
          (out/'official-identities.json').write_text(json.dumps(expected,indent=2))
          (out/'environment.txt').write_bytes(subprocess.check_output([sys.executable,'-m','pip','freeze']))
      - name: Preserved exact-rational reference tests
        shell: python
        run: |
          import pathlib,subprocess,sys
          p=subprocess.run([sys.executable,'-m','unittest','-v','test_oracle.py'],cwd='experiments/certified_trees/reference',capture_output=True,text=True)
          pathlib.Path('.tree-native-ci/reference.log').write_text(p.stdout+p.stderr)
          assert p.returncode==0,p.stdout+p.stderr
      - name: Portable native, fallback, audit and stream contracts
        env:
          TREE_UPSTREAM: ${{ github.workspace }}/.tree-native-ci/official
        run: python -m pytest experiments/certified_trees/test_native.py experiments/certified_trees/test_audit.py experiments/certified_trees/test_deployment.py experiments/certified_trees/test_bundle_output.py --import-mode=importlib --confcutdir=experiments/certified_trees -q --junitxml=.tree-native-ci/portable.xml
      - name: Instrument optimized native implementation
        run: python -m experiments.certified_trees.build --out .tree-native-ci/ubsan --target avx2 --layout register --ubsan
      - name: Same contracts on optimized AVX2 under UBSan
        env:
          TREE_LIBRARY: ${{ github.workspace }}/.tree-native-ci/ubsan/trees.so
          TREE_UPSTREAM: ${{ github.workspace }}/.tree-native-ci/official
        run: python -m pytest experiments/certified_trees/test_native.py experiments/certified_trees/test_audit.py experiments/certified_trees/test_deployment.py experiments/certified_trees/test_bundle_output.py --import-mode=importlib --confcutdir=experiments/certified_trees -q --junitxml=.tree-native-ci/ubsan.xml
      - name: Verify source and actual test inventories
        shell: python
        run: |
          import pathlib,subprocess,json,hashlib,xml.etree.ElementTree as ET
          out=pathlib.Path('.tree-native-ci');record=json.loads((out/'source.json').read_text())
          for name,h in record['sources'].items():assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==h,name
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==record['head']
          subprocess.run(['git','diff','--exit-code','HEAD'],check=True)
          cases=[]
          for name in ('portable','ubsan'):
              root=ET.parse(out/(name+'.xml')).getroot()
              assert not any(root.findall('.//'+bad) for bad in ('failure','error','skipped'))
              cases.append(sorted((c.get('classname'),c.get('name')) for c in root.findall('.//testcase')))
          assert cases[0]==cases[1] and len(cases[0])==131
          (out/'acceptance.json').write_text(json.dumps({'status':'PASS','head':record['head'],'tree':record['tree'],'unique_pytest_cases':131,'reference_cases':13,'scope':'same tests on portable and AVX2 UBSan; not a benchmark or generalization result'},indent=2))
      - name: Seal retained receipts, not dependency libraries
        if: always()
        shell: python
        run: |
          import pathlib,shutil,json,hashlib
          out=pathlib.Path('.tree-native-ci');out.mkdir(exist_ok=True)
          shutil.rmtree(out/'official',ignore_errors=True)
          (out/'SHA256.json').write_text(json.dumps({p.relative_to(out).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in out.rglob('*') if p.is_file() and p.name!='SHA256.json'},indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tree-native-acceptance-${{ github.sha }}
          path: .tree-native-ci/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
