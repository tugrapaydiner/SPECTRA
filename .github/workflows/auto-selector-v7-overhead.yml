name: auto-selector-v7-overhead

on:
  push:
    branches: [performance/automatic-engine-selection-v7]
    paths: [.github/workflows/auto-selector-v7-overhead.yml]

permissions:
  contents: read

env:
  UPSTREAM_COMMIT: 4932048642da2144f387961b595112277afff82f
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'

jobs:
  overhead:
    name: overhead-${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86-64
            runner: ubuntu-24.04
          - label: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the WAP reconstruction dependency
        run: python -m pip install 'python-sat==1.9.dev15'
      - name: Acquire and verify WAP inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p overhead-evidence/graphs
          for name in wap05a.col wap06a.col; do
            curl --fail --location --retry 3 --retry-all-errors \
              "https://raw.githubusercontent.com/marijnheule/clicolcom/${UPSTREAM_COMMIT}/graphs/${name}" \
              -o "overhead-evidence/graphs/${name}"
          done
          python -m experiments.compiled_query.study export-wap \
            --graphs overhead-evidence/graphs --output overhead-evidence/cases
      - name: Build and run the paired overhead guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > overhead-evidence/library.txt
          from spectra.exact import build_exact_runtime
          print(build_exact_runtime('overhead-evidence/native'))
          PY
          python -m experiments.compiled_query.auto_selector_wap_overhead \
            --library "$(cat overhead-evidence/library.txt)" \
            --cases overhead-evidence/cases \
            --out overhead-evidence/results \
            2>&1 | tee overhead-evidence/overhead.log
      - name: Retain identities and hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > overhead-evidence/source-commit.txt
          git rev-parse HEAD^{tree} > overhead-evidence/source-tree.txt
          python -VV > overhead-evidence/python.txt
          uname -a > overhead-evidence/platform.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('overhead-evidence')
          manifest = {}
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'SHA256.json':
                  manifest[str(path.relative_to(root))] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / 'SHA256.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auto-selector-v7-overhead-${{ matrix.label }}-${{ github.run_id }}
          path: overhead-evidence/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
