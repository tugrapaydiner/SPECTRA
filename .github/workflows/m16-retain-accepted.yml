name: m16-retain-accepted
on:
  push:
    branches: [research/verifier-aligned-cpu-search]
    paths: ['.github/workflows/m16-retain-accepted.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retain exact accepted evidence without rerunning experiments
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: research/verifier-aligned-cpu-search
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$BRANCH"
          mkdir -p "$RUNNER_TEMP/m16-accepted"
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/tugrapaydiner/SPECTRA/actions/artifacts/10170185765/zip' \
            -o "$RUNNER_TEMP/accepted.zip"
          python - <<'PY'
          import hashlib, os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          raw = (root/'accepted.zip').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '4e002847e476f5f30226395329ca4f28ed9d61467a079c4e58aae4694fff0adc'
          with zipfile.ZipFile(root/'accepted.zip') as z:
              assert len(z.namelist()) == len(set(z.namelist()))
              assert z.testzip() is None
              for name in z.namelist():
                  p = pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts
                  dest = root/'m16-accepted'/name
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(name))
          ev = root/'m16-accepted'
          assert (ev/'source_commit.txt').read_text().strip() == '39dd7b7b8b5491c38862a2c40f566cad1cd45301'
          for line in (ev/'evidence_sha256.txt').read_text().splitlines():
              sha, name = line.split('  ', 1)
              p = pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert hashlib.sha256((ev/name).read_bytes()).hexdigest() == sha
          PY
          git fetch origin "$BRANCH"
          git worktree add "$RUNNER_TEMP/m16-publish" FETCH_HEAD
          dest="$RUNNER_TEMP/m16-publish/results/m16"
          mkdir -p "$dest/sources" "$dest/runs" "$dest/accepted"
          for file in "$RUNNER_TEMP/m16-accepted/inputs/"*.zip; do
            name=$(basename "$file")
            if test -f "$dest/sources/$name"; then cmp "$file" "$dest/sources/$name"; else cp "$file" "$dest/sources/$name"; fi
          done
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner --exclude='./inputs' -cf - -C "$RUNNER_TEMP/m16-accepted" . | gzip -n > "$RUNNER_TEMP/canonical-accepted.tar.gz"
          if test -f "$dest/runs/accepted-34522192590.tar.gz"; then
            cmp "$RUNNER_TEMP/canonical-accepted.tar.gz" "$dest/runs/accepted-34522192590.tar.gz"
          else
            cp "$RUNNER_TEMP/canonical-accepted.tar.gz" "$dest/runs/accepted-34522192590.tar.gz"
          fi
          cp "$RUNNER_TEMP/m16-accepted/experiment/summary.json" "$dest/accepted/cpu_summary.json"
          cp "$RUNNER_TEMP/m16-accepted/experiment/targets_development/summary.json" "$dest/accepted/target_summary.json"
          cp "$RUNNER_TEMP/m16-accepted/experiment/retrospective_audit.json" "$dest/accepted/retrospective_audit.json"
          cp "$RUNNER_TEMP/m16-accepted/experiment/environment.json" "$dest/accepted/environment.json"
          cp "$RUNNER_TEMP/m16-accepted/pytest_fast.txt" "$dest/accepted/pytest_fast.txt"
          cp "$RUNNER_TEMP/m16-accepted/environment.lock.txt" "$dest/accepted/environment.lock.txt"
          cd "$RUNNER_TEMP/m16-publish"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f results/m16/sources results/m16/runs/accepted-34522192590.tar.gz results/m16/accepted
          git diff --cached --quiet && exit 0
          git commit -m '[skip ci] M16: persist hash-verified accepted results and source checkpoints'
          git push origin "HEAD:refs/heads/$BRANCH"
