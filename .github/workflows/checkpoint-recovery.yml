name: checkpoint-recovery
on:
  push:
    branches: [research/100-blitz-20261016]
    paths: ['.github/workflows/checkpoint-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checkpoint-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify repository and create exact recovery materials
        env:
          REVIEW_BASE: 575eb1e657fc8c5d06fd56a519efd59f95dc0a2d
        run: |
          set -euo pipefail
          mkdir -p checkpoint-recovery
          git merge-base --is-ancestor "$REVIEW_BASE" HEAD
          git diff --check "$REVIEW_BASE"..HEAD
          git fsck --strict
          git rev-parse HEAD > checkpoint-recovery/source_commit.txt
          git rev-parse HEAD^{tree} > checkpoint-recovery/source_tree.txt
          printf '%s\n' "$REVIEW_BASE" > checkpoint-recovery/review_base.txt
          git log --format='%H %T %s' "$REVIEW_BASE"..HEAD > checkpoint-recovery/commit_ledger.txt
          git diff --binary "$REVIEW_BASE"..HEAD > checkpoint-recovery/review.patch
          git format-patch --stdout --binary "$REVIEW_BASE"..HEAD > checkpoint-recovery/review-series.patch
          git archive --format=tar.gz --output=checkpoint-recovery/source.tar.gz HEAD
          git bundle create checkpoint-recovery/source.bundle HEAD
          git bundle verify checkpoint-recovery/source.bundle > checkpoint-recovery/bundle-verify.txt 2>&1
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('checkpoint-recovery')
          files = {}
          for path in sorted(root.iterdir()):
              if path.is_file() and path.name != 'SHA256SUMS.json':
                  files[path.name] = {
                      'bytes': path.stat().st_size,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
          (root / 'SHA256SUMS.json').write_text(
              json.dumps(files, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: spectra-100-blitz-recovery-${{ github.sha }}
          path: checkpoint-recovery/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
