name: nonlinear-admission
on:
  pull_request:
    branches: [main]
    paths: [experiments/nonlinear_admission/**, .github/workflows/nonlinear-admission.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol-and-native-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 pytest
      - name: Test protocol and same-model native baseline contracts
        run: python -m pytest experiments/nonlinear_admission/test_study.py experiments/nonlinear_admission/test_native.py --confcutdir=experiments/nonlinear_admission --junitxml=admission-tests.xml
      - name: Save tested source identity
        shell: python
        run: |
          import pathlib,subprocess,sys,hashlib,json
          root=pathlib.Path('admission-receipts');root.mkdir()
          root.joinpath('tests.xml').write_bytes(pathlib.Path('admission-tests.xml').read_bytes())
          root.joinpath('source.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'files':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('experiments/nonlinear_admission').glob('*') if p.is_file()},'scope':'synthetic protocol/native tests only; no repetition of model fitting or final-test evaluation'},indent=2))
          root.joinpath('environment.txt').write_bytes(subprocess.check_output([sys.executable,'-m','pip','freeze']))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nonlinear-admission-contracts-${{ github.sha }}
          path: admission-receipts/
          retention-days: 30
          if-no-files-found: warn
