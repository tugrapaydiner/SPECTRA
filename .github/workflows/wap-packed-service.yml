name: WAP packed service portability
on:
  push:
    branches: [research/wap-packed-service-20261009]
    paths:
      - .github/workflows/wap-packed-service.yml
      - experiments/wap_service_format/**
      - experiments/wap_support/controls.py
      - tests/public/test_wap_service_format.py
permissions:
  contents: read
jobs:
  packed-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Preserve exact source and environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          git rev-parse HEAD > delivery/commit.txt
          git rev-parse HEAD^{tree} > delivery/tree.txt
          git archive --format=tar.gz --prefix=SPECTRA/ HEAD > delivery/source.tar.gz
          git bundle create delivery/source-history.bundle --all
          python -m pip install -q pytest==9.0.2 'python-sat==1.9.dev15'
          python -m pip freeze > delivery/environment.txt
          python --version > delivery/python.txt
          g++ --version > delivery/compiler.txt
      - name: Focused old and new contracts
        run: |
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_wap_service_format.py \
            tests/public/test_wap_support.py \
            tests/public/test_wap_support_audit.py \
            tests/public/test_quotient_native_contract.py \
            tests/public/test_arcfree_support.py \
            --junitxml=delivery/contracts.xml > delivery/contracts.log 2>&1
      - name: UBSan packed-service contracts
        shell: bash
        run: |
          set -euo pipefail
          python -c "from spectra.cnf.quotient_query import build_quotient_runtime; print(build_quotient_runtime('delivery/ubsan-native',sanitize=True))" > delivery/ubsan-runtime-path.txt
          SPECTRA_QUOTIENT_LIBRARY="$(cat delivery/ubsan-runtime-path.txt)" \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_wap_service_format.py \
            tests/public/test_quotient_native_contract.py \
            --junitxml=delivery/ubsan.xml > delivery/ubsan.log 2>&1
      - name: Reacquire five exact exposed WAP graphs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery/graphs
          for name in wap02a.col wap03a.col wap04a.col wap07a.col wap08a.col; do
            curl --fail --location --retry 3 --retry-all-errors \
              "https://raw.githubusercontent.com/marijnheule/clicolcom/4932048642da2144f387961b595112277afff82f/graphs/${name}" \
              -o "delivery/graphs/${name}"
          done
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          inventory=json.load(open('experiments/quotient_application/WAP_UPSTREAM_INVENTORY.json'))
          expected=['wap02a.col','wap03a.col','wap04a.col','wap07a.col','wap08a.col']
          rows=[]
          for name in expected:
              record=inventory['graphs'][name]
              data=(Path('delivery/graphs')/name).read_bytes()
              blob=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
              assert len(data)==record['bytes'] and blob==record['git_blob_sha1']
              rows.append({'name':name,'bytes':len(data),'git_blob_sha1':blob,
                           'sha256':hashlib.sha256(data).hexdigest()})
          Path('delivery/graph-acquisition.json').write_text(json.dumps({
              'schema':'spectra.wap_service_format.graph_acquisition.v1',
              'repository':inventory['repository'],'commit':inventory['commit'],
              'graphs':rows},sort_keys=True,indent=2)+'\n')
          PY
      - name: Rebuild canonical cases and compile packed artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -m experiments.wap_support.run build-cases \
            --graphs delivery/graphs \
            --inventory experiments/quotient_application/WAP_UPSTREAM_INVENTORY.json \
            --out delivery/cases --roles prospective_holdout \
            > delivery/case-build.log 2>&1
          start="$(python -c 'import time; print(time.perf_counter_ns())')"
          python -m experiments.wap_service_format.run pack \
            --cases delivery/cases/cases --out delivery/packed \
            > delivery/pack.log 2>&1
          end="$(python -c 'import time; print(time.perf_counter_ns())')"
          python - <<PY
          import json
          from pathlib import Path
          Path('delivery/pack-timing.json').write_text(json.dumps({
              'schema':'spectra.wap_service_format.pack_timing.v1',
              'elapsed_ns':int('$end')-int('$start')},sort_keys=True,indent=2)+'\n')
          PY
          python -c "from spectra.cnf.quotient_query import build_quotient_runtime; print(build_quotient_runtime('delivery/native'))" > delivery/runtime-path.txt
          cp delivery/native/build.json delivery/runtime-build.json
      - name: Execute complete 60-session matrix
        id: measurement
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -B -m experiments.wap_service_format.run run \
            --packed delivery/packed \
            --runtime "$(cat delivery/runtime-path.txt)" \
            --out delivery/evidence > delivery/measurement.log 2>&1
          code=$?
          printf '%s\n' "$code" > delivery/measurement-exit.txt
          exit "$code"
      - name: Audit all packed artifacts, sessions and 61,440 answers
        id: analysis
        if: always() && steps.measurement.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -B -m experiments.wap_service_format.analyse \
            --packed delivery/packed \
            --canonical-cases delivery/cases/cases \
            --evidence delivery/evidence \
            --runtime "$(cat delivery/runtime-path.txt)" \
            --out delivery/analysis.json > delivery/analysis.log 2>&1
          code=$?
          printf '%s\n' "$code" > delivery/analysis-exit.txt
          exit "$code"
      - name: Compute immutable engineering verdict
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reasons=[]
          if not Path('delivery/measurement-exit.txt').is_file() or Path('delivery/measurement-exit.txt').read_text().strip()!='0':
              reasons.append('measurement_failed_or_incomplete')
          if not Path('delivery/analysis-exit.txt').is_file() or Path('delivery/analysis-exit.txt').read_text().strip()!='0':
              reasons.append('analysis_failed_or_incomplete')
          analysis=None
          if Path('delivery/analysis.json').is_file():
              analysis=json.load(open('delivery/analysis.json'))
              if analysis.get('status')!='PASS': reasons.append('packed_engineering_gate_failed')
              if analysis.get('graphs')!=5 or analysis.get('sessions')!=60 or analysis.get('answers_audited')!=61440:
                  reasons.append('audited_inventory_differs')
          else: reasons.append('missing_analysis')
          decision={'schema':'spectra.wap_service_format.decision.v1',
                    'role':'exposed-data engineering, not confirmation',
                    'verdict':'PASS' if not reasons else 'FAIL','reasons':reasons,
                    'analysis':analysis}
          Path('delivery/DECISION.json').write_text(json.dumps(decision,sort_keys=True,indent=2)+'\n')
          print(json.dumps({'verdict':decision['verdict'],'reasons':reasons},sort_keys=True))
          PY
      - name: Seal complete artifact
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('delivery')
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in sorted(root.rglob('*'))
                    if p.is_file() and p.name!='DELIVERY_SHA256.json'}
          (root/'DELIVERY_SHA256.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wap-packed-service-py${{ matrix.python }}-${{ github.run_id }}
          path: delivery
          include-hidden-files: true
          retention-days: 90
      - name: Enforce predeclared engineering verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          decision=json.load(open('delivery/DECISION.json'))
          if decision['verdict']!='PASS':
              raise SystemExit('Packed service gate FAILED: '+', '.join(decision['reasons']))
          print('Packed service engineering gate PASSED; this is exposed-data portability, not confirmation.')
          PY
