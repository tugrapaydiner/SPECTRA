name: m06-controlled-baseline

on:
  push:
    branches: [research/m06-capability-gates]
    paths:
      - '.github/workflows/m06-controlled-baseline.yml'
      - 'scripts/m06_baseline_experiment.py'
      - 'scripts/m06_protocol_runner.py'
      - 'docs/M06_PROTOCOL.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install CPU dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .m06
          timeout 360s python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4" |& tee .m06/install_torch.txt
          timeout 180s python -m pip install -r requirements.txt |& tee .m06/install_requirements.txt
          python - <<'PY' | tee .m06/environment_bootstrap.txt
          import os, platform, sys, torch, numpy
          print('python=', sys.version)
          print('platform=', platform.platform())
          print('machine=', platform.machine())
          print('logical_cpus=', os.cpu_count())
          print('torch=', torch.__version__)
          print('numpy=', numpy.__version__)
          print('cuda_available=', torch.cuda.is_available())
          PY

      - name: Preflight experiment contract
        shell: bash
        run: |
          set -euxo pipefail
          python -m py_compile scripts/m06_baseline_experiment.py scripts/m06_protocol_runner.py
          python - <<'PY' | tee .m06/preflight.txt
          import scripts.m06_baseline_experiment as m
          import scripts.m06_protocol_runner as contract
          rows=[]
          for kind in m.KINDS:
              model=m.make_model(kind, 1)
              row=m.architecture_record(kind, model)
              rows.append(row)
              print(row)
          counts={r['kind']: r['trainable_params'] for r in rows}
          gap=abs(counts['fp_recursive']-counts['ternary_recursive'])/counts['fp_recursive']
          assert gap <= contract.RECURSIVE_PARAMETER_MATCH_TOLERANCE, (gap, counts)
          assert counts['single_pass'] > max(counts['fp_recursive'], counts['ternary_recursive']), counts
          print('recursive_parameter_gap=', gap)
          print('recursive_parameter_tolerance=', contract.RECURSIVE_PARAMETER_MATCH_TOLERANCE)
          print('parameter_counts=', counts)
          PY

      - name: Run preregistered M06 experiment
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 1800s python scripts/m06_protocol_runner.py --out .m06 |& tee .m06/run.log
          code=${PIPESTATUS[0]}
          echo "$code" | tee .m06/experiment_exit_code.txt
          exit 0

      - name: Verify retained M06 evidence
        if: always()
        shell: bash
        run: |
          set +e
          python - <<'PY' | tee .m06/evidence_check.txt
          import json, pathlib, sys
          root=pathlib.Path('.m06')
          exit_path=root/'experiment_exit_code.txt'
          if not exit_path.exists():
              print('missing experiment_exit_code.txt')
              sys.exit(2)
          code=int(exit_path.read_text().strip())
          print('experiment_exit_code=', code)
          summary_path=root/'summary.json'
          if not summary_path.exists():
              print('summary.json missing')
              sys.exit(3)
          s=json.loads(summary_path.read_text())
          print(json.dumps(s, indent=2, sort_keys=True))
          allowed={'complete','complete_with_recorded_failures','stopped_compute_infeasible'}
          assert s['status'] in allowed, s['status']
          if s['status'].startswith('complete'):
              for run in s['runs']:
                  if run['kind']=='ternary_recursive' and 'test_metrics' in run:
                      q=run['evaluation_quant_strength']
                      assert q and all(abs(float(v)-1.0) <= 1e-8 for v in q.values()), q
              print('quantization_strength_check=pass')
          PY
          echo "$?" | tee .m06/evidence_check_exit_code.txt
          exit 0

      - name: Full fast regression
        if: always()
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 600s python -m pytest -m "not slow" -ra |& tee .m06/pytest_fast.txt
          code=${PIPESTATUS[0]}
          echo "$code" | tee .m06/fast_exit_code.txt
          exit 0

      - name: Record provenance and evidence hashes
        if: always()
        shell: bash
        run: |
          {
            echo "head=$(git rev-parse HEAD)"
            echo "base=1003c59e17dc17e652438317b7480c9e898379af"
            echo
            git diff --stat 1003c59e17dc17e652438317b7480c9e898379af...HEAD
          } | tee .m06/diff_stat.txt
          python - <<'PY' | tee .m06/evidence_sha256.txt
          import hashlib, pathlib
          root=pathlib.Path('.m06')
          paths=[]
          for p in root.rglob('*'):
              if p.is_file() and p.name != 'evidence_sha256.txt':
                  paths.append(p)
          for p in sorted(paths):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              print(f'{h}  {p.as_posix()}')
          PY

      - name: Upload M06 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m06-controlled-baseline-evidence
          path: .m06/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Enforce M06 execution gate
        if: always()
        shell: bash
        run: |
          exp=$(cat .m06/experiment_exit_code.txt 2>/dev/null || echo 99)
          evidence=$(cat .m06/evidence_check_exit_code.txt 2>/dev/null || echo 99)
          fast=$(cat .m06/fast_exit_code.txt 2>/dev/null || echo 99)
          echo "experiment_exit_code=$exp"
          echo "evidence_check_exit_code=$evidence"
          echo "fast_exit_code=$fast"
          if [ "$exp" -ne 0 ] || [ "$evidence" -ne 0 ] || [ "$fast" -ne 0 ]; then
            echo "M06 execution gate failed; inspect retained evidence."
            exit 1
          fi
          echo "M06 execution gate passed."
