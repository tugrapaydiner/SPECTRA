name: Apply quotient native v2 repair
on:
  push:
    branches: [research/quotient-application-v2-20261008]
    paths:
      - maintenance/native-v2.patch.gz.b64
      - .github/workflows/apply-quotient-native-v2.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify base, decode, and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          sha256sum \
            spectra/_native/quotient_query.cpp \
            spectra/cnf/quotient_query.py \
            spectra/cnf/arcfree_support.py \
            tests/public/test_arcfree_support.py | tee delivery/pre_patch_sha256.txt
          grep -q '^f1fc8830948784d9a3f09a715703fb900304ff21d30faf912978652c84b22667  spectra/_native/quotient_query.cpp$' delivery/pre_patch_sha256.txt
          grep -q '^f19245ef832e9b89b429d0ded26bd3482ae70b7d38f0c9de0f222f2936942dee  spectra/cnf/quotient_query.py$' delivery/pre_patch_sha256.txt
          grep -q '^a83ac4de8012d876b2bd249caa8b0ab20b86718859b6c283e90842aa1750f534  spectra/cnf/arcfree_support.py$' delivery/pre_patch_sha256.txt
          base64 -d maintenance/native-v2.patch.gz.b64 > /tmp/native-v2.patch.gz
          echo 'f5f0b16aabfe1dcc9bd1862c1c84304c6ab260206bcfd873e8db69055b23550b  /tmp/native-v2.patch.gz' | sha256sum -c -
          gzip -dc /tmp/native-v2.patch.gz > /tmp/native-v2.patch
          echo '05f10b1a3c88028c57070d9466e8329ef2388ee95719a8308a84b1192ecc6559  /tmp/native-v2.patch' | sha256sum -c -
          git apply --check /tmp/native-v2.patch
          git apply /tmp/native-v2.patch
          test "$(sha256sum spectra/_native/quotient_query.cpp | cut -d' ' -f1)" = '25ffa81d8a7d8716804f73805fa16eb6f6afb06475465a1c9d2d003a5b0d7e3b'
          test "$(sha256sum tests/public/test_quotient_native_contract.py | cut -d' ' -f1)" = 'e6936c6cae78ec70d248db25b415a0f4da1635876d6c3c3f49b5f908e6b34c0a'
      - name: Run normal native contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_arcfree_support.py \
            tests/public/test_quotient_native_contract.py | tee delivery/pytest_normal.txt
      - name: Run undefined-behaviour sanitizer contracts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/spectra-q-ubsan
          python - <<'PY'
          from spectra.cnf.quotient_query import build_quotient_runtime
          print(build_quotient_runtime('/tmp/spectra-q-ubsan', sanitize=True))
          PY
          LIB=$(find /tmp/spectra-q-ubsan -name '_spectra_quotient_query*.so' -print -quit)
          test -n "$LIB"
          SPECTRA_QUOTIENT_LIBRARY="$LIB" python -m pytest -q --confcutdir=tests/public \
            tests/public/test_arcfree_support.py \
            tests/public/test_quotient_native_contract.py | tee delivery/pytest_ubsan.txt
          cp /tmp/spectra-q-ubsan/build.json delivery/ubsan_build.json
      - name: Commit audited repair
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            spectra/_native/quotient_query.cpp \
            spectra/cnf/quotient_query.py \
            spectra/cnf/arcfree_support.py \
            tests/public/test_quotient_native_contract.py | tee delivery/post_patch_sha256.txt
          git rev-parse HEAD > delivery/parent_commit.txt
          rm maintenance/native-v2.patch.gz.b64 .github/workflows/apply-quotient-native-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair native quotient ABI and audit arc-free support ownership'
          git rev-parse HEAD | tee delivery/repair_commit.txt
          git push origin HEAD:research/quotient-application-v2-20261008
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quotient-native-v2-repair-${{ github.run_id }}
          path: delivery
          retention-days: 90
