name: compiled-query-dependencies
on:
  push:
    branches: [research/compiled-query-validation]
    paths: ['.github/workflows/compiled-query-dependencies.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-cudd:
    name: Build pinned native controls (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tulip-control/dd
          ref: 4442d498ddea1bec0071315f538cb5ef37443985
          path: upstream-dd
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the explicitly pinned native dependencies
        env:
          DD_FETCH: '1'
          DD_CUDD: '1'
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          python -m pip install 'setuptools==80.9.0' 'wheel==0.45.1' 'Cython==3.1.3'
          python -m pip wheel --no-build-isolation --wheel-dir wheelhouse ./upstream-dd
          python -m pip wheel --wheel-dir wheelhouse 'python-sat==1.9.dev15'
          python -m pip install --no-index --find-links wheelhouse dd 'python-sat==1.9.dev15'
      - name: Verify native imports and record dependency provenance
        run: |
          set -euo pipefail
          python - <<'PY'
          import dd.cudd
          from pysat.solvers import Solver
          bdd = dd.cudd.BDD()
          bdd.declare('x')
          root = bdd.var('x')
          assert bdd.pick(root, care_vars={'x'}) == {'x': True}
          del root, bdd
          for name in ('minicard', 'cadical195'):
              with Solver(name=name, bootstrap_with=[[1]]) as solver:
                  assert solver.solve()
                  assert not solver.solve(assumptions=[-1])
          print('Native CUDD, MiniCard and CaDiCaL dependency smoke checks passed.')
          print('This job is dependency preparation, not SPECTRA benchmark validation.')
          PY
          git -C upstream-dd rev-parse HEAD > wheelhouse/upstream_commit.txt
          python -m pip freeze > wheelhouse/environment.txt
          python -VV > wheelhouse/python.txt
          uname -a > wheelhouse/platform.txt
          cd wheelhouse
          sha256sum *.whl > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiled-query-deps-${{ matrix.python }}-${{ github.run_id }}
          path: wheelhouse/
          retention-days: 30
          if-no-files-found: error
