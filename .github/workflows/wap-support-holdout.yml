name: Frozen WAP support-query holdout
on:
  push:
    branches: [research/quotient-application-v2-20261008]
    paths: [experiments/wap_support/HOLDOUT_OPEN.json]
permissions:
  contents: read
jobs:
  holdout:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify public freeze before graph access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          git rev-parse HEAD > delivery/open-commit.txt
          git rev-parse HEAD^{tree} > delivery/open-tree.txt
          python -m experiments.wap_support.verify_freeze \
            --freeze experiments/wap_support/FREEZE.json \
            --marker experiments/wap_support/HOLDOUT_OPEN.json \
            --out delivery/freeze-verification.json \
            > delivery/freeze-verification.log
          FREEZE_COMMIT="$(python -c "import json; print(json.load(open('experiments/wap_support/HOLDOUT_OPEN.json'))['freeze_commit'])")"
          git archive --format=tar.gz --prefix=SPECTRA/ "$FREEZE_COMMIT" > delivery/frozen-source.tar.gz
          git bundle create delivery/open-history.bundle --all
      - name: Install pinned controls
        run: |
          python -m pip install -q pytest==9.0.2 'python-sat==1.9.dev15'
          python -m pip freeze > delivery/environment.txt
          python --version > delivery/python.txt
          g++ --version > delivery/compiler.txt
      - name: Complete public contracts before graph access
        run: |
          python -m pytest tests/public --confcutdir=tests/public \
            --junitxml=delivery/public-tests.xml > delivery/public-tests.log 2>&1
      - name: Focused native sanitizer contracts before graph access
        shell: bash
        run: |
          set -euo pipefail
          python -c "from spectra.cnf.quotient_query import build_quotient_runtime; print(build_quotient_runtime('delivery/ubsan-native',sanitize=True))" > delivery/ubsan-runtime-path.txt
          SPECTRA_QUOTIENT_LIBRARY="$(cat delivery/ubsan-runtime-path.txt)" \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_wap_support.py \
            tests/public/test_wap_support_audit.py \
            tests/public/test_quotient_native_contract.py \
            tests/public/test_arcfree_support.py \
            > delivery/ubsan-tests.log 2>&1
      - name: Acquire exactly five pinned unopened holdout graphs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery/graphs
          for name in wap02a.col wap03a.col wap04a.col wap07a.col wap08a.col; do
            curl --fail --location --retry 3 --retry-all-errors \
              "https://raw.githubusercontent.com/marijnheule/clicolcom/4932048642da2144f387961b595112277afff82f/graphs/${name}" \
              -o "delivery/graphs/${name}"
          done
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          inventory=json.load(open('experiments/quotient_application/WAP_UPSTREAM_INVENTORY.json'))
          expected=['wap02a.col','wap03a.col','wap04a.col','wap07a.col','wap08a.col']
          receipts=[]
          for name in expected:
              record=inventory['graphs'][name]
              assert record['role']=='prospective_holdout'
              data=(Path('delivery/graphs')/name).read_bytes()
              blob=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
              assert len(data)==record['bytes'], (name,len(data),record['bytes'])
              assert blob==record['git_blob_sha1'], (name,blob,record['git_blob_sha1'])
              receipts.append({'name':name,'bytes':len(data),'git_blob_sha1':blob,
                               'sha256':hashlib.sha256(data).hexdigest()})
          assert sorted(p.name for p in Path('delivery/graphs').iterdir())==expected
          Path('delivery/graph-acquisition.json').write_text(json.dumps({
              'schema':'spectra.wap_support.graph_acquisition.v1',
              'repository':inventory['repository'],'commit':inventory['commit'],
              'graphs':receipts},sort_keys=True,indent=2)+'\n')
          PY
      - name: Build exact native runtime and five frozen cases
        shell: bash
        run: |
          set -euo pipefail
          python -c "from spectra.cnf.quotient_query import build_quotient_runtime; print(build_quotient_runtime('delivery/native'))" > delivery/runtime-path.txt
          cp delivery/native/build.json delivery/runtime-build.json
          python -m experiments.wap_support.run build-cases \
            --graphs delivery/graphs \
            --inventory experiments/quotient_application/WAP_UPSTREAM_INVENTORY.json \
            --out delivery/cases \
            --roles prospective_holdout \
            > delivery/case-build.log 2>&1
      - name: Independently audit every compiled quotient relation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,time,zlib
          from pathlib import Path
          from experiments.wap_support.workload import WorkloadCase
          from spectra.cnf.quotient_query import QuotientRuntime
          from spectra.cnf.quotient_certificate import verify_quotient
          runtime=QuotientRuntime(Path('delivery/runtime-path.txt').read_text().strip())
          out=Path('delivery/certificates'); out.mkdir()
          rows=[]
          for path in sorted(Path('delivery/cases/cases').glob('*.json')):
              case=WorkloadCase.from_json(path)
              start=time.perf_counter_ns()
              prepared=runtime.prepare(case.n,case.palette,case.edges,masks=case.masks,
                                       mode='scc',max_build_bytes=512*1024*1024)
              try:
                  certificate=prepared.certificate()
                  audit=verify_quotient(case.n,case.palette,case.edges,case.masks,certificate)
                  assert audit['valid'] and audit['mapping_verified']
              finally:
                  prepared.close()
              payload=json.dumps(certificate,sort_keys=True,separators=(',',':')).encode()
              compressed=zlib.compress(payload,9)
              destination=out/(path.stem+'.certificate.json.zlib')
              destination.write_bytes(compressed)
              rows.append({'case_file':path.name,'case_sha256':case.case_sha256,
                           'certificate_sha256':hashlib.sha256(payload).hexdigest(),
                           'compressed_sha256':hashlib.sha256(compressed).hexdigest(),
                           'certificate_bytes':len(payload),'compressed_bytes':len(compressed),
                           'audit':audit,'audit_ns':time.perf_counter_ns()-start})
          assert len(rows)==5
          Path('delivery/certificate-audit.json').write_text(json.dumps({
              'schema':'spectra.wap_support.certificate_audit.v1','cases':rows
          },sort_keys=True,indent=2)+'\n')
          PY
      - name: Execute immutable 105-session matrix
        id: measurement
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m experiments.wap_support.run run \
            --cases delivery/cases/cases \
            --runtime "$(cat delivery/runtime-path.txt)" \
            --out delivery/evidence \
            > delivery/measurement.log 2>&1
          code=$?
          printf '%s\n' "$code" > delivery/measurement-exit.txt
          exit "$code"
      - name: Reconstruct and audit all evidence
        id: analysis
        if: always() && steps.measurement.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m experiments.wap_support.analyse \
            --cases delivery/cases \
            --evidence delivery/evidence \
            --runtime "$(cat delivery/runtime-path.txt)" \
            --inventory experiments/quotient_application/WAP_UPSTREAM_INVENTORY.json \
            --out delivery/analysis.json \
            --reconstruct-cases \
            --expected-role prospective_holdout \
            > delivery/analysis.log 2>&1
          code=$?
          printf '%s\n' "$code" > delivery/analysis-exit.txt
          exit "$code"
      - name: Compute immutable decision
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          measurement=Path('delivery/measurement-exit.txt')
          analysis_exit=Path('delivery/analysis-exit.txt')
          analysis_path=Path('delivery/analysis.json')
          reasons=[]
          if not measurement.is_file() or measurement.read_text().strip()!='0':
              reasons.append('measurement_failed_or_incomplete')
          if not analysis_exit.is_file() or analysis_exit.read_text().strip()!='0':
              reasons.append('analysis_failed_or_incomplete')
          analysis=None
          if analysis_path.is_file():
              analysis=json.load(open(analysis_path))
              if analysis.get('verdict')!='PASS': reasons.append('predeclared_numeric_gate_failed')
              if analysis.get('graphs')!=5 or analysis.get('sessions')!=105 or analysis.get('answers_audited')!=107520:
                  reasons.append('audited_inventory_differs')
          else:
              reasons.append('missing_analysis')
          decision={'schema':'spectra.wap_support.holdout_decision.v1',
                    'verdict':'PASS' if not reasons else 'FAIL','reasons':reasons,
                    'analysis':analysis}
          Path('delivery/DECISION.json').write_text(json.dumps(decision,sort_keys=True,indent=2)+'\n')
          print(json.dumps({'verdict':decision['verdict'],'reasons':reasons},sort_keys=True))
          PY
      - name: Seal complete delivery manifest
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('delivery')
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in sorted(root.rglob('*')) if p.is_file() and p.name!='DELIVERY_SHA256.json'}
          (root/'DELIVERY_SHA256.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frozen-wap-support-holdout-${{ github.run_id }}
          path: delivery
          include-hidden-files: true
          retention-days: 90
      - name: Enforce frozen verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          decision=json.load(open('delivery/DECISION.json'))
          if decision['verdict']!='PASS':
              raise SystemExit('Frozen WAP holdout FAILED: '+', '.join(decision['reasons']))
          print('Frozen WAP holdout PASSED exactly as preregistered.')
          PY
