name: learned-finite-inputs
on:
  push:
    branches: [research/learned-finite-kernels]
    paths: [.github/workflows/learned-finite-inputs.yml]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Acquire official public input bytes without model fitting
        shell: python
        run: |
          import pathlib,urllib.request,json,hashlib,os
          root=pathlib.Path('inputs');root.mkdir()
          receipt={}
          for name,url in [('semeion','https://archive.ics.uci.edu/static/public/178/semeion+handwritten+digit.zip'),('car','https://archive.ics.uci.edu/static/public/19/car+evaluation.zip')]:
              with urllib.request.urlopen(url,timeout=60) as response:
                  raw=response.read(8*1024*1024+1)
              assert len(raw)<=8*1024*1024 and raw[:2]==b'PK'
              (root/(name+'.zip')).write_bytes(raw)
              receipt[name]={'url':url,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (root/'ACQUISITION.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'data':receipt,'scope':'public input acquisition only; no training or evaluation'},indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learned-finite-inputs-${{ github.sha }}
          path: inputs/
          retention-days: 30
          if-no-files-found: error
