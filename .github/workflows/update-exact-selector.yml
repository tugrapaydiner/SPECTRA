name: update-exact-selector

on:
  push:
    branches: [faster-exact-service]
    paths:
      - '.github/workflows/update-exact-selector.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-exact-selector
  cancel-in-progress: false

jobs:
  patch-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: faster-exact-service
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest==9.0.2'
      - name: Update the installed self-test contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('spectra/exact_selftest.py')
          text = path.read_text(encoding='utf-8')
          if text.count('structural-v10') != 2:
              raise SystemExit(
                  'exact self-test no longer has the two expected v10 checks'
              )
          path.write_text(
              text.replace('structural-v10', 'structural-v11'),
              encoding='utf-8',
          )
          PY
      - name: Run the installed-package contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            tests/public/test_exact_selftest.py \
            tests/public/test_exact_api.py \
            tests/public/test_auto_selector_v11.py \
            --confcutdir=tests/public -q
          git diff --check
      - name: Commit the checked self-test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Tugrap
          git config user.email 106766396+tugrapaydiner@users.noreply.github.com
          git add spectra/exact_selftest.py
          git commit -m 'Keep the self-test on structural-v11'
          git push origin HEAD:faster-exact-service
