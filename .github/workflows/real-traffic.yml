name: Real traffic study
on:
  push:
    branches: [real-traffic]
    paths:
      - experiments/real_traffic/**
      - tests/public/test_real_traffic.py
      - .github/workflows/real-traffic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record the exact source
        run: |
          mkdir -p delivery
          git rev-parse HEAD > delivery/commit.txt
          git rev-parse HEAD^{tree} > delivery/tree.txt
          git archive --format=tar.gz HEAD > delivery/source.tar.gz
      - name: Run the complete public contract suite
        run: |
          python -m pip install pytest==9.0.2 numpy==2.3.5 'python-sat==1.9.dev15'
          python -m pytest tests/public --confcutdir=tests/public -ra --junitxml=delivery/public.xml | tee delivery/public.txt
      - name: Download the fixed development week
        run: python -m experiments.real_traffic.fetch_data --week X01 --out delivery/abilene
      - name: Build and independently replay the trace case
        run: python -m experiments.real_traffic.prepare --week X01 --source delivery/abilene --out delivery/case
      - name: Hash every retained byte
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('delivery')
          with (root/'SHA256SUMS').open('w') as output:
              for path in sorted(root.rglob('*')):
                  if path.is_file() and path.name!='SHA256SUMS':
                      output.write(hashlib.sha256(path.read_bytes()).hexdigest()+'  '+str(path.relative_to(root))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-traffic-${{ github.run_id }}
          path: delivery
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
