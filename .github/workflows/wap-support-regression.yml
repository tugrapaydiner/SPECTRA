name: WAP flagship regression

on:
  pull_request:
    branches: [main]
    paths:
      - spectra/cnf/arcfree_support.py
      - spectra/cnf/quotient_certificate.py
      - spectra/cnf/quotient_query.py
      - spectra/_native/quotient_query.cpp
      - experiments/wap_support/**
      - experiments/quotient_application/WAP_UPSTREAM_INVENTORY.json
      - tests/public/test_arcfree_support.py
      - tests/public/test_quotient_native_contract.py
      - tests/public/test_wap_support.py
      - tests/public/test_wap_support_audit.py
      - tests/public/test_wap_support_freeze.py
      - scripts/check_release_readiness.py
      - README.md
      - CHANGELOG.md
      - docs/**
      - .github/workflows/wap-support-regression.yml
  push:
    branches: [main]
    paths:
      - spectra/cnf/arcfree_support.py
      - spectra/cnf/quotient_certificate.py
      - spectra/cnf/quotient_query.py
      - spectra/_native/quotient_query.cpp
      - experiments/wap_support/**
      - experiments/quotient_application/WAP_UPSTREAM_INVENTORY.json
      - tests/public/test_arcfree_support.py
      - tests/public/test_quotient_native_contract.py
      - tests/public/test_wap_support.py
      - tests/public/test_wap_support_audit.py
      - tests/public/test_wap_support_freeze.py
      - scripts/check_release_readiness.py
      - README.md
      - CHANGELOG.md
      - docs/**
      - .github/workflows/wap-support-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned contracts
        run: python -m pip install -q pytest==9.0.2 'python-sat==1.9.dev15' build
      - name: Focused public contracts
        run: |
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_wap_support.py \
            tests/public/test_wap_support_audit.py \
            tests/public/test_wap_support_freeze.py \
            tests/public/test_quotient_native_contract.py \
            tests/public/test_arcfree_support.py
      - name: Native undefined-behaviour sanitizer
        run: |
          python -c "from spectra.cnf.quotient_query import build_quotient_runtime; print(build_quotient_runtime('/tmp/wap-ubsan',sanitize=True))" > /tmp/wap-ubsan-path.txt
          SPECTRA_QUOTIENT_LIBRARY="$(cat /tmp/wap-ubsan-path.txt)" \
            python -m pytest -q --confcutdir=tests/public \
              tests/public/test_quotient_native_contract.py \
              tests/public/test_arcfree_support.py
      - name: Documentation and package checks
        run: |
          python scripts/check_release_readiness.py
          python -m compileall -q spectra experiments/wap_support
          python -m build --sdist --wheel --outdir /tmp/spectra-dist
          python -m pip install --force-reinstall /tmp/spectra-dist/*.whl
          cd /tmp
          python -m spectra doctor
