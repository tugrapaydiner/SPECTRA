name: Inspect larger traffic traces
on:
  push:
    branches: [real-traffic]
    paths:
      - experiments/real_traffic/inspect_sndlib.py
      - experiments/real_traffic/fetch_germany50.py
      - .github/workflows/inspect-larger-traces.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect Germany50 source links
        run: |
          mkdir -p delivery
          python -m experiments.real_traffic.inspect_sndlib --network germany50 --out delivery/germany50-links | tee delivery/germany50-links.txt
      - name: Acquire the fixed development day
        run: |
          python -m experiments.real_traffic.fetch_germany50 --out delivery/germany50-day | tee delivery/germany50-day.txt
          git rev-parse HEAD > delivery/commit.txt
          git rev-parse HEAD^{tree} > delivery/tree.txt
          echo 'Germany50 one-day development source only; no solver, holdout, or promotion decision.' > delivery/ROLE.txt
      - name: Hash the receipts
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('delivery')
          with (root/'SHA256SUMS').open('w') as output:
              for path in sorted(root.rglob('*')):
                  if path.is_file() and path.name!='SHA256SUMS':
                      output.write(hashlib.sha256(path.read_bytes()).hexdigest()+'  '+str(path.relative_to(root))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: germany50-development-${{ github.run_id }}
          path: delivery
          retention-days: 90
          if-no-files-found: error
