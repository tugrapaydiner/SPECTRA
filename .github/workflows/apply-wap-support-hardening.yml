name: Apply WAP support hardening
on:
  push:
    branches: [research/quotient-application-v2-20261008]
    paths: [.github/workflows/apply-wap-support-hardening.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Decode exact hardening patch
        shell: bash
        run: |
          set -euo pipefail
          cat maintenance/wap-support-hardening/part-*.b64 > /tmp/wap-hardening.b64
          echo '3b149fbe08d9d40c48c601e24ec06202ddc7ea88b9c9c654b22e45f8c4f748be  /tmp/wap-hardening.b64' | sha256sum -c -
          base64 -d /tmp/wap-hardening.b64 | gzip -d > /tmp/wap-hardening.patch
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          git am /tmp/wap-hardening.patch
      - name: Install pinned contracts
        run: python -m pip install -q pytest==9.0.2 'python-sat==1.9.dev15'
      - name: Focused normal contracts
        run: |
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_wap_support.py \
            tests/public/test_wap_support_audit.py \
            tests/public/test_quotient_native_contract.py \
            tests/public/test_arcfree_support.py
      - name: Focused sanitizer contracts
        shell: bash
        run: |
          set -euo pipefail
          python -c "from spectra.cnf.quotient_query import build_quotient_runtime; print(build_quotient_runtime('/tmp/ubsan',sanitize=True))" > /tmp/ubsan-path.txt
          SPECTRA_QUOTIENT_LIBRARY="$(cat /tmp/ubsan-path.txt)" \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_wap_support.py \
            tests/public/test_wap_support_audit.py \
            tests/public/test_quotient_native_contract.py \
            tests/public/test_arcfree_support.py
      - name: Complete public regression suite
        run: python -m pytest -q --confcutdir=tests/public tests/public
      - name: Publish exact validated commit
        run: git push origin HEAD:research/quotient-application-v2-20261008
