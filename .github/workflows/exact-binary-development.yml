name: exact-binary-development
on:
  push:
    branches: [research/compiled-query-validation]
    paths:
      - '.github/workflows/exact-binary-development.yml'
      - 'experiments/compiled_query/*.py'
      - 'experiments/compiled_query/*.cpp'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      SPECTRA_REQUIRE_CUDD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@v4
        with:
          repository: tulip-control/dd
          ref: 4442d498ddea1bec0071315f538cb5ef37443985
          path: .ci-dd
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: marijnheule/clicolcom
          ref: 4932048642da2144f387961b595112277afff82f
          path: .ci-graphs
          persist-credentials: false
      - name: Install pinned actual native competitors
        env:
          DD_FETCH: '1'
          DD_CUDD: '1'
        run: |
          set -euo pipefail
          python -m pip install 'setuptools==80.9.0' 'wheel==0.45.1' 'Cython==3.1.3'
          python -m pip install --no-build-isolation ./.ci-dd
          python -m pip install 'python-sat==1.9.dev15' 'pytest==8.4.2' 'numpy==2.2.6'
          python -c 'import dd.cudd; import pysat.solvers'
      - name: Prepare explicit runtimes and source receipts
        run: |
          set -euo pipefail
          mkdir -p exact-validation/graphs
          git rev-parse HEAD > exact-validation/source_commit.txt
          git fetch --no-tags origin 095c1ed65ffa3beabc55e42052c2f3b038a3150e
          git update-ref refs/spectra/audit-helper FETCH_HEAD
          git bundle create exact-validation/source.bundle HEAD refs/spectra/audit-helper
          python -m pip freeze > exact-validation/environment.txt
          python -VV > exact-validation/python.txt
          uname -a > exact-validation/platform.txt
          python - <<'PY'
          from experiments.compiled_query.exact import build_exact_runtime
          from spectra.cnf.quotient_query import build_quotient_runtime
          import os
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SPECTRA_EXACT_LIBRARY=' + str(build_exact_runtime('exact-validation/exact-build')) + '\n')
              f.write('SPECTRA_QUOTIENT_LIBRARY=' + str(build_quotient_runtime('exact-validation/quotient-build')) + '\n')
          PY
      - name: Run all comparator and new proof contracts
        run: |
          set -euo pipefail
          python -m pytest experiments/compiled_query -q --junitxml=exact-validation/contracts.xml 2>&1 | tee exact-validation/contracts.log
          python scripts/check_release_readiness.py --out exact-validation/release_audit.json
          python scripts/audit_workspace.py --out exact-validation/workspace_audit.json
      - name: Freeze development inputs before measurement
        run: |
          set -euo pipefail
          for name in wap05a.col wap06a.col; do
            mapfile -t matches < <(find .ci-graphs -type f -name "$name")
            test "${#matches[@]}" -eq 1
            cp "${matches[0]}" "exact-validation/graphs/$name"
          done
          python -m experiments.compiled_query.study synthetic --output exact-validation/synthetic-cases --queries 128 --n 96
          python -m experiments.compiled_query.study export-wap --graphs exact-validation/graphs --output exact-validation/wap-sat-cases
          python -m experiments.compiled_query.mixed_cases --source exact-validation/wap-sat-cases --output exact-validation/wap-mixed-cases --queries 1024
          python -m experiments.compiled_query.common_masks --source exact-validation/wap-mixed-cases --output exact-validation/wap-common-cases
          python -m experiments.compiled_query.mixed_cases --source exact-validation/wap-sat-cases --output exact-validation/wap-long-mixed-cases --queries 8192
          python -m experiments.compiled_query.common_masks --source exact-validation/wap-long-mixed-cases --output exact-validation/wap-long-common-cases
          for name in synthetic wap-sat wap-mixed wap-common; do
            count=1024; if [ "$name" = synthetic ]; then count=128; fi
            python -m experiments.compiled_query.study new --cases "exact-validation/$name-cases" --library "$SPECTRA_QUOTIENT_LIBRARY" --exact-library "$SPECTRA_EXACT_LIBRARY" --output "exact-validation/$name-study" --arms exact-scc exact-raw exact-sparse exact-route exact-bank-raw exact-bank-scc exact-bank-closure scc none minicard cadical195 cudd-reduced-bfs --prefixes 1 "$count" --repeats 3 --deadline 15
          done
          # Long-bank amortization is a separately named development matrix. It
          # uses the same unfiltered request generator and exact request order;
          # no outcome is inspected while constructing the 8,192-row bank.
          python -m experiments.compiled_query.study new --cases exact-validation/wap-long-common-cases --library "$SPECTRA_QUOTIENT_LIBRARY" --exact-library "$SPECTRA_EXACT_LIBRARY" --output exact-validation/wap-long-common-study --arms exact-bank-raw exact-bank-scc exact-bank-closure --prefixes 1024 8192 --repeats 3 --deadline 30
      - uses: actions/upload-artifact@v4
        with:
          name: exact-binary-inputs-${{ matrix.python }}-${{ github.run_id }}
          path: |
            exact-validation/source.bundle
            exact-validation/*-cases/
            exact-validation/*-study/manifest*
            exact-validation/*-build/
            exact-validation/*.txt
          retention-days: 30
          if-no-files-found: error
      - name: Run every scheduled cell and independently replay all evidence
        run: |
          set -euo pipefail
          for name in synthetic wap-sat wap-mixed wap-common wap-long-common; do
            python -m experiments.compiled_query.study run --output "exact-validation/$name-study" | tee "exact-validation/$name-run.log"
            python -m experiments.compiled_query.study audit --output "exact-validation/$name-study" > "exact-validation/$name-audit.json"
          done
          # Integrity passing does not imply completeness or a speed win.
          # Keep every legacy UNKNOWN, timeout and negative comparison.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-binary-results-${{ matrix.python }}-${{ github.run_id }}
          path: |
            exact-validation/*-study/
            exact-validation/*.json
            exact-validation/*.xml
            exact-validation/*.log
          retention-days: 30
          if-no-files-found: error
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ['undefined', 'address,undefined']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest==8.4.2' 'python-sat==1.9.dev15'
      - name: Build and test changed native code under the selected sanitizer
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          set -euo pipefail
          mkdir -p sanitizer-results
          export SPECTRA_EXACT_LIBRARY="$(python -c "from experiments.compiled_query.exact import build_exact_runtime; import os; print(build_exact_runtime('sanitizer-results/build', sanitizer=os.environ['SANITIZER']))")"
          export UBSAN_OPTIONS=halt_on_error=1
          if [ "$SANITIZER" = 'address,undefined' ]; then
            export LD_PRELOAD="$(g++ -print-file-name=libasan.so):$(g++ -print-file-name=libstdc++.so)"
            export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
          fi
          python -m pytest experiments/compiled_query/test_exact.py -q --junitxml=sanitizer-results/contracts.xml 2>&1 | tee sanitizer-results/contracts.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-binary-sanitizer-${{ matrix.sanitizer }}-${{ github.run_id }}
          path: sanitizer-results/
          retention-days: 30
          if-no-files-found: error
