name: Build pinned CliColCom DDFW control
on:
  push:
    branches: [research/quotient-application-v2-20261008]
    paths:
      - .github/workflows/build-pinned-ddfw.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: marijnheule/clicolcom
          ref: 4932048642da2144f387961b595112277afff82f
          path: clicolcom
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source identity and build UBCSAT
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          test "$(git -C clicolcom rev-parse HEAD)" = '4932048642da2144f387961b595112277afff82f'
          git -C clicolcom ls-tree -r HEAD ubcsat > delivery/ubcsat_tree.txt
          sha256sum delivery/ubcsat_tree.txt > delivery/ubcsat_tree.sha256
          make -C clicolcom/ubcsat clean
          make -C clicolcom/ubcsat -j2
          test -x clicolcom/ubcsat/ubcsat
          cp clicolcom/ubcsat/ubcsat delivery/ubcsat
          cp clicolcom/ubcsat/legal.txt delivery/UBCSAT_LEGAL.txt
          cp clicolcom/ubcsat/algorithms.txt delivery/UBCSAT_ALGORITHMS.txt
          printf '%s\n' '4932048642da2144f387961b595112277afff82f' > delivery/upstream_commit.txt
          ./delivery/ubcsat -alg ddfw -help > delivery/ddfw_help.txt 2>&1 || true
          ldd delivery/ubcsat > delivery/ldd.txt
          sha256sum delivery/ubcsat delivery/UBCSAT_LEGAL.txt delivery/UBCSAT_ALGORITHMS.txt \
            delivery/upstream_commit.txt delivery/ddfw_help.txt delivery/ldd.txt \
            > delivery/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-clicolcom-ddfw-${{ github.run_id }}
          path: delivery
          retention-days: 90
