name: native-baseline-inputs
on:
  push:
    branches: [research/native-baselines-har]
    paths: [.github/workflows/native-baseline-inputs.yml, experiments/native_baselines/PROTOCOL.md]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-acquisition:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Acquire pinned native sources and official HAR feature partitions
        run: |
          python - <<'PY'
          import urllib.request,pathlib,hashlib,json,zipfile,io,os
          root=pathlib.Path('inputs');root.mkdir();receipts=[]
          def fetch(url,cap):
              with urllib.request.urlopen(url,timeout=120) as r: raw=r.read(cap+1)
              if len(raw)>cap: raise ValueError('download exceeds bound')
              receipts.append({'url':url,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
              return raw
          for name in ['svm.cpp','svm.h','COPYRIGHT']:
              p=root/'libsvm'/name;p.parent.mkdir(exist_ok=True)
              p.write_bytes(fetch('https://raw.githubusercontent.com/cjlin1/libsvm/6b907139084abf2da4d6d3cb10dc3b7eaffa2fbb/'+name,300000))
          raw=fetch('https://archive.ics.uci.edu/static/public/240/human+activity+recognition+using+smartphones.zip',100*1024*1024)
          archive=zipfile.ZipFile(io.BytesIO(raw))
          nested=[n for n in archive.namelist() if n.endswith('UCI HAR Dataset.zip')]
          if nested: archive=zipfile.ZipFile(io.BytesIO(archive.read(nested[0])))
          names=['README.txt','features.txt','features_info.txt','activity_labels.txt','train/X_train.txt','train/y_train.txt','train/subject_train.txt','test/X_test.txt','test/y_test.txt','test/subject_test.txt']
          for name in names:
              matches=[n for n in archive.namelist() if n.endswith('UCI HAR Dataset/'+name)]
              if len(matches)!=1: raise ValueError('HAR inventory mismatch: '+name)
              p=root/'har'/name;p.parent.mkdir(exist_ok=True,parents=True);p.write_bytes(archive.read(matches[0]))
          (root/'acquisition.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'downloads':receipts},indent=2))
          PY
          python -m pip download --only-binary=:all: --no-deps --dest inputs/wheels m2cgen==0.10.0
          python - <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path('inputs')
          (root/'SHA256.json').write_text(json.dumps({p.relative_to(root).as_posix():{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(root.rglob('*')) if p.is_file()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-baseline-inputs-${{ github.sha }}
          path: inputs/
          retention-days: 30
          if-no-files-found: error
