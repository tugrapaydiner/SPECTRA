name: fix-part3-hardening

on:
  push:
    branches: [finish-part3]
    paths: ['.github/workflows/fix-part3-hardening.yml']

permissions:
  contents: write

concurrency:
  group: fix-part3-hardening
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: finish-part3
          fetch-depth: 0
      - name: Correct the generated Markdown line
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/part3-hardening.yml')
          text = path.read_text(encoding='utf-8')
          old = "              '**Branch:** `finish-part3`  \\n',\n"
          new = "              '**Branch:** `finish-part3`\\n',\n"
          if text.count(old) != 1:
              raise AssertionError('expected one generated branch-line replacement')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-part3-hardening.yml').unlink()
          PY
          git diff --check
      - name: Save the correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix the Part 3 hardening check'
          git push origin HEAD:refs/heads/finish-part3
