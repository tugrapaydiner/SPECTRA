name: align-auto-selector-v7-contracts

on:
  push:
    branches: [performance/automatic-engine-selection-v7]
    paths: [.github/workflows/align-auto-selector-v7-contracts.yml]

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Align current and historical contracts
        run: python scripts/align_auto_selector_v7_contracts.py
      - name: Run affected public and research contracts
        run: |
          python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_auto_selector_v7.py \
            tests/public/test_exact_api.py \
            tests/public/test_exact_bank_tile64.py
          python -m pytest -q --confcutdir=experiments/compiled_query \
            experiments/compiled_query/test_exact.py -k 'auto or tiled_witnesses'
          python -m pytest -q --confcutdir=experiments/compiled_query \
            experiments/compiled_query/test_itc_exam_transfer.py
      - name: Commit the aligned contracts
        run: |
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          git add experiments tests
          git commit -m 'Align selector contracts with the new policy' -m 'Update the full exact and ITC contract suite for the v7 decisions while preserving support for historical selector evidence.'
          git push origin HEAD:performance/automatic-engine-selection-v7
