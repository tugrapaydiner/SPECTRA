name: package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'

jobs:
  dist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'build==1.3.0'
      - run: python -m build --outdir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  svm-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: >-
          python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3
          scikit-learn==1.8.0 joblib==1.5.3 threadpoolctl==3.6.0
      - name: Rebuild the SVM fixture corpus; fail if any model or input byte changes
        run: python benchmarks/svm_stream/corpus.py --out .svm-corpus
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: svm-corpus
          path: .svm-corpus/
          include-hidden-files: true
          if-no-files-found: error

  installed:
    name: installed wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [dist, svm-corpus]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.10', bundle: linux-py310}
          - {os: ubuntu-24.04, python: '3.13', bundle: linux-py313}
          - {os: ubuntu-24.04-arm, python: '3.13', bundle: linux-arm-py313}
          - {os: windows-2022, python: '3.11', bundle: windows-py311}
          - {os: windows-2022, python: '3.13', bundle: windows-py313}
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Windows'
        uses: ./.github/actions/msvc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - name: Verify the wheel and sdist against the checkout and install them
        if: runner.os == 'Linux'
        run: |
          python scripts/check_current_installation.py --dist dist --check-sdist --out .install
          echo "VENV_PYTHON=.install/venv/bin/python" >> "$GITHUB_ENV"
      - name: Install the wheel into a clean environment
        if: runner.os == 'Windows'
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); from check_current_installation import select_wheel, verify_sources; print(verify_sources(select_wheel(__import__('pathlib').Path('dist'))))"
          python -m venv .install/venv
          .install/venv/Scripts/python.exe -m pip install --no-deps dist/*.whl
          echo "VENV_PYTHON=.install/venv/Scripts/python.exe" >> "$GITHUB_ENV"
      - name: CNF solvers
        run: '"$VENV_PYTHON" -I scripts/check_cnf_installation.py'
      - name: Exact queries and exam repair
        run: |
          "$VENV_PYTHON" -I scripts/check_exact_installation.py --out .install/exact.json --evidence-dir .install/exact-selftest
          "$VENV_PYTHON" -I scripts/check_exam_repair_installation.py --out .install/exam-repair.json
      - name: SVM runtime, preprocessing and corpus replay
        if: matrix.python == '3.13'
        run: |
          python -m pip install 'scikit-learn==1.8.0' 'pandas==2.2.3'
          python scripts/check_svm_installation.py --wheel dist/*.whl --out .install/svm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.python == '3.13'
        with:
          name: svm-corpus
          path: .svm-corpus
      - name: Replay the SVM corpus through the installed wheel
        if: matrix.python == '3.13'
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          installed = pathlib.Path('.install/svm').resolve()
          python = installed / 'venv' / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          runtime = next(p for p in (installed / 'native').iterdir() if p.suffix in ('.so', '.dll'))
          preprocessor = next(p for p in (installed / 'preprocessing-native').iterdir()
                              if p.suffix in ('.so', '.pyd'))
          subprocess.run([str(python), '-I', 'benchmarks/svm_stream/check_corpus.py',
                          '--corpus', str(pathlib.Path('.svm-corpus').resolve()),
                          '--manifest', 'benchmarks/svm_stream/corpus_manifest.json',
                          '--auditor', 'benchmarks/svm_stream/audit.py',
                          '--library', str(runtime), '--preprocessor', str(preprocessor),
                          '--out', str(installed / 'corpus-replay')], check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exact-selftest-${{ matrix.bundle }}
          path: .install/exact-selftest/
          include-hidden-files: true
          if-no-files-found: error

  compare-platforms:
    name: exact results agree across platforms
    needs: installed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: exact-selftest-*
          path: bundles
      - run: python -m spectra exact compare bundles/* > comparison.json
      - run: |
          python - <<'PY'
          import json
          result = json.load(open('comparison.json'))
          assert result['verified'] is True and result['bundles'] == 5, result
          assert result['native_execution'] is False and result['native_module_loaded'] is False
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exact-selftest-comparison
          path: comparison.json
          if-no-files-found: error
