name: WAP development data acquisition
on:
  push:
    branches: [research/quotient-application-v2-20261008]
    paths:
      - .github/workflows/wap-development-data.yml
      - experiments/quotient_application/WAP_UPSTREAM_INVENTORY.json
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify frozen inventory and acquire development files only
        run: |
          mkdir -p delivery/graphs
          git rev-parse HEAD > delivery/spectra_commit.txt
          git rev-parse HEAD^{tree} > delivery/spectra_tree.txt
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path
          import urllib.request

          inventory_path = Path('experiments/quotient_application/WAP_UPSTREAM_INVENTORY.json')
          inventory = json.loads(inventory_path.read_text(encoding='utf-8'))
          if inventory['schema'] != 'spectra.wap.upstream_inventory.v2':
              raise ValueError('unexpected inventory schema')
          if inventory['repository'] != 'marijnheule/clicolcom':
              raise ValueError('unexpected upstream repository')
          commit = inventory['commit']
          selected = {
              name: record for name, record in inventory['graphs'].items()
              if record['role'] in ('development', 'development_consumed')
          }
          if set(selected) != {'wap01a.col', 'wap05a.col', 'wap06a.col'}:
              raise ValueError('development inventory differs from frozen split')
          if any(record['role'] == 'prospective_holdout' for record in selected.values()):
              raise ValueError('holdout entered development acquisition')

          root = Path('delivery')
          graph_dir = root / 'graphs'
          receipt = {
              'schema': 'spectra.wap.development_data.v2',
              'upstream_repository': inventory['repository'],
              'upstream_commit': commit,
              'inventory_sha256': hashlib.sha256(inventory_path.read_bytes()).hexdigest(),
              'role': 'development bytes only; no solver, holdout, or performance claim',
              'graphs': {},
          }

          def parse_dimacs(data: bytes) -> dict:
              text = data.decode('ascii')
              declared = None
              edges = []
              comments = 0
              for number, raw in enumerate(text.splitlines(), 1):
                  fields = raw.strip().split()
                  if not fields:
                      continue
                  if fields[0] == 'c':
                      comments += 1
                  elif fields[0] == 'p':
                      if declared is not None or len(fields) != 4 or fields[1] not in ('edge', 'edges'):
                          raise ValueError(f'invalid problem line at {number}')
                      declared = int(fields[2]), int(fields[3])
                  elif fields[0] == 'e':
                      if len(fields) != 3:
                          raise ValueError(f'invalid edge line at {number}')
                      edges.append((int(fields[1]), int(fields[2])))
                  else:
                      raise ValueError(f'unsupported record at {number}')
              if declared is None:
                  raise ValueError('missing problem line')
              n, m = declared
              if len(edges) != m:
                  raise ValueError(f'declared/parsed mismatch {m} != {len(edges)}')
              canonical = set()
              loops = 0
              for a, b in edges:
                  if not 1 <= a <= n or not 1 <= b <= n:
                      raise ValueError('endpoint outside declared range')
                  loops += a == b
                  canonical.add((a, b) if a <= b else (b, a))
              return {
                  'vertices': n,
                  'declared_edges': m,
                  'parsed_edges': len(edges),
                  'unique_undirected_edges': len(canonical),
                  'duplicate_undirected_edges': len(edges) - len(canonical),
                  'self_loops': loops,
                  'comment_lines': comments,
              }

          opener = urllib.request.build_opener()
          opener.addheaders = [('User-Agent', 'SPECTRA-pinned-development-acquisition/2')]
          for name, expected in sorted(selected.items()):
              url = f'https://raw.githubusercontent.com/{inventory["repository"]}/{commit}/graphs/{name}'
              with opener.open(url, timeout=45) as response:
                  data = response.read()
              if len(data) != expected['bytes']:
                  raise ValueError(f'byte length differs for {name}')
              blob_sha = hashlib.sha1(f'blob {len(data)}\0'.encode('ascii') + data).hexdigest()
              if blob_sha != expected['git_blob_sha1']:
                  raise ValueError(f'Git blob identity differs for {name}')
              (graph_dir / name).write_bytes(data)
              receipt['graphs'][name] = {
                  'url': url,
                  'role': expected['role'],
                  'bytes': len(data),
                  'git_blob_sha1': blob_sha,
                  'sha256': hashlib.sha256(data).hexdigest(),
                  **parse_dimacs(data),
              }

          (root / 'development_manifest.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          (root / 'ROLE.txt').write_text(
              'DEVELOPMENT DATA ACQUISITION ONLY. Prospective holdout bytes were not fetched. No solver or performance claim.\n',
              encoding='utf-8')
          hashes = {
              str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in sorted(root.rglob('*'))
              if path.is_file() and path.name != 'SHA256.json'
          }
          (root / 'SHA256.json').write_text(
              json.dumps(hashes, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({'graphs': sorted(receipt['graphs']),
                            'total_bytes': sum(x['bytes'] for x in receipt['graphs'].values())},
                           sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wap-development-data-${{ github.run_id }}
          path: delivery
          include-hidden-files: true
          retention-days: 90
