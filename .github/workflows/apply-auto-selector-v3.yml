name: apply-auto-selector-v3

on:
  push:
    branches: [performance/automatic-engine-selection]
    paths: [.github/workflows/apply-auto-selector-v3.yml]

permissions:
  contents: write

concurrency:
  group: apply-auto-selector-v3
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Apply structural policy v3
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old = '''        if(mode==4) {
              // Structural auto policy v2.  set9 development evidence showed that
              // large, heavily pinned repair banks can lose to raw traversal even
              // when tile64 is available.  The policy therefore uses only immutable
              // request geometry (never answers or measured timings): raw below one
              // tile, on a base contradiction, or at eight pins per row and above.
              // The threshold is frozen before the set10/set12 holdout transfer.
              if(bank_size<64) {
                  condensed=false;routed=false;auto_reason="bank_below_tile64";
              } else if(bad!=NIL) {
                  condensed=false;routed=false;auto_reason="base_infeasible";
              } else if(W(bank_pins)>=8*W(bank_size)) {
                  condensed=false;routed=false;auto_reason="high_pin_density";
              } else {
                  condensed=true;routed=nc<=n;
                  auto_reason=routed?"route_component_compression":"scc_tile64";
              }
          }
          '''
          new = '''        if(mode==4) {
              // Structural auto policy v3.  The optimized tile64 SCC engine wins
              // long low-pin banks even when SCC contraction is modest, while
              // short weakly compressed banks still favor raw traversal. Strong
              // contraction pays before a full 64-row tile. Selection uses only
              // immutable graph/request geometry, never answers or timings.
              if(bad!=NIL) {
                  condensed=false;routed=false;auto_reason="base_infeasible";
              } else if(W(bank_pins)>=8*W(bank_size)) {
                  condensed=false;routed=false;auto_reason="high_pin_density";
              } else if(bank_size>=64) {
                  condensed=true;routed=false;auto_reason="scc_tile64";
              } else if(bank_size>=8 && W(2)*W(nc)<=W(n)) {
                  condensed=true;routed=false;auto_reason="scc_strong_compression";
              } else {
                  condensed=false;routed=false;auto_reason="short_weak_compression";
              }
          }
          '''
          for name in (
              'spectra/_native/exact_binary.cpp',
              'experiments/compiled_query/exact_native.cpp',
          ):
              path = Path(name)
              text = path.read_text()
              if old not in text:
                  raise RuntimeError(f'expected selector block missing from {name}')
              text = text.replace(old, new)
              text = text.replace(
                  'which==4?"structural-v2":"explicit"',
                  'which==4?"structural-v3":"explicit"',
              )
              path.write_text(text)

          for name in ('spectra/exact.py', 'experiments/compiled_query/exact.py'):
              path = Path(name)
              text = path.read_text()
              text = text.replace(
                  'The default ``auto`` mode uses structural policy v2. It selects raw traversal below\n'
                  '        64 requests, on a base-infeasible graph, or when the immutable bank carries\n'
                  '        at least eight pins per request on average. Otherwise it uses routed proofs\n'
                  '        when SCCs at least halve the literal graph, and plain SCC batching when they\n'
                  '        do not.',
                  'The default ``auto`` mode uses structural policy v3. It keeps base-infeasible,\n'
                  '        high-pin, and short weakly compressed banks on raw traversal. It selects SCC\n'
                  '        for every feasible low-pin bank of at least 64 requests, and from eight\n'
                  '        requests when SCCs compress the literal graph by at least fourfold.',
              )
              path.write_text(text)

          test = Path('tests/public/test_exact_api.py')
          text = test.read_text()
          text = text.replace("'structural-v2'", "'structural-v3'")
          text = text.replace("'bank_below_tile64'", "'short_weak_compression'")
          test.write_text(text)

          readme = Path('experiments/compiled_query/README.md')
          text = readme.read_text()
          text = text.replace(
              'It chooses raw for fewer than 64 requests or an\n'
              'impossible fixed graph, then route or SCC according to graph compression.',
              'It keeps base-infeasible, high-pin, and short weakly compressed banks on raw; '
              'it chooses SCC for feasible low-pin banks at 64 requests, or from eight requests '
              'when literal contraction is at least fourfold.',
          )
          readme.write_text(text)
          PY
          cmp spectra/_native/exact_binary.cpp experiments/compiled_query/exact_native.cpp

      - name: Run focused selector and exact-bank contracts
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_auto_selector_v3.py \
            tests/public/test_exact_api.py \
            tests/public/test_exact_bank_tile64.py \
            tests/public/test_exact_packet_packing.py

      - name: Commit the selector as one implementation step
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-auto-selector-v3.yml
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          git add \
            spectra/_native/exact_binary.cpp \
            experiments/compiled_query/exact_native.cpp \
            spectra/exact.py \
            experiments/compiled_query/exact.py \
            experiments/compiled_query/README.md \
            tests/public/test_exact_api.py \
            tests/public/test_auto_selector_v3.py
          git commit -m 'Choose the right exact engine automatically' \
            -m 'Use SCC for long low-pin banks and strongly compressed short banks, while keeping raw for base contradictions, high-pin requests, and weakly compressed short calls. Explicit engines and all proof formats remain unchanged.'
          git push origin HEAD:performance/automatic-engine-selection
