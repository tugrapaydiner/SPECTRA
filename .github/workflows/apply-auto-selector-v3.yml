name: apply-auto-selector-v3

on:
  push:
    branches: [performance/automatic-engine-selection]
    paths: [.github/workflows/apply-auto-selector-v3.yml]

permissions:
  contents: write

concurrency:
  group: apply-auto-selector-v3
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Apply structural policy v3
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          replacement = '''        if(mode==4) {
              // Structural auto policy v3. The optimized tile64 SCC engine wins
              // long low-pin banks even when contraction is modest. Strong SCC
              // contraction also pays before one complete 64-row tile. Selection
              // uses only immutable graph/request geometry, never answers or time.
              if(bad!=NIL) {
                  condensed=false;routed=false;auto_reason="base_infeasible";
              } else if(W(bank_pins)>=8*W(bank_size)) {
                  condensed=false;routed=false;auto_reason="high_pin_density";
              } else if(bank_size>=64) {
                  condensed=true;routed=false;auto_reason="scc_tile64";
              } else if(bank_size>=8 && W(2)*W(nc)<=W(n)) {
                  condensed=true;routed=false;auto_reason="scc_strong_compression";
              } else {
                  condensed=false;routed=false;auto_reason="short_weak_compression";
              }
          }
'''
          selector = re.compile(
              r'        if\(mode==4\) \{\n'
              r'.*?'
              r'        \}\n'
              r'        if\(condensed && bad==NIL\) \{',
              re.DOTALL,
          )
          for name in (
              'spectra/_native/exact_binary.cpp',
              'experiments/compiled_query/exact_native.cpp',
          ):
              path = Path(name)
              text = path.read_text()
              updated, count = selector.subn(
                  replacement + '        if(condensed && bad==NIL) {', text, count=1
              )
              if count != 1:
                  raise RuntimeError(f'expected one selector block in {name}, got {count}')
              updated = updated.replace(
                  'which==4?"structural-v2":"explicit"',
                  'which==4?"structural-v3":"explicit"',
              )
              if updated.count('structural-v3') != 1:
                  raise RuntimeError(f'policy identity differs in {name}')
              path.write_text(updated)

          old_doc = '''The default ``auto`` mode uses structural policy v2. It selects raw traversal below
        64 requests, on a base-infeasible graph, or when the immutable bank carries
        at least eight pins per request on average. Otherwise it uses routed proofs
        when SCCs at least halve the literal graph, and plain SCC batching when they
        do not.'''
          new_doc = '''The default ``auto`` mode uses structural policy v3. It keeps base-infeasible,
        high-pin, and short weakly compressed banks on raw traversal. It selects SCC
        for every feasible low-pin bank of at least 64 requests, and from eight
        requests when SCCs compress the literal graph by at least fourfold.'''
          for name in ('spectra/exact.py', 'experiments/compiled_query/exact.py'):
              path = Path(name)
              text = path.read_text()
              if old_doc not in text:
                  raise RuntimeError(f'auto-policy documentation missing from {name}')
              path.write_text(text.replace(old_doc, new_doc))

          test = Path('tests/public/test_exact_api.py')
          text = test.read_text()
          text = text.replace("'structural-v2'", "'structural-v3'")
          text = text.replace("'bank_below_tile64'", "'short_weak_compression'")
          test.write_text(text)

          readme = Path('experiments/compiled_query/README.md')
          text = readme.read_text()
          old_readme = '''It chooses raw for fewer than 64 requests or an
impossible fixed graph, then route or SCC according to graph compression.'''
          new_readme = '''It keeps base-infeasible, high-pin, and short weakly compressed banks on raw;
it chooses SCC for feasible low-pin banks at 64 requests, or from eight requests
when literal contraction is at least fourfold.'''
          if old_readme not in text:
              raise RuntimeError('README selector description differs')
          readme.write_text(text.replace(old_readme, new_readme))
          PY
          cmp spectra/_native/exact_binary.cpp experiments/compiled_query/exact_native.cpp

      - name: Run focused selector and exact-bank contracts
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_auto_selector_v3.py \
            tests/public/test_exact_api.py \
            tests/public/test_exact_bank_tile64.py \
            tests/public/test_exact_packet_packing.py

      - name: Commit the selector as one implementation step
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-auto-selector-v3.yml
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          git add \
            spectra/_native/exact_binary.cpp \
            experiments/compiled_query/exact_native.cpp \
            spectra/exact.py \
            experiments/compiled_query/exact.py \
            experiments/compiled_query/README.md \
            tests/public/test_exact_api.py \
            tests/public/test_auto_selector_v3.py
          git commit -m 'Choose the right exact engine automatically' \
            -m 'Use SCC for long low-pin banks and strongly compressed short banks, while keeping raw for base contradictions, high-pin requests, and weakly compressed short calls. Explicit engines and proof formats remain unchanged.'
          git push origin HEAD:performance/automatic-engine-selection
