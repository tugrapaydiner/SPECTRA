name: finish-edgeless-fast-path

on:
  push:
    branches:
      - part3/release-replication-readiness
    paths:
      - .github/workflows/finish-edgeless-fast-path.yml

permissions:
  contents: write

concurrency:
  group: finish-edgeless-fast-path
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'
      - name: Apply the edgeless kernel with structural markers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('.github/workflows/add-edgeless-fast-path.yml').read_text(
              encoding='utf-8'
          )
          step = (
              "      - name: Add the independent edgeless solve and replay path\n"
              "        shell: bash\n"
              "        run: |\n"
          )
          start = source.index(step) + len(step)
          end = source.index(
              "      - name: Run focused and competitor contracts\n", start
          )
          shell = dedent(source[start:end])

          opening = "python - <<'PY'\n"
          code_start = shell.index(opening) + len(opening)
          code_end = shell.index("\nPY\n\ncat > tests/public/test_exact_edgeless.py", code_start)
          code = shell[code_start:code_end]

          old_admission = '''              W per_row=W(n)+25;
              if(count && per_row>(UINT64_MAX-16)/W(count))
                  throw Resource("edgeless SCQ2 output bound overflows");
              W output_bound=16+per_row*W(count);
              if(output_bound>std::numeric_limits<size_t>::max())
                  throw Resource("edgeless SCQ2 output exceeds platform size");
              W scratch=64*W(n+1)+16*W(pins)+8192;
              if(W(packet_size)>total_cap || output_bound>(total_cap-W(packet_size))/2
                      || scratch>total_cap-W(packet_size)-2*output_bound)
                  throw Resource("edgeless bank solve/verify/output admission exceeds cap");

              BankResult result;
              result.output.reserve(static_cast<size_t>(output_bound));
'''
          new_admission = '''              W per_row=25+17*W(n);
              if(count && per_row>(UINT64_MAX-16)/W(count))
                  throw Resource("edgeless SCQ2 output bound overflows");
              W output_bound=16+per_row*W(count);
              W initial=16+(W(n)+25)*W(count);
              if(output_bound>std::numeric_limits<size_t>::max()
                      || initial>std::numeric_limits<size_t>::max())
                  throw Resource("edgeless SCQ2 output exceeds platform size");
              // Keep the same conservative admission envelope as the general
              // exact service. The fast path may allocate less, but callers must
              // not gain a larger accepted problem merely by selecting auto.
              W retained=64*W(n+1)+32*W(pins+count+1);
              W scratch=2048*W(n+1)+64*W(pins)+64*W(count)+8192;
              if(retained>total_cap || W(packet_size)>total_cap-retained
                      || output_bound>(total_cap-retained-W(packet_size))/2
                      || scratch>total_cap-retained-W(packet_size)-2*output_bound)
                  throw Resource("edgeless bank solve/verify/output admission exceeds cap");

              BankResult result;
              result.output.reserve(static_cast<size_t>(initial));
'''
          if code.count(old_admission) != 1:
              raise AssertionError('edgeless admission block differs')
          code = code.replace(old_admission, new_admission, 1)

          loop_start = code.index('patched=[]\n')
          loop_end = code.index('if patched[0]!=patched[1]:\n', loop_start)
          replacement = '''def restore_cpp_indent(block):
              lines = block.splitlines(keepends=True)
              if not lines:
                  return block
              return lines[0] + ''.join(
                  ('    ' + line) if line.strip() else line
                  for line in lines[1:]
              )

          fast_construction = restore_cpp_indent(fast_construction)
          fast_metadata = restore_cpp_indent(fast_metadata)

          patched=[]
          for text in originals:
              if text.count(bank_marker)!=1:
                  raise AssertionError('BankResult insertion point differs')
              text=text.replace(bank_marker,helper,1)

              solve_at=text.index('PyObject* solve_session_packet')
              construction_start=text.index(
                  '        std::unique_ptr<Index> solver;', solve_at
              )
              construction_end=text.index(
                  '        PyObject* output=', construction_start
              )
              text=(text[:construction_start] + fast_construction
                    + text[construction_end:])

              metadata_start=text.index(
                  '        PyObject* metadata=Py_BuildValue(', solve_at
              )
              metadata_end=text.index(
                  '        if(!metadata)', metadata_start
              )
              text=text[:metadata_start] + fast_metadata + text[metadata_end:]

              old_kernel=(
                  'PyObject* kernel=PyUnicode_FromString('
                  'result.tiled?"tile64":"serial");'
              )
              new_kernel=(
                  'PyObject* kernel=PyUnicode_FromString('
                  'edgeless_fast?"edgeless":'
                  '(result.tiled?"tile64":"serial"));'
              )
              old_reason=(
                  'PyObject* reason=PyUnicode_FromString(solver->auto_reason);'
              )
              new_reason=(
                  'PyObject* reason=PyUnicode_FromString('
                  'edgeless_fast?fast_reason:solver->auto_reason);'
              )
              if text.count(old_kernel)!=1:
                  raise AssertionError('bank-kernel metadata point differs')
              if text.count(old_reason)!=1:
                  raise AssertionError('auto-reason metadata point differs')
              text=text.replace(old_kernel,new_kernel,1)
              text=text.replace(old_reason,new_reason,1)
              patched.append(text)
          '''
          code = code[:loop_start] + replacement + code[loop_end:]
          shell = shell[:code_start] + code + shell[code_end:]
          Path('/tmp/apply-edgeless.sh').write_text(shell, encoding='utf-8')
          PY
          bash /tmp/apply-edgeless.sh
      - name: Run the focused contracts
        shell: bash
        run: |
          set -euo pipefail
          export SPECTRA_EXACT_LIBRARY="$(
            python -c "from spectra.exact import build_exact_runtime; print(build_exact_runtime('edgeless-exact'))"
          )"
          python -m pytest \
            tests/public/test_exact_api.py \
            tests/public/test_exact_edgeless.py \
            --confcutdir=tests/public -q
          python -m pytest \
            experiments/compiled_query/test_exact.py \
            -q -k 'impossible_graph_bank_keeps_current_request_proofs or every_proof_kind_and_single_byte_mutations or auto_does_not_hide_malformed_packets_or_resource_limits'
          python -m pytest \
            experiments/compiled_query/test_native_twosat_challenge.py \
            experiments/compiled_query/test_twosat_development_benchmark.py -q
          python - <<'PY'
          from pathlib import Path
          assert Path('spectra/_native/exact_binary.cpp').read_bytes() == Path(
              'experiments/compiled_query/exact_native.cpp'
          ).read_bytes()
          PY
          git diff --check
      - name: Save the kernel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tugrap"
          git config user.email "106766396+tugrapaydiner@users.noreply.github.com"
          git add \
            spectra/_native/exact_binary.cpp \
            experiments/compiled_query/exact_native.cpp \
            tests/public/test_exact_edgeless.py \
            docs/EXACT_API.md
          git diff --cached --check
          git commit -m "Handle edgeless query banks directly"
          git push origin HEAD:refs/heads/part3/release-replication-readiness
