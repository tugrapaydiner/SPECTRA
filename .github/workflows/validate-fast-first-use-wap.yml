name: validate-fast-first-use-wap

on:
  push:
    branches: [audit/tile64-external-competition-20261017]
    paths: [.github/workflows/validate-fast-first-use-wap.yml]

permissions:
  contents: read

env:
  CANDIDATE: 16babd80de942537eb468aaef9a90ddbce02d35c
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned contracts
        run: python -m pip install -q pytest==9.0.2 'python-sat==1.9.dev15' build
      - name: Bind the candidate and run the flagship contracts
        run: |
          set -euo pipefail
          mkdir -p wap-validation
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git rev-parse HEAD > wap-validation/source-commit.txt
          git rev-parse HEAD^{tree} > wap-validation/source-tree.txt
          python -VV > wap-validation/python.txt
          python -m pip freeze > wap-validation/environment.txt
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_wap_support.py \
            tests/public/test_wap_support_audit.py \
            tests/public/test_wap_support_freeze.py \
            tests/public/test_quotient_native_contract.py \
            tests/public/test_arcfree_support.py \
            2>&1 | tee wap-validation/contracts.log
      - name: Native undefined-behaviour sanitizer
        run: |
          set -euo pipefail
          python -c "from spectra.cnf.quotient_query import build_quotient_runtime; print(build_quotient_runtime('/tmp/wap-ubsan',sanitize=True))" > /tmp/wap-ubsan-path.txt
          SPECTRA_QUOTIENT_LIBRARY="$(cat /tmp/wap-ubsan-path.txt)" \
            python -m pytest -q --confcutdir=tests/public \
              tests/public/test_quotient_native_contract.py \
              tests/public/test_arcfree_support.py \
              2>&1 | tee wap-validation/ubsan.log
      - name: Documentation and installed package checks
        run: |
          set -euo pipefail
          python scripts/check_release_readiness.py | tee wap-validation/release.log
          python -m compileall -q spectra experiments/wap_support
          python -m build --sdist --wheel --outdir /tmp/spectra-dist
          python -m pip install --force-reinstall /tmp/spectra-dist/*.whl
          cd /tmp
          python -m spectra doctor | tee "$GITHUB_WORKSPACE/wap-validation/doctor.log"
      - name: Hash retained receipts
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('wap-validation')
          manifest = {}
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'SHA256.json':
                  manifest[str(path.relative_to(root))] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / 'SHA256.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fast-first-use-wap-validation-${{ github.run_id }}
          path: wap-validation/
          retention-days: 90
          if-no-files-found: error
