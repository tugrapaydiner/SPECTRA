name: auto-selector-v7-itc-guard

on:
  push:
    branches: [performance/automatic-engine-selection-v7]
    paths: [.github/workflows/auto-selector-v7-itc-guard.yml]

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: davidvanbulck/ITC-2007-CETT
          ref: ed2d4c0cf5302b77a8b321cd0380de0bb579d538
          path: upstream/ITC-2007-CETT
          persist-credentials: false
      - name: Install test and build tools
        run: python -m pip install 'build==1.3.0' 'pytest==9.0.2'
      - name: Run affected ITC contracts
        run: |
          python -m pytest -q --confcutdir=experiments/compiled_query \
            experiments/compiled_query/test_itc_exam_transfer.py \
            experiments/compiled_query/test_itc_exam_suite.py
      - name: Freeze, execute, and audit the three-case suite
        shell: bash
        run: |
          set -euo pipefail
          python -m experiments.compiled_query.itc_exam_suite freeze \
            --root itc-v7-evidence \
            --upstream-root upstream/ITC-2007-CETT \
            --queries 1024 \
            --holdout-max-auto-raw-ratio 1.05 | tee freeze.log
          python -m experiments.compiled_query.itc_exam_suite run \
            --root itc-v7-evidence | tee run.log
          python -S -m experiments.compiled_query.itc_exam_suite audit \
            --root itc-v7-evidence | tee audit.log
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('itc-v7-evidence/suite-audit.json').read_text())
          assert result['functional_complete']
          assert result['selector_policy'] == 'structural-v7'
          assert result['holdout_gate_pass'], result['holdout_failures']
          for case in result['cases']:
              assert case['auto_selected_mode'] == 'raw', case
              assert case['auto_vs_raw_paired_median_ratio'] <= 1.05, case
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Retain source and environment receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p itc-v7-receipts
          git rev-parse HEAD > itc-v7-receipts/source-commit.txt
          git rev-parse HEAD^{tree} > itc-v7-receipts/source-tree.txt
          python -VV > itc-v7-receipts/python.txt
          uname -a > itc-v7-receipts/platform.txt
          lscpu > itc-v7-receipts/cpu.txt
          cp freeze.log run.log audit.log itc-v7-receipts/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auto-selector-v7-itc-${{ github.run_id }}
          path: |
            itc-v7-evidence/
            itc-v7-receipts/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
