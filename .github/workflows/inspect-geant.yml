name: Inspect GEANT traffic files
on:
  push:
    branches: [real-traffic]
    paths:
      - experiments/real_traffic/inspect_sndlib.py
      - .github/workflows/inspect-geant.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve the official GEANT links
        run: |
          mkdir -p delivery
          python -m experiments.real_traffic.inspect_sndlib --network geant --out delivery/geant | tee delivery/geant.txt
          git rev-parse HEAD > delivery/commit.txt
          git rev-parse HEAD^{tree} > delivery/tree.txt
          echo 'Source inspection only; no traffic matrix, solver, or confirmation input was opened.' > delivery/ROLE.txt
      - name: Hash the receipts
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('delivery')
          with (root/'SHA256SUMS').open('w') as output:
              for path in sorted(root.rglob('*')):
                  if path.is_file() and path.name!='SHA256SUMS':
                      output.write(hashlib.sha256(path.read_bytes()).hexdigest()+'  '+str(path.relative_to(root))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: geant-source-links-${{ github.run_id }}
          path: delivery
          retention-days: 90
          if-no-files-found: error
