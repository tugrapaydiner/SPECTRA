name: Kernel native control acquisition
on:
  push:
    branches: [research/sparse-incidence-20261007]
    paths: [.github/workflows/kernel-native-control.yml]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original hash-bound CaDiCaL source
        run: |
          mkdir -p delivery
          curl --fail --location --retry 2 https://codeload.github.com/arminbiere/cadical/tar.gz/c60730422e758ef1cebe7aeddf2dda31c996bf04 -o delivery/cadical-c60730422e758ef1cebe7aeddf2dda31c996bf04.tar.gz
          tar -xzf delivery/cadical-c60730422e758ef1cebe7aeddf2dda31c996bf04.tar.gz -C delivery
          cat delivery/cadical-c60730422e758ef1cebe7aeddf2dda31c996bf04/VERSION
          git rev-parse HEAD > delivery/commit.txt
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('delivery')
          (p/'SHA256.json').write_text(json.dumps({str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(p.rglob('*')) if f.is_file()},sort_keys=True,indent=2)+'\n')
          PY
          echo 'Original upstream source acquisition only; not a candidate test, performance result, new confirmation, or promotion.' > delivery/ROLE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-native-control-${{ github.run_id }}
          path: delivery
          include-hidden-files: true
          retention-days: 90
