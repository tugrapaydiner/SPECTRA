name: cross-domain-panel
on:
  push:
    branches: [research/cross-domain-panel-20260926]
    paths: ['experiments/cross_domain_20260926/**', '.github/workflows/cross-domain-panel.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  frozen-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: spectra-cross-domain-inputs-2ed5eabfeb8e0f88da9c50fa84ede8de0b05a9da
          run-id: 36279357914
          github-token: ${{ github.token }}
          path: .panel-inputs
      - name: Install fixed CPU tools
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 pytest==9.0.2
      - name: Run full sealed fitting, independent tests and matched timings
        run: |
          mkdir -p .panel-receipts
          git rev-parse HEAD > .panel-receipts/commit.txt
          git rev-parse HEAD^{tree} > .panel-receipts/tree.txt
          python -m pip freeze > .panel-receipts/environment.txt
          g++ --version > .panel-receipts/compiler.txt
          set -o pipefail
          python experiments/cross_domain_20260926/run_panel.py --acquisition .panel-inputs --out .panel | tee .panel-receipts/run.log
          SPECTRA_PANEL_BUILD="$PWD/.panel/build" python -m pytest experiments/cross_domain_20260926/test_panel.py experiments/cross_domain_20260926/test_audit_panel.py --confcutdir=experiments/cross_domain_20260926 --junitxml=.panel-receipts/tests.xml
          # A completed audit is not a passing scientific speed gate.
          python -c "import json; assert json.load(open('.panel/AUDIT_FINAL.json'))['status']=='PASS'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectra-cross-domain-${{ github.sha }}
          path: |
            .panel-receipts/
            .panel/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
