name: m04-repro-training

on:
  push:
    branches:
      - research/m04-repro-checkpoints
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducible-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .m04
          timeout 360s python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4" |& tee .m04/install_torch.txt
          timeout 180s python -m pip install -r requirements.txt |& tee .m04/install_requirements.txt
          python - <<'PY' | tee .m04/environment.txt
          import platform, torch, numpy, pytest
          print("platform=", platform.platform())
          print("torch=", torch.__version__)
          print("numpy=", numpy.__version__)
          print("pytest=", pytest.__version__)
          print("cuda_available=", torch.cuda.is_available())
          PY

      - name: Focused M04 reproducibility contracts
        shell: bash
        run: |
          set -o pipefail
          timeout 360s python -m pytest \
            tests/test_m04_repro_checkpoint.py \
            tests/test_stability.py \
            -m "not slow" -ra |& tee .m04/pytest_focused.txt

      - name: Deterministic CPU interruption-resume audit
        shell: bash
        run: |
          set -euxo pipefail
          timeout 360s python scripts/m04_repro_audit.py \
            --config config/m04_cpu_reference.yaml \
            --train-size 24 --val-size 12 \
            --out .m04/repro_audit.json |& tee .m04/repro_audit.txt

      - name: Teacher CLI checkpoint smoke
        shell: bash
        run: |
          set -euxo pipefail
          timeout 360s python scripts/train_teacher.py \
            --config config/m04_cpu_reference.yaml \
            --train-size 24 --val-size 12 \
            --out .m04/cli_teacher |& tee .m04/train_teacher_cli.txt
          python - <<'PY' | tee .m04/checkpoint_summary.txt
          from train.checkpoint import load_checkpoint_payload
          p = load_checkpoint_payload(".m04/cli_teacher/teacher.pt", require_resume=True)
          print("format=", p["format"])
          print("version=", p["version"])
          print("runtime=", p["runtime"])
          print("global_step=", p["training"]["global_step"])
          print("training_identity=", p["weights"]["training_identity"])
          print("evaluation_identity=", p["weights"]["evaluation_identity"])
          print("sampler_epoch=", p["sampler"]["epoch"])
          print("sampler_position=", p["sampler"]["position"])
          assert p["runtime"]["precision_mode"] == "fp32"
          assert p["runtime"]["device_type"] == "cpu"
          assert p["training"]["global_step"] == 8
          assert p["weights"]["evaluation_identity"] == "ema"
          PY

      - name: Full fast regression
        shell: bash
        run: |
          set -o pipefail
          timeout 480s python -m pytest -m "not slow" -ra |& tee .m04/pytest_fast.txt

      - name: Record diff
        if: always()
        shell: bash
        run: |
          {
            echo "head=$(git rev-parse HEAD)"
            echo "base=01638b10777029fb28bb35229e374f0865c6e5d4"
            git diff --stat 01638b10777029fb28bb35229e374f0865c6e5d4...HEAD
          } | tee .m04/diff_stat.txt

      - name: Upload M04 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m04-repro-training-evidence
          path: .m04/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
