name: Repair lean-main cleanup patch
on:
  push:
    branches: [maintenance/lean-main-20261016]
    paths: ['.github/workflows/repair-lean-main-cleanup-patch.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace the malformed staging patch with the validated bytes
        run: |
          set -euo pipefail
          cat > /tmp/lean-main.patch.gz.b64 <<'EOF'
          
          
          
          
          
          EOF
          tr -d '[:space:]' < /tmp/lean-main.patch.gz.b64 | base64 -d | gzip -dc > .cleanup/lean-main-text.patch
          git apply --check .cleanup/lean-main-text.patch
      - name: Retrigger the full cleanup from a clean checkout
        run: |
          set -euo pipefail
          printf '\n# retriggered after exact patch-byte repair\n' >> .github/workflows/apply-lean-main-cleanup.yml
          git rm .github/workflows/repair-lean-main-cleanup-patch.yml
          git config user.name Tugrap
          git config user.email 106766396+tugrapaydiner@users.noreply.github.com
          git add .cleanup/lean-main-text.patch .github/workflows/apply-lean-main-cleanup.yml
          git commit -m "Repair the lean-main cleanup patch bytes"
          git push origin HEAD:maintenance/lean-main-20261016
