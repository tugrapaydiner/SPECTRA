name: Cleanup source and footprint review
on:
  push:
    branches: [maintenance/lean-main-20261016]
    paths: ['.github/workflows/repair-lean-main-cleanup-patch.yml']
permissions:
  contents: read
concurrency:
  group: cleanup-source-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve exact source for offline review without applying staging payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/spectra-cleanup-review
          git rev-parse HEAD > /tmp/spectra-cleanup-review/review_commit.txt
          git rev-parse refs/remotes/origin/main > /tmp/spectra-cleanup-review/main_commit.txt
          git rev-parse refs/remotes/origin/main^{tree} > /tmp/spectra-cleanup-review/main_tree.txt
          git for-each-ref --format='%(objectname) %(refname)' > /tmp/spectra-cleanup-review/refs.txt
          git bundle create /tmp/spectra-cleanup-review/history.bundle --all
          git bundle verify /tmp/spectra-cleanup-review/history.bundle > /tmp/spectra-cleanup-review/bundle_verification.txt 2>&1
          git ls-tree -r -l refs/remotes/origin/main > /tmp/spectra-cleanup-review/main_inventory.txt
          git diff --name-status refs/remotes/origin/main HEAD > /tmp/spectra-cleanup-review/branch_changes.txt
          git diff --exit-code refs/remotes/origin/main HEAD -- spectra common model train eval data deploy tests results experiments pyproject.toml
          printf '%s\n' 'Read-only source export. No staged patch was applied. No remote ref, main file, solver, evidence, or workflow is rewritten by this job. This is not validation of the proposed cleanup.' > /tmp/spectra-cleanup-review/SCOPE.txt
          cd /tmp/spectra-cleanup-review
          sha256sum *.txt *.bundle > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spectra-cleanup-source-review-${{ github.run_id }}
          path: /tmp/spectra-cleanup-review/
          retention-days: 90
          if-no-files-found: error
