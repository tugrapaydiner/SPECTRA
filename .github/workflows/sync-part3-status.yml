name: sync-part3-status

on:
  push:
    branches: [finish-part3]
    paths:
      - '.github/scripts/sync_part3_status.py'
      - '.github/workflows/sync-part3-status.yml'

permissions:
  contents: write

concurrency:
  group: sync-part3-status
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest==9.0.2'
      - name: Apply the Part 3 identity and status corrections
        run: python .github/scripts/sync_part3_status.py
      - name: Verify the corrected source and docs
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            spectra/exact.py \
            experiments/compiled_query/exact.py \
            tests/public/test_auto_selector_v11.py \
            tests/public/test_exact_edgeless.py \
            experiments/compiled_query/test_exact.py
          python - <<'PY'
          from pathlib import Path
          from spectra.exact import ExactRuntime

          public_doc = ExactRuntime.solve_session_packet.__doc__ or ''
          research = Path('experiments/compiled_query/exact.py').read_text()
          assert 'structural policy v11' in public_doc
          assert 'structural policy v10' not in public_doc
          assert 'frozen structural policy v11' in research
          assert 'frozen structural policy v10' not in research
          assert 'part3/release-replication-readiness' not in Path(
              'docs/PART3_RELEASE_REPLICATION_READINESS.md').read_text()
          assert 'FAIL_ADMISSION' in Path(
              'docs/PART3_RELEASE_REPLICATION_READINESS.md').read_text()
          workflow = Path('.github/workflows/exact-public-api.yml').read_text()
          assert 'tests/public/test_auto_selector_v11.py' in workflow
          assert 'tests/public/test_exact_edgeless.py' in workflow
          assert 'cancel-in-progress: true' in workflow
          for removed in (
              '.github/scripts/sync_part3_status.py',
              '.github/workflows/sync-part3-status.yml',
          ):
              assert not Path(removed).exists()
          PY
          python -m pytest \
            tests/public/test_auto_selector_v11.py \
            tests/public/test_exact_edgeless.py \
            --confcutdir=tests/public -q
          python -m pytest \
            experiments/compiled_query/test_exact.py \
            -k selector_policy_identity_matches_the_public_api -q
          python scripts/check_active_tree.py > active-tree.json
          git diff --check
      - name: Commit the synchronized Part 3 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Keep Part 3's selector identity and status in sync"
          git push origin HEAD:refs/heads/finish-part3
