name: Apply WAP support hardening v2
on:
  push:
    branches: [research/quotient-application-v2-20261008]
    paths: [.github/workflows/apply-wap-support-hardening-v2.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify and decode exact split patch
        shell: bash
        run: |
          set -euo pipefail
          declare -a expected=(
            '78445b8be2dc854acb91ba13ccf0c7e72afbae02334a8b4b825e1c6f36e94212'
            '01625e6e583a4f46197394f460857e9fd9bb81c4350e8c945d9484160a14c8f8'
            '43206133ebe2f3ffd01ba3089ba572bf8d0098fe7e74d9ef2b021cf3de74ff93'
            '04f5434c49e840d91b8858111d5d183cadce4c6e5c75848338cf711befda08ac'
            '7d105997a65412090c36833ff3ba3569280fe4cbd9664a244fd0b0ef0aceb31c'
            '7f9b0e0f38ee5d6a4c3b252cae0e45177d14ae9a617d7a435354dc8b30edaea2'
            'f8c0cab6dcc333a484852607b52a0ab6d047ae0a952eddcaa33c4ff24f64e09e'
          )
          : > /tmp/wap-hardening.b64
          for index in $(seq -w 0 6); do
            file="maintenance/wap-support-hardening-v2/chunk-${index}.b64"
            position=$((10#$index))
            actual="$(sha256sum "$file" | cut -d' ' -f1)"
            test "$actual" = "${expected[$position]}"
            cat "$file" >> /tmp/wap-hardening.b64
          done
          test "$(wc -c < /tmp/wap-hardening.b64)" -eq 21480
          echo '3b149fbe08d9d40c48c601e24ec06202ddc7ea88b9c9c654b22e45f8c4f748be  /tmp/wap-hardening.b64' | sha256sum -c -
          base64 -d /tmp/wap-hardening.b64 | gzip -d > /tmp/wap-hardening.patch
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          git am /tmp/wap-hardening.patch
      - name: Install pinned test controls
        run: python -m pip install -q pytest==9.0.2 'python-sat==1.9.dev15'
      - name: Focused normal contracts
        run: |
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_wap_support.py \
            tests/public/test_wap_support_audit.py \
            tests/public/test_quotient_native_contract.py \
            tests/public/test_arcfree_support.py
      - name: Focused undefined-behaviour sanitizer contracts
        shell: bash
        run: |
          set -euo pipefail
          python -c "from spectra.cnf.quotient_query import build_quotient_runtime; print(build_quotient_runtime('/tmp/ubsan',sanitize=True))" > /tmp/ubsan-path.txt
          SPECTRA_QUOTIENT_LIBRARY="$(cat /tmp/ubsan-path.txt)" \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_wap_support.py \
            tests/public/test_wap_support_audit.py \
            tests/public/test_quotient_native_contract.py \
            tests/public/test_arcfree_support.py
      - name: Complete public regression suite
        run: python -m pytest -q --confcutdir=tests/public tests/public
      - name: Publish exact validated hardening commit
        run: git push origin HEAD:research/quotient-application-v2-20261008
