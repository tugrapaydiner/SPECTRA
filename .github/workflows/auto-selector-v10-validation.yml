name: auto-selector-v10-validation

on:
  push:
    branches: [performance/automatic-engine-selection-v10]
    paths: [.github/workflows/auto-selector-v10-validation.yml]

permissions:
  contents: read

concurrency:
  group: auto-selector-v10-validation
  cancel-in-progress: false

env:
  SOURCE_COMMIT: 79520b8340ed9e16f8eda836b03d5ac1ede409e8
  UPSTREAM_COMMIT: 4932048642da2144f387961b595112277afff82f
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  confirmation:
    name: confirmation-${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86-64
            runner: ubuntu-24.04
          - label: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install focused dependencies
        run: python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'
      - name: Bind source and run selector contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p confirmation-evidence
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git diff --quiet
          git diff --cached --quiet
          git rev-parse HEAD > confirmation-evidence/source-commit.txt
          git rev-parse HEAD^{tree} > confirmation-evidence/source-tree.txt
          python -VV > confirmation-evidence/python.txt
          python -m pip freeze > confirmation-evidence/environment.txt
          uname -a > confirmation-evidence/platform.txt
          lscpu > confirmation-evidence/cpu.txt
          cmp spectra/_native/exact_binary.cpp experiments/compiled_query/exact_native.cpp
          sha256sum \
            spectra/exact.py \
            spectra/_native/exact_binary.cpp \
            experiments/compiled_query/auto_selector_benchmark.py \
            experiments/compiled_query/AUTO_SELECTOR_V10_PROTOCOL_20261018.md \
            tests/public/test_auto_selector_v10.py \
            > confirmation-evidence/source-sha256.txt
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_auto_selector_v10.py \
            tests/public/test_exact_api.py \
            tests/public/test_exact_bank_tile64.py \
            2>&1 | tee confirmation-evidence/contracts.log
      - name: Build receipt-bound runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > confirmation-evidence/library.txt
          from spectra.exact import build_exact_runtime
          print(build_exact_runtime('confirmation-evidence/native'))
          PY
      - name: Run the fresh frozen confirmation panel
        id: benchmark
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m experiments.compiled_query.auto_selector_benchmark \
            --library "$(cat confirmation-evidence/library.txt)" \
            --panel confirmation \
            --out confirmation-evidence/results \
            --repeats 31 \
            2>&1 | tee confirmation-evidence/benchmark.log
      - name: Hash retained evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('confirmation-evidence')
          manifest = {}
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'SHA256.json':
                  manifest[str(path.relative_to(root))] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / 'SHA256.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auto-selector-v10-confirmation-${{ matrix.label }}-${{ github.run_id }}
          path: confirmation-evidence/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - name: Enforce the frozen confirmation gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('confirmation-evidence/results/results.json').read_text())
          summary = result['summary']
          assert summary['policy'] == 'structural-v10', summary
          assert summary['panel'] == 'confirmation', summary
          assert summary['pass'], summary
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

  wap:
    name: wap-${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86-64
            runner: ubuntu-24.04
          - label: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install WAP reconstruction dependency
        run: python -m pip install 'python-sat==1.9.dev15'
      - name: Acquire and verify WAP inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wap-evidence/graphs
          for name in wap05a.col wap06a.col; do
            curl --fail --location --retry 3 --retry-all-errors \
              "https://raw.githubusercontent.com/marijnheule/clicolcom/${UPSTREAM_COMMIT}/graphs/${name}" \
              -o "wap-evidence/graphs/${name}"
          done
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          inventory = json.loads(Path('experiments/quotient_application/WAP_UPSTREAM_INVENTORY.json').read_text())
          for name in ('wap05a.col', 'wap06a.col'):
              data = Path('wap-evidence/graphs', name).read_bytes()
              record = inventory['graphs'][name]
              blob = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              assert len(data) == record['bytes'] and blob == record['git_blob_sha1']
          PY
          python -m experiments.compiled_query.study export-wap \
            --graphs wap-evidence/graphs --output wap-evidence/cases
      - name: Build and run WAP selector guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > wap-evidence/library.txt
          from spectra.exact import build_exact_runtime
          print(build_exact_runtime('wap-evidence/native'))
          PY
          python -m experiments.compiled_query.auto_selector_wap_guard \
            --library "$(cat wap-evidence/library.txt)" \
            --cases wap-evidence/cases \
            --out wap-evidence/results \
            --repeats 31 \
            2>&1 | tee wap-evidence/guard.log
      - name: Retain identities and hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > wap-evidence/source-commit.txt
          git rev-parse HEAD^{tree} > wap-evidence/source-tree.txt
          python -VV > wap-evidence/python.txt
          uname -a > wap-evidence/platform.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('wap-evidence')
          manifest = {}
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'SHA256.json':
                  manifest[str(path.relative_to(root))] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / 'SHA256.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auto-selector-v10-wap-${{ matrix.label }}-${{ github.run_id }}
          path: wap-evidence/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

  overhead:
    name: overhead-${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86-64
            runner: ubuntu-24.04
          - label: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install WAP reconstruction dependency
        run: python -m pip install 'python-sat==1.9.dev15'
      - name: Acquire inputs and run paired overhead guard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p overhead-evidence/graphs
          for name in wap05a.col wap06a.col; do
            curl --fail --location --retry 3 --retry-all-errors \
              "https://raw.githubusercontent.com/marijnheule/clicolcom/${UPSTREAM_COMMIT}/graphs/${name}" \
              -o "overhead-evidence/graphs/${name}"
          done
          python -m experiments.compiled_query.study export-wap \
            --graphs overhead-evidence/graphs --output overhead-evidence/cases
          python - <<'PY' > overhead-evidence/library.txt
          from spectra.exact import build_exact_runtime
          print(build_exact_runtime('overhead-evidence/native'))
          PY
          python -m experiments.compiled_query.auto_selector_wap_overhead \
            --library "$(cat overhead-evidence/library.txt)" \
            --cases overhead-evidence/cases \
            --out overhead-evidence/results \
            2>&1 | tee overhead-evidence/overhead.log
      - name: Retain identities and hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > overhead-evidence/source-commit.txt
          git rev-parse HEAD^{tree} > overhead-evidence/source-tree.txt
          python -VV > overhead-evidence/python.txt
          uname -a > overhead-evidence/platform.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('overhead-evidence')
          manifest = {}
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'SHA256.json':
                  manifest[str(path.relative_to(root))] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / 'SHA256.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auto-selector-v10-overhead-${{ matrix.label }}-${{ github.run_id }}
          path: overhead-evidence/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

  itc:
    name: itc-real-workload
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: davidvanbulck/ITC-2007-CETT
          ref: ed2d4c0cf5302b77a8b321cd0380de0bb579d538
          path: upstream/ITC-2007-CETT
          persist-credentials: false
      - name: Install focused dependencies
        run: python -m pip install 'build==1.3.0' 'pytest==9.0.2'
      - name: Run ITC contracts
        run: |
          python -m pytest -q --confcutdir=experiments/compiled_query \
            experiments/compiled_query/test_itc_exam_transfer.py \
            experiments/compiled_query/test_itc_exam_suite.py
      - name: Freeze, execute, and audit the three-case suite
        shell: bash
        run: |
          set -euo pipefail
          python -m experiments.compiled_query.itc_exam_suite freeze \
            --root itc-v10-evidence \
            --upstream-root upstream/ITC-2007-CETT \
            --queries 1024 \
            --holdout-max-auto-raw-ratio 1.05 | tee freeze.log
          python -m experiments.compiled_query.itc_exam_suite run \
            --root itc-v10-evidence | tee run.log
          python -S -m experiments.compiled_query.itc_exam_suite audit \
            --root itc-v10-evidence | tee audit.log
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('itc-v10-evidence/suite-audit.json').read_text())
          assert result['functional_complete'], result
          assert result['selector_policy'] == 'structural-v10', result
          assert result['selector_guard_pass'], result['holdout_failures']
          expected = {
              'set9-development': 'scc',
              'set10-holdout': 'scc',
              'set12-holdout': 'raw',
          }
          seen = set()
          for case in result['cases']:
              seen.add(case['name'])
              assert case['auto_selected_mode'] == expected[case['name']], case
          assert seen == set(expected), seen
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Retain evidence and receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p itc-v10-receipts
          git rev-parse HEAD > itc-v10-receipts/source-commit.txt
          git rev-parse HEAD^{tree} > itc-v10-receipts/source-tree.txt
          python -VV > itc-v10-receipts/python.txt
          uname -a > itc-v10-receipts/platform.txt
          lscpu > itc-v10-receipts/cpu.txt
          cp freeze.log run.log audit.log itc-v10-receipts/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auto-selector-v10-itc-${{ github.run_id }}
          path: |
            itc-v10-evidence/
            itc-v10-receipts/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
