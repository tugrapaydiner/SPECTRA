name: tmp-confirm-auto-selector-v6

on:
  push:
    branches: [performance/automatic-engine-selection-confirmation-final]
    paths: [.github/workflows/tmp-confirm-auto-selector-v6.yml]

permissions:
  contents: read

concurrency:
  group: tmp-confirm-auto-selector-v6
  cancel-in-progress: false

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  confirmation:
    name: confirmation-${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86-64
            runner: ubuntu-24.04
          - label: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install focused dependencies
        run: python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'

      - name: Freeze source and environment receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p selector-confirmation
          git diff --quiet
          git diff --cached --quiet
          git rev-parse HEAD > selector-confirmation/source-commit.txt
          git rev-parse HEAD^{tree} > selector-confirmation/source-tree.txt
          python -VV > selector-confirmation/python.txt
          python -m pip freeze > selector-confirmation/environment.txt
          uname -a > selector-confirmation/platform.txt
          lscpu > selector-confirmation/cpu.txt
          sha256sum \
            spectra/_native/exact_binary.cpp \
            experiments/compiled_query/exact_native.cpp \
            spectra/exact.py \
            experiments/compiled_query/exact.py \
            experiments/compiled_query/auto_selector_benchmark.py \
            experiments/compiled_query/AUTO_SELECTOR_V6_PROTOCOL_20261018.md \
            > selector-confirmation/source-sha256.txt
          cmp spectra/_native/exact_binary.cpp experiments/compiled_query/exact_native.cpp
          grep -qi 'Structural auto policy v6' spectra/_native/exact_binary.cpp

      - name: Run focused selector contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_auto_selector_v6.py \
            tests/public/test_exact_api.py \
            tests/public/test_exact_bank_tile64.py \
            tests/public/test_exact_packet_packing.py \
            2>&1 | tee selector-confirmation/contracts.log

      - name: Build the candidate runtime
        shell: bash
        run: |
          python - <<'PY' > selector-confirmation/library.txt
          from spectra.exact import build_exact_runtime
          print(build_exact_runtime('selector-confirmation/native'))
          PY

      - name: Open and execute the frozen confirmation panel
        id: benchmark
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m experiments.compiled_query.auto_selector_benchmark \
            --library "$(cat selector-confirmation/library.txt)" \
            --panel confirmation \
            --out selector-confirmation/results \
            --repeats 31 \
            2>&1 | tee selector-confirmation/benchmark.log
          code=${PIPESTATUS[0]}
          echo "$code" > selector-confirmation/benchmark-exit-code.txt
          exit "$code"

      - name: Hash retained evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          root = Path('selector-confirmation')
          manifest = {}
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'SHA256.json':
                  manifest[str(path.relative_to(root))] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / 'SHA256.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auto-selector-v6-confirmation-${{ matrix.label }}-${{ github.run_id }}
          path: selector-confirmation/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

      - name: Enforce the frozen confirmation gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f selector-confirmation/results/results.json
          python - <<'PY'
          from pathlib import Path
          import json
          result = json.loads(Path('selector-confirmation/results/results.json').read_text())
          summary = result['summary']
          print(json.dumps(summary, indent=2, sort_keys=True))
          assert summary['policy'] == 'structural-v6'
          assert summary['panel'] == 'confirmation'
          assert summary['pass'], summary
          PY
