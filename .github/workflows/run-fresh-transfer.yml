name: run-fresh-transfer

on:
  push:
    branches: [archive/research-history-20261016]
    paths: [.github/workflows/run-fresh-transfer.yml]

permissions:
  contents: write

concurrency:
  group: run-fresh-transfer
  cancel-in-progress: false

env:
  SPECTRA_COMMIT: 9ff8a6130fc76c13171d62345e91532e03a817dc
  CADICAL_COMMIT: c60730422e758ef1cebe7aeddf2dda31c996bf04
  UPSTREAM_COMMIT: 4932048642da2144f387961b595112277afff82f

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SPECTRA_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest==9.0.2'
      - name: Validate the unopened freeze
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p freeze-validation
          test "$(git rev-parse HEAD)" = "$SPECTRA_COMMIT"
          git merge-base --is-ancestor \
            c0d56123bcc97f60d777de0d52d5b85a70808a25 HEAD
          test "$(git hash-object experiments/compiled_query/fresh_transfer.py)" = \
            64cecf816806db431c69b3529b4b2d13cb970d25
          test "$(git hash-object experiments/compiled_query/fresh_transfer_benchmark.py)" = \
            4d5adb1101d3a94d2bdb95bdf7911efe37c595fe
          test "$(git hash-object experiments/compiled_query/direct_twosat.py)" = \
            f73619902d0c9d2a3400c192d7c997ccc9ca6396
          test "$(git hash-object experiments/compiled_query/cadical_exact.py)" = \
            313c9538451746085622fd7eced82355e6fa689d
          test "$(git hash-object spectra/_native/exact_binary.cpp)" = \
            953388e463dbec3ee43b22032bfae61af2e574d6
          python -m py_compile \
            experiments/compiled_query/fresh_transfer.py \
            experiments/compiled_query/fresh_transfer_benchmark.py \
            experiments/compiled_query/direct_twosat.py \
            experiments/compiled_query/cadical_exact.py
          python -m pytest \
            experiments/compiled_query/test_fresh_transfer.py -q \
            2>&1 | tee freeze-validation/tests.log
          git rev-parse HEAD > freeze-validation/source_commit.txt
          git rev-parse HEAD^{tree} > freeze-validation/source_tree.txt
          git hash-object \
            experiments/compiled_query/fresh_transfer.py \
            experiments/compiled_query/fresh_transfer_benchmark.py \
            experiments/compiled_query/direct_twosat.py \
            experiments/compiled_query/cadical_exact.py \
            spectra/_native/exact_binary.cpp \
            > freeze-validation/blob_hashes.txt
          python -VV > freeze-validation/python.txt
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fresh-transfer-freeze-${{ github.run_id }}
          path: freeze-validation/
          retention-days: 90
          if-no-files-found: error

  benchmark:
    needs: validate
    name: Fresh transfer (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SPECTRA_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: arminbiere/cadical
          ref: ${{ env.CADICAL_COMMIT }}
          path: cadical-source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: marijnheule/clicolcom
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream-source
          sparse-checkout: |
            graphs
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Open and run the frozen study
        shell: bash
        run: |
          set +e
          mkdir -p fresh-evidence
          echo 99 > fresh-evidence/exit_code.txt
          (
            set -euo pipefail
            test "$(git rev-parse HEAD)" = "$SPECTRA_COMMIT"
            test "$(git -C cadical-source rev-parse HEAD)" = "$CADICAL_COMMIT"
            test "$(git -C upstream-source rev-parse HEAD)" = "$UPSTREAM_COMMIT"

            git rev-parse HEAD > fresh-evidence/source_commit.txt
            git rev-parse HEAD^{tree} > fresh-evidence/source_tree.txt
            git -C cadical-source rev-parse HEAD > fresh-evidence/cadical_commit.txt
            git -C upstream-source rev-parse HEAD > fresh-evidence/upstream_commit.txt
            python -VV > fresh-evidence/python.txt
            uname -a > fresh-evidence/platform.txt
            lscpu > fresh-evidence/lscpu.txt || true

            python - <<'PY'
          from pathlib import Path
          from experiments.compiled_query.fresh_transfer import open_fresh_transfer

          open_fresh_transfer(
              Path("upstream-source/graphs"),
              Path("fresh-evidence/cases"),
          )
          PY

            SPECTRA_LIBRARY="$(python -c "from spectra.exact import build_exact_runtime; print(build_exact_runtime('fresh-evidence/spectra-build'))")"
            CADICAL_LIBRARY="$(python -c "from experiments.compiled_query.cadical_exact import build_cadical_exact_runtime; import os; print(build_cadical_exact_runtime('fresh-evidence/cadical-build', os.path.abspath('cadical-source')))")"
            DIRECT_LIBRARY="$(python -c "from experiments.compiled_query.direct_twosat import build_direct_twosat_runtime; print(build_direct_twosat_runtime('fresh-evidence/direct-build'))")"

            timeout --signal=TERM --kill-after=30s 80m \
              python -m experiments.compiled_query.fresh_transfer_benchmark \
                --spectra-library "$SPECTRA_LIBRARY" \
                --cadical-library "$CADICAL_LIBRARY" \
                --direct-library "$DIRECT_LIBRARY" \
                --cases fresh-evidence/cases \
                --out fresh-evidence/results \
                --repeats 30 \
                --enforce
          ) 2>&1 | tee fresh-evidence/run.log
          status=${PIPESTATUS[0]}
          echo "$status" > fresh-evidence/exit_code.txt
          exit 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fresh-transfer-${{ matrix.runner }}-${{ github.run_id }}
          path: fresh-evidence/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

      - name: Enforce the frozen verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f fresh-evidence/exit_code.txt
          status="$(cat fresh-evidence/exit_code.txt)"
          test "$status" = 0

  cleanup:
    needs: [validate, benchmark]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: archive/research-history-20261016
          fetch-depth: 0
      - name: Remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tugrap"
          git config user.email "106766396+tugrapaydiner@users.noreply.github.com"
          rm .github/workflows/run-fresh-transfer.yml
          git add -A
          git diff --cached --check
          git commit -m "Remove the completed transfer workflow"
          git push origin HEAD:refs/heads/archive/research-history-20261016
