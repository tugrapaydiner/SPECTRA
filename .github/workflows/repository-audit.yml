name: repository-audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  active-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Audit only the active source tree
        run: |
          set -euo pipefail
          mkdir -p repository-audit
          git rev-parse HEAD > repository-audit/source_commit.txt
          git rev-parse HEAD^{tree} > repository-audit/source_tree.txt
          python scripts/check_active_tree.py --out repository-audit/active-tree.json
          python scripts/check_release_readiness.py --out repository-audit/release-readiness.json
          python scripts/audit_workspace.py --out repository-audit/workspace.json
          git ls-tree -r -l HEAD > repository-audit/tracked-files.txt
          du -sh --exclude=.git . > repository-audit/worktree-size.txt
          sha256sum repository-audit/*.json repository-audit/*.txt > repository-audit/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-audit-${{ github.run_id }}
          path: repository-audit/
          retention-days: 30
          if-no-files-found: error
