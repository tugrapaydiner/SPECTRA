name: part2-consolidation-patch

on:
  push:
    branches:
      - performance/automatic-engine-selection-final
    paths:
      - .github/workflows/part2-consolidation-patch.yml

permissions:
  contents: write

concurrency:
  group: part2-consolidation-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply audited corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text: str, old: str, new: str, *, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise AssertionError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          exact_policy = """        The default ``auto`` mode uses frozen structural policy v10. Banks of
          at most eight requests on graphs above 512 vertices take the exact raw
          path directly, and fixed contradictions stay raw. Dense high-pin banks
          shorter than 64 requests stay raw. Below 96 vertices, dense high-pin
          banks stay raw only when SCC compression is present; uncompressed long
          banks may use SCC. At exactly 64 requests, dense uncompressed graphs
          whose edge count is at least four times the vertex count stay raw.
          Other feasible banks of at least 64 requests use SCC; banks from eight
          requests use SCC earlier when SCCs compress the literal graph by at least
          fourfold. Selection uses immutable graph/request geometry only, never
          answers or measured timings. ``info['selected_mode']`` and
          ``info['auto_policy_reason']`` expose the decision. Explicit modes keep
          their meaning; the automatic policy is a frozen structural dispatcher.
          """

          for filename in ("spectra/exact.py", "experiments/compiled_query/exact.py"):
              text = read(filename)
              start = text.index("        The default ``auto`` mode uses structural policy")
              marker = "        their meaning; the automatic policy is a frozen structural dispatcher.\n"
              end = text.index(marker, start) + len(marker)
              text = text[:start] + exact_policy + text[end:]
              write(filename, text)

          filename = "experiments/compiled_query/itc_exam_suite.py"
          text = read(filename)
          text = replace_once(
              text,
              "    summaries = []\n    holdout_failures = []\n",
              "    summaries = []\n    selector_failures = []\n    holdout_failures = []\n    development_failures = []\n",
              label="ITC failure buckets",
          )
          text = replace_once(
              text,
              "        if not gate_pass:\n            holdout_failures.append(item[\"name\"])\n",
              "        if not gate_pass:\n            selector_failures.append(item[\"name\"])\n            if item[\"role\"] == \"holdout\":\n                holdout_failures.append(item[\"name\"])\n            else:\n                development_failures.append(item[\"name\"])\n",
              label="ITC role-aware failure classification",
          )
          text = replace_once(
              text,
              "            \"holdout_gate_pass\": gate_pass,\n",
              "            \"selector_guard_pass\": gate_pass,\n            \"holdout_gate_pass\": gate_pass if item[\"role\"] == \"holdout\" else None,\n",
              label="ITC case gate labels",
          )
          text = replace_once(
              text,
              "        \"holdout_gate_pass\": not holdout_failures,\n        \"selector_guard_pass\": not holdout_failures,\n        \"holdout_failures\": holdout_failures,\n",
              "        \"holdout_gate_pass\": not holdout_failures,\n        \"selector_guard_pass\": not selector_failures,\n        \"selector_failures\": selector_failures,\n        \"holdout_failures\": holdout_failures,\n        \"development_failures\": development_failures,\n",
              label="ITC suite gate labels",
          )
          text = replace_once(
              text,
              "            \"the gate limits auto-policy overhead relative to the explicit raw control\",\n",
              "            \"the selector guard covers every case; holdout failures are reported separately\",\n            \"the gate limits auto-policy overhead relative to the explicit raw control\",\n",
              label="ITC interpretation",
          )
          write(filename, text)

          filename = "experiments/compiled_query/test_itc_exam_suite.py"
          text = read(filename)
          text = replace_once(
              text,
              "    assert result[\"holdout_gate_pass\"]\n    assert result[\"holdout_failures\"] == []\n",
              "    assert result[\"holdout_gate_pass\"]\n    assert result[\"selector_guard_pass\"]\n    assert result[\"selector_failures\"] == []\n    assert result[\"holdout_failures\"] == []\n    assert result[\"development_failures\"] == []\n    assert result[\"cases\"][0][\"selector_guard_pass\"]\n    assert result[\"cases\"][0][\"holdout_gate_pass\"] is None\n    assert all(\n        case[\"holdout_gate_pass\"] is True\n        for case in result[\"cases\"][1:]\n    )\n",
              label="ITC audit contract",
          )
          write(filename, text)

          filename = "experiments/compiled_query/auto_selector_benchmark.py"
          text = read(filename)
          text = replace_once(
              text,
              '"""Frozen development and confirmation benchmark for structural auto policy v10."""',
              '"""Paired, calibrated benchmark for frozen structural auto policy v10."""',
              label="benchmark module identity",
          )
          text = replace_once(
              text,
              'WARMUPS = 2\nSCHEMA = "spectra.auto_selector_benchmark.v7"\nPOLICY = "structural-v10"\n',
              'WARMUPS = 2\nMIN_SAMPLE_NS = 1_000_000\nMAX_BATCH_SIZE = 256\nSCHEMA = "spectra.auto_selector_benchmark.v8"\nPOLICY = "structural-v10"\n',
              label="benchmark sampling constants",
          )
          marker = "def run(library: Path, panel: str, destination: Path, repeats: int) -> dict:\n"
          helper = '''def _time_batch(runtime: ExactRuntime, problem: ExactProblem, rows, mode: str,
                          batch_size: int):
              if batch_size < 1:
                  raise ValueError("batch size must be positive")
              current = b""
              answer = None
              started = time.perf_counter_ns()
              for _ in range(batch_size):
                  current = pack_session_packet(problem, rows)
                  answer = runtime.solve_session_packet(current, mode=mode)
              elapsed = time.perf_counter_ns() - started
              if answer is None:
                  raise AssertionError("timed batch produced no answer")
              return elapsed, current, answer


          def _calibrate_batch(runtime: ExactRuntime, problem: ExactProblem, rows, mode: str) -> int:
              batch_size = 1
              for _ in range(8):
                  elapsed, current, answer = _time_batch(
                      runtime, problem, rows, mode, batch_size
                  )
                  if not verify_session_output(current, answer.output):
                      raise AssertionError("calibration output replay failed")
                  if elapsed >= MIN_SAMPLE_NS or batch_size >= MAX_BATCH_SIZE:
                      return batch_size
                  target = math.ceil(batch_size * MIN_SAMPLE_NS / max(elapsed, 1))
                  batch_size = min(MAX_BATCH_SIZE, max(batch_size + 1, target))
              return batch_size


          def run(library: Path, panel: str, destination: Path, repeats: int) -> dict:
          '''
          text = replace_once(text, marker, helper, label="benchmark batch helpers")
          start = text.index("                samples = {mode: [] for mode in MODES}\n")
          end = text.index("                record = {\n", start)
          timing = '''                batch_sizes = {
                      mode: _calibrate_batch(runtime, problem, rows, mode)
                      for mode in MODES
                  }
                  samples = {mode: [] for mode in MODES}
                  hashes = {mode: set() for mode in MODES}
                  schedule = random.Random(seed_for(
                      "SPECTRA-auto-selector-v10-schedule",
                      f"{panel}/{case.name}/{count}",
                  ))
                  for _ in range(repeats):
                      order = list(MODES)
                      schedule.shuffle(order)
                      for mode in order:
                          elapsed, current, answer = _time_batch(
                              runtime, problem, rows, mode, batch_sizes[mode]
                          )
                          samples[mode].append(elapsed / batch_sizes[mode])
                          hashes[mode].add(hashlib.sha256(answer.output).hexdigest())
                          if answer.output != first[mode].output:
                              raise AssertionError("timed output differs from the verified warm result")
                          if not verify_session_output(current, answer.output):
                              raise AssertionError("timed output replay failed")
                  if any(len(values) != 1 for values in hashes.values()):
                      raise AssertionError("output bytes changed across repetitions")
                  medians = {mode: statistics.median(values) for mode, values in samples.items()}
                  oracle = min(("raw", "scc", "route"), key=medians.get)
                  selection_ratios = [
                      selected_ns / oracle_ns
                      for selected_ns, oracle_ns in zip(samples[selected], samples[oracle])
                  ]
                  realized_ratios = [
                      auto_ns / oracle_ns
                      for auto_ns, oracle_ns in zip(samples["auto"], samples[oracle])
                  ]
                  auto_raw_ratios = [
                      auto_ns / raw_ns
                      for auto_ns, raw_ns in zip(samples["auto"], samples["raw"])
                  ]
          '''
          text = text[:start] + timing + text[end:]
          text = replace_once(
              text,
              '                    "selection_regret": medians[selected] / medians[oracle],\n                    "realized_regret": medians["auto"] / medians[oracle],\n                    "auto_raw_ratio": medians["auto"] / medians["raw"],\n                    "samples_ns": samples,\n',
              '                    "batch_sizes": batch_sizes,\n                    "selection_regret": statistics.median(selection_ratios),\n                    "realized_regret": statistics.median(realized_ratios),\n                    "auto_raw_ratio": statistics.median(auto_raw_ratios),\n                    "independent_median_realized_regret": medians["auto"] / medians[oracle],\n                    "samples_ns_per_call": samples,\n',
              label="benchmark paired metrics",
          )
          text = replace_once(
              text,
              '        "repeats": repeats,\n',
              '        "repeats": repeats,\n        "sampling": {\n            "method": "paired median of calibrated batched per-call samples",\n            "minimum_sample_ns": MIN_SAMPLE_NS,\n            "maximum_batch_size": MAX_BATCH_SIZE,\n        },\n',
              label="benchmark sampling receipt",
          )
          write(filename, text)

          expression = "${" + "{ github.sha }}"
          workflows = (
              (
                  ".github/workflows/part2-auto-selector-validation.yml",
                  "auto-selector-v10-validation",
                  "part2-auto-selector-validation",
                  ".github/workflows/auto-selector-v10-validation.yml",
              ),
              (
                  ".github/workflows/part2-itc-balanced.yml",
                  "auto-selector-v10-itc-balanced",
                  "part2-itc-balanced",
                  ".github/workflows/auto-selector-v10-itc-balanced.yml",
              ),
          )
          for workflow, old_name, new_name, old_path in workflows:
              text = read(workflow)
              text = text.replace(f"name: {old_name}", f"name: {new_name}", 1)
              text = replace_once(
                  text,
                  "branches: [performance/automatic-engine-selection-v10]",
                  "branches: [performance/automatic-engine-selection-final]",
                  label=f"{workflow} branch",
              )
              text = replace_once(
                  text,
                  f"paths: [{old_path}]",
                  "paths: [.github/part2-validation-trigger]",
                  label=f"{workflow} trigger",
              )
              text = text.replace(
                  f"group: {old_name}", f"group: {new_name}", 1
              )
              text = text.replace(
                  "SOURCE_COMMIT: 79520b8340ed9e16f8eda836b03d5ac1ede409e8",
                  "SOURCE_COMMIT: " + expression,
                  1,
              )
              text = text.replace(
                  "'source_commit': '79520b8340ed9e16f8eda836b03d5ac1ede409e8'",
                  "'source_commit': '" + expression + "'",
              )
              write(workflow, text)

          status = """# Part 2 — automatic exact-engine selection revalidation

          Date: 2026-10-19

          This branch is the single canonical continuation of Part 2. It was rebuilt from
          `main` plus the v10 selector source, tests, protocols, and benchmark tools. The
          previous experimental branch heads are preserved by
          `archive/pre-part2-consolidation-2026-10-19`.

          ## Corrections made during consolidation

          - The public and research API docstrings now describe the executable v10 policy
            and its 96-vertex boundary consistently.
          - ITC development failures and true holdout failures are reported separately;
            the all-case selector guard remains strict.
          - The synthetic confirmation benchmark keeps every original gate threshold but
            replaces independent sub-10-microsecond medians with position-randomized,
            calibrated batched samples and paired per-repetition regret ratios.
          - The original failed evidence remains archived; it is not overwritten or
            relabelled as a pass.

          ## Merge rule

          Draft PR #71 must remain unmerged until the canonical branch passes the complete
          x86-64 and ARM64 confirmation matrix, WAP guard, paired overhead guard, ITC suite,
          balanced ITC correction, public/native/package/platform regressions, and source
          identity checks. A successful focused rerun does not substitute for a failed full
          matrix.
          """
          write("experiments/compiled_query/AUTO_SELECTOR_V10_REVALIDATION_20261019.md", status)

          Path(".github/workflows/part2-consolidation-patch.yml").unlink()
          PY
      - name: Verify corrected sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            spectra/exact.py \
            experiments/compiled_query/exact.py \
            experiments/compiled_query/itc_exam_suite.py \
            experiments/compiled_query/test_itc_exam_suite.py \
            experiments/compiled_query/auto_selector_benchmark.py
          python - <<'PY'
          from pathlib import Path
          package = Path('spectra/exact.py').read_text()
          research = Path('experiments/compiled_query/exact.py').read_text()
          assert 'structural policy v9' not in package
          assert 'below 256 vertices' not in research
          assert 'Below 96 vertices' in package and 'Below 96 vertices' in research
          suite = Path('experiments/compiled_query/itc_exam_suite.py').read_text()
          assert '"selector_guard_pass": not selector_failures' in suite
          assert '"holdout_gate_pass": not holdout_failures' in suite
          benchmark = Path('experiments/compiled_query/auto_selector_benchmark.py').read_text()
          assert 'spectra.auto_selector_benchmark.v8' in benchmark
          assert 'MIN_SAMPLE_NS = 1_000_000' in benchmark
          assert 'statistics.median(realized_ratios)' in benchmark
          for workflow in (
              '.github/workflows/part2-auto-selector-validation.yml',
              '.github/workflows/part2-itc-balanced.yml',
          ):
              value = Path(workflow).read_text()
              assert 'performance/automatic-engine-selection-v10' not in value
              assert '79520b8340ed9e16f8eda836b03d5ac1ede409e8' not in value
              assert '.github/part2-validation-trigger' in value
          PY
          git diff --check
      - name: Commit the audited patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Part 2 evidence identity and paired timing"
          git push origin HEAD:refs/heads/performance/automatic-engine-selection-final
