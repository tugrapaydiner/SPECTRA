name: check-faster-exact-service

on:
  push:
    branches: [faster-exact-service]
    paths:
      - 'spectra/_native/exact_binary.cpp'
      - 'spectra/exact_selftest.py'
      - 'experiments/compiled_query/exact_native.cpp'
      - 'experiments/compiled_query/auto_selector_benchmark.py'
      - 'experiments/compiled_query/test_exact.py'
      - 'tests/public/test_exact_api.py'
      - 'tests/public/test_exact_selftest.py'
      - 'tests/public/test_auto_selector_v11.py'
      - '.github/workflows/check-faster-exact-service.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-faster-exact-service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Contracts (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'
      - name: Build and run the exact contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p faster-exact-evidence
          git rev-parse HEAD > faster-exact-evidence/source_commit.txt
          python -VV > faster-exact-evidence/python.txt
          uname -a > faster-exact-evidence/platform.txt
          export SPECTRA_EXACT_LIBRARY="$(python -c "from spectra.exact import build_exact_runtime; print(build_exact_runtime('faster-exact-evidence/build'))")"
          python -m pytest \
            tests/public/test_exact_api.py \
            tests/public/test_exact_selftest.py \
            tests/public/test_auto_selector_v11.py \
            --confcutdir=tests/public -q \
            2>&1 | tee faster-exact-evidence/public-tests.log
          python -m pytest \
            experiments/compiled_query/test_exact.py \
            experiments/compiled_query/test_transfer_hardening.py \
            experiments/compiled_query/test_proof_replay.py \
            experiments/compiled_query/test_linear_construction.py \
            -q 2>&1 | tee faster-exact-evidence/research-tests.log
          git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: faster-exact-contracts-${{ matrix.runner }}-${{ github.run_id }}
          path: faster-exact-evidence/
          retention-days: 90
          if-no-files-found: error

  sanitizers:
    name: Sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [undefined, 'address,undefined']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'
      - name: Run the exact contracts under the native sanitizer
        shell: bash
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          set -euo pipefail
          mkdir -p faster-exact-sanitizer
          export SPECTRA_EXACT_LIBRARY="$(python -c "from spectra.exact import build_exact_runtime; import os; print(build_exact_runtime('faster-exact-sanitizer/build', sanitizer=os.environ['SANITIZER']))")"
          export UBSAN_OPTIONS=halt_on_error=1
          if [ "$SANITIZER" = 'address,undefined' ]; then
            export LD_PRELOAD="$(g++ -print-file-name=libasan.so):$(g++ -print-file-name=libstdc++.so)"
            export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
          fi
          python -m pytest \
            tests/public/test_exact_api.py \
            --confcutdir=tests/public -q \
            2>&1 | tee faster-exact-sanitizer/public-tests.log
          python -m pytest \
            experiments/compiled_query/test_exact.py \
            experiments/compiled_query/test_proof_replay.py \
            -q 2>&1 | tee faster-exact-sanitizer/research-tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: faster-exact-sanitizer-${{ matrix.sanitizer }}-${{ github.run_id }}
          path: faster-exact-sanitizer/
          retention-days: 90
          if-no-files-found: error

  replay:
    name: Opened-graph replay (${{ matrix.runner }})
    needs: contracts
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: marijnheule/clicolcom
          ref: 4932048642da2144f387961b595112277afff82f
          path: replay-upstream
          sparse-checkout: graphs
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build both native services
        shell: bash
        run: |
          set -euo pipefail
          SPECTRA_LIBRARY="$(python -c "from spectra.exact import build_exact_runtime; print(build_exact_runtime('replay-build/spectra'))")"
          DIRECT_LIBRARY="$(python -c "from experiments.compiled_query.direct_twosat import build_direct_twosat_runtime; print(build_direct_twosat_runtime('replay-build/direct'))")"
          echo "SPECTRA_LIBRARY=$SPECTRA_LIBRARY" >> "$GITHUB_ENV"
          echo "DIRECT_LIBRARY=$DIRECT_LIBRARY" >> "$GITHUB_ENV"
      - name: Replay the opened mixed banks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from experiments.compiled_query.cases import load_case
          from experiments.compiled_query.direct_twosat_benchmark import run
          from experiments.compiled_query.direct_twosat_holdout import (
              GRAPH_INVENTORY, open_holdout,
          )

          root = Path('faster-exact-replay')
          root.mkdir()
          opened = root / 'opened-cases'
          receipts = open_holdout(Path('replay-upstream/graphs'), opened)
          cases = []
          for name in GRAPH_INVENTORY:
              case, observed = load_case(opened / name / 'case.json')
              assert observed == receipts['graphs'][name]['case_sha256']
              cases.append(case)
          result = run(
              Path(os.environ['SPECTRA_LIBRARY']),
              Path(os.environ['DIRECT_LIBRARY']),
              root / 'benchmark',
              repeats=30,
              cases=tuple(cases),
              counts=(1, 8, 64, 1024),
              classification=(
                  'opened mixed-holdout development replay after the '
                  'structural-v11 selector update; not prospective confirmation'
              ),
          )
          summary = {
              count: result['summary'][str(count)]
              for count in (1, 8, 64, 1024)
          }
          (root / 'summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: faster-exact-replay-${{ matrix.runner }}-${{ github.run_id }}
          path: |
            faster-exact-replay/
            replay-build/
          retention-days: 90
          if-no-files-found: error
