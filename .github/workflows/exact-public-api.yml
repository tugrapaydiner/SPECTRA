name: exact-public-api
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'spectra/exact*.py'
      - 'spectra/_native/exact_binary.cpp'
      - 'spectra/cli.py'
      - 'tests/public/test_exact_api.py'
      - 'tests/public/test_exact_selftest.py'
      - 'tests/public/test_exact_compare.py'
      - 'tests/public/test_exam_repair.py'
      - 'tests/public/test_itc2007_exam.py'
      - 'scripts/check_exact_installation.py'
      - 'scripts/check_exam_repair_installation.py'
      - 'scripts/check_current_installation.py'
      - 'docs/EXACT_API.md'
      - '.github/workflows/exact-public-api.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exact-public-api-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux-installed:
    name: Installed API (${{ matrix.runner }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, python: '3.11'}
          - {runner: ubuntu-24.04, python: '3.13'}
          - {runner: ubuntu-24.04-arm, python: '3.13'}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'build==1.3.0' 'pytest==9.0.2' 'python-sat==1.9.dev15'
      - name: Build packaged source and run public plus exhaustive exact contracts
        run: |
          set -euo pipefail
          mkdir -p exact-public-evidence
          git rev-parse HEAD > exact-public-evidence/source_commit.txt
          git rev-parse HEAD^{tree} > exact-public-evidence/source_tree.txt
          python -VV > exact-public-evidence/python.txt
          uname -a > exact-public-evidence/platform.txt
          export SPECTRA_EXACT_LIBRARY="$(python -c "from spectra.exact import build_exact_runtime; print(build_exact_runtime('exact-public-evidence/source-build'))")"
          python -m pytest tests/public/test_exact_api.py tests/public/test_exact_selftest.py tests/public/test_exact_compare.py tests/public/test_exam_repair.py tests/public/test_itc2007_exam.py --confcutdir=tests/public -q --junitxml=exact-public-evidence/public-tests.xml 2>&1 | tee exact-public-evidence/public-tests.log
          python -m pytest experiments/compiled_query/test_exact.py experiments/compiled_query/test_transfer_hardening.py experiments/compiled_query/test_proof_replay.py experiments/compiled_query/test_linear_construction.py -q --junitxml=exact-public-evidence/research-tests.xml 2>&1 | tee exact-public-evidence/research-tests.log
      - name: Build the compiler-free wheel and test its installed native API
        run: |
          set -euo pipefail
          python -m build --wheel --outdir exact-public-evidence/dist 2>&1 | tee exact-public-evidence/build.log
          python -m venv exact-public-evidence/install
          exact-public-evidence/install/bin/python -m pip install --no-deps exact-public-evidence/dist/*.whl
          exact-public-evidence/install/bin/python -I scripts/check_exact_installation.py --out exact-public-evidence/installed.json --evidence-dir exact-public-evidence/installed-selftest 2>&1 | tee exact-public-evidence/installed.log
          exact-public-evidence/install/bin/python -I scripts/check_exam_repair_installation.py --out exact-public-evidence/installed-exam.json 2>&1 | tee exact-public-evidence/installed-exam.log
          python scripts/check_release_readiness.py --out exact-public-evidence/release-readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: exact-selftest-${{ matrix.runner }}-py${{ matrix.python }}-${{ github.run_id }}
          path: exact-public-evidence/installed-selftest/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-public-${{ matrix.runner }}-py${{ matrix.python }}-${{ github.run_id }}
          path: exact-public-evidence/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
  windows-installed:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Load MSVC x64
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 build tools not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $lines = & cmd /c "`"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment setup failed' }
          foreach ($line in $lines) {
            $pair = $line -split '=', 2
            if ($pair.Count -eq 2 -and $pair[0] -in @('PATH','INCLUDE','LIB','LIBPATH','VCToolsInstallDir','VCINSTALLDIR','WindowsSdkDir','WindowsSDKVersion')) {
              $line | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - run: python -m pip install 'build==1.3.0' 'pytest==9.0.2' 'python-sat==1.9.dev15'
      - name: Run source and installed-wheel contracts under MSVC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force exact-public-evidence | Out-Null
          git rev-parse HEAD | Out-File exact-public-evidence/source_commit.txt
          python -VV 2>&1 | Out-File exact-public-evidence/python.txt
          $library = python -c "from spectra.exact import build_exact_runtime; print(build_exact_runtime('exact-public-evidence/source-build'))"
          "SPECTRA_EXACT_LIBRARY=$library" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:SPECTRA_EXACT_LIBRARY = $library
          python -m pytest tests/public/test_exact_api.py tests/public/test_exact_selftest.py tests/public/test_exact_compare.py tests/public/test_exam_repair.py tests/public/test_itc2007_exam.py --confcutdir=tests/public -q --junitxml=exact-public-evidence/public-tests.xml 2>&1 | Tee-Object exact-public-evidence/public-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest experiments/compiled_query/test_exact.py experiments/compiled_query/test_transfer_hardening.py experiments/compiled_query/test_proof_replay.py experiments/compiled_query/test_linear_construction.py -q --junitxml=exact-public-evidence/research-tests.xml 2>&1 | Tee-Object exact-public-evidence/research-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build --wheel --outdir exact-public-evidence/dist 2>&1 | Tee-Object exact-public-evidence/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m venv exact-public-evidence/install
          $python = 'exact-public-evidence/install/Scripts/python.exe'
          & $python -m pip install --no-deps (Get-ChildItem exact-public-evidence/dist/*.whl).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I scripts/check_exact_installation.py --out exact-public-evidence/installed.json --evidence-dir exact-public-evidence/installed-selftest 2>&1 | Tee-Object exact-public-evidence/installed.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -I scripts/check_exam_repair_installation.py --out exact-public-evidence/installed-exam.json 2>&1 | Tee-Object exact-public-evidence/installed-exam.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: exact-selftest-windows-py3.13-${{ github.run_id }}
          path: exact-public-evidence/installed-selftest/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-public-windows-py3.13-${{ github.run_id }}
          path: exact-public-evidence/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
  compare-bundles:
    name: Compare installed self-test bundles
    needs: [linux-installed, windows-installed]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: exact-selftest-ubuntu-24.04-py3.11-${{ github.run_id }}
          path: exact-bundles/linux-py311
      - uses: actions/download-artifact@v4
        with:
          name: exact-selftest-ubuntu-24.04-py3.13-${{ github.run_id }}
          path: exact-bundles/linux-py313
      - uses: actions/download-artifact@v4
        with:
          name: exact-selftest-ubuntu-24.04-arm-py3.13-${{ github.run_id }}
          path: exact-bundles/arm-py313
      - uses: actions/download-artifact@v4
        with:
          name: exact-selftest-windows-py3.13-${{ github.run_id }}
          path: exact-bundles/windows-py313
      - name: Compare the retained results
        run: |
          set -euo pipefail
          python -m spectra exact compare \
            exact-bundles/linux-py311 \
            exact-bundles/linux-py313 \
            exact-bundles/arm-py313 \
            exact-bundles/windows-py313 \
            > cross-platform.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('cross-platform.json').read_text())
          assert result['verified'] is True
          assert result['bundles'] == 4
          assert result['proof_kinds'] == [1, 2, 3]
          assert len(result['environments']) == 4
          assert result['native_execution'] is False
          assert result['native_module_loaded'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exact-selftest-comparison-${{ github.run_id }}
          path: cross-platform.json
          retention-days: 90
          if-no-files-found: error
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ['undefined', 'address,undefined']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'
      - name: Build packaged source and run exact API contracts under sanitizer
        env:
          SANITIZER: ${{ matrix.sanitizer }}
        run: |
          set -euo pipefail
          mkdir -p exact-sanitizer-evidence
          export SPECTRA_EXACT_LIBRARY="$(python -c "from spectra.exact import build_exact_runtime; import os; print(build_exact_runtime('exact-sanitizer-evidence/build', sanitizer=os.environ['SANITIZER']))")"
          export UBSAN_OPTIONS=halt_on_error=1
          if [ "$SANITIZER" = 'address,undefined' ]; then
            export LD_PRELOAD="$(g++ -print-file-name=libasan.so):$(g++ -print-file-name=libstdc++.so)"
            export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
          fi
          python -m pytest tests/public/test_exact_api.py --confcutdir=tests/public -q --junitxml=exact-sanitizer-evidence/public-tests.xml 2>&1 | tee exact-sanitizer-evidence/public-tests.log
          python -m pytest experiments/compiled_query/test_exact.py experiments/compiled_query/test_transfer_hardening.py experiments/compiled_query/test_proof_replay.py experiments/compiled_query/test_linear_construction.py -q --junitxml=exact-sanitizer-evidence/research-tests.xml 2>&1 | tee exact-sanitizer-evidence/research-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-public-sanitizer-${{ matrix.sanitizer }}-${{ github.run_id }}
          path: exact-sanitizer-evidence/
          retention-days: 90
          if-no-files-found: error
