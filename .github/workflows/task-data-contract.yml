name: task-data-contract

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  task-data-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .m03/manifests
          timeout 360s python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.10.0" |& tee .m03/install_torch.txt
          timeout 180s python -m pip install -r requirements-cpu-research.txt |& tee .m03/install_requirements.txt
          python - <<'PY' | tee .m03/environment.txt
          import platform, torch, numpy, pytest
          print('platform=', platform.platform())
          print('torch=', torch.__version__)
          print('numpy=', numpy.__version__)
          print('pytest=', pytest.__version__)
          PY

      - name: Focused task data evaluation contracts
        shell: bash
        run: |
          set -o pipefail
          timeout 360s python -m pytest \
            tests/test_m03_task_data_contract.py \
            tests/test_data_sudoku.py \
            tests/test_data_maze.py \
            tests/test_data_tasks.py \
            tests/test_verifier.py \
            -m "not slow" -ra |& tee .m03/pytest_focused.txt

      - name: Generate reproducible manifests for every retained task
        shell: bash
        run: |
          set -euxo pipefail
          for task in sudoku maze arc babyai smarthome; do
            timeout 180s python scripts/build_data_manifests.py \
              --config "config/${task}.yaml" \
              --train-size 8 --val-size 4 --test-size 4 --seed 314159 \
              --out ".m03/manifests/${task}.json" |& tee ".m03/manifest_${task}.txt"
          done
          python - <<'PY' | tee .m03/manifest_audit.txt
          import json, pathlib
          for p in sorted(pathlib.Path('.m03/manifests').glob('*.json')):
              m=json.loads(p.read_text())
              print(p.name, m['generator_version'], m['task_scope'])
              print('  counts=', {k:v['count'] for k,v in m['splits'].items()})
              print('  duplicate_audit=', m['duplicate_audit'])
              assert all(v == 0 for v in m['duplicate_audit']['cross_split_group_overlap'].values())
              assert all(v == 0 for v in m['duplicate_audit']['cross_split_exact_overlap'].values())
          PY

      - name: Record diff
        if: always()
        shell: bash
        run: |
          {
            echo "head=$(git rev-parse HEAD)"
            echo "base=e0781ec8b4e649ab4ccd48d4cd5f432a9b88d249"
            git diff --stat e0781ec8b4e649ab4ccd48d4cd5f432a9b88d249...HEAD
          } | tee .m03/diff_stat.txt

      - name: Upload M03 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m03-task-data-evidence
          path: .m03/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
