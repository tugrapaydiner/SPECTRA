name: Apply real traffic update
on:
  push:
    branches: [real-traffic]
    paths:
      - .bootstrap/real-traffic/**
      - .github/workflows/apply-real-traffic-update.yml
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply the checked source archive
        run: python .bootstrap/real-traffic/apply_update.py
      - name: Push the readable commits
        run: git push origin HEAD:real-traffic
      - name: Start the full validation run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --location --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/real-traffic.yml/dispatches" \
            --data '{"ref":"real-traffic"}'
