name: apply-panel-partition

on:
  push:
    branches:
      - finish-part3
    paths:
      - .github/workflows/apply-panel-partition.yml

permissions:
  contents: write

concurrency:
  group: partition-exposed-panel
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: finish-part3
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Apply the reviewed partition patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/partition-exposed-panel.yml').read_text(
              encoding='utf-8'
          )
          opening = "          python - <<'PY'\n"
          start = source.index(opening) + len(opening)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          script = script.replace('${{ matrix.instance }}', '__MATRIX_INSTANCE__')
          script = script.replace('${{ github.run_id }}', '__GITHUB_RUN_ID__')
          exec(compile(script, '<partition-exposed-panel>', 'exec'), {})

          workflow_path = Path('.github/workflows/cpu-regression.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          expression_open = '${' + '{'
          workflow = workflow.replace(
              '__MATRIX_INSTANCE__', expression_open + ' matrix.instance }}'
          )
          workflow = workflow.replace(
              '__GITHUB_RUN_ID__', expression_open + ' github.run_id }}'
          )
          workflow_path.write_text(workflow, encoding='utf-8')

          for temporary in (
              '.github/workflows/partition-exposed-panel.yml',
              '.github/workflows/apply-panel-partition.yml',
          ):
              Path(temporary).unlink(missing_ok=True)
          PY

      - name: Validate the partitioned panel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pytest==9.0.2' 'pyyaml==6.0.3'
          python -m py_compile \
            experiments/general_competition/exposed_panel.py \
            experiments/general_competition/test_exposed_panel.py
          python -m pytest \
            experiments/general_competition/test_exposed_panel.py \
            --confcutdir=experiments/general_competition \
            -q
          python - <<'PY'
          from pathlib import Path
          import yaml

          parsed = yaml.safe_load(
              Path('.github/workflows/cpu-regression.yml').read_text(encoding='utf-8')
          )
          jobs = parsed['jobs']
          matrix = jobs['exposed-general-panel']['strategy']['matrix']['instance']
          assert len(matrix) == 4 and len(set(matrix)) == 4
          assert jobs['aggregate-exposed-panel']['needs'] == ['exposed-general-panel']
          text = Path('.github/workflows/cpu-regression.yml').read_text(encoding='utf-8')
          assert '${{ matrix.instance }}' in text
          assert '${{ github.run_id }}' in text
          PY
          python scripts/check_active_tree.py > /tmp/active-tree.json
          git diff --check

      - name: Commit the partitioned panel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tugrap"
          git config user.email "106766396+tugrapaydiner@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Run exposed panel cases independently"
          git push origin HEAD:refs/heads/finish-part3
