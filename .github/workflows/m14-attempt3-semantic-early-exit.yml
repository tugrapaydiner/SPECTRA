name: m14-attempt3-semantic-early-exit

on:
  push:
    branches: [research/m14-attempt3-semantic-early-exit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attempt3-controlled-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install CPU experiment dependencies
        run: |
          set -euxo pipefail
          mkdir -p .m14a3
          timeout 360s python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4" |& tee .m14a3/install_torch.txt
          timeout 240s python -m pip install -r requirements.txt matplotlib |& tee .m14a3/install_requirements.txt

      - name: Verify Attempt 3 preregistration ancestry and compile
        shell: bash
        run: |
          set +e
          git merge-base --is-ancestor 41e23c69fd6a0664ce1f5e6cd4712f95898294d8 HEAD
          prereg=$?
          python -m py_compile \
            scripts/m14_attempt3_semantic_early_exit.py \
            scripts/m14_attempt3_run.py \
            scripts/render_m14_attempt3.py \
            tests/test_m14_attempt3_semantic_early_exit.py \
            tests/test_m14_attempt3_timing_contract.py
          compile=$?
          echo "$prereg" | tee .m14a3/prereg_exit_code.txt
          echo "$compile" | tee .m14a3/compile_exit_code.txt
          exit 0

      - name: Focused Attempt 3 contracts
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 600s python -m pytest \
            tests/test_m14_attempt3_semantic_early_exit.py \
            tests/test_m14_attempt3_timing_contract.py \
            tests/test_m14_attempt2_single_stream.py \
            tests/test_m14_primary_experiment.py \
            tests/test_energy_measurement.py \
            -m "not slow" -q |& tee .m14a3/pytest_focused.txt
          code=${PIPESTATUS[0]}
          echo "$code" | tee .m14a3/focused_exit_code.txt
          exit 0

      - name: Run preregistered Attempt 3 experiment
        shell: bash
        run: |
          set +e
          set -o pipefail
          rm -rf .m14a3/experiment
          timeout 2700s python scripts/m14_attempt3_run.py --out .m14a3/experiment \
            |& tee .m14a3/experiment.log
          code=${PIPESTATUS[0]}
          echo "$code" | tee .m14a3/experiment_exit_code.txt
          exit 0

      - name: Render Attempt 3 table and Pareto plot from raw evidence
        shell: bash
        run: |
          set +e
          set -o pipefail
          if [ -f .m14a3/experiment/summary.json ]; then
            python scripts/render_m14_attempt3.py \
              --experiment .m14a3/experiment --out .m14a3/rendered \
              |& tee .m14a3/render.log
            code=${PIPESTATUS[0]}
          else
            echo "summary missing; renderer not run" | tee .m14a3/render.log
            code=3
          fi
          echo "$code" | tee .m14a3/render_exit_code.txt
          exit 0

      - name: Verify Attempt 3 evidence hierarchy
        shell: bash
        run: |
          set +e
          python - <<'PY' |& tee .m14a3/evidence_check.txt
          import hashlib,json,pathlib,sys
          root=pathlib.Path('.m14a3/experiment'); rendered=pathlib.Path('.m14a3/rendered')
          required=[
              root/'summary.json',root/'prior_attempts.json',root/'environment.json',root/'energy_inventory.json',
              root/'parameter_audit.json',root/'manifests/train_validation_development.json',root/'training_runs.jsonl',
              root/'validation_rows.jsonl',root/'validation_operating_points.json',root/'candidate_selection.json',
              root/'development_rows.jsonl',root/'development_effect.json',root/'development_decision.json',root/'development_energy.json',
              rendered/'result_table.csv',rendered/'result_table.md',rendered/'pareto.png',rendered/'provenance.json',
          ]
          missing=[str(p) for p in required if not p.is_file()]
          print('missing=',missing)
          if missing: sys.exit(2)
          summary=json.loads((root/'summary.json').read_text()); prior=json.loads((root/'prior_attempts.json').read_text())
          selection=json.loads((root/'candidate_selection.json').read_text()); audit=json.loads((root/'parameter_audit.json').read_text())
          print(json.dumps(summary,indent=2,sort_keys=True))
          assert summary['milestone']==14 and summary['attempt']==3
          assert summary['protocol_committed_before_attempt3_results'] is True
          assert summary['protocol_commit']=='41e23c69fd6a0664ce1f5e6cd4712f95898294d8'
          assert summary['adaptive_development_attempts_before_confirmation']==3 and summary['prior_attempt_count']==2
          assert prior['attempt1']['status']=='INCOMPLETE' and prior['attempt1']['confirmation_opened'] is False
          assert prior['attempt2']['status']=='INCOMPLETE' and prior['attempt2']['confirmation_opened'] is False
          assert summary['primary_baseline']=='single_pass_fp'
          assert summary['candidate_family']=='single_stream_recursive_with_symbolic_semantic_early_exit'
          assert summary['n_training_seeds']==5 and summary['training_seeds']==[1401,2402,3403,4404,5405]
          assert summary['semantic_stop_reference_target_used'] is False and summary['learned_halter_used'] is False
          assert summary['task_specific_termination_bias'] is True
          assert summary['thresholds_changed_after_prior_attempts'] is False
          assert summary['baseline_weakened'] is False and summary['favorable_seed_filtering'] is False
          assert summary['hidden_width_sweep'] is False and summary['learning_rate_sweep'] is False and summary['loss_weight_sweep'] is False
          assert summary['scaling_law_claim'] is False
          assert audit['candidate_smaller'] is True and audit['candidate_trainable_params'] < audit['baseline_trainable_params']
          runs=[json.loads(x) for x in (root/'training_runs.jsonl').read_text().splitlines() if x.strip()]
          assert len(runs)==10 and {r['seed'] for r in runs}=={1401,2402,3403,4404,5405}
          assert len([r for r in runs if r['kind']=='input_conditioned_single_stream'])==5
          assert len([r for r in runs if r['kind']=='single_pass'])==5
          assert selection['selection_used_development'] is False and selection['selection_used_confirmation'] is False
          assert selection['thresholds_changed'] is False
          selected=selection['selected_config_id']; assert selected.startswith('semantic_exit_k') and summary['selected_candidate']==selected
          maxk=int(selected.rsplit('k',1)[1])
          vrows=[json.loads(x) for x in (root/'validation_rows.jsonl').read_text().splitlines() if x.strip()]
          for r in vrows:
              if str(r['config_id']).startswith('semantic_exit_k'):
                  k=int(str(r['config_id']).rsplit('k',1)[1])
                  assert 1 <= int(r['work_executed_steps']) <= k
                  assert int(r['work_block_applications'])==int(r['work_executed_steps'])
                  assert int(r['work_semantic_checks_internal'])==int(r['work_executed_steps'])
                  assert int(r['work_output_head_calls'])==int(r['work_executed_steps'])
                  assert int(r['work_halt_head_calls'])==0
                  assert r['final_semantic_reused_without_duplicate_check'] is True
              if r['config_id']=='single_pass_fp':
                  assert r['final_semantic_reused_without_duplicate_check'] is False
          drows=[json.loads(x) for x in (root/'development_rows.jsonl').read_text().splitlines() if x.strip()]
          cand=[r for r in drows if r['config_id']==selected]; base=[r for r in drows if r['config_id']=='single_pass_fp']
          assert len(cand)==len(base)==5*512
          assert all(1 <= int(r['work_executed_steps']) <= maxk for r in cand)
          assert all(int(r['work_block_applications'])==int(r['work_executed_steps']) for r in cand)
          dev=json.loads((root/'development_decision.json').read_text()); assert dev==summary['development_gate']
          assert dev['path_a']['min_quality_diff']==0.03 and dev['path_a']['max_latency_ratio']==1.15 and dev['path_a']['max_latency_ci_upper']==1.20
          assert dev['path_b']['min_quality_diff']==-0.02 and dev['path_b']['min_quality_ci_lower']==-0.03
          assert dev['path_b']['max_latency_ratio']==0.65 and dev['path_b']['max_latency_ci_upper']==0.75
          if summary['confirmation_opened']:
              for p in [root/'confirmation_freeze_manifest.json',root/'manifests/confirmation_1.json',root/'manifests/confirmation_overlap_audit.json',root/'confirmation_rows.jsonl',root/'confirmation_effect.json',root/'confirmation_decision.json',root/'confirmation_energy.json']:
                  assert p.is_file(),p
              freeze=json.loads((root/'confirmation_freeze_manifest.json').read_text()); oa=json.loads((root/'manifests/confirmation_overlap_audit.json').read_text()); conf=json.loads((root/'confirmation_decision.json').read_text())
              assert freeze['frozen_before_confirmation'] is True and freeze['learned_halter_used'] is False
              assert oa['overlap_count']==0 and dev['pass'] is True
              assert summary['confirmation_seed']==2026091402
              if summary['status']=='COMPLETE':
                  assert conf['pass'] is True and summary['claim_confirmed'] is True
              else:
                  assert summary['claim_confirmed'] is False
          else:
              assert dev['pass'] is False and summary['status']=='INCOMPLETE'
              assert not (root/'manifests/confirmation_1.json').exists()
              assert summary['reserve_confirmation_seed_unopened']==2026091403
          prov=json.loads((rendered/'provenance.json').read_text()); sha=lambda p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          surface='confirmation' if summary['confirmation_opened'] else 'development'; raw=root/f'{surface}_rows.jsonl'
          assert prov['raw_rows_sha256']==sha(raw) and prov['summary_sha256']==sha(root/'summary.json')
          assert prov['result_table_sha256']==sha(rendered/'result_table.csv') and prov['pareto_plot_sha256']==sha(rendered/'pareto.png')
          assert prov['adaptive_development_attempts_before_confirmation']==3
          assert prov['semantic_stop_reference_target_used'] is False and prov['task_specific_termination_bias'] is True
          print('M14_ATTEMPT3_EVIDENCE_HIERARCHY=VALID'); print('M14_ATTEMPT3_STATUS='+summary['status'])
          PY
          echo "$?" | tee .m14a3/evidence_check_exit_code.txt
          exit 0

      - name: Full fast regression
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 900s python -m pytest -m "not slow" -ra |& tee .m14a3/pytest_fast.txt
          code=${PIPESTATUS[0]}
          echo "$code" | tee .m14a3/fast_exit_code.txt
          exit 0

      - name: Record provenance and hashes
        if: always()
        run: |
          {
            echo "head=$(git rev-parse HEAD)"
            echo "attempt3_protocol_prereg_commit=41e23c69fd6a0664ce1f5e6cd4712f95898294d8"
            echo "attempt2_head=0ed43b00fdba28678ced5fb144ec375276c995cd"
            echo "attempt1_head=66acbc62f48b3e5b1e81080897b89562edfd8bd8"
            echo "main_base=b9e2decf19dcc772bfcef3a78615c2f4c8b350c0"
            echo
            git diff --stat 738b27204794005c6e8fd889888d0c36b5772983...HEAD
          } | tee .m14a3/diff_stat.txt
          python - <<'PY' | tee .m14a3/evidence_sha256.txt
          import hashlib,pathlib
          root=pathlib.Path('.m14a3')
          for p in sorted(q for q in root.rglob('*') if q.is_file() and q.name!='evidence_sha256.txt'):
              print(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}")
          PY

      - name: Upload Attempt 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m14-attempt3-semantic-early-exit-evidence
          path: .m14a3/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Enforce positive M14 acceptance
        if: always()
        run: |
          prereg=$(cat .m14a3/prereg_exit_code.txt 2>/dev/null || echo 99)
          compile=$(cat .m14a3/compile_exit_code.txt 2>/dev/null || echo 99)
          focused=$(cat .m14a3/focused_exit_code.txt 2>/dev/null || echo 99)
          experiment=$(cat .m14a3/experiment_exit_code.txt 2>/dev/null || echo 99)
          render=$(cat .m14a3/render_exit_code.txt 2>/dev/null || echo 99)
          evidence=$(cat .m14a3/evidence_check_exit_code.txt 2>/dev/null || echo 99)
          fast=$(cat .m14a3/fast_exit_code.txt 2>/dev/null || echo 99)
          status=$(python - <<'PY'
          import json,pathlib
          p=pathlib.Path('.m14a3/experiment/summary.json')
          print(json.loads(p.read_text()).get('status','MISSING') if p.is_file() else 'MISSING')
          PY
          )
          echo "prereg=$prereg compile=$compile focused=$focused experiment=$experiment render=$render evidence=$evidence fast=$fast status=$status"
          if [ "$prereg" -ne 0 ] || [ "$compile" -ne 0 ] || [ "$focused" -ne 0 ] || [ "$render" -ne 0 ] || [ "$evidence" -ne 0 ] || [ "$fast" -ne 0 ]; then
            echo "M14 Attempt 3 experiment/evidence integrity failure."
            exit 1
          fi
          if [ "$experiment" -ne 0 ] || [ "$status" != "COMPLETE" ]; then
            echo "M14 Attempt 3 is valid evidence but the unchanged practical-improvement claim is not independently confirmed. Milestone remains INCOMPLETE."
            exit 1
          fi
          echo "M14 primary controlled experiment acceptance passed on Attempt 3."
