name: cpu-regression-contracts
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpu-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cpu-contracts:
    name: CPU contracts (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MAX_JOBS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export complete immutable source before testing
        run: |
          mkdir -p .cpu-contracts
          git rev-parse HEAD > .cpu-contracts/source_commit.txt
          git archive --format=tar.gz HEAD > .cpu-contracts/source.tar.gz
          sha256sum .cpu-contracts/source.tar.gz > .cpu-contracts/source_sha256.txt
          echo 'All tracked files, including retained experiment archives; no .git directory.' > .cpu-contracts/source_scope.txt
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install declared CPU environment
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install -r requirements-cpu-research.txt
          python -m pip freeze > .cpu-contracts/environment.lock.txt
          python - <<'PYCPU'
          import torch
          assert torch.version.cuda is None and not torch.cuda.is_available()
          print('CPU-only torch:', torch.__version__)
          PYCPU
      - name: Full fast regression including native builds
        run: |
          set -o pipefail
          timeout 1200s python -m pytest -m 'not slow' -ra --junitxml=.cpu-contracts/pytest_fast.xml | tee .cpu-contracts/pytest_fast.txt
      - name: Runtime energy API and optimizer smoke
        run: |
          python - <<'PYSMOKE'
          import torch
          from eval.edge_energy import rapl_available, measure_energy_joules
          from model.trm import TRM
          from train.losses import deep_supervision_loss
          print('RAPL available:', rapl_available())
          print('Energy observation:', measure_energy_joules(lambda: sum(range(1000)), n_runs=1))
          torch.manual_seed(0)
          model = TRM(dim=16, num_tokens=5, seq_len=4, n_layers=1, n=1, T=1, N_sup=1, heads=1, max_grid_size=4)
          optimizer = torch.optim.AdamW(model.parameters(), lr=1e-3)
          x, y = torch.randint(0, 5, (2, 4)), torch.randint(0, 5, (2, 4))
          before = next(model.parameters()).detach().clone()
          for _ in range(2):
              _, steps = model(x, height=2, width=2)
              loss = deep_supervision_loss(steps, y)
              assert torch.isfinite(loss)
              optimizer.zero_grad(); loss.backward()
              grads = [p.grad for p in model.parameters() if p.grad is not None]
              assert grads and all(torch.isfinite(g).all() for g in grads)
              optimizer.step()
          assert not torch.equal(before, next(model.parameters()).detach())
          PYSMOKE
      - name: Independently verify retained evidence without reopening confirmation
        run: |
          set -o pipefail
          python scripts/verify_retained_results.py --out .cpu-contracts/retained_results_verified.json | tee .cpu-contracts/evidence_verification.txt
      - name: Replay every frozen development checkpoint and complete-solve arm
        run: |
          set -o pipefail
          timeout 600s python scripts/verify_checkpoint_replay.py --out .cpu-contracts/checkpoint_replay | tee .cpu-contracts/checkpoint_replay.txt
      - name: Reconstruct all published fixed pools and evaluator predictions
        run: |
          set -o pipefail
          timeout 600s python scripts/verify_fixed_pool_replay.py --cpu-profile historical-ordered --out .cpu-contracts/fixed_pool_replay | tee .cpu-contracts/fixed_pool_replay.txt
      - name: Verify retained restart evidence and paired frontier analysis
        run: |
          set -o pipefail
          python scripts/verify_cpu_progress.py --out .cpu-contracts/restart_evidence.json | tee .cpu-contracts/restart_evidence.txt
          python scripts/audit_research_frontier.py --out .cpu-contracts/research_frontier.json --verify-report results/reliability/research_frontier_audit.json | tee .cpu-contracts/research_frontier.txt
      - name: Replay every retained restart policy and comparator answer
        run: |
          set -o pipefail
          timeout 600s python scripts/verify_symmetry_checkpoint_replay.py --out .cpu-contracts/restart_replay | tee .cpu-contracts/restart_replay.txt
      - name: Verify candidate coverage, refit excluded-fold policies and replay the full follow-up
        run: |
          set -o pipefail
          timeout 900s python scripts/verify_failure_information.py --refit --replay --out .cpu-contracts/failure_information_verified.json | tee .cpu-contracts/failure_information_verified.txt
      - name: Independently replay every retained SAT admission observation
        run: |
          set -o pipefail
          python scripts/verify_sat_admission.py | tee .cpu-contracts/sat_admission_verified.json
      - name: Diagnose a failed strict replay on the same host
        if: failure()
        run: |
          set -o pipefail
          for dispatch in original sse42 compatible; do
            for family in sudoku_shift maze; do
              python scripts/probe_replay_dispatch.py --family "$family" --mkl-dispatch "$dispatch" --out ".cpu-contracts/${dispatch}_${family}" | tee ".cpu-contracts/${dispatch}_${family}.txt"
            done
          done
          ATEN_CPU_CAPABILITY=avx2 MKL_ENABLE_INSTRUCTIONS=SSE4_2 ONEDNN_MAX_CPU_ISA=AVX2 DNNL_MAX_CPU_ISA=AVX2 \
            python scripts/verify_fixed_pool_replay.py --cpu-profile host --out .cpu-contracts/sse42_strict_replay | tee .cpu-contracts/sse42_strict_replay.txt
      - name: Hash verification artifacts
        if: always()
        run: |
          python - <<'PYHASH'
          from pathlib import Path
          import hashlib
          root=Path('.cpu-contracts'); root.mkdir(exist_ok=True)
          with (root/'sha256.txt').open('w') as out:
              for p in sorted(root.rglob('*')):
                  if p.is_file() and p.name!='sha256.txt':
                      out.write(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p.relative_to(root))+'\n')
          PYHASH
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectra-cpu-contracts-${{ matrix.python }}-${{ github.run_id }}-${{ github.sha }}
          path: .cpu-contracts/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
