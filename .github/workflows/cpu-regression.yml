name: cpu-regression-contracts
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpu-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  general-cnf-contracts:
    name: General CNF contracts (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install the dependency-light contract runner
        run: python -m pip install 'pytest==9.0.2'
      - name: Compile and run arbitrary-CNF contracts
        run: |
          python -m py_compile \
            experiments/general_competition/cnf_admission.py \
            experiments/general_competition/binary_core.py \
            experiments/general_competition/residual_solver.py \
            experiments/general_competition/official_score.py \
            experiments/general_competition/test_cnf_admission.py \
            experiments/general_competition/test_binary_core.py \
            experiments/general_competition/test_residual_solver.py \
            experiments/general_competition/test_official_score.py
          python -m pytest \
            experiments/general_competition/test_cnf_admission.py \
            experiments/general_competition/test_binary_core.py \
            experiments/general_competition/test_residual_solver.py \
            experiments/general_competition/test_official_score.py \
            -q
      - name: Check out the pinned SAT Competition 2026 results
        if: matrix.python == '3.13'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: satcompetition/2026
          ref: 8ca5451c8993e7b1099ce08a80d3ee81e5d4b07c
          path: .official/satcompetition-2026
          fetch-depth: 1
          persist-credentials: false
      - name: Reproduce the official 2026 Main PAR-2 field
        if: matrix.python == '3.13'
        run: |
          set -euo pipefail
          mkdir -p general-cnf-receipts
          test "$(git -C .official/satcompetition-2026 rev-parse HEAD)" = \
            "8ca5451c8993e7b1099ce08a80d3ee81e5d4b07c"
          git -C .official/satcompetition-2026 rev-parse HEAD \
            > general-cnf-receipts/satcompetition-2026-commit.txt
          git -C .official/satcompetition-2026 rev-parse HEAD:downloads/scores.csv \
            > general-cnf-receipts/satcompetition-2026-scores-blob.txt
          python -m experiments.general_competition.official_score \
            .official/satcompetition-2026/downloads/scores.csv \
            --out general-cnf-receipts/satcompetition-2026-main.json \
            > general-cnf-receipts/satcompetition-2026-main.stdout.json
          cmp \
            general-cnf-receipts/satcompetition-2026-main.json \
            general-cnf-receipts/satcompetition-2026-main.stdout.json
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path(
              'general-cnf-receipts/satcompetition-2026-main.json'
          ).read_text(encoding='utf-8'))
          assert receipt['source_sha256'] == (
              'c00d4137bc602b0cc431e52cca02e989ef4abf4c6197cd70b42abedf6c7a4d4e'
          )
          assert receipt['source_rows'] == 13200
          assert (
              receipt['solver_count'],
              receipt['instance_count'],
              receipt['sat_instances'],
              receipt['unsat_instances'],
              receipt['unknown_instances'],
          ) == (19, 400, 191, 166, 43)
          expected = (
              ('anders_satsuma-iter-kissat[main]', '3647.019675', 276),
              ('anders_satsuma-iter-ae-kissat-mab[main]', '3696.843', 269),
              ('zheng_kissat-mab-hypre[main]', '3996.293425', 255),
          )
          observed = tuple(
              (row['solver_id'], row['overall_par2'], row['solved'])
              for row in receipt['standings'][:3]
          )
          assert observed == expected
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.python == '3.13'
        with:
          name: satcompetition-2026-main-${{ github.run_id }}
          path: general-cnf-receipts/
          if-no-files-found: error
          retention-days: 90

  cpu-contracts:
    name: CPU contracts (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MAX_JOBS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Record exact source identity
        run: |
          mkdir -p .cpu-contracts
          git rev-parse HEAD > .cpu-contracts/source_commit.txt
          git rev-parse HEAD^{tree} > .cpu-contracts/source_tree.txt
          python -VV > .cpu-contracts/python.txt
          uname -a > .cpu-contracts/platform.txt
      - name: Install declared CPU environment
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install -r requirements-cpu-research.txt
          python -m pip install 'python-sat==1.9.dev15' scikit-learn==1.8.0
          python -m pip freeze > .cpu-contracts/environment.lock.txt
          python - <<'PY'
          import torch, sklearn, pysat
          assert torch.version.cuda is None and not torch.cuda.is_available()
          assert sklearn.__version__ == '1.8.0'
          assert pysat.__version__ == '1.9.dev15'
          PY
      - name: Cross-check general CNF against CaDiCaL and Glucose
        run: python -m pytest experiments/general_competition/test_residual_differential.py -q
      - name: Full fast regression including native builds
        run: |
          set -o pipefail
          timeout 1200s python -m pytest -m 'not slow' -ra \
            --junitxml=.cpu-contracts/pytest_fast.xml | tee .cpu-contracts/pytest_fast.txt
      - name: Runtime energy API and optimizer smoke
        run: |
          python - <<'PY'
          import torch
          from eval.edge_energy import rapl_available, measure_energy_joules
          from model.trm import TRM
          from train.losses import deep_supervision_loss
          print('RAPL available:', rapl_available())
          print('Energy observation:', measure_energy_joules(lambda: sum(range(1000)), n_runs=1))
          torch.manual_seed(0)
          model = TRM(dim=16, num_tokens=5, seq_len=4, n_layers=1, n=1, T=1,
                      N_sup=1, heads=1, max_grid_size=4)
          optimizer = torch.optim.AdamW(model.parameters(), lr=1e-3)
          x, y = torch.randint(0, 5, (2, 4)), torch.randint(0, 5, (2, 4))
          before = next(model.parameters()).detach().clone()
          for _ in range(2):
              _, steps = model(x, height=2, width=2)
              loss = deep_supervision_loss(steps, y)
              assert torch.isfinite(loss)
              optimizer.zero_grad(); loss.backward(); optimizer.step()
          assert not torch.equal(before, next(model.parameters()).detach())
          PY
      - name: Active-tree and release checks
        run: |
          python scripts/check_active_tree.py --out .cpu-contracts/active-tree.json
          python scripts/check_release_readiness.py --out .cpu-contracts/release-readiness.json
          python scripts/audit_workspace.py --out .cpu-contracts/workspace.json
      - name: Hash small verification receipts
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.cpu-contracts'); root.mkdir(exist_ok=True)
          with (root/'sha256.txt').open('w') as out:
              for p in sorted(root.rglob('*')):
                  if p.is_file() and p.name!='sha256.txt':
                      out.write(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p.relative_to(root))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectra-cpu-contracts-${{ matrix.python }}-${{ github.run_id }}
          path: .cpu-contracts/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
