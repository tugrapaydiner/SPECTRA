name: cpu-regression-contracts
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpu-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  general-cnf-contracts:
    name: General CNF contracts (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install the dependency-light contract runner
        run: python -m pip install 'pytest==9.0.2'
      - name: Compile and run arbitrary-CNF admission and binary-core contracts
        run: |
          python -m py_compile \
            experiments/general_competition/cnf_admission.py \
            experiments/general_competition/binary_core.py \
            experiments/general_competition/test_cnf_admission.py \
            experiments/general_competition/test_binary_core.py
          python -m pytest \
            experiments/general_competition/test_cnf_admission.py \
            experiments/general_competition/test_binary_core.py \
            -q

  cpu-contracts:
    name: CPU contracts (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MAX_JOBS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Record exact source identity
        run: |
          mkdir -p .cpu-contracts
          git rev-parse HEAD > .cpu-contracts/source_commit.txt
          git rev-parse HEAD^{tree} > .cpu-contracts/source_tree.txt
          python -VV > .cpu-contracts/python.txt
          uname -a > .cpu-contracts/platform.txt
      - name: Install declared CPU environment
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install -r requirements-cpu-research.txt
          python -m pip install 'python-sat==1.9.dev15' scikit-learn==1.8.0
          python -m pip freeze > .cpu-contracts/environment.lock.txt
          python - <<'PY'
          import torch, sklearn, pysat
          assert torch.version.cuda is None and not torch.cuda.is_available()
          assert sklearn.__version__ == '1.8.0'
          assert pysat.__version__ == '1.9.dev15'
          PY
      - name: Full fast regression including native builds
        run: |
          set -o pipefail
          timeout 1200s python -m pytest -m 'not slow' -ra \
            --junitxml=.cpu-contracts/pytest_fast.xml | tee .cpu-contracts/pytest_fast.txt
      - name: Runtime energy API and optimizer smoke
        run: |
          python - <<'PY'
          import torch
          from eval.edge_energy import rapl_available, measure_energy_joules
          from model.trm import TRM
          from train.losses import deep_supervision_loss
          print('RAPL available:', rapl_available())
          print('Energy observation:', measure_energy_joules(lambda: sum(range(1000)), n_runs=1))
          torch.manual_seed(0)
          model = TRM(dim=16, num_tokens=5, seq_len=4, n_layers=1, n=1, T=1,
                      N_sup=1, heads=1, max_grid_size=4)
          optimizer = torch.optim.AdamW(model.parameters(), lr=1e-3)
          x, y = torch.randint(0, 5, (2, 4)), torch.randint(0, 5, (2, 4))
          before = next(model.parameters()).detach().clone()
          for _ in range(2):
              _, steps = model(x, height=2, width=2)
              loss = deep_supervision_loss(steps, y)
              assert torch.isfinite(loss)
              optimizer.zero_grad(); loss.backward(); optimizer.step()
          assert not torch.equal(before, next(model.parameters()).detach())
          PY
      - name: Active-tree and release checks
        run: |
          python scripts/check_active_tree.py --out .cpu-contracts/active-tree.json
          python scripts/check_release_readiness.py --out .cpu-contracts/release-readiness.json
          python scripts/audit_workspace.py --out .cpu-contracts/workspace.json
      - name: Hash small verification receipts
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('.cpu-contracts'); root.mkdir(exist_ok=True)
          with (root/'sha256.txt').open('w') as out:
              for p in sorted(root.rglob('*')):
                  if p.is_file() and p.name!='sha256.txt':
                      out.write(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p.relative_to(root))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectra-cpu-contracts-${{ matrix.python }}-${{ github.run_id }}
          path: .cpu-contracts/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
