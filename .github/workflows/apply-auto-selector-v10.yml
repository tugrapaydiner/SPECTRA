name: apply-auto-selector-v10

on:
  push:
    branches: [performance/automatic-engine-selection-v10]
    paths: [.github/workflows/apply-auto-selector-v10.yml]

permissions:
  contents: write

concurrency:
  group: apply-auto-selector-v10
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Apply and inspect the selector correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_auto_selector_v10.py')
          text = path.read_text()
          anchor = 'from textwrap import dedent\n'
          helper = '''from textwrap import dedent\n\n\ndef _indent4(value: str) -> str:\n    return "\\n".join(("    " + line) if line else line for line in value.split("\\n"))\n'''
          if text.count(anchor) != 1:
              raise RuntimeError('migration import anchor differs')
          text = text.replace(anchor, helper)
          text = text.replace('    old_regimes = dedent(\n',
                              '    old_regimes = _indent4(dedent(\n', 1)
          text = text.replace('    )\n    new_regimes = dedent(\n',
                              '    ))\n    new_regimes = _indent4(dedent(\n', 1)
          text = text.replace('    )\n    if text.count(old_regimes) != 1:\n',
                              '    ))\n    if text.count(old_regimes) != 1:\n', 1)
          old_guard = '''    if text.count(old_policy) != 1:\n        raise RuntimeError("exact packet reference policy differs")\n    exact_tests.write_text(text.replace(old_policy, new_policy))\n'''
          new_guard = '''    function_start = text.index("def test_auto_packet_exposes_and_matches_its_selected_engine")\n    policy_start = text.index("    if structure == 'odd_cycle':", function_start)\n    policy_end = text.index("\\n\\n    assert answer.info['mode'] == 'auto'", policy_start)\n    text = text[:policy_start] + _indent4(new_policy.rstrip()) + text[policy_end:]\n    exact_tests.write_text(text)\n'''
          if text.count(old_guard) != 1:
              raise RuntimeError('test migration guard differs')
          path.write_text(text.replace(old_guard, new_guard))
          PY
          python scripts/apply_auto_selector_v10.py
          python - <<'PY'
          from pathlib import Path
          path = Path('experiments/compiled_query/test_exact.py')
          text = path.read_text()
          start = text.index("@pytest.mark.parametrize('count', (0, 1, 63, 64, 65, 129))")
          end = text.index("\ndef test_auto_does_not_hide_malformed_packets_or_resource_limits", start)
          lines = [
              "@pytest.mark.parametrize('count', (0, 1, 63, 64, 65, 129))",
              "@pytest.mark.parametrize('structure', ('empty', 'independent', 'chain', 'odd_cycle'))",
              "def test_auto_packet_exposes_and_matches_its_selected_engine(exact_runtime, count, structure):",
              "    n = 0 if structure == 'empty' else 9",
              "    edges = () if structure in ('empty', 'independent') else tuple(",
              "        (v, v + 1) for v in range(n - 1)",
              "    )",
              "    if structure == 'odd_cycle':",
              "        edges += ((0, n - 1),)",
              "    p = BinaryListProblem.create(n, 2, edges, (3,) * n)",
              "    requests = ((),) if not n else (",
              "        (), ((0, 1),), ((0, 1), (1, 1)), ((0, 0),)",
              "    )",
              "    rows = tuple(requests[i % len(requests)] for i in range(count))",
              "    packet = pack_session_packet(p, rows)",
              "    answer = exact_runtime.solve_session_packet(packet, mode='auto')",
              "    pins = sum(map(len, rows))",
              "",
              "    if structure == 'odd_cycle':",
              "        selected, reason = 'raw', 'base_infeasible'",
              "    else:",
              "        components = {'empty': 0, 'independent': 18, 'chain': 2}[structure]",
              "        high_pin = bool(count and pins >= 8 * count",
              "                        and 24 * pins >= n * count)",
              "        if high_pin and count < 64:",
              "            selected, reason = 'raw', 'dense_pin_short'",
              "        elif high_pin and n < 96 and components < 2 * n:",
              "            selected, reason = 'raw', 'dense_small_compressed'",
              "        elif count == 64 and components == 2 * n and len(edges) >= 4 * n:",
              "            selected, reason = 'raw', 'dense_uncompressed_tile64'",
              "        elif count >= 64:",
              "            selected, reason = 'scc', 'scc_long_bank'",
              "        elif count >= 8 and 2 * components <= n:",
              "            selected, reason = 'scc', 'scc_strong_compression'",
              "        else:",
              "            selected, reason = 'raw', 'short_weak_compression'",
              "",
              "    assert answer.info['mode'] == 'auto'",
              "    assert answer.info['auto_policy'] == 'structural-v10'",
              "    assert answer.info['auto_policy_reason'] == reason",
              "    assert answer.info['bank_query_count'] == count",
              "    assert answer.info['selected_mode'] == selected",
              "    assert answer.output == exact_runtime.solve_session_packet(",
              "        packet, mode=selected",
              "    ).output",
              "    for query, (decision, labels, certificate) in zip(",
              "            rows, decode_certified_output(answer.output, n, count)):",
              "        assert bool(decision) == bool(brute(p, query))",
              "        assert verify_answer(",
              "            p,",
              "            query,",
              "            'SAT_VERIFIED' if decision else 'UNSAT_VERIFIED',",
              "            labels if decision else b'',",
              "            certificate,",
              "        )",
              "",
          ]
          path.write_text(text[:start] + '\n'.join(lines) + text[end:])
          PY
          python - <<'PY'
          from pathlib import Path
          for name in ('spectra/_native/exact_binary.cpp',
                       'experiments/compiled_query/exact_native.cpp'):
              path = Path(name)
              text = path.read_text()
              old = 'which==4?"structural-v9":"explicit"'
              new = 'which==4?"structural-v10":"explicit"'
              if text.count(old) != 1:
                  raise RuntimeError(f'{name}: selector receipt anchor differs')
              path.write_text(text.replace(old, new))
          PY
          cmp spectra/_native/exact_binary.cpp experiments/compiled_query/exact_native.cpp
          git diff --check
          python -m py_compile \
            spectra/exact.py \
            experiments/compiled_query/exact.py \
            experiments/compiled_query/auto_selector_benchmark.py \
            experiments/compiled_query/test_exact.py \
            scripts/apply_auto_selector_v10.py

      - name: Run focused contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_auto_selector_v10.py \
            tests/public/test_exact_api.py \
            tests/public/test_exact_bank_tile64.py \
            tests/public/test_exact_packet_packing.py
          python -m pytest -q --confcutdir=experiments/compiled_query \
            experiments/compiled_query/test_exact.py \
            experiments/compiled_query/test_itc_exam_transfer.py \
            experiments/compiled_query/test_itc_exam_suite.py

      - name: Commit the selector
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/apply-auto-selector-v10.yml \
            .github/workflows/auto-selector-v8-itc-recheck.yml \
            .github/workflows/auto-selector-v8-validation.yml \
            .github/workflows/fix-auto-selector-v8-apply.yml \
            scripts/apply_auto_selector_v10.py
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          git add -A
          git commit -m 'Choose the exact engine from the workload shape' \
            -m 'Keep tiny and proof-heavy compressed banks on raw traversal, use SCC for long tile-friendly banks, and make the decision entirely inside the native endpoint. Preserve packet formats, explicit engines, witnesses, proofs and resource limits.'
          git push origin HEAD:performance/automatic-engine-selection-v10
