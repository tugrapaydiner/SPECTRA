name: apply prepared CNF path

on:
  push:
    branches: [archive/research-history-20261016]
    paths: [.github/prepared-cnf/**, .github/workflows/apply-prepared-cnf.yml]

permissions:
  contents: write

concurrency:
  group: apply-prepared-cnf
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: archive/research-history-20261016
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Prepare the working tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin finish-part3:refs/remotes/origin/finish-part3
          test "$(git rev-parse refs/remotes/origin/finish-part3)" = "da9ce49a60fa31242d30edb70bc400f7563a417c"
          git worktree add /tmp/finish-part3 refs/remotes/origin/finish-part3
      - name: Apply the reviewed files
        shell: bash
        run: |
          set -euo pipefail
          cat .github/prepared-cnf/part*.txt > /tmp/prepared-cnf.b64
          base64 --decode /tmp/prepared-cnf.b64 > /tmp/prepared-cnf.tgz
          echo "d3ad4f514621f98632aa6015efa12a1031b785dbba4e1e1a9fc080babf07ec2f  /tmp/prepared-cnf.tgz" | sha256sum --check -
          python - <<'PY'
          import tarfile
          from pathlib import Path

          destination = Path('/tmp/finish-part3')
          mapping = {
              'native_binary_core.py': destination / 'experiments/general_competition/native_binary_core.py',
              'matched_backend.py': destination / 'experiments/general_competition/matched_backend.py',
              'exposed_panel.py': destination / 'experiments/general_competition/exposed_panel.py',
              'test_general_native_core.py': destination / 'tests/test_general_native_core.py',
              'test_matched_backend.py': destination / 'experiments/general_competition/test_matched_backend.py',
          }
          with tarfile.open('/tmp/prepared-cnf.tgz', mode='r:gz') as archive:
              members = {member.name: member for member in archive.getmembers()}
              if set(members) != set(mapping):
                  raise AssertionError(f'unexpected bundle inventory: {sorted(members)}')
              for name, target in mapping.items():
                  source = archive.extractfile(members[name])
                  if source is None:
                      raise AssertionError(f'missing regular file: {name}')
                  target.write_bytes(source.read())
          PY
      - name: Check the prepared path
        working-directory: /tmp/finish-part3
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'
          python -m py_compile \
            experiments/general_competition/native_binary_core.py \
            experiments/general_competition/matched_backend.py \
            experiments/general_competition/exposed_panel.py \
            tests/test_general_native_core.py \
            experiments/general_competition/test_matched_backend.py
          python -m pytest --noconftest tests/test_general_native_core.py -q
          python -m pytest \
            experiments/general_competition/test_matched_backend.py \
            --confcutdir=experiments/general_competition -q
          python scripts/check_active_tree.py >/tmp/prepared-active-tree.json
          git diff --check
      - name: Commit the prepared path
        working-directory: /tmp/finish-part3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          git add \
            experiments/general_competition/native_binary_core.py \
            experiments/general_competition/matched_backend.py \
            experiments/general_competition/exposed_panel.py \
            experiments/general_competition/test_matched_backend.py \
            tests/test_general_native_core.py
          git diff --cached --check
          git commit -m 'Reuse the canonical CNF across matched runs'
          git push origin HEAD:refs/heads/finish-part3
      - name: Remove the completed helper
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/prepared-cnf .github/workflows/apply-prepared-cnf.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove the completed prepared-CNF helper'
          git push origin HEAD:refs/heads/archive/research-history-20261016
