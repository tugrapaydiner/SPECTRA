name: label-transfer-development

on:
  push:
    branches: [archive/research-history-20261016]
    paths: [.github/workflows/label-transfer-development.yml]

permissions:
  contents: write

concurrency:
  group: label-transfer-development
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: finish-part3
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest==9.0.2'

      - name: Update the evidence classification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("experiments/compiled_query/fresh_transfer_benchmark.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  '"""Frozen three-way benchmark for the fresh transfer suite.\n\n'
                  'The source identities, graph inventory, answer-free query generator, measured arms,\n'
                  'schedule and numerical gates are committed before any candidate graph is opened.\n'
                  '"""',
                  '"""Three-way development benchmark for the exposed transfer suite.\n\n'
                  'The first prospective opening failed during workload admission. This module now\n'
                  'measures the corrected generator on exposed graphs; its thresholds are development\n'
                  'targets and cannot be promoted into a prospective or state-of-the-art claim.\n'
                  '"""',
              ),
              (
                  'SCHEMA = "spectra.fresh_transfer_benchmark.v1"',
                  'SCHEMA = "spectra.fresh_transfer_benchmark.v2"',
              ),
              (
                  '"prospectively frozen fresh transfer across six unopened graph "\n'
                  '            "families under matched proof-carrying first-use accounting"',
                  '"exposed six-family transfer development under matched "\n'
                  '            "proof-carrying first-use accounting"',
              ),
              (
                  'raise AssertionError("fresh transfer gate failed")',
                  'raise AssertionError("transfer development target failed")',
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise AssertionError(f"expected one benchmark classification match: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile experiments/compiled_query/fresh_transfer_benchmark.py
          python -m pytest \
            experiments/compiled_query/test_witness_colouring.py \
            experiments/compiled_query/test_fresh_transfer.py -q
          git diff --check

      - name: Save the change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tugrap"
          git config user.email "106766396+tugrapaydiner@users.noreply.github.com"
          git add experiments/compiled_query/fresh_transfer_benchmark.py
          git commit -m "Mark the reopened transfer matrix as development"
          git push origin HEAD:refs/heads/finish-part3
