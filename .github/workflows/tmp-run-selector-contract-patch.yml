name: tmp-run-selector-contract-patch

on:
  push:
    branches: [performance/automatic-engine-selection]
    paths: [.github/workflows/tmp-run-selector-contract-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install focused dependencies
        run: python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'

      - name: Patch and validate the research contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp_patch_selector_contracts.py
          python -m py_compile experiments/compiled_query/test_exact.py
          ! grep -nE 'structural-v2|high_pin_density' experiments/compiled_query/test_exact.py
          git diff --check
          python -m pytest -q --confcutdir=experiments/compiled_query \
            experiments/compiled_query/test_exact.py

      - name: Publish the validated contract update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          git add experiments/compiled_query/test_exact.py
          git commit -m 'Align the exact-query contracts with structural v6'
          git push origin HEAD:performance/automatic-engine-selection
