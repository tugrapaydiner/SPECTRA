name: public-package
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  public-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.10', numpy: '2.2.6'}
          - {python: '3.11', numpy: '2.3.5'}
          - {python: '3.13', numpy: '2.3.5'}
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Record exact source identity
        run: |
          mkdir -p .public-package
          git rev-parse HEAD > .public-package/source_commit.txt
          git rev-parse HEAD^{tree} > .public-package/source_tree.txt
          python -VV > .public-package/python.txt
      - name: Install public contract and build dependencies
        run: python -m pip install 'build==1.3.0' 'pytest==9.0.2' 'numpy==${{ matrix.numpy }}' 'python-sat==1.9.dev15'
      - name: Dependency-light public contracts
        id: public_contract
        run: |
          set -o pipefail
          set +e
          python -m pytest tests/public --confcutdir=tests/public -ra \
            --junitxml=.public-package/pytest.xml | tee .public-package/pytest.txt
          statuses=("${PIPESTATUS[@]}")
          echo "exit_code=${statuses[0]}" >> "$GITHUB_OUTPUT"
          if [ "${statuses[0]}" -ne 0 ]; then exit "${statuses[0]}"; fi
          exit "${statuses[1]}"
      - name: Capture a native backtrace after a contract process crash
        if: failure() && (steps.public_contract.outputs.exit_code == '134' || steps.public_contract.outputs.exit_code == '139')
        timeout-minutes: 4
        run: |
          if ! command -v gdb >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gdb
          fi
          set -o pipefail
          timeout 180s gdb --batch --return-child-result \
            -ex 'set pagination off' -ex 'set debuginfod enabled off' \
            -ex run -ex 'thread apply all bt' --args \
            python -m pytest tests/public --confcutdir=tests/public -ra \
            2>&1 | tee .public-package/native-crash.txt
      - name: Check release metadata, navigation and active-tree budget
        run: |
          python scripts/check_release_readiness.py --out .public-package/release-readiness.json
          python scripts/audit_workspace.py --out .public-package/workspace.json
          python scripts/check_active_tree.py --out .public-package/active-tree.json
      - name: Build wheel from sdist and verify outside-checkout installation
        run: |
          set -o pipefail
          python -m build --outdir .public-package/dist | tee .public-package/build.txt
          python scripts/check_current_installation.py --dist .public-package/dist \
            --out .public-package/install | tee .public-package/install.txt
          .public-package/install/venv/bin/python -I scripts/check_focused_installation.py \
            | tee .public-package/focused-install.txt
          .public-package/install/venv/bin/python -I scripts/check_dpll_installation.py \
            | tee .public-package/dpll-install.txt
          .public-package/install/venv/bin/python -I scripts/check_exact_installation.py \
            --out .public-package/exact-install.json | tee .public-package/exact-install.txt
          .public-package/install/venv/bin/python -I scripts/check_exam_repair_installation.py \
            --out .public-package/exam-repair-install.json | tee .public-package/exam-repair-install.txt
      - name: Run and replay the current compact-state contract
        run: |
          set -o pipefail
          python scripts/bench_compact_cnf.py run --out .public-package/compact \
            | tee .public-package/compact-run.txt
          python scripts/bench_compact_cnf.py verify --out .public-package/compact --replay \
            | tee .public-package/compact-replay.txt
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('.public-package/compact/summary.json').read_text())
          assert report['gate']=='PASS', report
          PY
      - name: Retain receipts and built artifacts, not the disposable venv
        if: always()
        run: |
          rm -rf .public-package/install/venv
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('.public-package');root.mkdir(exist_ok=True)
          files={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in sorted(root.rglob('*')) if p.is_file() and p.name!='SHA256.json'}
          (root/'SHA256.json').write_text(json.dumps(files,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-package-${{ matrix.python }}-${{ github.run_id }}
          path: .public-package/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
