name: WAP compiler-certificate reproduction
on:
  push:
    branches: [research/wap-support-results-20261009]
    paths: [.github/workflows/wap-support-certificate-reproduction.yml]
permissions:
  contents: read
jobs:
  certificate:
    name: certificate-${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu22-python311
            os: ubuntu-22.04
            python: '3.11'
          - label: ubuntu24-python313
            os: ubuntu-24.04
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      FROZEN_COMMIT: 0af6fda36c60a110584e7db836ee5724e530fbd4
      UPSTREAM_COMMIT: 4932048642da2144f387961b595112277afff82f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Materialize exact frozen source
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/spectra-frozen "$FROZEN_COMMIT"
          test "$(git -C /tmp/spectra-frozen rev-parse HEAD)" = "$FROZEN_COMMIT"
          test "$(sha256sum /tmp/spectra-frozen/experiments/wap_support/FREEZE.json | cut -d' ' -f1)" = "31997d38cced5e5611f3f17dc6bc3929b21dcc92a6b7bc81a78db31aab949020"
          mkdir -p "delivery-${{ matrix.label }}/graphs"
      - name: Install pinned case-builder dependency
        run: |
          python -m pip install -q pytest==9.0.2 'python-sat==1.9.dev15'
          python -m pip freeze > "delivery-${{ matrix.label }}/environment.txt"
          python --version > "delivery-${{ matrix.label }}/python.txt"
          g++ --version > "delivery-${{ matrix.label }}/compiler.txt"
      - name: Focused certificate contracts
        working-directory: /tmp/spectra-frozen
        run: |
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_quotient_native_contract.py \
            > "$GITHUB_WORKSPACE/delivery-${{ matrix.label }}/contracts.log" 2>&1
      - name: Acquire exact exposed graph blobs
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/delivery-${{ matrix.label }}"
          for name in wap02a.col wap03a.col wap04a.col wap07a.col wap08a.col; do
            curl --fail --location --retry 3 --retry-all-errors \
              "https://raw.githubusercontent.com/marijnheule/clicolcom/${UPSTREAM_COMMIT}/graphs/${name}" \
              -o "$OUT/graphs/${name}"
          done
      - name: Rebuild exact cases and native runtime
        working-directory: /tmp/spectra-frozen
        run: |
          OUT="$GITHUB_WORKSPACE/delivery-${{ matrix.label }}"
          python -m experiments.wap_support.run build-cases \
            --graphs "$OUT/graphs" \
            --inventory experiments/quotient_application/WAP_UPSTREAM_INVENTORY.json \
            --out "$OUT/cases" --roles prospective_holdout \
            > "$OUT/case-build.log" 2>&1
          python -c "from spectra.cnf.quotient_query import build_quotient_runtime; print(build_quotient_runtime('$OUT/native'))" \
            > "$OUT/runtime-path.txt"
      - name: Reproduce and independently verify all five certificates
        working-directory: /tmp/spectra-frozen
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/delivery-${{ matrix.label }}"
          python - "$OUT" <<'PY'
          import hashlib,json,sys,time,zlib
          from pathlib import Path
          from experiments.wap_support.workload import WorkloadCase
          from spectra.cnf.quotient_query import QuotientRuntime
          from spectra.cnf.quotient_certificate import verify_quotient

          out=Path(sys.argv[1])
          expected={
            'wap02a.col.json':('36e9fee3b78b6d7ab53ce3e4053714997e6aa7784b1456a44fb6851fdeff0184','41707089361b681296d5f3ae3b49fd8a1dfa981c0845b387191a3bf0fd010ad1'),
            'wap03a.col.json':('07890577d524afa685f54c57abd2291e885dc3222ed85b8755924a803aa30e0f','ce8084da04d5696ab5ba9fba45b9cc6ee7bc662e039c108238c78247683b9620'),
            'wap04a.col.json':('ad8605dc368e7cad380edcbe9b0c4a70c373b5761f99ddc7ca773830af145a3a','51993b9683802a817ec1294ce63f4b00be32802ab8d78ed21774b681c07b766e'),
            'wap07a.col.json':('3178bf33c87d2f486816794a0e43281c065e0125602581b7418519009355828d','93f84c3a86fe0f3d12cea7e88c37dbe1cd7ca7dc797b92427b40919bbdf4b0e1'),
            'wap08a.col.json':('d92b35908e96ec8214b44d11a7ea510aa01d7cc434daa50bc2e6a33d05b82e33','8b3dffa3cbf0e99e5607184643703b86a661fea28584a908cdd1bbea4eb08244'),
          }
          runtime=QuotientRuntime(Path(out/'runtime-path.txt').read_text().strip())
          certdir=out/'certificates';certdir.mkdir()
          rows=[]
          for path in sorted((out/'cases/cases').glob('*.json')):
              case=WorkloadCase.from_json(path)
              assert case.case_sha256==expected[path.name][0]
              start=time.perf_counter_ns()
              prepared=runtime.prepare(case.n,case.palette,case.edges,masks=case.masks,
                                       mode='scc',max_build_bytes=512*1024*1024)
              try:
                  certificate=prepared.certificate()
                  audit=verify_quotient(case.n,case.palette,case.edges,case.masks,certificate)
                  assert audit['valid'] and audit['mapping_verified']
              finally:
                  prepared.close()
              payload=json.dumps(certificate,sort_keys=True,separators=(',',':')).encode()
              digest=hashlib.sha256(payload).hexdigest()
              assert digest==expected[path.name][1]
              compressed=zlib.compress(payload,9)
              destination=certdir/(path.stem+'.certificate.json.zlib')
              destination.write_bytes(compressed)
              rows.append({'case_file':path.name,'case_sha256':case.case_sha256,
                           'certificate_sha256':digest,'compressed_sha256':hashlib.sha256(compressed).hexdigest(),
                           'certificate_bytes':len(payload),'compressed_bytes':len(compressed),
                           'audit':audit,'audit_ns':time.perf_counter_ns()-start})
          assert len(rows)==5
          receipt={'schema':'spectra.wap_support.certificate_reproduction.v1',
                   'source_commit':'0af6fda36c60a110584e7db836ee5724e530fbd4',
                   'confirmation_run':37883619073,'status':'PASS','cases':rows}
          (out/'CERTIFICATE_REPRODUCTION.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
      - name: Hash complete receipt
        if: always()
        run: |
          python - "delivery-${{ matrix.label }}" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='SHA256.json'}
          (root/'SHA256.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wap-certificate-reproduction-${{ matrix.label }}-${{ github.run_id }}
          path: delivery-${{ matrix.label }}
          include-hidden-files: true
          retention-days: 90
      - name: Enforce exact certificate identity
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('delivery-${{ matrix.label }}/CERTIFICATE_REPRODUCTION.json')
          if not path.is_file():
              raise SystemExit('certificate reproduction receipt missing; inspect earlier retained logs')
          result=json.loads(path.read_text())
          assert result['status']=='PASS' and len(result['cases'])==5
          print('All five canonical certificates and independent audits match.')
          PY
