name: apply-itc-selector-v4-compat

on:
  push:
    branches: [performance/automatic-engine-selection]
    paths: [.github/workflows/apply-itc-selector-v4-compat.yml]

permissions:
  contents: write

concurrency:
  group: apply-itc-selector-v4-compat
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Update current execution and retained evidence compatibility
        run: python scripts/enable_itc_selector_v4.py

      - name: Run focused ITC and selector contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'
          python -m pytest -q --confcutdir=experiments/compiled_query \
            experiments/compiled_query/test_itc_exam_transfer.py \
            experiments/compiled_query/test_itc_exam_suite.py
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_auto_selector_v4.py \
            tests/public/test_exam_repair.py \
            tests/public/test_itc2007_exam.py

      - name: Publish the compatibility update
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-itc-selector-v4-compat.yml
          git rm scripts/enable_itc_selector_v4.py
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          git add \
            experiments/compiled_query/itc_exam_transfer.py \
            experiments/compiled_query/itc_exam_suite.py \
            experiments/compiled_query/test_itc_exam_transfer.py
          git commit -m 'Keep ITC evidence compatible with structural v4'
          git push origin HEAD:performance/automatic-engine-selection
