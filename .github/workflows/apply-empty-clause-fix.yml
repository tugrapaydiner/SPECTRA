name: apply-empty-clause-fix

on:
  push:
    branches: [finish-part3]
    paths: [.github/workflows/apply-empty-clause-fix.yml]

permissions:
  contents: write

concurrency:
  group: apply-empty-clause-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: finish-part3
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Preserve empty-clause semantics in the fast path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('experiments/general_competition/native_binary_core.cpp')
          text = path.read_text(encoding='utf-8')

          old_counts = '''    result.normalized_clause_count = static_cast<std::uint32_t>(canonical.size());
              for (const Clause& row : canonical) {
                  if (row.size() == 1) ++result.unit_input_clauses;
                  else if (row.size() == 2) ++result.binary_input_clauses;
                  else if (row.size() >= 3) ++result.long_input_clauses;
              }

              if (result.unit_input_clauses == 0 && result.binary_input_clauses == 0) {
          '''
          new_counts = '''    result.normalized_clause_count = static_cast<std::uint32_t>(canonical.size());
              bool has_empty_clause = false;
              for (const Clause& row : canonical) {
                  if (row.empty()) has_empty_clause = true;
                  else if (row.size() == 1) ++result.unit_input_clauses;
                  else if (row.size() == 2) ++result.binary_input_clauses;
                  else if (row.size() >= 3) ++result.long_input_clauses;
              }

              if (!has_empty_clause && result.unit_input_clauses == 0 && result.binary_input_clauses == 0) {
          '''
          old_class = '''    result.class_literals = equivalence_classes(nvars, component, result.class_count);
              result.equivalent_variables_removed = nvars - result.class_count;
              if (result.class_count == nvars && result.unit_input_clauses == 0) {
          '''
          new_class = '''    result.class_literals = equivalence_classes(nvars, component, result.class_count);
              result.equivalent_variables_removed = nvars - result.class_count;
              if (has_empty_clause) {
                  result.contradiction = true;
                  result.conflict_code = 2;
                  result.mapping.assign(nvars, 0);
                  result.fixed.assign(nvars, 0);
                  result.residual_clauses = {Clause{}};
                  return result;
              }
              if (result.class_count == nvars && result.unit_input_clauses == 0) {
          '''

          for label, old, new in (
              ('clause counts', old_counts, new_counts),
              ('empty-clause result', old_class, new_class),
          ):
              if text.count(old) != 1:
                  raise AssertionError(f'{label}: expected one exact match, found {text.count(old)}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/apply-empty-clause-fix.yml').unlink()
          PY
      - name: Run the native-core equivalence contract
        run: |
          python -m pip install 'pytest==9.0.2'
          python -m pytest --noconftest tests/test_general_native_core.py -q
          git diff --check
      - name: Commit the correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve empty-clause contradictions'
          git push origin HEAD:refs/heads/finish-part3
