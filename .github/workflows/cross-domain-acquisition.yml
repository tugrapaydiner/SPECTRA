name: cross-domain-acquisition
on:
  push:
    branches: [research/cross-domain-panel-20260926]
    paths: ['experiments/cross_domain_20260926/PROTOCOL.md', '.github/workflows/cross-domain-acquisition.yml']
permissions:
  contents: read
jobs:
  public-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Acquire official public inputs, preserving source hashes
        run: |
          mkdir -p acquisition/data acquisition/libsvm
          python - <<'PY'
          import urllib.request,hashlib,json,os,zipfile,io
          from pathlib import Path
          root=Path('acquisition');receipt=[]
          data=[('wine',109,'wine'),('vehicle',149,'statlog+vehicle+silhouettes'),('satellite',146,'statlog+landsat+satellite'),('har',240,'human+activity+recognition+using+smartphones'),('sensorless',325,'dataset+for+sensorless+drive+diagnosis')]
          for name,ident,slug in data:
              url=f'https://archive.ics.uci.edu/static/public/{ident}/{slug.replace("+","%2B")}.zip'
              with urllib.request.urlopen(url,timeout=150) as response: raw=response.read(128*1024*1024+1)
              if len(raw)>128*1024*1024 or raw[:2]!=b'PK':raise ValueError(f'bad archive {name}')
              archive=zipfile.ZipFile(io.BytesIO(raw));assert archive.testzip() is None
              (root/'data'/f'{name}.zip').write_bytes(raw)
              receipt.append(dict(name=name,url=url,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest()))
          # Pinned public upstream source; comparison-only, no credentials or writes.
          for name in ('svm.cpp','svm.h','COPYRIGHT'):
              url='https://raw.githubusercontent.com/cjlin1/libsvm/v337/'+name
              with urllib.request.urlopen(url,timeout=60) as response: raw=response.read(1024*1024+1)
              if len(raw)>1024*1024:raise ValueError('source cap')
              (root/'libsvm'/name).write_bytes(raw)
              receipt.append(dict(name='libsvm/'+name,url=url,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest()))
          (root/'acquisition.json').write_text(json.dumps(dict(source_commit=os.environ['GITHUB_SHA'],files=receipt),indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectra-cross-domain-inputs-${{ github.sha }}
          path: acquisition/
          if-no-files-found: error
          retention-days: 30
