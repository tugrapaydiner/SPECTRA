name: apply-auto-selector-v6

on:
  push:
    branches: [performance/automatic-engine-selection]
    paths: [.github/workflows/apply-auto-selector-v6.yml]

permissions:
  contents: write

concurrency:
  group: apply-auto-selector-v6
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Apply the frozen v6 policy
        run: python scripts/apply_auto_selector_v6.py

      - name: Check source identity and focused contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          cmp spectra/_native/exact_binary.cpp experiments/compiled_query/exact_native.cpp
          python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_auto_selector_v6.py \
            tests/public/test_exact_api.py \
            tests/public/test_exact_bank_tile64.py \
            tests/public/test_exact_packet_packing.py
          python -m pytest -q --confcutdir=experiments/compiled_query \
            experiments/compiled_query/test_itc_exam_transfer.py \
            experiments/compiled_query/test_itc_exam_suite.py

      - name: Publish the selector implementation
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-auto-selector-v6.yml
          git rm scripts/apply_auto_selector_v6.py
          git add -A
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          git commit -m 'Dispatch large tiny banks directly to raw'
          git push origin HEAD:performance/automatic-engine-selection
