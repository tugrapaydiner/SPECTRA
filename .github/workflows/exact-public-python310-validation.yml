name: exact-public-python310-validation
on:
  push:
    branches: [validation/exact-public-api-py310-20261015]
permissions:
  contents: read
concurrency:
  group: exact-public-python310-validation
  cancel-in-progress: false
jobs:
  installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 575eb1e657fc8c5d06fd56a519efd59f95dc0a2d
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'build==1.3.0' 'pytest==9.0.2' 'python-sat==1.9.dev15'
      - name: Run source and installed-wheel contracts at the declared Python floor
        run: |
          set -euo pipefail
          mkdir -p python310-evidence
          git rev-parse HEAD > python310-evidence/source_commit.txt
          git rev-parse HEAD^{tree} > python310-evidence/source_tree.txt
          python -VV > python310-evidence/python.txt
          export SPECTRA_EXACT_LIBRARY="$(python -c "from spectra.exact import build_exact_runtime; print(build_exact_runtime('python310-evidence/source-build'))")"
          python -m pytest tests/public/test_exact_api.py --confcutdir=tests/public -q --junitxml=python310-evidence/public-tests.xml 2>&1 | tee python310-evidence/public-tests.log
          python -m pytest experiments/compiled_query/test_exact.py experiments/compiled_query/test_transfer_hardening.py experiments/compiled_query/test_proof_replay.py experiments/compiled_query/test_linear_construction.py -q --junitxml=python310-evidence/research-tests.xml 2>&1 | tee python310-evidence/research-tests.log
          python -m build --wheel --outdir python310-evidence/dist 2>&1 | tee python310-evidence/build.log
          python -m venv python310-evidence/install
          python310-evidence/install/bin/python -m pip install --no-deps python310-evidence/dist/*.whl
          python310-evidence/install/bin/python -I scripts/check_exact_installation.py --out python310-evidence/installed.json 2>&1 | tee python310-evidence/installed.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-public-python310-${{ github.run_id }}
          path: python310-evidence/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
