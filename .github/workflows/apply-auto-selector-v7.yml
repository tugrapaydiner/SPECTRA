name: apply-auto-selector-v7

on:
  push:
    branches: [performance/automatic-engine-selection-v7]
    paths: [.github/workflows/apply-auto-selector-v7.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Apply the frozen selector rule
        run: python scripts/apply_auto_selector_v7.py
      - name: Run focused contracts
        run: |
          python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'
          python -m py_compile experiments/compiled_query/auto_selector_benchmark.py
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_auto_selector_v7.py \
            tests/public/test_exact_api.py \
            tests/public/test_exact_bank_tile64.py
      - name: Commit the implementation
        run: |
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          git add spectra experiments tests docs
          git commit -m 'Improve automatic engine selection' -m 'Keep short, contradictory, and small high-pin banks on raw while routing feasible long banks to the faster SCC engine. Preserve explicit modes, packet formats, answers, proofs, and resource limits.'
          git push origin HEAD:performance/automatic-engine-selection-v7
