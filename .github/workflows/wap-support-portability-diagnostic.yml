name: WAP cross-version portability diagnosis
on:
  push:
    branches: [research/wap-support-results-20261009]
    paths: [.github/workflows/wap-support-portability-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    name: diagnose-${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu22-python313
            os: ubuntu-22.04
            python: '3.13'
          - label: ubuntu24-python311
            os: ubuntu-24.04
            python: '3.11'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      FROZEN_COMMIT: 0af6fda36c60a110584e7db836ee5724e530fbd4
      UPSTREAM_COMMIT: 4932048642da2144f387961b595112277afff82f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Materialize untouched frozen source
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/spectra-frozen "$FROZEN_COMMIT"
          test "$(git -C /tmp/spectra-frozen rev-parse HEAD)" = "$FROZEN_COMMIT"
          test "$(sha256sum /tmp/spectra-frozen/experiments/wap_support/FREEZE.json | cut -d' ' -f1)" = "31997d38cced5e5611f3f17dc6bc3929b21dcc92a6b7bc81a78db31aab949020"
          mkdir -p "delivery-${{ matrix.label }}/graphs"
          git -C /tmp/spectra-frozen rev-parse HEAD > "delivery-${{ matrix.label }}/source-commit.txt"
          git -C /tmp/spectra-frozen rev-parse HEAD^{tree} > "delivery-${{ matrix.label }}/source-tree.txt"
      - name: Install exact controls and record environment
        run: |
          python -m pip install -q pytest==9.0.2 'python-sat==1.9.dev15'
          python -m pip freeze > "delivery-${{ matrix.label }}/environment.txt"
          python --version > "delivery-${{ matrix.label }}/python.txt"
          g++ --version > "delivery-${{ matrix.label }}/compiler.txt"
      - name: Focused correctness contracts
        working-directory: /tmp/spectra-frozen
        run: |
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_wap_support.py \
            tests/public/test_wap_support_audit.py \
            tests/public/test_quotient_native_contract.py \
            tests/public/test_arcfree_support.py \
            > "$GITHUB_WORKSPACE/delivery-${{ matrix.label }}/contracts.log" 2>&1
      - name: Acquire and verify exact exposed graphs
        working-directory: /tmp/spectra-frozen
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/delivery-${{ matrix.label }}"
          for name in wap02a.col wap03a.col wap04a.col wap07a.col wap08a.col; do
            curl --fail --location --retry 3 --retry-all-errors \
              "https://raw.githubusercontent.com/marijnheule/clicolcom/${UPSTREAM_COMMIT}/graphs/${name}" \
              -o "$OUT/graphs/${name}"
          done
          python - "$OUT" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          out=Path(sys.argv[1]); inventory=json.load(open('experiments/quotient_application/WAP_UPSTREAM_INVENTORY.json'))
          names=['wap02a.col','wap03a.col','wap04a.col','wap07a.col','wap08a.col']; rows=[]
          for name in names:
              record=inventory['graphs'][name]; data=(out/'graphs'/name).read_bytes()
              blob=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
              assert record['role']=='prospective_holdout' and len(data)==record['bytes'] and blob==record['git_blob_sha1']
              rows.append({'name':name,'bytes':len(data),'git_blob_sha1':blob,'sha256':hashlib.sha256(data).hexdigest()})
          (out/'graph-acquisition.json').write_text(json.dumps({'schema':'spectra.wap_support.exposed_acquisition.v1','graphs':rows},indent=2,sort_keys=True)+'\n')
          PY
      - name: Build runtime and deterministic cases
        working-directory: /tmp/spectra-frozen
        run: |
          OUT="$GITHUB_WORKSPACE/delivery-${{ matrix.label }}"
          python -c "from spectra.cnf.quotient_query import build_quotient_runtime; print(build_quotient_runtime('$OUT/native'))" > "$OUT/runtime-path.txt"
          python -m experiments.wap_support.run build-cases \
            --graphs "$OUT/graphs" \
            --inventory experiments/quotient_application/WAP_UPSTREAM_INVENTORY.json \
            --out "$OUT/cases" --roles prospective_holdout \
            > "$OUT/case-build.log" 2>&1
      - name: Execute and audit the complete frozen matrix
        working-directory: /tmp/spectra-frozen
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/delivery-${{ matrix.label }}"
          python -m experiments.wap_support.run run \
            --cases "$OUT/cases/cases" \
            --runtime "$(cat "$OUT/runtime-path.txt")" \
            --out "$OUT/evidence" > "$OUT/measurement.log" 2>&1
          python -m experiments.wap_support.analyse \
            --cases "$OUT/cases" --evidence "$OUT/evidence" \
            --runtime "$(cat "$OUT/runtime-path.txt")" \
            --inventory experiments/quotient_application/WAP_UPSTREAM_INVENTORY.json \
            --out "$OUT/analysis.json" --reconstruct-cases \
            --expected-role prospective_holdout > "$OUT/analysis.log" 2>&1
      - name: Separate semantic reproduction from performance portability
        if: always()
        run: |
          python - "delivery-${{ matrix.label }}" <<'PY'
          import hashlib,json,platform,sys
          from pathlib import Path
          root=Path(sys.argv[1]); reasons=[]; analysis=None
          try: analysis=json.load(open(root/'analysis.json'))
          except Exception as exc: reasons.append('missing_or_invalid_analysis:'+type(exc).__name__)
          if analysis is not None and (analysis.get('graphs'),analysis.get('sessions'),analysis.get('answers_audited'))!=(5,105,107520):
              reasons.append('audited_inventory_differs')
          receipt={'schema':'spectra.wap_support.portability_diagnostic.v1','label':'${{ matrix.label }}',
                   'source_commit':'0af6fda36c60a110584e7db836ee5724e530fbd4',
                   'confirmation_run':37883619073,
                   'semantic_status':'PASS' if not reasons else 'FAIL',
                   'semantic_failure_reasons':reasons,
                   'frozen_performance_gate':None if analysis is None else analysis.get('verdict'),
                   'analysis':analysis,'platform':platform.platform(),'python':sys.version}
          (root/'PORTABILITY_DIAGNOSTIC.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          manifest={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='SHA256.json'}
          (root/'SHA256.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wap-portability-${{ matrix.label }}-${{ github.run_id }}
          path: delivery-${{ matrix.label }}
          include-hidden-files: true
          retention-days: 90
      - name: Enforce semantic correctness without hiding performance failures
        if: always()
        run: |
          python - <<'PY'
          import json
          result=json.load(open('delivery-${{ matrix.label }}/PORTABILITY_DIAGNOSTIC.json'))
          if result['semantic_status']!='PASS':
              raise SystemExit('semantic reproduction failed: '+', '.join(result['semantic_failure_reasons']))
          print('semantic_status=PASS')
          print('frozen_performance_gate='+str(result['frozen_performance_gate']))
          print(json.dumps(result['analysis']['primary'],sort_keys=True))
          PY
