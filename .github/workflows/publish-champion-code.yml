name: publish-champion-code
on:
  push:
    branches: [research/champion-gauntlet-20261017]
    paths: ['.github/workflows/publish-champion-code.yml']
permissions:
  contents: write
concurrency:
  group: publish-champion-code
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply the frozen source transport
        env:
          EXPECTED_B64: 565d66450921a59c33d46dfb4e9ef8af7207097c4b41e352e1b4828d2fef514a
          EXPECTED_XZ: 2bd90ff70d57617b10cd631b756774e8c60359936b70e12437ded9c95f674ca5
          EXPECTED_PATCH: 2fa4afdf4f0898feec97c3266d815abb3fa0c00263f67defdc30d338080de929
        run: |
          set -euo pipefail
          mkdir -p /tmp/champion-publication
          python - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          payload = Path('.delivery/champion-code.patch.xz.b64').read_bytes()
          def check(data, key):
              got = hashlib.sha256(data).hexdigest()
              if got != os.environ[key]:
                  raise RuntimeError(f'{key} mismatch: {got}')
          check(payload, 'EXPECTED_B64')
          archive = base64.b64decode(payload, validate=True)
          check(archive, 'EXPECTED_XZ')
          patch = lzma.decompress(archive)
          check(patch, 'EXPECTED_PATCH')
          Path('/tmp/champion-publication/champion-code.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/champion-publication/champion-code.patch
          git apply --index /tmp/champion-publication/champion-code.patch
          git diff --cached --name-only -z > /tmp/champion-publication/changed.paths
          python - <<'PY'
          from pathlib import Path
          expected = {
              'experiments/compiled_query/CHAMPION_GAUNTLET_PROTOCOL_20261017.md',
              'experiments/compiled_query/champion_competitors.py',
              'experiments/compiled_query/champion_gauntlet.py',
              'experiments/compiled_query/sessions.py',
              'experiments/compiled_query/study.py',
              'experiments/compiled_query/test_champion_competitors.py',
          }
          paths = {p.decode() for p in Path('/tmp/champion-publication/changed.paths').read_bytes().split(b'\0') if p}
          if paths != expected:
              raise RuntimeError(f'changed-path mismatch: {sorted(paths)}')
          PY
          git rm -r .delivery
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          git commit -m 'Add frozen strong-competitor development gauntlet'
          git rev-parse HEAD > /tmp/champion-publication/source_commit.txt
          git rev-parse HEAD^{tree} > /tmp/champion-publication/source_tree.txt
          sha256sum /tmp/champion-publication/champion-code.patch > /tmp/champion-publication/SHA256SUMS.txt
          git push origin HEAD:research/champion-gauntlet-20261017
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: champion-code-publication-${{ github.run_id }}
          path: /tmp/champion-publication/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
