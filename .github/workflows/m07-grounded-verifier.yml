name: m07-grounded-verifier

on:
  push:
    branches: [research/m07-grounded-verifier]
    paths:
      - '.github/workflows/m07-grounded-verifier.yml'
      - 'docs/M07_PROTOCOL.md'
      - 'model/grounded_verifier.py'
      - 'eval/grounded_checkpoint.py'
      - 'eval/grounded_mcts.py'
      - 'eval/grounded_targets.py'
      - 'train/distill.py'
      - 'scripts/train_grounded_verifier.py'
      - 'tests/test_m07_grounded_verifier.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grounded-verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install CPU dependencies
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .m07
          timeout 360s python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4" |& tee .m07/install_torch.txt
          timeout 180s python -m pip install -r requirements.txt |& tee .m07/install_requirements.txt
          python - <<'PY' | tee .m07/environment_bootstrap.txt
          import os, platform, sys, torch, numpy
          print('python=', sys.version)
          print('platform=', platform.platform())
          print('machine=', platform.machine())
          print('logical_cpus=', os.cpu_count())
          print('torch=', torch.__version__)
          print('numpy=', numpy.__version__)
          print('cuda_available=', torch.cuda.is_available())
          PY

      - name: Compile and run focused M07 contracts
        shell: bash
        run: |
          set +e
          set -o pipefail
          python -m py_compile \
            model/grounded_verifier.py \
            eval/grounded_checkpoint.py \
            eval/grounded_mcts.py \
            eval/grounded_targets.py \
            scripts/train_grounded_verifier.py
          compile_code=$?
          timeout 300s python -m pytest tests/test_m07_grounded_verifier.py -q |& tee .m07/pytest_m07.txt
          test_code=${PIPESTATUS[0]}
          echo "$compile_code" > .m07/compile_exit_code.txt
          echo "$test_code" > .m07/focused_exit_code.txt
          exit 0

      - name: Run grounded verifier experiment
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 1800s python scripts/train_grounded_verifier.py --out .m07/experiment |& tee .m07/run.log
          code=${PIPESTATUS[0]}
          echo "$code" | tee .m07/experiment_exit_code.txt
          exit 0

      - name: Verify M07 evidence gate
        if: always()
        shell: bash
        run: |
          set +e
          python - <<'PY' | tee .m07/evidence_check.txt
          import json, pathlib, sys
          root=pathlib.Path('.m07/experiment')
          required=[
            'reasoner.pt','grounded_verifier.pt','z_only_ablation.pt','summary.json',
            'metrics.json','target_provenance.json','freeze_audit.json','aliasing_audit.json',
            'depth_metrics.json','training_report.json','exact_commands.json','SUMMARY.md',
          ]
          missing=[p for p in required if not (root/p).is_file()]
          print('missing=', missing)
          if missing: sys.exit(2)
          s=json.loads((root/'summary.json').read_text())
          print(json.dumps(s, indent=2, sort_keys=True))
          assert s['status']=='complete', s['status']
          assert s['acceptance_useful_meaning'] is True
          assert s['test_reference_target_used'] is False
          assert s['mcts_bootstrap_used_as_ground_truth'] is False
          assert s['state_representation']=='search_state_xyz_v1'
          assert s['target']['target_id']=='sudoku_one_cycle_improvement_v1'
          assert s['reasoner_frozen']['unchanged'] is True
          assert s['primary_heldout']['positive'] > 0 and s['primary_heldout']['negative'] > 0
          assert s['primary_heldout']['roc_auc'] >= 0.60
          print('M07_EVIDENCE_GATE=PASS')
          PY
          echo "$?" | tee .m07/evidence_check_exit_code.txt
          exit 0

      - name: Full fast regression
        if: always()
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 600s python -m pytest -m "not slow" -ra |& tee .m07/pytest_fast.txt
          code=${PIPESTATUS[0]}
          echo "$code" | tee .m07/fast_exit_code.txt
          exit 0

      - name: Record provenance and evidence hashes
        if: always()
        shell: bash
        run: |
          {
            echo "head=$(git rev-parse HEAD)"
            echo "base=dbec23dd2077fc9f23e6a031b1b2b82c7c731de6"
            echo
            git diff --stat dbec23dd2077fc9f23e6a031b1b2b82c7c731de6...HEAD
          } | tee .m07/diff_stat.txt
          python - <<'PY' | tee .m07/evidence_sha256.txt
          import hashlib, pathlib
          root=pathlib.Path('.m07')
          for p in sorted(q for q in root.rglob('*') if q.is_file() and q.name!='evidence_sha256.txt'):
              print(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}")
          PY

      - name: Upload M07 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m07-grounded-verifier-evidence
          path: .m07/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Enforce M07 acceptance execution
        if: always()
        shell: bash
        run: |
          compile=$(cat .m07/compile_exit_code.txt 2>/dev/null || echo 99)
          focused=$(cat .m07/focused_exit_code.txt 2>/dev/null || echo 99)
          exp=$(cat .m07/experiment_exit_code.txt 2>/dev/null || echo 99)
          evidence=$(cat .m07/evidence_check_exit_code.txt 2>/dev/null || echo 99)
          fast=$(cat .m07/fast_exit_code.txt 2>/dev/null || echo 99)
          echo "compile=$compile focused=$focused experiment=$exp evidence=$evidence fast=$fast"
          if [ "$compile" -ne 0 ] || [ "$focused" -ne 0 ] || [ "$exp" -ne 0 ] || [ "$evidence" -ne 0 ] || [ "$fast" -ne 0 ]; then
            echo "M07 acceptance failed; inspect retained evidence."
            exit 1
          fi
          echo "M07 acceptance passed."
