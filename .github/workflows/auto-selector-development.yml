name: auto-selector-development

on:
  push:
    branches: [performance/smarter-auto-selection]
    paths: [.github/workflows/auto-selector-development.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-selector-development
  cancel-in-progress: false

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  development-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install focused contracts
        run: python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'

      - name: Verify the selector study and exact API contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p selector-evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet
          git rev-parse HEAD > selector-evidence/source-commit.txt
          git rev-parse HEAD^{tree} > selector-evidence/source-tree.txt
          python -m py_compile experiments/compiled_query/auto_selector_development.py
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_exact_api.py \
            tests/public/test_exact_bank_tile64.py \
            2>&1 | tee selector-evidence/contracts.log

      - name: Build the receipt-bound exact runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > selector-evidence/library.txt
          from spectra.exact import build_exact_runtime
          print(build_exact_runtime('selector-evidence/native'))
          PY

      - name: Run the exposed development oracle study
        shell: bash
        run: |
          set -euo pipefail
          python -m experiments.compiled_query.auto_selector_development run \
            --root selector-evidence/study \
            --library "$(cat selector-evidence/library.txt)" \
            2>&1 | tee selector-evidence/run.log
          python -m experiments.compiled_query.auto_selector_development audit \
            --root selector-evidence/study \
            2>&1 | tee selector-evidence/audit.log

      - name: Hash retained evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          root = Path('selector-evidence')
          manifest = {}
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'SHA256.json':
                  manifest[str(path.relative_to(root))] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / 'SHA256.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auto-selector-development-${{ github.run_id }}
          path: selector-evidence/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
