name: publish-100-blitz
on:
  push:
    branches: [research/100-blitz-20261016]
    paths: ['.github/workflows/publish-100-blitz.yml']
permissions:
  contents: write
concurrency:
  group: publish-100-blitz
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and reconstruct reviewed patch
        env:
          EXPECTED_B64: f75650c04f59e0ae6e02d2190ebd56668442d790276d5cc9fa3dc11d188108a7
          EXPECTED_XZ: 31780857b8f024c4cb4f1144d04f8e8fdebf8b902ab1acd7c293673aacaef036
          EXPECTED_PATCH: dcd47a5a9a621f9f20d91cf040cc125c5300089b699dbacfbd25a2be84e83ab6
        run: |
          set -euo pipefail
          mkdir -p /tmp/blitz
          cat .delivery/100-blitz-source/{00,01,02,03,04,05,06,07,08,09} > /tmp/blitz/patch.xz.b64
          test "$(sha256sum /tmp/blitz/patch.xz.b64 | cut -d' ' -f1)" = "$EXPECTED_B64"
          base64 --decode /tmp/blitz/patch.xz.b64 > /tmp/blitz/patch.xz
          test "$(sha256sum /tmp/blitz/patch.xz | cut -d' ' -f1)" = "$EXPECTED_XZ"
          xz --decompress --stdout /tmp/blitz/patch.xz > /tmp/blitz/reviewed.patch
          test "$(sha256sum /tmp/blitz/reviewed.patch | cut -d' ' -f1)" = "$EXPECTED_PATCH"
      - name: Validate base identities and publish atomically
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD:spectra/exact.py)" = 983d33551e29d13016e36cd6038d02d270575b66
          test "$(git rev-parse HEAD:spectra/_native/exact_binary.cpp)" = 96182ee6c7754d24e1c8bc46181dd69a5732d32f
          test "$(git rev-parse HEAD:experiments/compiled_query/exact.py)" = 780a7ff1d8f293450fb592ae9e29e129e92a551c
          test "$(git rev-parse HEAD:experiments/compiled_query/exact_native.cpp)" = 96182ee6c7754d24e1c8bc46181dd69a5732d32f
          git apply --check --index /tmp/blitz/reviewed.patch
          git apply --index /tmp/blitz/reviewed.patch
          git diff --cached --name-only -z > /tmp/blitz/changed.paths
          python - <<'PY'
          from pathlib import Path
          expected = {
              'docs/EXAM_REPAIR.md',
              'experiments/compiled_query/ITC_EXAM_SUITE_PROTOCOL.md',
              'experiments/compiled_query/ITC_EXAM_TRANSFER_PROTOCOL.md',
              'experiments/compiled_query/exact.py',
              'experiments/compiled_query/exact_native.cpp',
              'experiments/compiled_query/itc_exam_suite.py',
              'experiments/compiled_query/itc_exam_transfer.py',
              'experiments/compiled_query/test_exact.py',
              'experiments/compiled_query/test_itc_exam_suite.py',
              'experiments/compiled_query/test_itc_exam_transfer.py',
              'scripts/check_exam_repair_installation.py',
              'spectra/_native/exact_binary.cpp',
              'spectra/exact.py',
              'spectra/exam_repair.py',
              'spectra/itc2007_exam.py',
              'tests/public/test_exam_repair.py',
              'tests/public/test_itc2007_exam.py',
          }
          changed = {
              item.decode('utf-8')
              for item in Path('/tmp/blitz/changed.paths').read_bytes().split(b'\0')
              if item
          }
          if changed != expected:
              raise RuntimeError(f'changed path set differs: {sorted(changed ^ expected)}')
          PY
          git rm -r .delivery/100-blitz-source
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Workflow changes are not permitted in the reconstructed code commit.' >&2
            exit 1
          fi
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          git commit -m 'Publish proof-carrying exam repair and prospective ITC suite'
          git push origin HEAD:research/100-blitz-20261016
