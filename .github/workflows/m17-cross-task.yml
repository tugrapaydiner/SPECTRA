name: m17-cross-task-cpu
on:
  push:
    branches: [research/verifier-aligned-cpu-search]
    paths: ['docs/M17_RUN_REQUEST.json']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: m17-science-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frozen-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MAX_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce explicit run request and untouched execution
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/research/verifier-aligned-cpu-search
          test ! -e results/m17/executed/summary.json
          git merge-base --is-ancestor fe15894d1d57afb99a9235462c76acde3fa28d89 HEAD
          python - <<'PY'
          import json, pathlib, subprocess
          p=json.loads(pathlib.Path('docs/M17_RUN_REQUEST.json').read_text())
          assert p['request_id']=='m17-20260910-01' and p['cpu_only'] is True
          assert p['protocol_commit']=='fe15894d1d57afb99a9235462c76acde3fa28d89'
          subprocess.run(['git','merge-base','--is-ancestor',p['implementation_commit'],'HEAD'], check=True)
          PY
          mkdir -p .m17
          git rev-parse HEAD > .m17/source_commit.txt
          git archive --format=tar HEAD -- . ':!results/m16/runs' ':!results/m16/sources' ':!results/m17/runs' > .m17/source.tar
          sha256sum .m17/source.tar > .m17/source_sha256.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU environment
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install -r requirements-cpu-research.txt
          python -m pip freeze > .m17/environment.lock.txt
      - name: Run frozen experiment, retaining negative outcomes
        run: |
          set -o pipefail
          timeout 6600s python scripts/m17_cross_task.py \
            --accepted-m16 results/m16/runs/accepted-34522192590.tar.gz \
            --evidence-dir results/m16/sources --out .m17/experiment | tee .m17/experiment.log
          python - <<'PY'
          import json, pathlib
          s=json.loads(pathlib.Path('.m17/experiment/summary.json').read_text())
          assert s['execution_status']=='COMPLETE' and s['device']=='cpu'
          print('M17_EXECUTION='+s['execution_status'])
          print('M17_SCIENTIFIC_STATUS='+s['scientific_status'])
          print('M17_TWO_FAMILY_GATE_PASS='+str(s['two_family_gate_pass']))
          PY
      - name: Hash all evidence including any failure record
        if: always()
        run: |
          python - <<'PY'
          import hashlib, pathlib
          root=pathlib.Path('.m17'); root.mkdir(exist_ok=True)
          with (root/'evidence_sha256.txt').open('w') as f:
              for p in sorted(root.rglob('*')):
                  if p.is_file() and p.name!='evidence_sha256.txt':
                      f.write(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p.relative_to(root))+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m17-evidence-${{ github.run_id }}-${{ github.sha }}
          path: .m17/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - name: Persist this outcome without modifying main or selecting a better run
        if: always()
        env:
          BRANCH: research/verifier-aligned-cpu-search
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$BRANCH"
          test -f .m17/evidence_sha256.txt
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - -C .m17 . | gzip -n > "$RUNNER_TEMP/m17-evidence.tar.gz"
          git fetch origin "$BRANCH"
          git worktree add "$RUNNER_TEMP/m17-publish" FETCH_HEAD
          dest="$RUNNER_TEMP/m17-publish/results/m17"
          mkdir -p "$dest/runs"
          name="${GITHUB_RUN_ID}-${GITHUB_SHA}.tar.gz"
          test ! -e "$dest/runs/$name"
          cp "$RUNNER_TEMP/m17-evidence.tar.gz" "$dest/runs/$name"
          if test -f .m17/experiment/summary.json; then
            test ! -e "$dest/executed/summary.json"
            mkdir -p "$dest/executed"
            cp .m17/experiment/summary.json "$dest/executed/summary.json"
            cp .m17/experiment/environment.json "$dest/executed/environment.json"
            cp .m17/evidence_sha256.txt "$dest/executed/evidence_sha256.txt"
          fi
          cd "$RUNNER_TEMP/m17-publish"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f results/m17/runs results/m17/executed 2>/dev/null || git add -f results/m17/runs
          git commit -m "[skip ci] M17: retain complete outcome ${GITHUB_RUN_ID}; scientific status is explicit"
          git push origin "HEAD:refs/heads/$BRANCH"
