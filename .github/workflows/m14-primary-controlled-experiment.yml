name: m14-primary-controlled-experiment

on:
  push:
    branches: [research/m14-primary-controlled-experiment]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primary-controlled-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install CPU experiment dependencies
        run: |
          set -euxo pipefail
          mkdir -p .m14
          timeout 360s python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4" |& tee .m14/install_torch.txt
          timeout 240s python -m pip install -r requirements.txt matplotlib |& tee .m14/install_requirements.txt

      - name: Verify preregistration ancestry and compile M14 paths
        shell: bash
        run: |
          set +e
          git merge-base --is-ancestor 99102c30f87661f6767c586ba6f81971e32a654c HEAD
          prereg=$?
          python -m py_compile scripts/m14_primary_experiment.py scripts/render_m14_results.py tests/test_m14_primary_experiment.py
          compile=$?
          echo "$prereg" | tee .m14/prereg_exit_code.txt
          echo "$compile" | tee .m14/compile_exit_code.txt
          exit 0

      - name: Focused M14 contracts
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 600s python -m pytest tests/test_m14_primary_experiment.py tests/test_energy_measurement.py -m "not slow" -q |& tee .m14/pytest_m14.txt
          code=${PIPESTATUS[0]}
          echo "$code" | tee .m14/focused_exit_code.txt
          exit 0

      - name: Run preregistered trained-model experiment
        shell: bash
        run: |
          set +e
          set -o pipefail
          rm -rf .m14/experiment
          timeout 2700s python scripts/m14_primary_experiment.py --out .m14/experiment |& tee .m14/experiment.log
          code=${PIPESTATUS[0]}
          echo "$code" | tee .m14/experiment_exit_code.txt
          exit 0

      - name: Render table and Pareto plot directly from raw artifacts
        shell: bash
        run: |
          set +e
          set -o pipefail
          if [ -f .m14/experiment/summary.json ]; then
            python scripts/render_m14_results.py --experiment .m14/experiment --out .m14/rendered |& tee .m14/render.log
            code=${PIPESTATUS[0]}
          else
            echo "summary missing; renderer not run" | tee .m14/render.log
            code=3
          fi
          echo "$code" | tee .m14/render_exit_code.txt
          exit 0

      - name: Verify M14 evidence hierarchy
        shell: bash
        run: |
          set +e
          python - <<'PY' |& tee .m14/evidence_check.txt
          import csv, hashlib, json, pathlib, sys
          root=pathlib.Path('.m14/experiment'); rendered=pathlib.Path('.m14/rendered')
          required=[
              root/'summary.json', root/'environment.json', root/'energy_inventory.json',
              root/'manifests/train_validation_development.json', root/'training_runs.jsonl',
              root/'verifier_runs.jsonl', root/'validation_rows.jsonl',
              root/'validation_operating_points.json', root/'candidate_selection.json',
              root/'development_rows_main.jsonl', root/'development_effect_main.json',
              root/'development_decision_main.json', rendered/'result_table.csv',
              rendered/'result_table.md', rendered/'pareto.png', rendered/'provenance.json',
          ]
          missing=[str(p) for p in required if not p.is_file()]
          print('missing=',missing)
          if missing: sys.exit(2)
          summary=json.loads((root/'summary.json').read_text())
          print(json.dumps(summary,indent=2,sort_keys=True))
          assert summary['milestone']==14
          assert summary['protocol_committed_before_results'] is True
          assert summary['primary_metric']=='strict_sudoku_semantic_validity'
          assert summary['primary_baseline']=='single_pass_fp'
          assert summary['n_training_seeds']==5
          assert summary['training_seeds']==[1401,2402,3403,4404,5405]
          assert summary['thresholds_changed_after_results'] is False
          assert summary['baseline_weakened'] is False
          assert summary['favorable_seed_filtering'] is False
          assert summary['scaling_law_claim'] is False
          train_lines=[json.loads(x) for x in (root/'training_runs.jsonl').read_text().splitlines() if x.strip()]
          main=[r for r in train_lines if r['kind'] in {'fp_recursive','ternary_recursive','single_pass'}]
          assert len(main)==15
          assert {r['seed'] for r in main}=={1401,2402,3403,4404,5405}
          counts={k:{r['architecture']['trainable_params'] for r in main if r['kind']==k} for k in ['fp_recursive','ternary_recursive','single_pass']}
          assert len(counts['fp_recursive'])==len(counts['ternary_recursive'])==len(counts['single_pass'])==1
          assert next(iter(counts['single_pass'])) > max(next(iter(counts['fp_recursive'])), next(iter(counts['ternary_recursive'])))
          verifier=[json.loads(x) for x in (root/'verifier_runs.jsonl').read_text().splitlines() if x.strip()]
          assert len(verifier)==10 and all(v['fixed_actions_trained'] is False for v in verifier)
          selection=json.loads((root/'candidate_selection.json').read_text())
          assert selection['selection_used_development'] is False and selection['selection_used_confirmation'] is False
          assert selection['selected_config_id']
          val_points=json.loads((root/'validation_operating_points.json').read_text())
          assert any(r['config_id']=='single_pass_fp' for r in val_points)
          assert any(r['config_id'].startswith('fp_n') for r in val_points)
          assert any(r['config_id'].startswith('ternary_n') for r in val_points)
          assert any('search' in r['config_id'] for r in val_points)
          # Any point outside the declared tolerance must remain explicitly unmatched.
          for r in selection['all_candidate_validation']:
              ratio=r.get('validation_latency_ratio_vs_baseline')
              if ratio is not None and not (0.85 <= ratio <= 1.15):
                  assert r['latency_match_status']=='unmatched'
          # Confirmation cannot exist before a development pass/freeze.
          if summary['confirmation_opened']:
              for p in [root/'confirmation_freeze_manifest.json',root/'manifests/confirmation_1.json',root/'manifests/confirmation_overlap_audit.json',root/'confirmation_rows.jsonl',root/'confirmation_effect.json',root/'confirmation_decision.json']:
                  assert p.is_file(), p
              freeze=json.loads((root/'confirmation_freeze_manifest.json').read_text())
              audit=json.loads((root/'manifests/confirmation_overlap_audit.json').read_text())
              conf=json.loads((root/'confirmation_decision.json').read_text())
              assert freeze['frozen_before_confirmation'] is True
              assert audit['overlap_count']==0
              assert summary['development_gate']['pass'] is True
              assert summary['confirmation_manifest_opened_only_after_development_pass'] is True
              if summary['status']=='COMPLETE':
                  assert summary['claim_confirmed'] is True and conf['pass'] is True
              else:
                  assert summary['claim_confirmed'] is False
          else:
              assert not (root/'manifests/confirmation_1.json').exists()
              assert summary['status']=='INCOMPLETE'
          prov=json.loads((rendered/'provenance.json').read_text())
          sha=lambda p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          assert prov['result_table_sha256']==sha(rendered/'result_table.csv')
          assert prov['pareto_plot_sha256']==sha(rendered/'pareto.png')
          assert prov['summary_sha256']==sha(root/'summary.json')
          assert prov['primary_baseline']=='single_pass_fp'
          assert 'unmatched points are not called iso-budget' in prov['latency_matching_rule']
          print('M14_EVIDENCE_HIERARCHY=VALID')
          print('M14_STATUS='+summary['status'])
          PY
          echo "$?" | tee .m14/evidence_check_exit_code.txt
          exit 0

      - name: Full fast regression
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 900s python -m pytest -m "not slow" -ra |& tee .m14/pytest_fast.txt
          code=${PIPESTATUS[0]}
          echo "$code" | tee .m14/fast_exit_code.txt
          exit 0

      - name: Record provenance and hashes
        if: always()
        run: |
          {
            echo "head=$(git rev-parse HEAD)"
            echo "base=b9e2decf19dcc772bfcef3a78615c2f4c8b350c0"
            echo "protocol_prereg_commit=99102c30f87661f6767c586ba6f81971e32a654c"
            echo
            git diff --stat b9e2decf19dcc772bfcef3a78615c2f4c8b350c0...HEAD
          } | tee .m14/diff_stat.txt
          python - <<'PY' | tee .m14/evidence_sha256.txt
          import hashlib,pathlib
          root=pathlib.Path('.m14')
          for p in sorted(q for q in root.rglob('*') if q.is_file() and q.name!='evidence_sha256.txt'):
              print(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}")
          PY

      - name: Upload M14 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m14-primary-controlled-experiment-evidence
          path: .m14/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Enforce positive M14 acceptance
        if: always()
        run: |
          prereg=$(cat .m14/prereg_exit_code.txt 2>/dev/null || echo 99)
          compile=$(cat .m14/compile_exit_code.txt 2>/dev/null || echo 99)
          focused=$(cat .m14/focused_exit_code.txt 2>/dev/null || echo 99)
          experiment=$(cat .m14/experiment_exit_code.txt 2>/dev/null || echo 99)
          render=$(cat .m14/render_exit_code.txt 2>/dev/null || echo 99)
          evidence=$(cat .m14/evidence_check_exit_code.txt 2>/dev/null || echo 99)
          fast=$(cat .m14/fast_exit_code.txt 2>/dev/null || echo 99)
          status=$(python - <<'PY'
          import json,pathlib
          p=pathlib.Path('.m14/experiment/summary.json')
          print(json.loads(p.read_text()).get('status','MISSING') if p.is_file() else 'MISSING')
          PY
          )
          echo "prereg=$prereg compile=$compile focused=$focused experiment=$experiment render=$render evidence=$evidence fast=$fast status=$status"
          if [ "$prereg" -ne 0 ] || [ "$compile" -ne 0 ] || [ "$focused" -ne 0 ] || [ "$render" -ne 0 ] || [ "$evidence" -ne 0 ] || [ "$fast" -ne 0 ]; then
            echo "M14 experiment/evidence integrity failure."
            exit 1
          fi
          if [ "$experiment" -ne 0 ] || [ "$status" != "COMPLETE" ]; then
            echo "M14 valid experiment may have completed, but the preregistered practical-improvement claim is not independently confirmed. Milestone remains INCOMPLETE."
            exit 1
          fi
          echo "M14 primary controlled experiment acceptance passed."
