name: auto-selector-v10-itc-balanced

on:
  push:
    branches: [performance/automatic-engine-selection-v10]
    paths: [.github/workflows/auto-selector-v10-itc-balanced.yml]

permissions:
  contents: read

concurrency:
  group: auto-selector-v10-itc-balanced
  cancel-in-progress: false

env:
  SOURCE_COMMIT: 79520b8340ed9e16f8eda836b03d5ac1ede409e8
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  balanced:
    name: balanced-${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86-64
            runner: ubuntu-24.04
          - label: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: davidvanbulck/ITC-2007-CETT
          ref: ed2d4c0cf5302b77a8b321cd0380de0bb579d538
          path: upstream/ITC-2007-CETT
          persist-credentials: false
      - name: Freeze set9 and build the exact runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p balanced-evidence
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python -m experiments.compiled_query.itc_exam_transfer freeze \
            --root balanced-evidence/set9 \
            --instance upstream/ITC-2007-CETT/examtt-instances/Instances/set9.exam \
            --solution upstream/ITC-2007-CETT/InitMethods/SolStore/set9_OBSIFeas_0.sol \
            --queries 1024 \
            --license upstream/ITC-2007-CETT/LICENSE \
            --evaluation-role development \
            --dataset-instance-path examtt-instances/Instances/set9.exam \
            --dataset-solution-path InitMethods/SolStore/set9_OBSIFeas_0.sol
          python - <<'PY' > balanced-evidence/library.txt
          from spectra.exact import build_exact_runtime
          print(build_exact_runtime('balanced-evidence/native'))
          PY
      - name: Run a position-balanced 32-pair guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, math, statistics, time
          from spectra.exact import ExactRuntime, verify_session_output

          root = Path('balanced-evidence')
          packet = (root / 'set9/session.sbc1').read_bytes()
          runtime = ExactRuntime(Path((root / 'library.txt').read_text().strip()))

          reference = None
          for _ in range(8):
              for mode in ('auto', 'scc'):
                  answer = runtime.solve_session_packet(packet, mode=mode)
                  if reference is None:
                      reference = answer.output
                  assert answer.output == reference
                  assert answer.info['selected_mode'] == 'scc'
                  assert answer.info['auto_policy'] in ('structural-v10', 'explicit')
          assert reference is not None and verify_session_output(packet, reference)

          samples = {'auto': [], 'scc': []}
          orders = []
          outputs = set()
          for repetition in range(32):
              order = ('auto', 'scc') if repetition % 2 == 0 else ('scc', 'auto')
              orders.append(order)
              row = {}
              for mode in order:
                  start = time.perf_counter_ns()
                  answer = runtime.solve_session_packet(packet, mode=mode)
                  elapsed = time.perf_counter_ns() - start
                  row[mode] = elapsed
                  outputs.add(hashlib.sha256(answer.output).hexdigest())
                  assert answer.output == reference
                  assert answer.info['selected_mode'] == 'scc'
              samples['auto'].append(row['auto'])
              samples['scc'].append(row['scc'])

          ratios = [auto / scc for auto, scc in zip(samples['auto'], samples['scc'])]
          median = statistics.median(ratios)
          geomean = math.exp(statistics.fmean(math.log(value) for value in ratios))
          first_half = statistics.median(ratios[:16])
          second_half = statistics.median(ratios[16:])
          result = {
              'schema': 'spectra.auto_selector_itc_balanced.v1',
              'classification': 'set9 development timing correction; original five-round failure retained',
              'source_commit': '79520b8340ed9e16f8eda836b03d5ac1ede409e8',
              'pairs': 32,
              'warmups_per_mode': 8,
              'position_counts': {'auto_first': 16, 'scc_first': 16},
              'paired_ratios': ratios,
              'paired_median_ratio': median,
              'paired_geomean_ratio': geomean,
              'first_half_median_ratio': first_half,
              'second_half_median_ratio': second_half,
              'limit': 1.03,
              'output_sha256': next(iter(outputs)),
              'output_hash_count': len(outputs),
              'selected_mode': 'scc',
              'pass': len(outputs) == 1 and median <= 1.03 and geomean <= 1.03,
          }
          (root / 'result.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          assert result['pass'], result
          PY
      - name: Retain receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > balanced-evidence/source-commit.txt
          git rev-parse HEAD^{tree} > balanced-evidence/source-tree.txt
          python -VV > balanced-evidence/python.txt
          uname -a > balanced-evidence/platform.txt
          lscpu > balanced-evidence/cpu.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('balanced-evidence')
          manifest = {}
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'SHA256.json':
                  manifest[str(path.relative_to(root))] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / 'SHA256.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auto-selector-v10-itc-balanced-${{ matrix.label }}-${{ github.run_id }}
          path: balanced-evidence/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error