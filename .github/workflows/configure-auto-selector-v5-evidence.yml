name: configure-auto-selector-v5-evidence

on:
  push:
    branches: [performance/automatic-engine-selection]
    paths:
      - .github/workflows/configure-auto-selector-v5-evidence.yml
      - scripts/configure_auto_selector_v5_evidence.py

permissions:
  contents: write

concurrency:
  group: configure-auto-selector-v5-evidence
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Configure the v5 development and confirmation panels
        run: python scripts/configure_auto_selector_v5_evidence.py

      - name: Check syntax and focused policy contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          set -euo pipefail
          python -m py_compile \
            experiments/compiled_query/auto_selector_benchmark.py \
            experiments/compiled_query/auto_selector_wap_guard.py
          python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_auto_selector_v5.py \
            tests/public/test_exact_api.py

      - name: Publish the evidence configuration
        run: |
          set -euo pipefail
          git rm .github/workflows/configure-auto-selector-v5-evidence.yml
          git rm scripts/configure_auto_selector_v5_evidence.py
          git add \
            experiments/compiled_query/auto_selector_benchmark.py \
            experiments/compiled_query/auto_selector_wap_guard.py
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          git commit -m 'Challenge the selector near its structural boundaries'
          git push origin HEAD:performance/automatic-engine-selection
