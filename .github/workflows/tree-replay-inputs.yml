name: tree-replay-inputs
on:
  push:
    branches: [research/tree-native-replay]
    paths: [.github/workflows/tree-replay-inputs.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preserve exact source and official inference-library inputs
        shell: python
        run: |
          import pathlib,subprocess,urllib.request,json,hashlib
          out=pathlib.Path('tree-replay-inputs');out.mkdir()
          (out/'source.tar.gz').write_bytes(subprocess.check_output(['git','archive','--format=tar.gz','HEAD']))
          base='f816bb8bc6a6dd9bbb1fe63604f81d7b7752e3ba'
          (out/'base.commit').write_bytes(subprocess.check_output(['git','cat-file','commit',base]))
          (out/'base.tar.gz').write_bytes(subprocess.check_output(['git','archive','--format=tar.gz',base]))
          subprocess.run(['git','bundle','create',str(out/'review.bundle'),'HEAD','^'+base],check=True)
          record={'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'libraries':[]}
          for version in ('1.2.8','1.2.10'):
              url='https://api.github.com/repos/catboost/catboost/releases/tags/v'+version
              request=urllib.request.Request(url,headers={'User-Agent':'SPECTRA-reproduction'})
              with urllib.request.urlopen(request,timeout=60) as f:release=json.load(f)
              name='libcatboostmodel-linux-x86_64-'+version+'.so'
              asset=next(x for x in release['assets'] if x['name']==name)
              with urllib.request.urlopen(asset['browser_download_url'],timeout=60) as f:data=f.read(32*1024*1024+1)
              assert len(data)==asset['size'] and len(data)<=32*1024*1024 and data[:4]==b'\x7fELF'
              digest=hashlib.sha256(data).hexdigest()
              if asset.get('digest'):assert asset['digest']=='sha256:'+digest
              (out/name).write_bytes(data)
              record['libraries'].append({'version':version,'url':asset['browser_download_url'],'id':asset['id'],'bytes':len(data),'sha256':digest,'github_digest':asset.get('digest')})
          for path in ('catboost/libs/model_interface/c_api.h','LICENSE'):
              url='https://raw.githubusercontent.com/catboost/catboost/v1.2.8/'+path
              with urllib.request.urlopen(url,timeout=60) as f:data=f.read(1024*1024+1)
              assert len(data)<=1024*1024
              (out/('catboost-LICENSE' if path=='LICENSE' else 'c_api.h')).write_bytes(data)
          (out/'receipt.json').write_text(json.dumps(record,indent=2))
          (out/'SHA256.json').write_text(json.dumps({p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file()},indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: tree-replay-inputs-${{ github.sha }}
          path: tree-replay-inputs/
          retention-days: 30
          if-no-files-found: error
