name: publish-fast-first-use-candidate

on:
  push:
    branches: [audit/tile64-external-competition-20261017]
    paths: [.github/workflows/publish-fast-first-use-candidate.yml]

permissions:
  contents: write

concurrency:
  group: publish-fast-first-use-candidate
  cancel-in-progress: false

env:
  BASE_COMMIT: 4a647e54e7e7e0756e74b52575f86f03d2764455
  SOURCE_COMMIT: 415036763dc9ea918cbcf69e4a87da23d05c43d4
  CANDIDATE_BRANCH: performance/fast-first-use-sessions
  UPSTREAM_COMMIT: 4932048642da2144f387961b595112277afff82f
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.publish.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Rebuild one clean candidate commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/fast-first-use "$BASE_COMMIT"
          cd /tmp/fast-first-use
          git checkout "$SOURCE_COMMIT" -- \
            experiments/compiled_query/SESSION_PACKET_COLD_PROTOCOL_20261017.md \
            experiments/compiled_query/session_packet_cold_benchmark.py \
            spectra/exact.py \
            spectra/exact_problem.py \
            tests/public/test_exact_packet_packing.py
          python - <<'PY'
          from pathlib import Path

          problem = Path('spectra/exact_problem.py')
          text = problem.read_text()
          text = text.replace('from dataclasses import dataclass',
                              'from dataclasses import dataclass, field')
          text = text.replace(
              '    masks: tuple[int, ...]\n',
              '    masks: tuple[int, ...]\n'
              "    _admitted: bool = field(default=False, init=False, repr=False, compare=False)\n",
          )
          text = text.replace(
              '        if canonical:\n            return cls(n, palette, edge_snapshot, snapshot)\n',
              "        if canonical:\n"
              "            result = cls(n, palette, edge_snapshot, snapshot)\n"
              "            object.__setattr__(result, '_admitted', True)\n"
              "            return result\n",
          )
          text = text.replace(
              '        return cls(n, palette, tuple(sorted(set(copied))), snapshot)\n',
              "        result = cls(n, palette, tuple(sorted(set(copied))), snapshot)\n"
              "        object.__setattr__(result, '_admitted', True)\n"
              "        return result\n",
          )
          problem.write_text(text)

          exact = Path('spectra/exact.py')
          text = exact.read_text()
          text = text.replace('from itertools import chain',
                              'from itertools import accumulate, chain')
          old = '''def _pack_canonical_session_packet(problem: ExactProblem,
                                             rows: tuple[tuple[tuple[int, int], ...], ...]) -> bytes:
              offsets = [0]
              vertices: list[int] = []
              allowed: list[int] = []
              for row in rows:
                  vertices.extend(vertex for vertex, _ in row)
                  allowed.extend(mask for _, mask in row)
                  offsets.append(len(vertices))

              return b''.join((
          '''
          old = '\n'.join(line[12:] if line.startswith('            ') else line
                          for line in old.splitlines())
          new = '''def _pack_canonical_session_packet(problem: ExactProblem,
                                             rows: tuple[tuple[tuple[int, int], ...], ...]) -> bytes:
              offsets = [0, *accumulate(map(len, rows))]
              vertices = [pair[0] for row in rows for pair in row]
              allowed = [pair[1] for row in rows for pair in row]

              return b''.join((
          '''
          new = '\n'.join(line[12:] if line.startswith('            ') else line
                          for line in new.splitlines())
          if old not in text:
              raise SystemExit('canonical packer source changed')
          text = text.replace(old, new)
          old = '''def pack_session_packet(problem: ExactProblem,
                                  queries: Iterable[Iterable[Sequence[int]]]) -> bytes:
              """Validate ordinary inputs and create one immutable prepared session packet."""
              p = ExactProblem.create(problem.n, problem.palette,
                                      problem.edges, problem.masks)
              rows = tuple(p.freeze_query(query) for query in queries)
              # ``p`` and ``rows`` were admitted immediately above; do not perform the
              # same graph and request validation a second time before serialization.
              return _pack_canonical_session_packet(p, rows)
          '''
          old = '\n'.join(line[12:] if line.startswith('            ') else line
                          for line in old.splitlines())
          new = '''def _admit_query_bank(problem: ExactProblem,
                                queries: Iterable[Iterable[Sequence[int]]]) -> tuple[tuple[tuple[int, int], ...], ...]:
              if type(queries) is tuple and len(queries) <= 1_000_000:
                  pins = 0
                  canonical = True
                  for row in queries:
                      if type(row) is not tuple:
                          canonical = False
                          break
                      pins += len(row)
                      if pins > 1_000_000:
                          raise ValueError('session packet query bank exceeds supported bound')
                      for item in row:
                          if (type(item) is not tuple or len(item) != 2 or
                                  type(item[0]) is not int or not 0 <= item[0] < problem.n or
                                  type(item[1]) is not int or not 0 <= item[1] < 1 << 64):
                              canonical = False
                              break
                      if not canonical:
                          break
                  if canonical:
                      return queries
              return tuple(problem.freeze_query(query) for query in queries)


          def pack_session_packet(problem: ExactProblem,
                                  queries: Iterable[Iterable[Sequence[int]]]) -> bytes:
              """Validate ordinary inputs and create one immutable prepared session packet."""
              if type(problem) is ExactProblem and problem._admitted:
                  p = problem
              else:
                  p = ExactProblem.create(problem.n, problem.palette,
                                          problem.edges, problem.masks)
              rows = _admit_query_bank(p, queries)
              return _pack_canonical_session_packet(p, rows)
          '''
          new = '\n'.join(line[12:] if line.startswith('            ') else line
                          for line in new.splitlines())
          if old not in text:
              raise SystemExit('public packet source changed')
          exact.write_text(text.replace(old, new))

          tests = Path('tests/public/test_exact_packet_packing.py')
          text = tests.read_text()
          text = text.replace('    assert problem.edges is edges\n',
                              '    assert problem.edges is edges\n    assert problem._admitted\n')
          text = text.replace(
              '    assert normalized.edges == ((0, 2), (1, 2))\n',
              '    assert normalized.edges == ((0, 2), (1, 2))\n    assert normalized._admitted\n',
          )
          marker = '\n\ndef test_bulk_session_packet_is_byte_identical_to_scalar_reference():'
          addition = '''

          def test_direct_problem_constructor_is_revalidated_before_public_packing():
              direct = ExactProblem(2, 2, ((0, 1),), (0b11, 0b11))
              admitted = ExactProblem.create(2, 2, ((0, 1),), (0b11, 0b11))
              rows = ((), ((0, 0b01),))
              assert not direct._admitted
              assert pack_session_packet(direct, rows) == pack_session_packet(admitted, rows)


          def test_canonical_query_tuple_is_reused_but_still_checked():
              problem = ExactProblem.create(2, 2, ((0, 1),), (0b11, 0b11))
              rows = ((), ((0, 0b01), (1, 0b10)))
              packet = pack_session_packet(problem, rows)
              _, decoded = unpack_session_packet(packet)
              assert decoded == rows
              with pytest.raises(ValueError, match='vertex/uint64-mask'):
                  pack_session_packet(problem, ((), ((2, 0b01),)))
          '''
          addition = '\n'.join(line[10:] if line.startswith('          ') else line
                               for line in addition.splitlines())
          if marker not in text:
              raise SystemExit('packet test source changed')
          tests.write_text(text.replace(marker, addition + marker))
          PY
          git config user.name 'Tugrap'
          git config user.email '106766396+tugrapaydiner@users.noreply.github.com'
          git add \
            experiments/compiled_query/SESSION_PACKET_COLD_PROTOCOL_20261017.md \
            experiments/compiled_query/session_packet_cold_benchmark.py \
            spectra/exact.py spectra/exact_problem.py \
            tests/public/test_exact_packet_packing.py
          git commit -m 'Make first-use exact sessions fast'
          test "$(git rev-parse HEAD^)" = "$BASE_COMMIT"
          test "$(git log -1 --format=%s)" = 'Make first-use exact sessions fast'
          test "$(git rev-list --count "$BASE_COMMIT"..HEAD)" -eq 1
          git diff --check "$BASE_COMMIT"..HEAD
          git push --force origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > /tmp/candidate-commit.txt
          git rev-parse HEAD^{tree} > /tmp/candidate-tree.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fast-first-use-candidate-identity
          path: |
            /tmp/candidate-commit.txt
            /tmp/candidate-tree.txt
          retention-days: 30

  benchmark:
    needs: publish
    name: first-use-${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86-64
            runner: ubuntu-24.04
          - label: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.publish.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install focused contracts
        run: python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'
      - name: Bind source and run public contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p first-use-evidence
          test "$(git rev-parse HEAD)" = '${{ needs.publish.outputs.commit }}'
          git rev-parse HEAD > first-use-evidence/source-commit.txt
          git rev-parse HEAD^{tree} > first-use-evidence/source-tree.txt
          python -VV > first-use-evidence/python.txt
          python -m pip freeze > first-use-evidence/environment.txt
          uname -a > first-use-evidence/platform.txt
          lscpu > first-use-evidence/cpu.txt
          {
            python -m pytest -q --confcutdir=tests/public \
              tests/public/test_exact_packet_packing.py \
              tests/public/test_exact_api.py \
              tests/public/test_exact_bank_tile64.py
          } 2>&1 | tee first-use-evidence/contracts.log
      - name: Acquire exact exposed WAP inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p first-use-evidence/graphs
          for name in wap05a.col wap06a.col; do
            curl --fail --location --retry 3 --retry-all-errors \
              "https://raw.githubusercontent.com/marijnheule/clicolcom/${UPSTREAM_COMMIT}/graphs/${name}" \
              -o "first-use-evidence/graphs/${name}"
          done
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          inventory = json.loads(Path('experiments/quotient_application/WAP_UPSTREAM_INVENTORY.json').read_text())
          rows = []
          for name in ('wap05a.col', 'wap06a.col'):
              record = inventory['graphs'][name]
              data = Path('first-use-evidence/graphs', name).read_bytes()
              blob = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              assert record['role'] in ('development', 'development_consumed')
              assert len(data) == record['bytes'] and blob == record['git_blob_sha1']
              rows.append({'name': name, 'bytes': len(data), 'git_blob_sha1': blob,
                           'sha256': hashlib.sha256(data).hexdigest()})
          Path('first-use-evidence/graph-acquisition.json').write_text(
              json.dumps({'upstream_commit': inventory['commit'], 'graphs': rows},
                         indent=2, sort_keys=True) + '\n')
          PY
          python -m experiments.compiled_query.study export-wap \
            --graphs first-use-evidence/graphs \
            --output first-use-evidence/cases
      - name: Build and measure the installed first-use path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > first-use-evidence/library.txt
          from spectra.exact import build_exact_runtime
          print(build_exact_runtime('first-use-evidence/native'))
          PY
          python -m experiments.compiled_query.session_packet_cold_benchmark \
            --library "$(cat first-use-evidence/library.txt)" \
            --cases first-use-evidence/cases \
            --out first-use-evidence/benchmark \
            --repeats 31 \
            2>&1 | tee first-use-evidence/benchmark.log
          python - <<'PY'
          from pathlib import Path
          import json
          result = json.loads(Path('first-use-evidence/benchmark/results.json').read_text())
          assert result['summary']['gate_pass'], result['summary']
          print(json.dumps(result['summary'], indent=2, sort_keys=True))
          PY
      - name: Hash all retained evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('first-use-evidence')
          manifest = {}
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'SHA256.json':
                  manifest[str(path.relative_to(root))] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / 'SHA256.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fast-first-use-${{ matrix.label }}-${{ github.run_id }}
          path: first-use-evidence/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
