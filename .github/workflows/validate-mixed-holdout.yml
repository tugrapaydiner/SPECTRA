name: validate-mixed-holdout

on:
  push:
    branches: [direct-2sat-challenge]
    paths:
      - '.github/workflows/validate-mixed-holdout.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-mixed-holdout
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7962ffe4033a8409659c917816b719259b16fab9
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest==9.0.2'
      - name: Check the frozen generator without opening holdout graphs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7962ffe4033a8409659c917816b719259b16fab9"
          python -m py_compile \
            experiments/compiled_query/direct_twosat_holdout.py \
            experiments/compiled_query/direct_twosat_holdout_run.py \
            experiments/compiled_query/test_direct_twosat_holdout.py
          python -m pytest \
            experiments/compiled_query/test_direct_twosat_holdout.py -q
          python - <<'PY'
          from experiments.compiled_query.direct_twosat_holdout import (
              EXPECTED, GRAPH_INVENTORY, MASTER_SEED, QUERY_COUNT, SCHEMA,
          )

          assert SCHEMA == 'spectra.direct_twosat_holdout.v2'
          assert QUERY_COUNT == 1024
          assert EXPECTED.count(1) == EXPECTED.count(0) == 512
          assert MASTER_SEED == 0xD12EC72A75A7C0DE
          assert GRAPH_INVENTORY == {
              'DSJC250.5.col': {
                  'family': 'random-dimacs',
                  'bytes': 143142,
                  'git_blob_sha1': 'b8a80c7ea4ae5e2df00ac901dae80d637e6d419c',
              },
              'flat300_28_0.col': {
                  'family': 'flat-planted',
                  'bytes': 201265,
                  'git_blob_sha1': 'e05f69de8d2dece0ad1327ccc3c2ea22a4dc24a1',
              },
              'le450_15c.col': {
                  'family': 'leighton',
                  'bytes': 158884,
                  'git_blob_sha1': 'f3dc12ae8d0ea898b0816df4680bf661620c4bb7',
              },
              'miles1000.col': {
                  'family': 'geometric',
                  'bytes': 26899,
                  'git_blob_sha1': '0aef7ac921ea7b7acac9ded3f446e17af02ed1fa',
              },
          }
          PY
          git diff --check
      - name: Record the frozen source hashes
        shell: bash
        run: |
          sha256sum \
            experiments/compiled_query/DIRECT_2SAT_HOLDOUT_PROTOCOL.md \
            experiments/compiled_query/direct_twosat_holdout.py \
            experiments/compiled_query/direct_twosat_holdout_run.py \
            experiments/compiled_query/direct_twosat_benchmark.py \
            experiments/compiled_query/direct_twosat.py \
            experiments/compiled_query/direct_twosat_native.cpp \
            experiments/compiled_query/direct_twosat_modes.cpp \
            > mixed-holdout-freeze.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mixed-holdout-freeze-${{ github.run_id }}
          path: mixed-holdout-freeze.sha256
          retention-days: 90
          if-no-files-found: error
