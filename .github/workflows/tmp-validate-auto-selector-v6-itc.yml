name: tmp-validate-auto-selector-v6-itc

on:
  push:
    branches: [performance/automatic-engine-selection]
    paths: [.github/workflows/tmp-validate-auto-selector-v6-itc.yml]

permissions:
  contents: read

concurrency:
  group: tmp-validate-auto-selector-v6-itc
  cancel-in-progress: false

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  UPSTREAM_COMMIT: ed2d4c0cf5302b77a8b321cd0380de0bb579d538

jobs:
  itc-guard:
    name: itc-${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86-64
            runner: ubuntu-24.04
          - label: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: davidvanbulck/ITC-2007-CETT
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream/ITC-2007-CETT
          persist-credentials: false

      - name: Freeze source and environment receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p itc-selector-receipts
          git diff --quiet
          git diff --cached --quiet
          git rev-parse HEAD > itc-selector-receipts/source-commit.txt
          git rev-parse HEAD^{tree} > itc-selector-receipts/source-tree.txt
          git -C upstream/ITC-2007-CETT rev-parse HEAD > itc-selector-receipts/upstream-commit.txt
          test "$(cat itc-selector-receipts/upstream-commit.txt)" = "$UPSTREAM_COMMIT"
          python -VV > itc-selector-receipts/python.txt
          python -m pip freeze > itc-selector-receipts/environment.txt
          uname -a > itc-selector-receipts/platform.txt
          lscpu > itc-selector-receipts/cpu.txt
          sha256sum \
            spectra/_native/exact_binary.cpp \
            experiments/compiled_query/itc_exam_transfer.py \
            experiments/compiled_query/itc_exam_suite.py \
            experiments/compiled_query/AUTO_SELECTOR_V6_PROTOCOL_20261018.md \
            > itc-selector-receipts/source-sha256.txt
          cmp spectra/_native/exact_binary.cpp experiments/compiled_query/exact_native.cpp
          grep -qi 'Structural auto policy v6' spectra/_native/exact_binary.cpp

      - name: Run focused ITC and selector contracts
        run: |
          set -euo pipefail
          python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'
          python -m pytest -q --confcutdir=experiments/compiled_query \
            experiments/compiled_query/test_itc_exam_transfer.py \
            experiments/compiled_query/test_itc_exam_suite.py
          python -m pytest -q --confcutdir=tests/public \
            tests/public/test_auto_selector_v6.py \
            tests/public/test_exam_repair.py \
            tests/public/test_itc2007_exam.py

      - name: Freeze the three ITC cases
        shell: bash
        run: |
          set -euo pipefail
          python -m experiments.compiled_query.itc_exam_suite freeze \
            --root itc-selector-evidence \
            --upstream-root upstream/ITC-2007-CETT \
            --queries 1024 \
            --holdout-max-auto-raw-ratio 1.05 \
            2>&1 | tee itc-selector-receipts/freeze.log

      - name: Execute and audit the raw-friendly guard
        id: benchmark
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m experiments.compiled_query.itc_exam_suite run \
            --root itc-selector-evidence \
            2>&1 | tee itc-selector-receipts/run.log
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then
            python -S -m experiments.compiled_query.itc_exam_suite audit \
              --root itc-selector-evidence \
              2>&1 | tee itc-selector-receipts/audit.log
            code=${PIPESTATUS[0]}
          fi
          echo "$code" > itc-selector-receipts/benchmark-exit-code.txt
          exit "$code"

      - name: Hash retained evidence
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          manifest = {}
          for root_name in ('itc-selector-evidence', 'itc-selector-receipts'):
              root = Path(root_name)
              if not root.exists():
                  continue
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      manifest[str(path)] = hashlib.sha256(path.read_bytes()).hexdigest()
          Path('itc-selector-SHA256.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          )
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auto-selector-v6-itc-${{ matrix.label }}-${{ github.run_id }}
          path: |
            itc-selector-evidence/
            itc-selector-receipts/
            itc-selector-SHA256.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn

      - name: Enforce the frozen gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f itc-selector-evidence/suite-audit.json
          python - <<'PY'
          from pathlib import Path
          import json
          result = json.loads(Path('itc-selector-evidence/suite-audit.json').read_text())
          assert result['functional_complete']
          assert result['selector_policy'] == 'structural-v6'
          assert result['holdout_gate_pass'], result['holdout_failures']
          for case in result['cases']:
              assert case['queries'] == 1024
              assert case['sat'] + case['unsat'] == 1024
              assert case['auto_selected_mode'] == 'raw', case
              assert case['auto_policy_reason'] == 'dense_pin_fraction', case
              assert case['auto_vs_raw_paired_median_ratio'] <= 1.05, case
          print(json.dumps({
              'selector_policy': result['selector_policy'],
              'cases': [{
                  'name': case['name'],
                  'ratio': case['auto_vs_raw_paired_median_ratio'],
                  'selected': case['auto_selected_mode'],
                  'reason': case['auto_policy_reason'],
              } for case in result['cases']],
          }, indent=2, sort_keys=True))
          PY
