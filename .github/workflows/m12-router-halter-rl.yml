name: m12-router-halter-rl

on:
  push:
    branches: [research/m12-router-halter-rl]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grounded-router-halter-rl:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install CPU dependencies
        run: |
          set -euxo pipefail
          mkdir -p .m12
          timeout 360s python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4" |& tee .m12/install_torch.txt
          timeout 180s python -m pip install -r requirements.txt |& tee .m12/install_requirements.txt

      - name: Compile M12 paths
        shell: bash
        run: |
          set +e
          python -m py_compile train/rl.py model/halting.py eval/adaptive_rl_checkpoint.py scripts/m12_prepare_pilot.py scripts/train_adaptive_rl.py tests/test_m12_router_halter_rl.py
          echo "$?" | tee .m12/compile_exit_code.txt
          exit 0

      - name: Focused M12 contracts
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 600s python -m pytest tests/test_m12_router_halter_rl.py tests/test_rl_gae.py tests/test_halting.py -m "not slow" -q |& tee .m12/pytest_m12.txt
          code=${PIPESTATUS[0]}
          echo "$code" | tee .m12/focused_exit_code.txt
          exit 0

      - name: Prepare strict reasoner and grounded verifier pilot fixtures
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 1200s python scripts/m12_prepare_pilot.py --out .m12/fixture |& tee .m12/fixture.log
          code=${PIPESTATUS[0]}
          echo "$code" | tee .m12/fixture_exit_code.txt
          exit 0

      - name: Run real M12 adaptive RL training command
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 1200s python scripts/train_adaptive_rl.py \
            --reasoner-checkpoint .m12/fixture/reasoner.pt \
            --verifier-checkpoint .m12/fixture/grounded_verifier.pt \
            --inputs .m12/fixture/rl_inputs.pt \
            --out .m12/experiment \
            --steps 120 \
            --seed 20260912 |& tee .m12/train_rl.log
          code=${PIPESTATUS[0]}
          echo "$code" | tee .m12/training_exit_code.txt
          exit 0

      - name: Verify M12 acceptance evidence
        shell: bash
        run: |
          set +e
          python - <<'PY' |& tee .m12/evidence_check.txt
          import json, pathlib, sys
          fixture=pathlib.Path('.m12/fixture')
          exp=pathlib.Path('.m12/experiment')
          required_fixture=['reasoner.pt','grounded_verifier.pt','rl_inputs.pt','fixture_summary.json']
          required_exp=['adaptive_rl.pt','summary.json','training_log.jsonl','heldout_comparison.json','heldout_rows.json','ownership.json','checkpoint_reload.json']
          missing=[str(fixture/p) for p in required_fixture if not (fixture/p).is_file()]
          missing += [str(exp/p) for p in required_exp if not (exp/p).is_file()]
          print('missing=',missing)
          if missing: sys.exit(2)
          f=json.loads((fixture/'fixture_summary.json').read_text())
          s=json.loads((exp/'summary.json').read_text())
          print(json.dumps(s,indent=2,sort_keys=True))
          assert f['status']=='fixture_ready'
          assert f['inputs']['reference_targets_included'] is False
          assert f['grounded_verifier']['reasoner_hash_unchanged'] is True
          assert s['milestone']==12
          assert s['status']=='complete'
          assert s['scope']=='grounded_router_halter_rl_training_path'
          assert s['reference_targets_used_by_rl'] is False
          a=s['acceptance']
          for key in [
              'real_training_updates_router','real_training_updates_halter',
              'real_training_updates_critic','target_polyak_updates',
              'reasoner_frozen','verifier_frozen','strict_checkpoint_reload',
              'heldout_baselines_compared','cost_is_proxy_not_energy',
          ]:
              assert a[key] is True, (key,a[key])
          assert s['objective']['potential_shaping']=='gamma*Phi(next_effective)-Phi(current)'
          assert s['objective']['terminal_bootstrap'] is False
          assert s['objective']['truncation_bootstrap'] is True
          assert s['objective']['forced_actions_policy_gradient_credit'] is False
          assert s['objective']['cost_kind']=='logical_step_token_proxy_v1'
          assert s['objective']['measured_energy_used'] is False
          assert s['objective']['measured_energy_joules'] is None
          assert set(s['heldout_comparison'])=={'learned_rl','fixed_depth','heuristic'}
          own=s['training']['optimizer_ownership']
          assert own['optimizer_exactly_intended'] is True
          assert own['optimizer_forbidden_overlap']==0
          assert own['reasoner_requires_grad_false'] is True
          assert own['verifier_requires_grad_false'] is True
          assert own['target_requires_grad_false'] is True
          lines=(exp/'training_log.jsonl').read_text().strip().splitlines()
          assert len(lines)==120
          last=json.loads(lines[-1])
          for key in [
              'task_success','realized_steps','active_density','router_entropy','halter_entropy',
              'router_policy_loss','halter_policy_loss','value_loss','total_loss',
              'step_proxy_cost','token_proxy_cost','total_proxy_cost',
              'terminated_fraction','truncated_fraction'
          ]:
              assert key in last
          assert last['measured_energy_joules'] is None
          print('M12_GROUNDED_RL_TRAINING_GATE=PASS')
          PY
          echo "$?" | tee .m12/evidence_check_exit_code.txt
          exit 0

      - name: Full fast regression
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 900s python -m pytest -m "not slow" -ra |& tee .m12/pytest_fast.txt
          code=${PIPESTATUS[0]}
          echo "$code" | tee .m12/fast_exit_code.txt
          exit 0

      - name: Record provenance and hashes
        if: always()
        run: |
          {
            echo "head=$(git rev-parse HEAD)"
            echo "base=40ce9c65f97e3950bb927713d8e117ab6c4b6e1c"
            echo
            git diff --stat 40ce9c65f97e3950bb927713d8e117ab6c4b6e1c...HEAD
          } | tee .m12/diff_stat.txt
          python - <<'PY' | tee .m12/evidence_sha256.txt
          import hashlib,pathlib
          root=pathlib.Path('.m12')
          for p in sorted(q for q in root.rglob('*') if q.is_file() and q.name!='evidence_sha256.txt'):
              print(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}")
          PY

      - name: Upload M12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m12-router-halter-rl-evidence
          path: .m12/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Enforce M12 acceptance
        if: always()
        run: |
          compile=$(cat .m12/compile_exit_code.txt 2>/dev/null || echo 99)
          focused=$(cat .m12/focused_exit_code.txt 2>/dev/null || echo 99)
          fixture=$(cat .m12/fixture_exit_code.txt 2>/dev/null || echo 99)
          training=$(cat .m12/training_exit_code.txt 2>/dev/null || echo 99)
          evidence=$(cat .m12/evidence_check_exit_code.txt 2>/dev/null || echo 99)
          fast=$(cat .m12/fast_exit_code.txt 2>/dev/null || echo 99)
          echo "compile=$compile focused=$focused fixture=$fixture training=$training evidence=$evidence fast=$fast"
          if [ "$compile" -ne 0 ] || [ "$focused" -ne 0 ] || [ "$fixture" -ne 0 ] || [ "$training" -ne 0 ] || [ "$evidence" -ne 0 ] || [ "$fast" -ne 0 ]; then
            echo "M12 grounded RL training-path acceptance not established; inspect retained evidence."
            exit 1
          fi
          echo "M12 grounded RL training-path acceptance passed."
