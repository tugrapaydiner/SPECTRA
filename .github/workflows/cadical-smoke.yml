name: cadical-smoke

on:
  push:
    branches: [external-solver-challenge]
    paths:
      - '.github/workflows/cadical-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: arminbiere/cadical
          ref: c60730422e758ef1cebe7aeddf2dda31c996bf04
          path: cadical-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest==9.0.2'
      - name: Build and run the focused contracts
        env:
          CADICAL_SOURCE: ${{ github.workspace }}/cadical-source
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            experiments/compiled_query/test_cadical_exact.py \
            -k 'not every_three_vertex_formula' -q
          git diff --check
