name: install-native-general-solver

on:
  push:
    branches:
      - finish-part3
    paths:
      - .github/workflows/install-native-general-solver.yml

permissions:
  contents: write

concurrency:
  group: install-native-general-solver
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the focused contract tools
        run: python -m pip install 'pytest==9.0.2' 'python-sat==1.9.dev15'
      - name: Reconstruct and apply the reviewed solver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/scripts
          cat .github/native-general-installer/part.* \
            | base64 --decode \
            | gzip --decompress \
            > .github/scripts/install_native_general_solver.py
          python .github/scripts/install_native_general_solver.py
          rm -rf .github/native-general-installer
      - name: Challenge the integrated source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            experiments/general_competition/native_cdcl.py \
            experiments/general_competition/test_native_cdcl.py
          python -m pytest \
            experiments/general_competition/test_native_cdcl.py \
            -q
          python scripts/check_active_tree.py --out /tmp/active-tree.json
          git diff --check
      - name: Commit the native engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tugrap"
          git config user.email "106766396+tugrapaydiner@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add the first native general-CNF engine"
          git push origin HEAD:refs/heads/finish-part3
