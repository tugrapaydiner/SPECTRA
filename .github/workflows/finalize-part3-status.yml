name: finalize-part3-status

on:
  push:
    branches: [finish-part3]
    paths:
      - '.github/workflows/finalize-part3-status.yml'

permissions:
  contents: write

concurrency:
  group: finalize-part3-status
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install 'pytest==9.0.2'
      - name: Make the generated identity checks stable
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/sync_part3_status.py')
          text = path.read_text(encoding='utf-8')

          old_assert = '            assert "at least 64 requests" in doc'
          new_assert = (
              '            assert "Long banks of at least" in doc\n'
              '            assert "64 requests" in doc'
          )
          if text.count(old_assert) != 2:
              raise AssertionError('expected two selector assertion sites')
          text = text.replace(old_assert, new_assert)

          start = text.index('    text += dedent(\n', text.index('research_path ='))
          end_marker = '    write(research_path, text)\n'
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''    text += (\n        "\\n\\ndef test_selector_policy_identity_matches_the_public_api():\\n"\n        "    from spectra.exact import ExactRuntime as PublicExactRuntime\\n\\n"\n        "    for runtime in (PublicExactRuntime, ExactRuntime):\\n"\n        "        doc = runtime.solve_session_packet.__doc__ or \\\"\\\"\\n"\n        "        assert \\\"structural policy v11\\\" in doc\\n"\n        "        assert \\\"structural policy v10\\\" not in doc\\n"\n        "        assert \\\"Long banks of at least\\\" in doc\\n"\n        "        assert \\\"64 requests\\\" in doc\\n"\n        "        assert \\\"bank_kernel\\\" in doc\\n"\n    )\n    write(research_path, text)\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply the source and status corrections
        run: python .github/scripts/sync_part3_status.py
      - name: Normalize the rewritten status document
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/PART3_RELEASE_REPLICATION_READINESS.md')
          lines = path.read_text(encoding='utf-8').splitlines()
          path.write_text('\n'.join(line.rstrip(' \t') for line in lines) + '\n', encoding='utf-8')
          PY
      - name: Leave workflow cleanup to the repository connection
        run: git checkout HEAD -- .github/workflows
      - name: Verify the source-only commit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            spectra/exact.py \
            experiments/compiled_query/exact.py \
            tests/public/test_auto_selector_v11.py \
            tests/public/test_exact_edgeless.py \
            experiments/compiled_query/test_exact.py
          python - <<'PY'
          from pathlib import Path
          from spectra.exact import ExactRuntime

          public_doc = ExactRuntime.solve_session_packet.__doc__ or ''
          research = Path('experiments/compiled_query/exact.py').read_text()
          assert 'structural policy v11' in public_doc
          assert 'structural policy v10' not in public_doc
          assert 'Long banks of at least' in public_doc
          assert '64 requests' in public_doc
          assert 'frozen structural policy v11' in research
          assert 'frozen structural policy v10' not in research

          status = Path('docs/PART3_RELEASE_REPLICATION_READINESS.md').read_text()
          assert 'finish-part3' in status
          assert 'FAIL_ADMISSION' in status
          assert 'Part 3 is **in progress**' in status
          assert not Path('.github/scripts/sync_part3_status.py').exists()
          PY
          python -m pytest \
            tests/public/test_auto_selector_v11.py \
            tests/public/test_exact_edgeless.py \
            --confcutdir=tests/public -q
          python -m pytest \
            experiments/compiled_query/test_exact.py \
            -k selector_policy_identity_matches_the_public_api -q
          python - <<'PY'
          import subprocess

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines()
          assert changed
          assert not any(path.startswith('.github/workflows/') for path in changed)
          PY
          git diff --check
      - name: Commit the synchronized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align Part 3's selector identity and status"
          git push origin HEAD:refs/heads/finish-part3
