name: m16-cpu-reliability
on:
  push:
    branches: [research/m16-verifier-aligned-cpu]
    paths: ['spectra_reliability/**', 'tests/reliability/**', 'tests/native/**', 'scripts/m16_*.py', 'eval/telemetry.py', 'requirements-cpu.lock', 'pyproject.toml', '.github/workflows/m16-cpu-reliability.yml']
  pull_request:
    branches: [main]
    paths: ['spectra_reliability/**', 'tests/reliability/**', 'tests/native/**', 'scripts/m16_*.py', 'eval/telemetry.py', 'requirements-cpu.lock', 'pyproject.toml', '.github/workflows/m16-cpu-reliability.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m16-tests-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fast-and-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      MAX_JOBS: '1'
      TORCH_EXTENSIONS_DIR: /tmp/spectra-m16-torch-extensions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install pinned CPU-only stack
        run: python -m pip install -r requirements-cpu.lock
      - name: Record environment and enforce CPU build
        run: |
          mkdir -p .m16-ci
          python - <<'PY' > .m16-ci/environment.json
          import json, os, platform, sys, torch, numpy
          assert torch.version.cuda is None, 'GPU build is not permitted'
          print(json.dumps({'python':sys.version,'torch':torch.__version__,'numpy':numpy.__version__,
            'platform':platform.platform(),'cpus':os.cpu_count(),'device':'cpu','physical_energy_joules':None},indent=2))
          PY
          git rev-parse HEAD > .m16-ci/source_commit.txt
          python -m pip freeze > .m16-ci/pip_freeze.txt
      - name: Full fast suite
        run: |
          set -o pipefail
          python -m pytest -m 'not slow' -ra |& tee .m16-ci/pytest-fast.txt
      - name: Address and undefined-behavior sanitizers
        run: |
          set -o pipefail
          g++ -O1 -g -std=c++17 -ffp-contract=off -fno-fast-math -fno-tree-vectorize -fsanitize=address,undefined -fno-omit-frame-pointer tests/native/m16_sanitizer.cpp -o /tmp/m16-sanitizer
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 /tmp/m16-sanitizer |& tee .m16-ci/sanitizer.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m16-cpu-tests-python-${{ matrix.python }}
          path: .m16-ci/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
  legacy-learning-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      MAX_JOBS: '1'
      TORCH_EXTENSIONS_DIR: /tmp/spectra-m16-legacy-extensions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-cpu.lock
      - name: All original slow learning gates without weakening assertions
        run: |
          set -o pipefail
          mkdir -p .m16-slow
          free -m | tee .m16-slow/memory.txt
          python -m pytest -m slow -ra |& tee .m16-slow/pytest-slow.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m16-original-slow-gates
          path: .m16-slow/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
