name: Sparse research dependencies
on:
  push:
    branches: [research/sparse-incidence-20261007]
    paths: [.github/workflows/sparse-dependencies.yml]
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pinned wheels and original upstream controls
        run: |
          mkdir -p delivery/wheels delivery/upstream
          python -m pip download --only-binary=:all: --dest delivery/wheels 'python-sat==1.9.dev15' 'ortools==9.15.6755' 'build==1.6.1' 'pytest==9.0.2'
          curl --fail --location --retry 2 https://www-cs-faculty.stanford.edu/~knuth/programs/dlx1.w -o delivery/upstream/dlx1.w
          curl --fail --location --retry 2 https://www-cs-faculty.stanford.edu/~knuth/programs/ssxcc.w -o delivery/upstream/ssxcc.w
          curl --fail --location --retry 2 https://www-cs-faculty.stanford.edu/~knuth/programs.html -o delivery/upstream/knuth-programs.html
          sudo apt-get update -qq
          sudo apt-get install -y -qq cweb
          (cd delivery/upstream && ctangle dlx1.w && ctangle ssxcc.w)
          git bundle create delivery/source-history.bundle --all
          git rev-parse HEAD > delivery/commit.txt
          python --version > delivery/python.txt
          ctangle --version > delivery/ctangle-version.txt
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('delivery')
          (p/'SHA256.json').write_text(json.dumps({str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(p.rglob('*')) if f.is_file()},indent=2,sort_keys=True)+'\n')
          PY
          echo 'DEPENDENCY ACQUISITION ONLY: no candidate test or performance claim.' > delivery/NOT_VALIDATION.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sparse-dependencies-${{ github.run_id }}
          path: delivery
          retention-days: 90
